type: object
additionalProperties: false
required:
  - requestId
  - type
properties:
  requestId:
    type: string
    description: Stable client-provided request identifier used for idempotent batch submission.
  currentChainingTraceId:
    type: string
    description: Optional default chaining-trace identifier applied to submitted work items that omit it.
  type:
    $ref: './WorkRequestType.yaml'
  works:
    type: array
    description: >-
      A batch of work items to be submitted together. Each Work payload uses
      the compact UTF-8 JSON byte limit documented by the Work schema; a batch
      is rejected atomically when any Work exceeds 65,536 bytes.
    items:
      $ref: '../data-models/Work.yaml'
  relations:
    type: array
    description: Relationships between various work items.
    items:
      $ref: '../data-models/Relation.yaml'
