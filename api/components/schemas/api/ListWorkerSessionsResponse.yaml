type: object
additionalProperties: false
required:
  - sessions
properties:
  sessions:
    type: array
    description: >-
      Deterministically ordered Worker Session observations.
      Work-scoped queries return observations correlated with the requested Work.
      Top-level fleet pages use captured metadata without reading native provider files.
      Fleet token usage appears only when captured during execution.
      Fleet rows omit native-only turn usage and return unavailable transcript status and empty parse diagnostics.
      Show and detail queries retain provider inspection when available.
    items:
      $ref: './WorkerSessionObservation.yaml'
  paginationContext:
    $ref: './PaginationContext.yaml'
    description: Bounded pagination context for top-level Worker Session observation queries.
