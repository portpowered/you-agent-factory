type: object
additionalProperties: false
required:
  - orchestratorKind
  - status
  - progress
  - usage
  - lifecycle
properties:
  orchestratorKind:
    $ref: '../data-models/FactoryOrchestratorKind.yaml'
  dialect:
    type: string
    description: JavaScript workflow dialect when orchestrator.kind = JAVASCRIPT.
  sourceRef:
    type: string
    description: Authored JavaScript workflow source reference when applicable.
  sourceHash:
    type: string
    description: Stable hash of the authored JavaScript workflow source.
  policyHash:
    type: string
    description: Stable hash of the effective orchestrator policy.
  status:
    $ref: './FactorySessionStatus.yaml'
  lifecycleControlStatus:
    $ref: './FactorySessionDurableLifecycleStatus.yaml'
    description: >-
      Canonical Factory Session lifecycle-control status reconstructed from
      SESSION_PAUSED and SESSION_RESUMED events when present. Live session
      inspection reads report PAUSED after a successful pause and RUNNING after
      a successful resume.
  progress:
    $ref: './FactorySessionProgress.yaml'
  budgets:
    $ref: './FactorySessionBudgets.yaml'
  usage:
    $ref: './FactorySessionUsage.yaml'
  lifecycle:
    $ref: './FactorySessionLifecycle.yaml'
  stopSummary:
    $ref: './FactoryStopSummary.yaml'
    description: >-
      Canonical stopped-state summary for paused, blocked, needs-human, and
      interrupted inspection paths on the existing Factory Session surface.
  streamIdentity:
    $ref: './FactorySessionStreamIdentity.yaml'
    description: >-
      Backend-authoritative identity for the current live session event stream.
      Clients must confirm this identity before reusing persisted reconnect
      cursors or timeline checkpoints.
  petri:
    $ref: './FactorySessionPetriProjection.yaml'
  javascript:
    $ref: './FactorySessionJavaScriptProjection.yaml'
  artifacts:
    type: array
    items:
      $ref: '../data-models/FactoryArtifact.yaml'
    description: Shared artifact projections for the session runtime.
  pendingHumanApprovals:
    type: array
    items:
      $ref: './HumanApproval.yaml'
    description: Durable pending HUMAN_APPROVAL requests reconstructed from canonical events.
