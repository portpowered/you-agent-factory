type: object
required:
  - name
  - managedRuntime
  - providerLocality
  - status
  - loadState
  - operations
  - modalities
  - resources
  - capabilities
  - diagnostics
properties:
  name:
    type: string
    description: >
      Stable managed runtime identity such as `OMNIVOICE_Q4_K_M`. Mirrors
      `managedRuntime.identity` for compatibility with earlier inspect fields.
  managedRuntime:
    $ref: './ManagedRuntime.yaml'
  providerLocality:
    $ref: '../data-models/WorkerModelLocality.yaml'
    description: >
      Managed runtime locality summary. Mirrors `managedRuntime.locality` for
      compatibility with earlier inspect fields.
  status:
    $ref: './ModelStatus.yaml'
  loadState:
    $ref: './ModelLoadState.yaml'
  operations:
    type: array
    description: >
      Union of provider-agnostic operations supported by workers for this managed
      runtime. Mirrors `managedRuntime.supportedOperations` for compatibility
      with earlier inspect fields.
    items:
      $ref: './ModelInvocationOperation.yaml'
  modalities:
    type: array
    description: Uppercase content modalities observed across all declared operation inputs and outputs.
    items:
      $ref: './ModelInvocationContentType.yaml'
  resources:
    type: array
    description: Factory resource summaries associated with this model's workers or explicit model metadata.
    items:
      $ref: './ModelResourceSummary.yaml'
  capabilities:
    type: array
    description: Worker-scoped capability declarations that contribute to this discovered model.
    items:
      $ref: './ModelCapability.yaml'
  diagnostics:
    $ref: '../shared/StringMap.yaml'
