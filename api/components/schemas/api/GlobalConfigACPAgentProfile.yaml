type: object
additionalProperties: false
required:
  - defaultTarget
properties:
  defaultTarget:
    type: string
    minLength: 1
    description: Unversioned namespaced Factory target reference, such as factory:@you/factory-builder. Factory Definitions owns enumeration and canonical reference resolution.
  allowedTargets:
    type: array
    minItems: 1
    description: >-
      Optional ordered allowlist of unversioned namespaced Factory target
      references. Order is authored and preserved. Omit this property to leave
      the profile unrestricted, which makes every installed Factory selectable.
      An explicitly empty array is rejected, so omission is the only way to
      express "no restriction".
    items:
      type: string
      minLength: 1
