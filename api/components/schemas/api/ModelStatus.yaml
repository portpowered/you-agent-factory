type: string
description: >
  Compatibility readiness projection for one managed runtime. Prefer
  `managedRuntime.readinessState` for the canonical managed-runtime vocabulary.
  `READY` maps to managed readiness `READY`; `UNAVAILABLE` maps to managed
  readiness `MISSING` for local runtimes that still require install or setup.
enum:
  - READY
  - UNAVAILABLE
