type: object
additionalProperties: false
required:
  - workerSessionId
  - workIds
  - attemptId
  - state
  - entries
  - recordingHealth
properties:
  workerSessionId:
    type: string
    description: Stable Worker Session identity.
  factorySessionId:
    type: string
    description: Explicit Factory Session scope used for this transcript read.
  providerSession:
    $ref: './WorkerSessionProviderSessionRef.yaml'
    nullable: true
  workIds:
    type: array
    items:
      type: string
    description: Work identities correlated with this Worker Session attempt.
  turnId:
    type: string
    nullable: true
    description: Optional turn correlation identifier.
  attemptId:
    type: string
    description: Stable attempt or dispatch identity.
  state:
    type: string
    description: Terminal Worker Session lifecycle state at transcript read time.
  entries:
    type: array
    description: Ordered normalized transcript entries projected by Provider Sessions or durable Worker history.
    items:
      $ref: './ProviderSessionTranscriptEntry.yaml'
  recordingHealth:
    type: string
    enum:
      - COMPLETE
      - DEGRADED
      - INCOMPLETE
    x-enum-varnames:
      - WorkerSessionTranscriptRecordingHealthComplete
      - WorkerSessionTranscriptRecordingHealthDegraded
      - WorkerSessionTranscriptRecordingHealthIncomplete
    description: Recordings-owned capture health, independent of Worker execution outcome.
  recordingHealthReason:
    type: string
    nullable: true
    description: Stable safe reason when recording health is DEGRADED or INCOMPLETE.
