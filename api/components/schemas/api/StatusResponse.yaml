type: object
additionalProperties: false
required:
  - categories
  - factoryState
  - runtimeStatus
  - totalTokens
properties:
  categories:
    $ref: './StatusCategories.yaml'
  factoryState:
    type: string
  lifecycleControlStatus:
    $ref: './FactorySessionDurableLifecycleStatus.yaml'
    description: >-
      Canonical Factory Session lifecycle-control status reconstructed from
      SESSION_PAUSED and SESSION_RESUMED events when present. Live status reads
      report PAUSED after a successful pause and RUNNING after a successful resume.
  runtimeStatus:
    type: string
  totalTokens:
    type: integer
  resources:
    type: array
    items:
      $ref: '../shared/ResourceUsage.yaml'
  startupRecovery:
    type: object
    additionalProperties: false
    required: [code, file, cause, quarantinedFile]
    properties:
      code: {type: string, enum: [DURABLE_STATE_QUARANTINED]}
      file: {type: string}
      cause: {type: string, enum: [INVALID_JSON, INVALID_SCHEMA, SIZE_LIMIT, READ_FAILED]}
      quarantinedFile: {type: string}
