type: string
description: >-
  Typed lifecycle-control outcome. ACCEPTED means the control request was
  accepted and may complete asynchronously. NO_OP means the session was already
  in the requested end state. INVALID_STATE means the current session state does
  not allow the requested control. TERMINAL_SESSION means the session is already
  terminal and cannot accept the requested control. CONFLICT means another
  in-flight or incompatible control prevents the request.
enum:
  - ACCEPTED
  - NO_OP
  - INVALID_STATE
  - TERMINAL_SESSION
  - CONFLICT
x-enum-varnames:
  - FactorySessionLifecycleControlOutcomeAccepted
  - FactorySessionLifecycleControlOutcomeNoOp
  - FactorySessionLifecycleControlOutcomeInvalidState
  - FactorySessionLifecycleControlOutcomeTerminalSession
  - FactorySessionLifecycleControlOutcomeConflict
x-enum-descriptions:
  - Control request was accepted and may complete asynchronously.
  - Session already satisfies the requested control; no state change was applied.
  - Current session state does not allow the requested control.
  - Session is terminal and cannot accept the requested control.
  - Control request conflicts with current session state or another in-flight control.
