type: object
additionalProperties: false
required:
  - id
  - status
  - dispatchKind
  - confirmationState
description: >-
  Durable factory-session dispatch summary for list responses. Exposes shared
  dispatch fields plus bounded orchestrator-specific inspection data when
  available.
properties:
  id:
    type: string
    description: Stable dispatch identifier.
  status:
    $ref: '../data-models/FactoryDispatchStatus.yaml'
  confirmationState:
    $ref: '../data-models/ConfirmationState.yaml'
    description: Whether the event that produced the reported dispatch status is covered by completed recording storage.
  dispatchKind:
    $ref: '../data-models/FactoryDispatchKind.yaml'
  phase:
    type: string
    description: Workflow phase when the dispatch was created or observed.
  label:
    type: string
    description: Customer-visible dispatch label.
  attempt:
    type: integer
    format: int32
    minimum: 1
    description: One-based attempt number for retried dispatches.
  retryable:
    type: boolean
    description: Whether the provider failure that produced the current failed state was retryable.
  failureClassification:
    $ref: '../../../openapi-main.yaml#/components/schemas/WorkFailureType'
    description: Stable canonical classification recorded for the current provider failure.
  runnerId:
    type: string
    description: Selected runner identifier when applicable.
  presetId:
    type: string
    description: Resolved operator worker preset identifier when one was selected.
  modelProvider:
    type: string
    description: Resolved canonical model-provider identifier when applicable.
  model:
    type: string
    description: Selected model identifier when applicable.
  reasoningEffort:
    type: string
    description: Resolved canonical reasoning effort when applicable.
  provider:
    type: string
    description: Selected provider identifier when applicable.
  providerSessionRefs:
    type: array
    items:
      $ref: './LoadableProviderSessionRef.yaml'
    description: Provider-session correlation refs for model-backed dispatches.
  usage:
    $ref: '../data-models/FactoryDispatchUsage.yaml'
  warnings:
    type: array
    items:
      $ref: '../data-models/FactoryDispatchWarning.yaml'
  outputArtifactIds:
    type: array
    items:
      type: string
    description: Artifact identifiers produced by the dispatch.
  failureDetail:
    $ref: '../data-models/FailureDetail.yaml'
  javascript:
    $ref: '../data-models/FactoryDispatchJavaScriptProjection.yaml'
