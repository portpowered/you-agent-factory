type: object
additionalProperties: false
required:
  - requestId
  - successorWorkerSessionId
  - followUpInput
description: >-
  Idempotent continuation request for one terminal Worker Session. The server
  resolves and validates the source Provider Session association; callers may
  select the source Factory Session, successor identity and follow-up input.
  Without factorySessionId, a shared source ID returns 409 WORKER_SESSION_AMBIGUOUS.
properties:
  resolveHead:
    type: boolean
    default: false
    description: Resolve the newest validated terminal continuation head before reserving a successor.
  factorySessionId:
    type: string
    minLength: 1
    description: Exact source Factory Session; omit only when the Worker Session ID is unique.
  requestId:
    type: string
    minLength: 1
    description: Required caller idempotency key for this continuation.
  successorWorkerSessionId:
    type: string
    minLength: 1
    description: Distinct Worker Session identity to reserve for the successor.
  followUpInput:
    type: string
    minLength: 1
    description: Non-empty follow-up input delivered to the resumed Provider Session.
