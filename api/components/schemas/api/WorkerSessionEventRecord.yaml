type: object
additionalProperties: false
required:
  - position
  - cursor
  - sourceType
  - sourceId
  - sourceSequence
  - sourceEventId
  - schemaId
  - payload
properties:
  truncated:
    type: boolean
    description: True when logs return a preview instead of the complete captured payload.
  originalBytes:
    type: integer
    format: int64
    minimum: 0
    description: Byte count of the exact captured payload before truncation.
  returnedBytes:
    type: integer
    format: int64
    minimum: 0
    description: Byte count of the encoded payload preview.
  artifactRef:
    type: string
    description: Worker Session ID and record position used to retrieve the complete payload through the logs route.
  capturedAt:
    type: string
    format: date-time
    description: Host time at which Recordings committed this record. Omitted for older records and uncommitted live frames.
  cursor:
    $ref: './WorkerSessionEventCursor.yaml'
    description: Typed reconnect cursor for this canonical event record.
  position:
    type: integer
    format: int64
    minimum: 1
    description: Aggregate position assigned by the canonical Events ledger.
  sourceType:
    type: string
    description: Source-native event family.
  sourceId:
    type: string
    description: Source-native event identity.
  sourceSequence:
    type: integer
    format: int64
    minimum: 1
    description: Source-native monotonic sequence.
  sourceEventId:
    type: string
    description: Source-native idempotency event identity.
  schemaId:
    type: string
    description: Source-native payload schema identity.
  payload:
    type: object
    additionalProperties: true
    description: Source-native canonical event payload.
