type: string
description: >
  Compatibility lifecycle projection for one managed runtime. Prefer
  `managedRuntime.lifecycleState` for the canonical managed-runtime vocabulary.
  `UNLOADED` maps to managed lifecycle `NOT_INSTALLED` or `LOADED` depending on
  cache and load state; `NOT_APPLICABLE` maps to managed lifecycle
  `NOT_APPLICABLE` for cloud-backed runtimes.
enum:
  - UNLOADED
  - NOT_APPLICABLE
