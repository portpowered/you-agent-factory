type: object
additionalProperties: false
properties:
  totalDispatches:
    type: integer
    minimum: 0
    description: Total durable dispatches recorded for the session.
  completedDispatches:
    type: integer
    minimum: 0
    description: Dispatches that reached a terminal success state.
  failedDispatches:
    type: integer
    minimum: 0
    description: Dispatches that reached a terminal failure state.
  inFlightDispatches:
    type: integer
    minimum: 0
    description: Dispatches currently running or awaiting completion.
  queuedDispatches:
    type: integer
    minimum: 0
    description: Dispatches waiting to start.
  runningDispatches:
    type: integer
    minimum: 0
    description: Dispatches currently running.
  canceledDispatches:
    type: integer
    minimum: 0
    description: Dispatches canceled before completion.
  timedOutDispatches:
    type: integer
    minimum: 0
    description: Dispatches that exceeded their execution deadline.
  skippedDispatches:
    type: integer
    minimum: 0
    description: Dispatches skipped by orchestration policy.
  interruptedDispatches:
    type: integer
    minimum: 0
    description: Dispatches interrupted after starting.
  phaseCount:
    type: integer
    minimum: 0
    description: Number of workflow phases represented in phase summaries.
