type: object
additionalProperties: true
description: Operator defaults that participate independently in file, environment, and flag precedence.
properties:
  workerModelProvider:
    type: string
    description: Default worker model provider, including supported aliases and symbolic DEFAULT resolution.
  workerModel:
    type: string
    description: Default worker model name.
  subagent:
    type: object
    additionalProperties: false
    description: File-only subagent route, independent of generic worker defaults.
    required: [provider, model]
    properties:
      provider:
        type: string
        minLength: 1
      model:
        type: string
        minLength: 1
      reasoningEffort:
        type: string
        minLength: 1
