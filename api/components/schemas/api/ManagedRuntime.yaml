type: object
required:
  - identity
  - readinessState
  - lifecycleState
  - locality
  - supportedOperations
properties:
  identity:
    type: string
    description: >
      Stable managed runtime identity shared by discovery, inspect, pull or
      install, and factory dependency surfaces.
  cachePath:
    type: string
    description: Resolved managed-cache revision directory when a local cache is installed.
  revision:
    type: string
    description: Installed managed-cache revision when a local cache is present.
  cacheBytes:
    type: integer
    format: int64
    minimum: 0
    description: Exact recursive byte count of regular files in the installed managed-cache revision.
  readinessState:
    $ref: './ManagedRuntimeReadinessState.yaml'
  lifecycleState:
    $ref: './ManagedRuntimeLifecycleState.yaml'
  locality:
    $ref: '../data-models/WorkerModelLocality.yaml'
  supportedOperations:
    type: array
    description: Provider-agnostic operations supported by this managed runtime.
    items:
      $ref: './ModelInvocationOperation.yaml'
  diagnostics:
    $ref: '../shared/StringMap.yaml'
    description: Concise managed-runtime diagnostics in customer-relevant terms.
