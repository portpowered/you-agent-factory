type: object
additionalProperties: false
required:
  - sessionId
  - status
  - orchestratorKind
  - resolvedSource
  - syncOutcome
description: >-
  Sync durable execution response. Returns the normalized execution identity plus
  sync wait outcome and, when available before timeout, the terminal
  FactorySessionResult.
properties:
  sessionId:
    type: string
    description: Stable durable factory-session identifier.
  status:
    $ref: './FactorySessionDurableLifecycleStatus.yaml'
  orchestratorKind:
    $ref: '../data-models/FactoryOrchestratorKind.yaml'
  dialect:
    type: string
    description: Resolved orchestrator dialect when orchestratorKind = JAVASCRIPT.
  resolvedSource:
    $ref: './FactorySessionResolvedSourceIdentity.yaml'
  sourceHash:
    type: string
    description: Stable hash of the resolved workflow or factory source when available.
  requestedPolicy:
    $ref: './FactorySessionRequestedPolicy.yaml'
    description: Caller-requested policy echoed from the execution request when available.
  effectivePolicy:
    $ref: './FactorySessionEffectivePolicy.yaml'
    description: Effective approved orchestrator policy after any required approval.
  effectivePolicyHash:
    type: string
    description: >-
      Stable hash of the effective approved orchestrator policy when available.
      Mirrors effectivePolicy.policyHash when both are present.
  links:
    $ref: './FactorySessionExecutionLinks.yaml'
    description: Inspection links for the started session.
  syncOutcome:
    $ref: './FactorySessionSyncExecutionOutcome.yaml'
  result:
    $ref: './FactorySessionResult.yaml'
    description: Terminal session result when syncOutcome = COMPLETED.
  timedOut:
    type: boolean
    description: True when syncOutcome = TIMED_OUT.
  sessionCanceledByTimeout:
    type: boolean
    description: >-
      True only when timedOut is true and the request explicitly set
      wait.cancelOnTimeout to true.
