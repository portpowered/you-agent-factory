type: string
description: Durable factory-session lifecycle control operation requested by the client.
enum:
  - APPROVE
  - PAUSE
  - RESUME
  - CANCEL
  - TERMINATE
  - RETRY_DISPATCH
  - INTERRUPT_DISPATCH
x-enum-varnames:
  - FactorySessionLifecycleControlKindApprove
  - FactorySessionLifecycleControlKindPause
  - FactorySessionLifecycleControlKindResume
  - FactorySessionLifecycleControlKindCancel
  - FactorySessionLifecycleControlKindTerminate
  - FactorySessionLifecycleControlKindRetryDispatch
  - FactorySessionLifecycleControlKindInterruptDispatch
x-enum-descriptions:
  - Approve requested orchestrator policy so execution can proceed.
  - Pause active Factory Session scheduling while preserving inspectable state and buffered work.
  - Resume a paused Factory Session and drain ready buffered work.
  - Request graceful cancellation while preserving partial results and artifacts.
  - Forcefully terminate a durable session while preserving inspectable state.
  - Retry one failed or interrupted dispatch within the targeted session.
  - Interrupt one active dispatch within the targeted session.
