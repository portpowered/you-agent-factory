type: object
additionalProperties: false
properties:
  enabled: {type: boolean, default: true}
  retentionDays: {type: integer, minimum: 1, default: 30}
  policy:
    type: object
    additionalProperties: false
    properties:
      scopeLabelKeys: {type: array, items: {type: string, minLength: 1}, default: ['tag:project']}
      allowCrossScope:
        type: boolean
        enum: [false]
        default: false
        description: Reserved policy extension. T5 rejects enablement and never grants sibling or cross-project permission.
  limits:
    type: object
    additionalProperties: false
    properties:
      sendsPerChainPerHour: {type: integer, minimum: 1, default: 10}
      revivesPerChainPerHour:
        type: integer
        minimum: 1
        default: 6
        description: Provider-confirmed revivals per recipient continuation chain in a rolling hour. Failed attempts do not consume this limit.
      messagesPerThread: {type: integer, minimum: 1, default: 8}
      maxBodyBytes: {type: integer, minimum: 1, maximum: 8192, default: 8192}
      maxHop: {type: integer, minimum: 0, maximum: 3, default: 3}
      defaultExpirySeconds: {type: integer, minimum: 60, maximum: 604800, default: 86400}
