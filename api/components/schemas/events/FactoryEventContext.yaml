type: object
additionalProperties: false
required:
  - sequence
  - tick
  - eventTime
properties:
  sequence:
    type: integer
    minimum: 0
    description: Append-only event-log sequence number.
  tick:
    type: integer
    minimum: 0
    description: Logical engine tick observed by the runtime.
  eventTime:
    type: string
    format: date-time
    description: Wall-clock event timestamp for customer explanation and diagnostics. ISO8601 timestamp.
  sessionId:
    type: string
    description: Canonical factory session identity for session-scoped events; payloads must not restate it.
  sessionSequence:
    type: integer
    minimum: 0
    description: Monotonic per-session ordering used for replay deduplication within one session.
  orchestratorKind:
    $ref: '../data-models/FactoryOrchestratorKind.yaml'
    description: Canonical orchestrator kind for session-scoped events; payloads must not restate it.
  orchestratorDialect:
    type: string
    description: Optional JavaScript workflow dialect when orchestrator.kind = JAVASCRIPT.
  phaseId:
    type: string
    description: Canonical workflow phase identifier; payloads must not restate it.
  phaseName:
    type: string
    description: Canonical workflow phase name for customer-visible diagnostics.
  checkpointId:
    type: string
    description: Canonical checkpoint identifier for checkpoint-scoped events; payloads must not restate it.
  requestId:
    type: string
    description: Canonical request identity for all request-scoped events; payload metadata must not restate it.
  traceIds:
    type: array
    description: Canonical trace identifiers that contributed to this event; payloads must not restate them.
    items:
      type: string
  workIds:
    type: array
    description: Canonical work identities correlated to this event; payloads must not restate them.
    items:
      type: string
  dispatchId:
    type: string
    description: Canonical dispatch identity for dispatch and inference events; payloads must not restate it.
  currentChainingTraceId:
    type: string
    description: Canonical chaining-trace identifier for the dispatch currently represented by this event context.
  previousChainingTraceIds:
    type: array
    description: Canonical predecessor chaining traces consumed by the dispatch in deterministic order.
    items:
      type: string
  source:
    type: string
    description: Human-readable source such as api, filewatcher, replay, cron, or worker.
