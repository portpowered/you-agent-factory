type: string
description: Stable machine-readable failure type used to classify failed work across providers and runtimes.
x-enum-varnames:
  - WorkFailureTypeAuthFailure
  - WorkFailureTypePermanentBadRequest
  - WorkFailureTypeThrottled
  - WorkFailureTypeInternalServerError
  - WorkFailureTypeTimeout
  - WorkFailureTypeUnknown
  - WorkFailureTypeMisconfigured
  - WorkFailureTypeMissingExecutable
  - WorkFailureTypeCommandLineTooLong
  - WorkFailureTypeStructuredOutputSchemaViolation
enum:
  - auth_failure
  - permanent_bad_request
  - throttled
  - internal_server_error
  - timeout
  - unknown
  - misconfigured
  - missing_executable
  - command_line_too_long
  - structured_output_schema_violation
x-enum-descriptions:
  - Authentication or authorization failed and operator action is required.
  - The request is invalid in a non-retryable way and should be fixed before retrying.
  - The dependency rejected the request because of throttling or capacity limits.
  - The dependency or runtime failed with a retryable internal error.
  - The work exceeded a configured deadline before completing.
  - The runtime could not classify the failure into a more specific stable type.
  - The worker or runtime was misconfigured and requires operator intervention.
  - The configured provider executable could not be found.
  - The provider command exceeded the operating system command-line size limit.
  - The worker response was malformed JSON or did not satisfy the workstation output schema.
