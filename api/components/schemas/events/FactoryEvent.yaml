type: object
additionalProperties: false
description: >-
  Versioned Agent Factory event message. This is the intended canonical
  schema for customer event streams, history projection, record/replay
  artifacts, and runtime diagnostics. New fields use camelCase even when
  older REST resource schemas still contain legacy snake_case fields.
required:
  - schemaVersion
  - id
  - type
  - context
  - payload
properties:
  schemaVersion:
    type: string
    description: Version of the factory event envelope schema.
    enum:
      - agent-factory.event.v1
    x-enum-descriptions:
      - Initial unified Agent Factory event schema.
  id:
    type: string
    description: Stable event identifier. Record/replay artifacts must preserve this value.
  type:
    $ref: ./FactoryEventType.yaml
  context:
    $ref: ./FactoryEventContext.yaml
  payload:
    oneOf:
      - $ref: ./payloads/RunRequestEventPayload.yaml
      - $ref: ./payloads/InitialStructureRequestEventPayload.yaml
      - $ref: ./payloads/FactoryChangeEventPayload.yaml
      - $ref: ./payloads/FactoryChangeRequestEventPayload.yaml
      - $ref: ./payloads/FactoryChangeFailedEventPayload.yaml
      - $ref: ./payloads/WorkRequestEventPayload.yaml
      - $ref: ./payloads/RelationshipChangeRequestEventPayload.yaml
      - $ref: ./payloads/DispatchRequestEventPayload.yaml
      - $ref: ./payloads/HumanApprovalRequestedEventPayload.yaml
      - $ref: ./payloads/DispatchWorkerSessionAssociationEventPayload.yaml
      - $ref: ./payloads/ModelRequestEventPayload.yaml
      - $ref: ./payloads/ModelResponseEventPayload.yaml
      - $ref: ./payloads/InferenceRequestEventPayload.yaml
      - $ref: ./payloads/InferenceResponseEventPayload.yaml
      - $ref: ./payloads/ScriptRequestEventPayload.yaml
      - $ref: ./payloads/ScriptResponseEventPayload.yaml
      - $ref: ./payloads/AgentRunResponseEventPayload.yaml
      - $ref: ./payloads/DispatchResponseEventPayload.yaml
      - $ref: ./payloads/DispatchResultIgnoredEventPayload.yaml
      - $ref: ./payloads/WorkStateChangeEventPayload.yaml
      - $ref: ./payloads/FactoryStateResponseEventPayload.yaml
      - $ref: ./payloads/RunResponseEventPayload.yaml
      - $ref: ./payloads/SessionStartedEventPayload.yaml
      - $ref: ./payloads/SessionPausedEventPayload.yaml
      - $ref: ./payloads/SessionResumedEventPayload.yaml
      - $ref: ./payloads/SessionResultUpdatedEventPayload.yaml
      - $ref: ./payloads/SessionCompletedEventPayload.yaml
      - $ref: ./payloads/SessionLifecycleControlEventPayload.yaml
      - $ref: ./payloads/OrchestratorPhaseChangedEventPayload.yaml
      - $ref: ./payloads/OrchestratorCheckpointWrittenEventPayload.yaml
      - $ref: ./payloads/DispatchQueuedEventPayload.yaml
      - $ref: ./payloads/DispatchInterruptedEventPayload.yaml
      - $ref: ./payloads/DispatchReconciledEventPayload.yaml
      - $ref: ./payloads/JavaScriptCheckpointRefEventPayload.yaml
      - $ref: ./payloads/JavaScriptPhaseChangeEventPayload.yaml
      - $ref: ./payloads/ArtifactCreatedEventPayload.yaml
# The association payload carries only the Worker Session identity. Exclude an
# association envelope whose shared context does not contain a non-empty,
# authoritative dispatch identity. `not` preserves the generated envelope
# model while keeping this event-specific constraint in the public schema.
not:
  type: object
  required:
    - type
    - context
  properties:
    type:
      type: string
      enum:
        - DISPATCH_WORKER_SESSION_ASSOCIATION
    context:
      not:
        type: object
        required:
          - dispatchId
        properties:
          dispatchId:
            type: string
            minLength: 1
discriminator:
  propertyName: type
  mapping:
    RUN_REQUEST: ./payloads/RunRequestEventPayload.yaml
    INITIAL_STRUCTURE_REQUEST: ./payloads/InitialStructureRequestEventPayload.yaml
    FACTORY_CHANGE: ./payloads/FactoryChangeEventPayload.yaml
    FACTORY_CHANGE_REQUEST: ./payloads/FactoryChangeRequestEventPayload.yaml
    FACTORY_CHANGE_FAILED: ./payloads/FactoryChangeFailedEventPayload.yaml
    WORK_REQUEST: ./payloads/WorkRequestEventPayload.yaml
    RELATIONSHIP_CHANGE_REQUEST: ./payloads/RelationshipChangeRequestEventPayload.yaml
    DISPATCH_REQUEST: ./payloads/DispatchRequestEventPayload.yaml
    HUMAN_APPROVAL_REQUESTED: ./payloads/HumanApprovalRequestedEventPayload.yaml
    DISPATCH_WORKER_SESSION_ASSOCIATION: ./payloads/DispatchWorkerSessionAssociationEventPayload.yaml
    MODEL_REQUEST: ./payloads/ModelRequestEventPayload.yaml
    MODEL_RESPONSE: ./payloads/ModelResponseEventPayload.yaml
    INFERENCE_REQUEST: ./payloads/InferenceRequestEventPayload.yaml
    INFERENCE_RESPONSE: ./payloads/InferenceResponseEventPayload.yaml
    SCRIPT_REQUEST: ./payloads/ScriptRequestEventPayload.yaml
    SCRIPT_RESPONSE: ./payloads/ScriptResponseEventPayload.yaml
    AGENT_RUN_RESPONSE: ./payloads/AgentRunResponseEventPayload.yaml
    DISPATCH_RESPONSE: ./payloads/DispatchResponseEventPayload.yaml
    DISPATCH_RESULT_IGNORED: ./payloads/DispatchResultIgnoredEventPayload.yaml
    WORK_STATE_CHANGE: ./payloads/WorkStateChangeEventPayload.yaml
    FACTORY_STATE_RESPONSE: ./payloads/FactoryStateResponseEventPayload.yaml
    RUN_RESPONSE: ./payloads/RunResponseEventPayload.yaml
    SESSION_STARTED: ./payloads/SessionStartedEventPayload.yaml
    SESSION_PAUSED: ./payloads/SessionPausedEventPayload.yaml
    SESSION_RESUMED: ./payloads/SessionResumedEventPayload.yaml
    SESSION_RESULT_UPDATED: ./payloads/SessionResultUpdatedEventPayload.yaml
    SESSION_COMPLETED: ./payloads/SessionCompletedEventPayload.yaml
    SESSION_LIFECYCLE_CONTROL: ./payloads/SessionLifecycleControlEventPayload.yaml
    ORCHESTRATOR_PHASE_CHANGED: ./payloads/OrchestratorPhaseChangedEventPayload.yaml
    ORCHESTRATOR_CHECKPOINT_WRITTEN: ./payloads/OrchestratorCheckpointWrittenEventPayload.yaml
    DISPATCH_QUEUED: ./payloads/DispatchQueuedEventPayload.yaml
    DISPATCH_INTERRUPTED: ./payloads/DispatchInterruptedEventPayload.yaml
    DISPATCH_RECONCILED: ./payloads/DispatchReconciledEventPayload.yaml
    JAVASCRIPT_CHECKPOINT_REF: ./payloads/JavaScriptCheckpointRefEventPayload.yaml
    JAVASCRIPT_PHASE_CHANGE: ./payloads/JavaScriptPhaseChangeEventPayload.yaml
    ARTIFACT_CREATED: ./payloads/ArtifactCreatedEventPayload.yaml
