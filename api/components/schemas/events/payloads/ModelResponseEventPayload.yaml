type: object
additionalProperties: false
required:
  - modelRequestId
  - attempt
  - operation
  - worker
  - model
  - providerLocality
  - outcome
  - durationMillis
description: >-
  Response details captured after a model-backed worker invocation returns,
  including resource wait, local load, binding-resolution, output, and failure
  evidence correlated to the matching model request event. Large binary audio
  must remain represented through content references or bounded previews instead
  of unbounded inline payloads.
properties:
  modelRequestId:
    type: string
    description: Identifier from the matching model request event.
  attempt:
    type: integer
    minimum: 1
    description: One-based model execution attempt number for this dispatch.
  operation:
    type: string
    description: Uppercase model operation requested by the workstation, such as TTS.
  worker:
    type: string
    description: Runtime worker name selected for the invocation.
  model:
    type: string
    description: Concrete model identity resolved for this invocation.
  providerLocality:
    type: string
    description: Worker-declared model locality, such as LOCAL or CLOUD.
  outcome:
    $ref: '../InferenceOutcome.yaml'
  durationMillis:
    type: integer
    format: int64
    minimum: 0
    description: End-to-end model invocation duration in milliseconds.
  resources:
    type: array
    items:
      $ref: '../../../../openapi-main.yaml#/components/schemas/ModelResourceSummary'
    description: Concrete resources attached to the model worker execution path.
  bindings:
    type: array
    items:
      $ref: '../../../../openapi-main.yaml#/components/schemas/ResolvedModelOperationBinding'
    description: Deterministically resolved operation-slot bindings used for invocation.
  resourceWaitMillis:
    type: integer
    format: int64
    minimum: 0
    description: Time spent waiting for local model resources before acquisition.
  resourceAcquired:
    type: boolean
    description: Whether the invocation acquired the required local model resources.
  loadRequested:
    type: boolean
    description: Whether this invocation asked the managed local-model runtime to load a handle.
  loadReused:
    type: boolean
    description: Whether an already-loaded local model handle was reused instead of loading again.
  loadDurationMillis:
    type: integer
    format: int64
    minimum: 0
    description: Duration of the managed local-model load call when one occurred.
  outputPreview:
    type: string
    description: Bounded output preview for non-binary model responses when present.
  outputContent:
    $ref: '../../../../openapi-main.yaml#/components/schemas/WorkContent'
  diagnostics:
    $ref: '../../../../openapi-main.yaml#/components/schemas/SafeWorkDiagnostics'
  errorClass:
    type: string
    description: Stable failure classification when available.
