type: object
additionalProperties: false
required:
  - transitionId
  - outcome
description: >-
  Customer-visible dispatch completion event. Output work is represented
  with the same Work schema used by request submission rather than token
  or marking-mutation internals. FactoryEvent.context owns dispatch, trace,
  and work identity; workstation and worker topology must be derived from
  the matching dispatch-request event plus the initial structure.
  Provider-attempt session and safe diagnostic facts stay on inference
  response events instead of being copied onto dispatch completion payloads.
properties:
  completionId:
    type: string
  transitionId:
    type: string
  currentChainingTraceId:
    type: string
    deprecated: true
    description: Deprecated compatibility copy of the dispatch chaining-trace identifier; prefer FactoryEvent.context.currentChainingTraceId.
  previousChainingTraceIds:
    type: array
    deprecated: true
    description: Deprecated compatibility copy of predecessor chaining traces; prefer FactoryEvent.context.previousChainingTraceIds.
    items:
      type: string
  outcome:
    $ref: '../../../../openapi-main.yaml#/components/schemas/WorkOutcome'
  output:
    type: string
  structuredResult:
    description: Optional native JSON value produced when the workstation outputSchema validates the worker response. JSON null is distinct from an omitted value.
  error:
    type: string
  feedback:
    type: string
  selectedClassificationLabel:
    type: string
  artifactVerification:
    $ref: '../../data-models/ExpectedArtifactVerification.yaml'
  failureDetail:
    $ref: '../../data-models/FailureDetail.yaml'
  providerFailure:
    $ref: '../../../../openapi-main.yaml#/components/schemas/ProviderFailureMetadata'
  metrics:
    $ref: '../../../../openapi-main.yaml#/components/schemas/WorkMetrics'
  durationMillis:
    type: integer
    format: int64
  outputWork:
    type: array
    items:
      $ref: '../../../../openapi-main.yaml#/components/schemas/Work'
  outputResources:
    type: array
    items:
      $ref: '../../../../openapi-main.yaml#/components/schemas/Resource'
  metadata:
    $ref: '../../../../openapi-main.yaml#/components/schemas/StringMap'
