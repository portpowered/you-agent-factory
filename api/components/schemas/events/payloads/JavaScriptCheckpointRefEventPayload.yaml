type: object
additionalProperties: false
description: >-
  Customer-visible JavaScript checkpoint reference recorded on the canonical
  factory event stream. Raw VM checkpoint bodies remain orchestrator-owned and
  are not included in this payload.
required:
  - checkpointId
  - artifactRef
properties:
  checkpointId:
    type: string
    description: Stable checkpoint identifier referenced by the session runtime.
  label:
    type: string
    description: Customer-visible checkpoint label.
  timestamp:
    type: string
    format: date-time
    description: When the checkpoint was recorded.
  summary:
    type: string
    description: Short customer-visible checkpoint summary without raw VM state.
  artifactRef:
    $ref: '../../data-models/FactoryArtifactRef.yaml'
