description: >-
  Discontinuity marker for either unavailable retained response-event sequences
  or an affected provider item whose lifecycle could not be fully observed.
  Retention gaps include fromSequence, toSequence, and firstAvailableSequence;
  item-scoped gaps include affectedItemId and reason. The alternatives are
  exclusive so empty, partial, and mixed payloads are rejected.
oneOf:
  - type: object
    additionalProperties: false
    required:
      - fromSequence
      - toSequence
      - firstAvailableSequence
    properties:
      fromSequence:
        type: integer
        format: int64
        minimum: 0
        description: Lowest unavailable published sequence greater than the reader's cursor.
      toSequence:
        type: integer
        format: int64
        minimum: 0
        description: Highest unavailable published sequence in the reader's catch-up window.
      firstAvailableSequence:
        type: integer
        format: int64
        minimum: 1
        description: First retained sequence available after the gap.
      reason:
        type: string
        minLength: 1
        description: Retention-gap reason such as retention_window.
  - type: object
    additionalProperties: false
    required:
      - affectedItemId
      - reason
    properties:
      affectedItemId:
        type: string
        minLength: 1
        description: Stable item identifier affected by a provider lifecycle discontinuity.
      toolCallId:
        type: string
        minLength: 1
        description: Provider tool-call identifier when the affected item is a tool lifecycle.
      reason:
        type: string
        minLength: 1
        description: Provider gap reason such as provider_reconnect or provider_terminated.
