type: object
additionalProperties: false
description: Discontinuity marker in the retained response-event stream.
required:
  - fromSequence
  - toSequence
properties:
  fromSequence:
    type: integer
    format: int64
    minimum: 0
    description: >-
      Lowest unavailable published sequence greater than the reader's cursor.
  toSequence:
    type: integer
    format: int64
    minimum: 0
    description: >-
      Highest unavailable published sequence in the reader's catch-up window.
  reason:
    type: string
    description: Optional reason for the stream gap such as retention_window.
