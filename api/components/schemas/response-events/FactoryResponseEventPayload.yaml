  - $ref: ./payloads/FactoryResponseEventRunPayload.yaml
  - $ref: ./payloads/FactoryResponseEventTurnPayload.yaml
  - $ref: ./payloads/FactoryResponseEventMessagePayload.yaml
  - $ref: ./payloads/FactoryResponseEventMessageDeltaPayload.yaml
  - $ref: ./payloads/FactoryResponseEventReasoningPayload.yaml
  - $ref: ./payloads/FactoryResponseEventToolPayload.yaml
  - $ref: ./payloads/FactoryResponseEventToolDeltaPayload.yaml
  - $ref: ./payloads/FactoryResponseEventFileChangePayload.yaml
  - $ref: ./payloads/FactoryResponseEventPlanPayload.yaml
  - $ref: ./payloads/FactoryResponseEventProgressPayload.yaml
  - $ref: ./payloads/FactoryResponseEventUsagePayload.yaml
  - $ref: ./payloads/FactoryResponseEventErrorPayload.yaml
  - $ref: ./payloads/FactoryResponseEventStreamGapPayload.yaml
