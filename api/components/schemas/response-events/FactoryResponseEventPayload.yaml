description: >-
  Public typed payload union for FactoryResponseEvent. Variants align with
  envelope kind and phase semantics from the Story 01 vocabulary. MESSAGE and
  TOOL kinds use distinct snapshot and delta payload shapes; consumers select
  the variant using envelope kind and phase together with structural decoding.
oneOf:
