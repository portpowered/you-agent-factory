type: object
additionalProperties: false
required:
  - workId
properties:
  workId:
    type: string
  workTypeId:
    type: string
  state:
    type: string
  displayName:
    type: string
  chainingTraceDepth:
    type: integer
    minimum: 1
  currentChainingTraceId:
    type: string
  previousChainingTraceIds:
    type: array
    items:
      type: string
  traceId:
    type: string
  content:
    $ref: '../data-models/WorkContent.yaml'
  payloadStatus:
    type: string
    enum:
      - RESOLVED
      - UNAVAILABLE
      - LOADING
      - ERROR
  payloadUnavailableReason:
    type: string
  lineageLogicalWorkId:
    type: string
  lineageSourceKind:
    type: string
    enum:
      - WORK_REQUEST
      - DISPATCH_RESPONSE_OUTPUT
  lineageContinuity:
    type: string
    enum:
      - INITIAL_SUBMISSION
      - SAME_WORK_ID_CONTINUATION
      - NEW_DOWNSTREAM_WORK
  lineageParentWorkIds:
    type: array
    items:
      type: string
