type: object
additionalProperties: false
required:
  - workId
properties:
  workId:
    type: string
  workTypeId:
    type: string
  state:
    type: string
  displayName:
    type: string
  chainingTraceDepth:
    type: integer
    minimum: 1
  currentChainingTraceId:
    type: string
  previousChainingTraceIds:
    type: array
    items:
      type: string
  traceId:
    type: string
  content:
    $ref: '../data-models/WorkContent.yaml'
  payloadStatus:
    type: string
    enum:
      - RESOLVED
      - UNAVAILABLE
      - LOADING
      - ERROR
  payloadUnavailableReason:
    type: string
