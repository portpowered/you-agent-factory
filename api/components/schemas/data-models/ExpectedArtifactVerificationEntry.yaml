type: object
additionalProperties: false
required:
  - name
  - pattern
  - reason
properties:
  declarationIndex:
    type: integer
    minimum: 1
    description: One-based position in the normalized expected-artifact declaration list.
  name:
    type: string
    minLength: 1
  pattern:
    type: string
    minLength: 1
    description: Workspace-relative rendered artifact pattern; host paths are never emitted.
  reason:
    $ref: '../events/ExpectedArtifactVerificationReason.yaml'
