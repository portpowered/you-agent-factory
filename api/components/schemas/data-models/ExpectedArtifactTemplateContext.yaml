type: object
additionalProperties: true
description: >-
  Stable, non-host context used when rendering expected-artifact patterns.
  Filesystem paths, environment variables, and Factory documentation are not
  part of this replayable vocabulary.
properties:
  inputs:
    type: array
    description: >-
      Exact replay-safe input values captured when the dispatch was created.
      Artifact templates expose these values through `.Inputs`; prompt-only
      relations, content, retry history, and host context are not included.
    items:
      $ref: './ExpectedArtifactTemplateInput.yaml'
  project:
    type: string
    description: Stable project identifier for the dispatch.
  sessionId:
    type: string
    description: Stable Factory Session identifier for the dispatch.
