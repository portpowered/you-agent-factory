description: >-
  A reusable worker definition that tells the factory how a workstation
  should execute work, such as through a model-backed agent or a script.
type: object
additionalProperties: false
required:
  - name
properties:
  id:
    type: string
    description: Optional durable public identifier for this worker. When present, graph and layout references should use this id instead of the mutable name.
  name:
    type: string
    description: Worker name referenced by Workstation.worker.
  description:
    allOf:
      - $ref: './NameValue.yaml'
    description: Optional localized customer-facing explanation of this worker.
  type:
    allOf:
      - $ref: './WorkerType.yaml'
    description: Worker implementation family to instantiate for this definition.
  provider:
    allOf:
      - $ref: './HostedWorkerProvider.yaml'
    description: Built-in hosted provider identity when this worker uses repository-owned hosted execution.
  model:
    type: string
    description: Model identifier to request from the configured model provider when this worker uses model execution.
  modelProvider:
    oneOf:
      - $ref: './ProviderIdentity.yaml'
      - type: string
        pattern: '^\$\{[A-Za-z0-9_.-]+\}$'
    description: >-
      Canonical provider identity used for model routing and provider diagnostics,
      or an exact invocation-parameter placeholder such as `${modelProvider}`.
      For `executorProvider: ACP`, this names the configured ACP integration,
      such as `cursor-acp`. Extension identities use lowercase standardized
      syntax; built-in values such as `CLAUDE` and `CODEX` remain compatibility
      conveniences.
  reasoningEffort:
    $ref: './ReasoningEffort.yaml'
  modelLocality:
    allOf:
      - $ref: './WorkerModelLocality.yaml'
    description: Provider locality for this model capability declaration. Use `LOCAL` for embedded or host-managed inference and `CLOUD` for remote provider execution.
  executorProvider:
    allOf:
      - $ref: './WorkerProvider.yaml'
    description: >-
      Execution mechanism. Use `ACP` for ACP-backed workers and put the
      configured integration identity (for example `cursor-acp`) in
      modelProvider. `SCRIPT_WRAP` remains the command-wrapper compatibility
      value; legacy named executor identities remain accepted during migration.
  operations:
    type: array
    description: Provider-agnostic model operations that this worker can execute, including named input and output slots.
    items:
      $ref: './ModelOperation.yaml'
  command:
    type: string
    description: Command to execute when this worker runs through a command or script provider.
  args:
    type: array
    description: Additional command arguments passed to the configured command.
    items:
      type: string
  resources:
    type: array
    description: Resource capacity this worker requires before it can be dispatched.
    items:
      $ref: '../shared/ResourceRequirement.yaml'
  timeout:
    type: string
    description: Optional Go duration that caps one worker execution attempt.
  stopToken:
    type: string
    description: Marker that tells model-oriented workers where to stop generated output when the provider supports it.
  skipPermissions:
    type: boolean
    description: When true, bypasses permission checks for providers that support permission gating.
  auth:
    allOf:
      - $ref: './HostedWorkerAuth.yaml'
    description: Hosted-worker authentication contract. V1 hosted workers accept only auth.secretRef.
  linear:
    allOf:
      - $ref: './HostedLinearWorkerConfig.yaml'
    description: Provider-specific configuration for the built-in hosted LINEAR worker.
  agentTools:
    allOf:
      - $ref: './AgentWorkerToolsConfig.yaml'
    description: >-
      Explicit agent-loop tool policy for AGENT_WORKER definitions. Omit or set
      policy DISABLED to run agent loops without advertising or executing tools.
  body:
    type: string
    description: Inline worker instructions or script body when the worker is authored directly in factory config.
