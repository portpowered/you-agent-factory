type: object
additionalProperties: false
description: >-
  A lifecycle state that a work item can occupy inside one work type.
required:
  - name
  - type
properties:
  id:
    type: string
    description: Optional durable public identifier for this state within its work type. When present, graph and layout references should use this id instead of the mutable name.
  name:
    type: string
    description: Customer-authored state name referenced by workstation inputs and outputs.
  type:
    allOf:
      - $ref: './WorkStateType.yaml'
    description: Lifecycle category for this state, such as initial, processing, terminal, or failed.
  onReopen:
    type: object
    additionalProperties: false
    description: >-
      Optional recovery rule for restored Work in a processing state.
      Live reopening applies one move before scheduling. Replay applies none.
      At maxWaits recorded waiting admissions, reopening selects exhaustedState.
    required:
      - state
      - maxWaits
      - exhaustedState
    properties:
      state:
        type: string
        minLength: 1
        description: Different processing state in the same work type for another attempt.
      maxWaits:
        type: integer
        minimum: 1
        description: Number of recorded waiting admissions that exhaust the recovery budget.
      exhaustedState:
        type: string
        minLength: 1
        description: Failed state in the same work type selected when the budget is exhausted.
