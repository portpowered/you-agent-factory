type: object
additionalProperties: false
required:
  - id
  - sessionId
  - orchestratorKind
  - dispatchKind
  - status
  - confirmationState
properties:
  id:
    type: string
    description: Stable dispatch identifier.
  sessionId:
    type: string
    description: Factory session that owns this dispatch.
  orchestratorKind:
    $ref: './FactoryOrchestratorKind.yaml'
  dispatchKind:
    $ref: './FactoryDispatchKind.yaml'
  phase:
    type: string
    description: JavaScript workflow phase when the dispatch was created or observed.
  status:
    $ref: './FactoryDispatchStatus.yaml'
  confirmationState:
    $ref: './ConfirmationState.yaml'
    description: Whether the event that produced the reported dispatch status is covered by completed recording storage.
  label:
    type: string
    description: Customer-visible dispatch label.
  attempt:
    type: integer
    format: int32
    minimum: 1
    description: One-based attempt number for retried dispatches.
  retryable:
    type: boolean
    description: Whether the provider failure that produced the current failed state was retryable.
  failureClassification:
    $ref: '../../../openapi-main.yaml#/components/schemas/WorkFailureType'
    description: Stable canonical classification recorded for the current provider failure.
  runnerId:
    type: string
    description: Selected runner identifier when applicable.
  presetId:
    type: string
    description: Resolved operator worker preset identifier when one was selected.
  modelProvider:
    type: string
    description: Resolved canonical model-provider identifier when applicable.
  model:
    type: string
    description: Selected model identifier when applicable.
  reasoningEffort:
    type: string
    description: Resolved canonical reasoning effort when applicable.
  provider:
    type: string
    description: Selected provider identifier when applicable.
  providerSessionRefs:
    type: array
    items:
      $ref: '../api/LoadableProviderSessionRef.yaml'
    description: Provider-session correlation refs for model-backed dispatches.
  promptDigest:
    type: string
    description: Stable digest of rendered prompt material.
  schemaDigest:
    type: string
    description: Stable digest of the output schema when applicable.
  relatedWorkIds:
    type: array
    items:
      type: string
    description: Related work identifiers consumed or produced by the dispatch.
  artifactIds:
    type: array
    items:
      type: string
    description: Artifact identifiers produced by the dispatch.
  statusTransitions:
    type: array
    items:
      $ref: './FactoryDispatchStatus.yaml'
    description: Ordered durable status history observed for the dispatch.
  usage:
    $ref: './FactoryDispatchUsage.yaml'
  warnings:
    type: array
    items:
      $ref: './FactoryDispatchWarning.yaml'
  failureDetail:
    $ref: './FailureDetail.yaml'
  petri:
    $ref: './FactoryDispatchPetriProjection.yaml'
    description: Petri-specific dispatch projection. Present for Petri transition dispatches.
  javascript:
    $ref: './FactoryDispatchJavaScriptProjection.yaml'
    description: JavaScript-specific dispatch projection. Present for JavaScript workflow task dispatches.
