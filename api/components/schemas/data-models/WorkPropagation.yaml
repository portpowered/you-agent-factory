type: object
additionalProperties: false
required:
  - mode
description: >-
  Optional workstation policy for how downstream work receives payload content
  after this workstation completes. When omitted, downstream work uses the
  workstation output payload.
properties:
  mode:
    allOf:
      - $ref: './WorkPropagationMode.yaml'
    description: >-
      Propagation mode for downstream work payload selection after this
      workstation succeeds.
