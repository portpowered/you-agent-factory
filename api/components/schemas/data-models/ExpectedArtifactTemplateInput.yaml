type: object
additionalProperties: true
description: >-
  Stable replay-safe input value available to an expected-artifact template.
  This is intentionally smaller than the workstation prompt input surface so
  completion verification and historical Work reads can use the same values.
properties:
  name:
    type: string
  workId:
    type: string
  workTypeId:
    type: string
  dataType:
    type: string
  traceId:
    type: string
  parentId:
    type: string
  project:
    type: string
    description: Per-input project value resolved from the input project tag, dispatch context, or the default project.
  tags:
    $ref: '../shared/StringMap.yaml'
  payload:
    type: string
    description: >-
      The dispatch-time textual payload value. It is retained only in the
      artifact template context and is not added to the normal Work read.
