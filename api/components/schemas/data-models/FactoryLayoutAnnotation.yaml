type: object
description: Inert positioned canvas annotation. Its kind selects either note or image content; annotations never identify graph nodes or edges, and connection-like fields are invalid.
additionalProperties: false
required:
  - id
  - kind
  - position
properties:
  id:
    type: string
    description: Stable annotation identifier unique within this layout.
  kind:
    $ref: './FactoryLayoutAnnotationKind.yaml'
  position:
    $ref: './FactoryLayoutAnnotationPosition.yaml'
  size:
    $ref: './FactoryLayoutAnnotationSize.yaml'
  note:
    $ref: './FactoryLayoutNote.yaml'
  image:
    $ref: './FactoryLayoutImage.yaml'
