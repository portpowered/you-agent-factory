type: object
additionalProperties: false
description: >-
  One expected output declaration relative to the dispatch workspace. Pattern is
  a workspace-relative literal path or glob and may use the dispatch template
  fields, such as (index .Inputs 0).Name, inside a Go template action.
required:
  - name
  - pattern
properties:
  name:
    type: string
    minLength: 1
    description: Customer-visible name for this expected output declaration.
  pattern:
    type: string
    minLength: 1
    description: Workspace-relative literal path or glob template to verify.
  nonEmpty:
    type: boolean
    default: false
    description: Require every regular file matched by the pattern to be non-empty.
