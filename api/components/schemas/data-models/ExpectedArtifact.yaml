type: object
additionalProperties: true
description: >-
  One expected output declaration relative to the dispatch workspace. Pattern is
  a workspace-relative literal path or glob and may use the replay-safe
  dispatch template fields `.Inputs` (the replay-safe fields are documented by
  `ExpectedArtifactTemplateInput`), `.Context.Project`, and
  `.Context.SessionID` inside a Go template action. Prompt-only fields, host
  paths, environment variables, and Factory documentation are not supported.
required:
  - name
  - pattern
properties:
  name:
    type: string
    minLength: 1
    description: Customer-visible name for this expected output declaration.
  pattern:
    type: string
    minLength: 1
    description: Workspace-relative literal path or glob template to verify.
  nonEmpty:
    type: boolean
    default: false
    description: Require every regular file matched by the pattern to be non-empty.
