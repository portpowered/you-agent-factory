description: >-
  Shared capacity that limits how much work the factory can run at once,
  such as worker slots or external service quotas.
type: object
additionalProperties: false
required:
  - name
  - capacity
properties:
  id:
    type: string
    description: Optional durable public identifier for this resource. When present, graph and layout references should use this id instead of the mutable name.
  name:
    type: string
    description: Resource name referenced from worker requirements and workstation resourceUsage entries.
  type:
    allOf:
      - $ref: './ResourceType.yaml'
    description: Optional uppercase resource family, such as `MODEL`, `PROVIDER_QUOTA`, or `INVOCATION_SLOT`.
  capacity:
    type: integer
    minimum: 1
    description: Total units of this resource available to the factory at one time.
  model:
    type: string
    description: >-
      Stable managed runtime identity for `MODEL` resources, such as `OMNIVOICE_Q4_K_M`.
      Packaged and authored factories declare the same managed-runtime dependency through
      this field plus matching `MODEL_WORKER.model` values.
  backend:
    type: string
    description: >-
      Managed runtime backend identifier for `MODEL` resources, such as `LLAMACPP`.
      Backend selection stays provider-agnostic in customer-facing factory config.
  loadPolicy:
    type: string
    description: >-
      Managed runtime load policy for `MODEL` resources, such as `ON_DEMAND` or `EAGER`.
  provider:
    type: string
    description: Provider identity associated with this resource, especially for `PROVIDER_QUOTA` resources.
