type: object
additionalProperties: false
description: >-
  A named category of work that can move through the factory. Each work
  type declares the lifecycle states its work items can occupy.
required:
  - name
  - states
properties:
  id:
    type: string
    description: Optional durable public identifier for this work type. When present, graph and layout references should use this id instead of the mutable name.
  name:
    type: string
    description: Customer-authored work type name referenced by workstation inputs, outputs, and submitted work.
  description:
    allOf:
      - $ref: './NameValue.yaml'
    description: Optional localized customer-facing explanation of this work type.
  states:
    type: array
    description: Lifecycle states available for work items of this type.
    items:
      $ref: './WorkState.yaml'
  handlingBehavior:
    type: array
    description: >-
      Optional CLI routing markers for this work type. Factories used with you run --factory
      must declare handlingBehavior DEFAULT on exactly one work type.
    items:
      $ref: './WorkTypeHandlingBehavior.yaml'
