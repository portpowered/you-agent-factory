description: Named factory name or payload was invalid.
content:
  application/json:
    schema:
      $ref: '../schemas/api/ErrorResponse.yaml'
    examples:
      invalidFactoryName:
        summary: Factory name failed validation.
        value:
          message: Factory name must be a safe directory segment without path separators.
          family: BAD_REQUEST
          code: INVALID_FACTORY_NAME
      invalidFactory:
        summary: Factory payload failed validation because a workstation has outputs but no failure route.
        value:
          message: Factory payload is not a valid Agent Factory definition.
          family: BAD_REQUEST
          code: INVALID_FACTORY
          targets:
            - code: factory.workstation.missingFailureRoute
              severity: error
              message: workstation "bob" must define a failure route.
              subject:
                type: WORKSTATION
                id: bob
                location: ON_FAILURE
      routelessWorkstation:
        summary: Factory payload failed validation because a workstation has no output routes.
        value:
          message: Factory payload is not a valid Agent Factory definition.
          family: BAD_REQUEST
          code: INVALID_FACTORY
          targets:
            - code: factory.workstation.missingOutputRoutes
              severity: error
              message: workstation "bob" must define output routes.
              subject:
                type: WORKSTATION
                id: bob
                location: OUTPUTS
