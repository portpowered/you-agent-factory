        relation:
          $ref: '#/components/schemas/Relation'
    DispatchRequestEventPayload:
      type: object
      additionalProperties: false
      required:
        - transitionId
        - inputs
      description: Customer-visible dispatch start event. FactoryEvent.context owns dispatch, request, trace, and work identity. This payload keeps only non-derived dispatch facts first known when execution starts; workstation and worker topology must be reconstructed from the initial structure and the retained transition identifier. Ordered inputs carry consumed work references only; work type, trace, display, and other work facts must be rebuilt from prior work-request history.
      properties:
        transitionId:
          type: string
        currentChainingTraceId:
          type: string
          deprecated: true
          description: Deprecated compatibility copy of the dispatch chaining-trace identifier; prefer FactoryEvent.context.currentChainingTraceId.
        previousChainingTraceIds:
          type: array
          deprecated: true
          description: Deprecated compatibility copy of predecessor chaining traces; prefer FactoryEvent.context.previousChainingTraceIds.
          items:
            type: string
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/DispatchConsumedWorkRef'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        metadata:
          $ref: '#/components/schemas/DispatchRequestEventMetadata'
        expectedArtifactContext:
          $ref: '#/components/schemas/ExpectedArtifactTemplateContext'
    HumanApprovalRequestedEventPayload:
      type: object
      additionalProperties: false
      required:
        - approvalId
        - workstationId
        - decisions
        - status
      description: Canonical request for operator input at a HUMAN_APPROVAL workstation. FactoryEvent.context carries session, dispatch, request, trace, and Work lineage; this payload intentionally contains no mutable Work content or display text.
      properties:
        approvalId:
          type: string
          description: Stable approval identity derived from the reserved dispatch.
        workstationId:
          type: string
          description: Authored HUMAN_APPROVAL workstation identity.
        decisions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
