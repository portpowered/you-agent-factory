        - DISPATCH_QUEUED
        - DISPATCH_INTERRUPTED
        - DISPATCH_RECONCILED
        - JAVASCRIPT_CHECKPOINT_REF
        - JAVASCRIPT_PHASE_CHANGE
        - ARTIFACT_CREATED
      x-enum-descriptions:
        - A factory run request was recorded and its effective runtime configuration is known.
        - The static factory topology and configured resources are available before work moves.
        - The running factory definition changed and a canonical replacement topology is now active.
        - A normalized live Factory Session change request was admitted before application.
        - An admitted live Factory Session change could not become effective and was closed with a safe failure.
        - Work entered the factory as a normalized request.
        - A relationship-change request between work items was recorded.
        - A workstation request began processing a set of input work.
        - A HUMAN_APPROVAL workstation reserved its input Work and is waiting for operator input.
        - A dispatch was associated with the Worker Session allocated to execute it.
        - A model-backed worker invocation request is about to enter resource, load, and execution boundaries.
        - A model-backed worker invocation returned with resource, load, output, and failure evidence.
        - A model-worker provider attempt is about to send a prompt to the provider.
        - A model-worker provider attempt returned from the provider boundary.
        - A script-backed worker is about to invoke one concrete command attempt.
        - A script-backed worker command attempt returned or failed before a normal exit.
        - An AGENT_RUN workstation agent loop completed and returned bounded inspection metadata.
        - A workstation response finished processing and produced an outcome.
        - A work item moved between authored marking states.
        - The factory lifecycle state response was recorded.
        - A factory run response ended and final metadata is available.
        - Durable factory session execution started and replay-safe session facts are available.
        - A Factory Session lifecycle pause control transitioned the session into PAUSED.
        - A Factory Session lifecycle resume control transitioned the session into RUNNING.
        - Partial or final customer-visible session result availability was recorded.
        - Durable factory session execution reached a terminal lifecycle state.
        - Durable factory session lifecycle control was applied or recorded for replay.
        - An orchestrator workflow phase transition was recorded.
        - An orchestrator checkpoint reference was recorded without exposing raw VM state.
        - A child dispatch was queued for execution.
        - A dispatch was interrupted before completion.
        - Durable dispatch state was reconciled after interruption or stream loss.
        - A JavaScript workflow checkpoint reference was recorded without exposing raw VM state.
        - A JavaScript workflow phase transition was recorded without using Petri marking terminology.
        - A customer-visible factory artifact was created without exposing raw artifact bodies.
    FactoryEventContext:
      type: object
      additionalProperties: false
      required:
        - sequence
        - tick
        - eventTime
      properties:
        sequence:
          type: integer
          minimum: 0
          description: Append-only event-log sequence number.
        tick:
          type: integer
          minimum: 0
          description: Logical engine tick observed by the runtime.
        eventTime:
          type: string
          format: date-time
          description: Wall-clock event timestamp for customer explanation and diagnostics. ISO8601 timestamp.
        sessionId:
          type: string
          description: Canonical factory session identity for session-scoped events; payloads must not restate it.
        sessionSequence:
          type: integer
          minimum: 0
          description: Monotonic per-session ordering used for replay deduplication within one session.
        orchestratorKind:
          $ref: '#/components/schemas/FactoryOrchestratorKind'
          description: Canonical orchestrator kind for session-scoped events; payloads must not restate it.
        orchestratorDialect:
          type: string
          description: Optional JavaScript workflow dialect when orchestrator.kind = JAVASCRIPT.
        phaseId:
          type: string
          description: Canonical workflow phase identifier; payloads must not restate it.
        phaseName:
          type: string
          description: Canonical workflow phase name for customer-visible diagnostics.
        checkpointId:
          type: string
          description: Canonical checkpoint identifier for checkpoint-scoped events; payloads must not restate it.
        requestId:
          type: string
          description: Canonical request identity for all request-scoped events; payload metadata must not restate it.
        traceIds:
          type: array
          description: Canonical trace identifiers that contributed to this event; payloads must not restate them.
          items:
            type: string
        workIds:
          type: array
          description: Canonical work identities correlated to this event; payloads must not restate them.
          items:
            type: string
        dispatchId:
          type: string
          description: Canonical dispatch identity for dispatch and inference events; payloads must not restate it.
        currentChainingTraceId:
          type: string
          description: Canonical chaining-trace identifier for the dispatch currently represented by this event context.
        previousChainingTraceIds:
          type: array
          description: Canonical predecessor chaining traces consumed by the dispatch in deterministic order.
          items:
            type: string
        source:
          type: string
          description: Human-readable source such as api, filewatcher, replay, cron, or worker.
    WorkStateChangeSource:
      type: string
      description: Origin of a WORK_STATE_CHANGE event.
      x-enum-varnames:
        - WorkStateChangeSourceAPI
        - WorkStateChangeSourceCLI
        - WorkStateChangeSourceCascadingFailure
      enum:
        - api
        - cli
        - cascading-failure
      x-enum-descriptions:
        - Operator move through the HTTP API.
        - Operator move through the CLI.
        - Automatic cascade propagation after a dependency failure.
    DispatchConsumedWorkRef:
      type: object
      additionalProperties: false
      required:
        - workId
      description: Ordered reference to one consumed work item on a dispatch boundary. Dispatch-request payloads keep only the consumed work identity here; work type, trace, display, and other work facts must be derived from prior WORK_REQUEST events plus FactoryEvent.context.
      properties:
        workId:
          type: string
          description: Canonical work identity for one consumed dispatch input.
    DispatchRequestEventMetadata:
      type: object
      additionalProperties: false
      description: Optional non-identity dispatch metadata retained on dispatch-request events. Request, trace, work, and dispatch identity must remain on FactoryEvent.context rather than reappearing here.
      properties:
        replayKey:
          type: string
          description: Stable replay correlation key for recorded dispatch reconstruction.
        runnerId:
          $ref: '#/components/schemas/RunnerID'
        runnerSelectionSource:
          $ref: '#/components/schemas/RunnerSelectionSource'
    FactoryResourceCapacityChange:
      type: object
      additionalProperties: false
      description: Detached resource-capacity accounting retained in a successful Factory change event so replay does not depend on mutable runtime state.
      required:
        - resourceId
        - previousCapacity
        - requestedCapacity
        - effectiveCapacity
        - inUseCount
        - availableCount
        - minimumCapacity
        - outcome
      properties:
        resourceId:
          type: string
          minLength: 1
          description: Stable authored Resource.id whose capacity changed.
        resourceName:
          type: string
          description: Optional display name retained for inspection only.
        previousCapacity:
          type: integer
          minimum: 0
          description: Capacity immediately before the change.
        requestedCapacity:
          type: integer
          minimum: 0
          description: Capacity requested by the operator.
        effectiveCapacity:
          type: integer
          minimum: 0
          description: Capacity effective after the change.
        inUseCount:
          type: integer
          minimum: 0
          description: Number of leases in use at the decision boundary.
        availableCount:
          type: integer
          minimum: 0
          description: Number of currently available capacity units.
        minimumCapacity:
          type: integer
          minimum: 0
          description: Lowest capacity permitted by the current in-use count.
        outcome:
          type: string
          enum:
            - APPLIED
            - NO_OP
          description: Terminal capacity decision recorded by the runtime.
    RunRequestEventPayload:
      type: object
      additionalProperties: true
      required:
        - recordedAt
        - factory
      properties:
        recordedAt:
          type: string
          format: date-time
        factory:
          $ref: '#/components/schemas/Factory'
        wallClock:
          $ref: '#/components/schemas/WallClock'
        diagnostics:
          $ref: '#/components/schemas/Diagnostics'
    InitialStructureRequestEventPayload:
      type: object
      additionalProperties: false
      required:
        - factory
      description: Runtime topology snapshot before work moves.
      properties:
        factory:
          $ref: '#/components/schemas/Factory'
        sourceDirectory:
          type: string
        metadata:
          $ref: '#/components/schemas/StringMap'
    FactoryChangeEventPayload:
      type: object
      additionalProperties: false
      required:
        - factory
      description: Runtime topology snapshot after a live factory definition change replaces the running factory.
      properties:
        factory:
          $ref: '#/components/schemas/Factory'
        changeId:
          type: string
          description: Stable live-change identity when this is a revisioned change boundary.
        operation:
          type: string
          description: Normalized live-change operation name.
        targetId:
          type: string
          description: Stable target identity changed by the operation.
        previousRevision:
          type: integer
          minimum: 0
          description: Effective Factory revision immediately before this change.
        newRevision:
          type: integer
          minimum: 0
          description: Effective Factory revision created by this change.
        effectiveSequence:
          type: integer
          minimum: 0
          description: Canonical Factory Event sequence at which this change became effective.
        resourceCapacity:
          $ref: '#/components/schemas/FactoryResourceCapacityChange'
          description: Detached resource-capacity accounting for a capacity change.
        sourceDirectory:
          type: string
        metadata:
          $ref: '#/components/schemas/StringMap'
    FactoryChangeRequestEventPayload:
      type: object
      additionalProperties: false
      description: Normalized live Factory Session change intent. Request identity and session scope are carried by FactoryEvent.context.
      required:
        - changeId
        - expectedRevision
        - operation
        - targetId
        - requestedValue
      properties:
        changeId:
          type: string
          minLength: 1
          description: Stable identity of the requested live change.
        expectedRevision:
          type: integer
          minimum: 0
          description: Effective Factory revision the operator observed before admission.
        operation:
          type: string
          minLength: 1
          description: Normalized live-change operation name.
        targetId:
          type: string
          minLength: 1
          description: Stable target identity changed by the operation.
        requestedValue:
          description: Canonical JSON value requested by the operation.
        actor:
          type: string
          description: Safe actor identity supplied by the caller.
        source:
          type: string
          description: Safe source label such as cli or api.
        reason:
          type: string
          description: Optional normalized safe operator reason.
    FactoryChangeFailedEventPayload:
      type: object
      additionalProperties: false
      description: Safe terminal failure for an admitted live Factory Session change. Raw provider payloads, commands, stack traces, and requested values are excluded.
      required:
        - changeId
        - operation
        - targetId
        - expectedRevision
        - previousRevision
        - failureCode
        - failureMessage
      properties:
        changeId:
          type: string
          minLength: 1
        operation:
          type: string
          minLength: 1
        targetId:
          type: string
          minLength: 1
        expectedRevision:
          type: integer
          minimum: 0
        previousRevision:
          type: integer
          minimum: 0
        failureCode:
          type: string
          minLength: 1
          description: Stable safe failure category.
        failureMessage:
          type: string
          minLength: 1
          description: Bounded safe failure explanation.
    WorkRequestEventPayload:
      type: object
      additionalProperties: false
      required:
        - type
      description: Normalized work request entering the factory. Single-work submissions accepted by POST /work are converted into this one-work request shape before an event is emitted.
      properties:
        type:
          $ref: '#/components/schemas/WorkRequestType'
        works:
          type: array
          items:
            $ref: '#/components/schemas/Work'
        relations:
          type: array
          items:
            $ref: '#/components/schemas/Relation'
        source:
          type: string
        parentLineage:
          type: array
          items:
            type: string
    RelationshipChangeRequestEventPayload:
      type: object
      additionalProperties: false
      required:
        - relation
