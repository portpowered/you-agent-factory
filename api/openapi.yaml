            - $ref: '#/components/schemas/FactoryChangeRequestEventPayload'
            - $ref: '#/components/schemas/FactoryChangeFailedEventPayload'
            - $ref: '#/components/schemas/WorkRequestEventPayload'
            - $ref: '#/components/schemas/RelationshipChangeRequestEventPayload'
