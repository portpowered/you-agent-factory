          description: Capacity was applied, was an exact no-op, or replayed an identical request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionResourceCapacityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionResourceCapacityConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/artifacts:
    get:
      tags:
        - Factory
      operationId: listFactorySessionArtifacts
      summary: List durable factory session artifacts
      description: Returns artifact metadata for one factory session with artifact id, kind, visibility, content hash, size, created time, dispatch relation, secret-redaction counts, audit mode, and safe retrieval refs without exposing unrestricted host filesystem paths by default.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Artifact metadata rows for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFactorySessionArtifactsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/artifacts/{artifact_id}:
    get:
      tags:
        - Factory
      operationId: getFactorySessionArtifact
      summary: Get one durable factory session artifact
      description: Returns artifact metadata plus inlined content or a safe content ref according to artifact visibility and payload size. Responses must not expose unrestricted host filesystem paths by default.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/ArtifactID'
      responses:
        '200':
          description: Artifact detail for the targeted session and artifact id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionArtifactDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/approve:
    post:
      tags:
        - Factory
      operationId: approveFactorySession
      summary: Approve one durable factory session
      description: Approves requested orchestrator policy for one durable factory session in AWAITING_APPROVAL state. Returns the updated session or a typed lifecycle-control outcome for no-op, invalid-state, terminal-session, or conflict cases. Approval responses include the effective policy hash and approval preview identity when available.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionApproveRequest'
      responses:
        '200':
          description: Approval applied immediately or the session already satisfied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Approval control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/pause:
    post:
      tags:
        - Factory
      operationId: pauseFactorySession
      summary: Pause one Factory Session
      description: Pauses one live or durable Factory Session while preserving inspectable partial results, dispatches, artifacts, and buffered inbound submissions or completed worker results. Live workspace sessions use the same route family as durable execution sessions. Automatic progression stops until resume. Returns the updated session or a typed lifecycle-control outcome for no-op, invalid-state, terminal-session, or conflict cases.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionLifecycleControlRequest'
      responses:
        '200':
          description: Pause applied immediately or the session was already paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Pause control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/resume:
    post:
      tags:
        - Factory
      operationId: resumeFactorySession
      summary: Resume one Factory Session
      description: Resumes one paused live or durable Factory Session while preserving inspectable partial results, dispatches, and artifacts. Live workspace sessions use the same route family as durable execution sessions. Wakes the runtime internally and drains ready buffered submissions and completed worker results without requiring a new external signal. Returns the updated session or a typed lifecycle-control outcome for no-op, invalid-state, terminal-session, or conflict cases.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionLifecycleControlRequest'
      responses:
        '200':
          description: Resume applied immediately or the session was already running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Resume control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/cancel:
    post:
      tags:
        - Factory
      operationId: cancelFactorySession
      summary: Cancel one durable factory session
      description: Requests graceful cancellation for one durable factory session while preserving inspectable partial results, dispatches, and artifacts. Returns the updated session or a typed lifecycle-control outcome for no-op, invalid-state, terminal-session, or conflict cases.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionLifecycleControlRequest'
      responses:
        '200':
          description: Cancel applied immediately or the session was already canceled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Cancel control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/terminate:
    post:
      tags:
        - Factory
      operationId: terminateFactorySession
      summary: Terminate one durable factory session
      description: Forcefully terminates one durable factory session while preserving inspectable partial results, dispatches, and artifacts. Returns the updated session or a typed lifecycle-control outcome for no-op, invalid-state, terminal-session, or conflict cases.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionLifecycleControlRequest'
      responses:
        '200':
          description: Termination applied immediately or the session was already terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Terminate control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/retry-dispatch:
    post:
      tags:
        - Factory
      operationId: retryFactorySessionDispatch
      summary: Retry one durable factory session dispatch
      description: Retries one failed or interrupted dispatch within the targeted durable factory session. The response links the retry to the session and dispatch state and preserves inspectable partial results, dispatches, and artifacts after the control operation.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionRetryDispatchRequest'
      responses:
        '200':
          description: Retry dispatch applied immediately or produced a typed no-op outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Retry-dispatch control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/interrupt-dispatch:
    post:
      tags:
        - Factory
      operationId: interruptFactorySessionDispatch
      summary: Interrupt one active durable factory session dispatch
      description: Interrupts one active dispatch within the targeted durable factory session. The response links the interruption to the session and dispatch state and preserves inspectable partial results, dispatches, and artifacts after the control operation.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionInterruptDispatchRequest'
      responses:
        '200':
          description: Interrupt dispatch applied immediately or produced a typed no-op outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
