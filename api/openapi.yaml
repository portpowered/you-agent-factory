        error:
          type: string
        feedback:
          type: string
        selectedClassificationLabel:
          type: string
        artifactVerification:
          $ref: '#/components/schemas/ExpectedArtifactVerification'
        failureDetail:
          $ref: '#/components/schemas/FailureDetail'
        providerFailure:
          $ref: '#/components/schemas/ProviderFailureMetadata'
        metrics:
          $ref: '#/components/schemas/WorkMetrics'
        usage:
