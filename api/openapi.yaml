          type: string
          description: |
            Stable managed runtime identity shared by discovery, inspect, pull or install, and factory dependency surfaces.
        cachePath:
          type: string
          description: Resolved managed-cache revision directory when a local cache is installed.
        revision:
          type: string
          description: Installed managed-cache revision when a local cache is present.
        cacheBytes:
          type: integer
          format: int64
          minimum: 0
          description: Exact recursive byte count of regular files in the installed managed-cache revision.
        readinessState:
          $ref: '#/components/schemas/ManagedRuntimeReadinessState'
        lifecycleState:
          $ref: '#/components/schemas/ManagedRuntimeLifecycleState'
        locality:
          $ref: '#/components/schemas/WorkerModelLocality'
        supportedOperations:
          type: array
          description: Provider-agnostic operations supported by this managed runtime.
          items:
            $ref: '#/components/schemas/ModelInvocationOperation'
        diagnostics:
          $ref: '#/components/schemas/StringMap'
          description: Concise managed-runtime diagnostics in customer-relevant terms.
    ManagedRuntimeLifecycleState:
      type: string
      description: |
        Customer-facing lifecycle position for one managed runtime. Lifecycle state tracks install, cache, and load progression independently from short-lived readiness used by invocation surfaces.
      enum:
        - NOT_APPLICABLE
        - NOT_INSTALLED
        - INSTALLING
        - INSTALLED
        - LOADING
        - LOADED
      x-enum-descriptions:
        - Managed install and cache lifecycle does not apply, such as for cloud-backed runtimes.
        - Required managed runtime assets are not installed in the managed cache.
        - Managed runtime assets are being pulled or installed into the managed cache.
        - Required managed runtime assets are installed in the managed cache but not loaded for invocation.
        - Managed runtime assets are being loaded into an invocation-ready runtime handle.
        - Managed runtime assets are loaded and available for invocation subject to readiness checks.
    ManagedRuntimePullOutcome:
      type: string
      description: |
        Source-agnostic outcome for one managed runtime pull or install request. Outcomes classify whether the runtime is already ready, newly installed, still preparing, timed out, cancelled, failed during source resolution, source fetch, integrity verification, assembly, cache installation, or readiness evaluation, or unsupported.
      enum:
        - ALREADY_READY
        - INSTALLED_SUCCESSFULLY
        - ALREADY_PRESENT
        - STILL_LOADING
        - TIMED_OUT
        - CANCELLED
        - SOURCE_FETCH_FAILED
        - SOURCE_RESOLUTION_FAILED
        - INTEGRITY_VERIFICATION_FAILED
        - ASSEMBLY_FAILED
        - CACHE_INSTALLATION_FAILED
        - READINESS_EVALUATION_FAILED
        - ASSET_PREPARATION_FAILED
        - UNSUPPORTED_RUNTIME
      x-enum-descriptions:
        - The managed runtime was already ready and no additional install work was required.
        - Required managed runtime assets were installed successfully into the managed cache.
        - Required managed runtime assets were already present in the managed cache at the requested revision.
        - Managed runtime install or preparation is still in progress.
        - Managed runtime install or preparation timed out before reaching a terminal readiness state.
        - The pull was cancelled before reaching a terminal readiness state.
        - Required managed runtime assets could not be fetched from the configured backend source.
        - The configured source could not be resolved for the requested model assets.
        - Prepared asset bytes failed size or digest verification.
        - Asset assembly or staging failed after source resolution.
        - Installation of the prepared asset snapshot into the managed cache failed.
        - The final managed-cache readiness evaluation failed after preparation.
        - Asset preparation failed without a more specific stage classification.
        - The requested managed runtime does not support pull or install in the current configuration.
    ManagedRuntimePullResult:
      type: object
      required:
        - identity
        - pullOutcome
        - readinessState
      properties:
        identity:
          type: string
          description: Stable managed runtime identity targeted by the pull or install request.
        pullOutcome:
          $ref: '#/components/schemas/ManagedRuntimePullOutcome'
        readinessState:
          $ref: '#/components/schemas/ManagedRuntimeReadinessState'
        cachePath:
          type: string
          description: Managed cache directory that now contains the installed runtime assets.
        revision:
          type: string
          description: Managed revision identifier for the installed runtime assets.
        downloadedFiles:
          type: array
          description: Files downloaded or verified as already present for the managed cache entry.
          items:
            $ref: '#/components/schemas/ModelPullDownloadedFile'
        sourceDiagnostics:
          $ref: '#/components/schemas/ManagedRuntimeSourceDiagnostics'
        pullDiagnostics:
          $ref: '#/components/schemas/ManagedRuntimePullDiagnostics'
    ManagedRuntimePullDiagnostics:
      type: object
      description: |
        Safe, logical facts describing the operation attempted by a managed runtime pull. Response bodies, credentials, authorization data, and unrestricted local paths are never included.
      properties:
        modelName:
          type: string
          description: Model identity associated with the failed pull.
        resolvedRepository:
          type: string
          description: Resolved upstream repository or other safe source identifier.
        revision:
          type: string
          description: Source revision selected for the pull.
        file:
          type: string
          description: Logical asset file involved in the failed operation, when applicable.
        operation:
          type: string
          description: Safe logical operation that failed.
        requestUrl:
          type: string
          format: uri
          description: Sanitized HTTP request URL, when an HTTP request failed.
        upstreamStatusCode:
          type: integer
          format: int32
          description: Upstream HTTP status code, when the server returned one.
    ManagedRuntimeReadinessState:
      type: string
      description: |
        Customer-facing readiness for one managed runtime. Readiness describes whether the runtime can be invoked now or what action is required next, without naming upstream repository or provider-specific cache semantics.
      enum:
        - READY
        - MISSING
        - LOADING
        - FAILED
        - UNSUPPORTED
      x-enum-descriptions:
        - Required managed runtime assets are present and the runtime is ready for invocation.
        - Required managed runtime assets are not present and pull or install is required.
        - Managed runtime assets are being prepared or loaded.
        - Managed runtime setup failed and requires operator attention.
        - The managed runtime is not supported by the current factory or platform configuration.
    ManagedRuntimeSourceDiagnostics:
      type: object
      description: |
        Optional advanced diagnostics for how one managed runtime resolved assets from a configured backend source. Source details are implementation diagnostics and are not required for the primary customer lifecycle contract.
      properties:
        sourceKind:
          type: string
          description: |
            Resolver-classified backend source kind, such as `UPSTREAM_REPOSITORY` or `MANAGED_MIRROR`, without exposing provider-native repository vocabulary in the primary customer contract.
        sourceId:
          type: string
          description: Opaque resolver identifier for the selected backend source instance.
        resolverNotes:
          type: string
          description: Concise resolver note suitable for operator diagnostics.
    ModelSummary:
      type: object
      required:
        - name
        - managedRuntime
        - providerLocality
        - status
        - loadState
        - operations
        - modalities
        - resources
      properties:
        name:
          type: string
          description: |
            Stable managed runtime identity such as `OMNIVOICE_Q4_K_M`. Mirrors `managedRuntime.identity` for compatibility with earlier discovery fields.
        managedRuntime:
          $ref: '#/components/schemas/ManagedRuntime'
        providerLocality:
          $ref: '#/components/schemas/WorkerModelLocality'
          description: |
            Managed runtime locality summary. Mirrors `managedRuntime.locality` for compatibility with earlier discovery fields.
        status:
          $ref: '#/components/schemas/ModelStatus'
        loadState:
          $ref: '#/components/schemas/ModelLoadState'
        operations:
          type: array
          description: |
            Provider-agnostic operations supported by the managed runtime. Mirrors `managedRuntime.supportedOperations` for compatibility with earlier discovery fields.
          items:
            $ref: '#/components/schemas/ModelInvocationOperation'
        modalities:
          type: array
          description: Uppercase content modalities observed across the model's declared operation inputs and outputs.
          items:
            $ref: '#/components/schemas/ModelInvocationContentType'
        resources:
          type: array
          description: Factory resource summaries associated with this model's workers or explicit model metadata.
          items:
            $ref: '#/components/schemas/ModelResourceSummary'
    ModelDetail:
      type: object
      required:
        - name
        - managedRuntime
        - providerLocality
        - status
        - loadState
        - operations
        - modalities
        - resources
        - capabilities
        - diagnostics
      properties:
        name:
          type: string
          description: |
            Stable managed runtime identity such as `OMNIVOICE_Q4_K_M`. Mirrors `managedRuntime.identity` for compatibility with earlier inspect fields.
        managedRuntime:
          $ref: '#/components/schemas/ManagedRuntime'
        providerLocality:
          $ref: '#/components/schemas/WorkerModelLocality'
          description: |
            Managed runtime locality summary. Mirrors `managedRuntime.locality` for compatibility with earlier inspect fields.
        status:
          $ref: '#/components/schemas/ModelStatus'
        loadState:
          $ref: '#/components/schemas/ModelLoadState'
        operations:
          type: array
          description: |
            Union of provider-agnostic operations supported by workers for this managed runtime. Mirrors `managedRuntime.supportedOperations` for compatibility with earlier inspect fields.
          items:
            $ref: '#/components/schemas/ModelInvocationOperation'
        modalities:
          type: array
          description: Uppercase content modalities observed across all declared operation inputs and outputs.
          items:
            $ref: '#/components/schemas/ModelInvocationContentType'
        resources:
          type: array
          description: Factory resource summaries associated with this model's workers or explicit model metadata.
          items:
            $ref: '#/components/schemas/ModelResourceSummary'
        capabilities:
          type: array
          description: Worker-scoped capability declarations that contribute to this discovered model.
          items:
            $ref: '#/components/schemas/ModelCapability'
        diagnostics:
          $ref: '#/components/schemas/StringMap'
    ModelReference:
      type: object
      additionalProperties: false
      required:
        - nameOrUri
      description: Opaque model name or source URI accepted by the provider-neutral invocation contract.
      properties:
        nameOrUri:
          type: string
          minLength: 1
          description: Configured model name or source URI. Resolution is owned by Models.
    ModelInvocationInput:
      type: object
      additionalProperties: false
      required:
        - name
        - modality
      description: One ordered value supplied to a named model-operation input slot.
      properties:
        name:
          type: string
          minLength: 1
          description: Input slot name declared by the selected operation.
        modality:
          $ref: '#/components/schemas/ModelInvocationContentType'
          description: Provider-neutral modality of the supplied value.
        contentType:
          type: string
          description: Logical content type retained for compatibility with prepared invocation inputs.
        mediaType:
          type: string
          description: Concrete MIME type for media or file-backed content, when known.
        content:
          type: string
          description: Inline UTF-8 content. JSON values are carried as their canonical JSON text. Do not combine with contentBase64 or artifactRef.
        contentBase64:
          type: string
          format: byte
          description: Base64-encoded inline binary content. Do not combine with content or artifactRef.
        artifactRef:
          type: string
          minLength: 1
          description: Opaque Models-owned input artifact reference when content is not inline. Do not combine with content or contentBase64.
    ModelInvocationOutput:
      type: object
      additionalProperties: false
      required:
        - name
        - modality
      description: One ordered, slot-named output of a generic model invocation.
      properties:
        name:
          type: string
          minLength: 1
          description: Output slot name declared by the selected operation.
        modality:
          $ref: '#/components/schemas/ModelInvocationContentType'
          description: Provider-neutral modality of the output.
        contentType:
          type: string
          description: Logical content type retained for compatibility with prepared invocation outputs.
        mediaType:
          type: string
          description: Concrete MIME type for media or file-backed output, when known.
        content:
          type: string
          description: Inline output content. JSON values are carried as their canonical JSON text.
        artifact:
          $ref: '#/components/schemas/ModelInvocationArtifact'
          description: Optional opaque artifact metadata for materialized output.
    ModelInvocationContentType:
      type: string
      description: Uppercase provider-neutral content modality used by generic model invocation contracts.
      enum:
        - TEXT
        - IMAGE
        - AUDIO
        - VIDEO
        - JSON
        - BINARY
    ModelInvocationSlot:
      type: object
      additionalProperties: false
      required:
        - name
        - contentTypes
      description: One named provider-neutral slot in a generic model invocation operation.
      properties:
        name:
          type: string
          description: Stable slot name used by generic invocation inputs, outputs, and diagnostics.
        contentTypes:
          type: array
          minItems: 1
          description: Uppercase content types accepted or produced by this generic slot.
          items:
            $ref: '#/components/schemas/ModelInvocationContentType'
        modality:
          $ref: '#/components/schemas/ModelInvocationContentType'
          description: Provider-neutral modality of values accepted or produced by this slot.
        required:
          type: boolean
          description: Whether this slot is required by the selected operation.
        repeatable:
          type: boolean
          description: Whether the slot accepts or produces multiple ordered values.
        mediaTypes:
          type: array
          description: Accepted or produced MIME-type patterns for this slot.
          items:
            type: string
    ModelInvocationOperation:
      type: object
      additionalProperties: false
      required:
        - name
      description: One provider-neutral operation exposed by a managed model runtime.
      properties:
        name:
          $ref: '#/components/schemas/ModelOperationName'
        inputs:
          type: array
          description: Named generic invocation input slots this model can consume.
          items:
            $ref: '#/components/schemas/ModelInvocationSlot'
        outputs:
          type: array
          description: Named generic invocation output slots this model can produce.
          items:
            $ref: '#/components/schemas/ModelInvocationSlot'
    ModelInvocationArtifact:
      type: object
      additionalProperties: false
      required:
        - artifactRef
      properties:
        artifactRef:
          type: string
          minLength: 1
          description: Opaque Models-owned artifact reference; cache paths and storage handles are never exposed.
        name:
          type: string
          description: Customer-visible artifact name, when available.
        mediaType:
          type: string
          description: MIME type of the materialized artifact, when known.
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          description: Artifact size in bytes, when known.
        properties:
          $ref: '#/components/schemas/StringMap'
          description: Safe provider-neutral artifact metadata.
    ModelInvocationParameter:
      type: object
      additionalProperties: false
      required:
        - name
        - value
      description: One ordered named JSON parameter supplied to a model operation.
      properties:
        name:
          type: string
          minLength: 1
          description: Operation parameter name.
        value:
          description: JSON-compatible parameter value preserved without backend-specific typing.
    ModelInvocationOutputMode:
      type: string
      description: Provider-neutral representation requested for a generic model invocation result.
      enum:
        - AUTO
        - INLINE
        - JSON
        - ARTIFACT
    ModelInvocationFailureClass:
      type: string
      description: Stable provider-neutral failure identity for generic model invocation.
      enum:
        - INVALID_MODEL_REFERENCE
        - INVALID_OPERATION
        - INVALID_SLOT
        - SLOT_ARITY
        - INVALID_PARAMETER
        - MEDIA_CAPABILITY
        - CONFIGURATION
        - OFFLINE_CACHE
        - ARTIFACT
        - BACKEND_READINESS
        - BACKEND_PROTOCOL
        - CANCELLATION
        - TIMEOUT
        - MALFORMED_RESPONSE
    ModelInvocationFailure:
      type: object
      additionalProperties: false
      required:
        - class
        - message
      description: Customer-safe typed failure for a generic model invocation.
      properties:
        class:
          $ref: '#/components/schemas/ModelInvocationFailureClass'
        message:
          type: string
          minLength: 1
          description: Actionable failure explanation without cache paths, backend addresses, credentials, or protocol payloads.
        model:
          $ref: '#/components/schemas/ModelReference'
        operation:
          type: string
          description: Operation associated with the failure, when known.
        slot:
          type: string
          description: Input or output slot associated with the failure, when known.
        parameter:
          type: string
          description: Parameter associated with the failure, when known.
        field:
          type: string
          description: Public request field associated with the failure, when known.
    GenericModelInvocationRequest:
      type: object
      additionalProperties: false
      required:
        - scope
        - holder
        - model
      description: Provider-neutral generic model invocation request. Inputs and parameters retain authored order. When operation is omitted, Models infers the sole operation exposed by the resolved model.
      properties:
        scope:
          type: string
          minLength: 1
          description: Opaque Models runtime-scope reference.
        holder:
          type: string
          minLength: 1
          description: Non-empty caller identity used by the eventual capacity owner.
        model:
          $ref: '#/components/schemas/ModelReference'
        operation:
          $ref: '#/components/schemas/ModelOperationName'
          description: Optional operation identifier. Omit it when the resolved model exposes exactly one operation.
        inputs:
          type: array
          description: Ordered input values. Repeated slot names remain separate entries in this order.
          items:
            $ref: '#/components/schemas/ModelInvocationInput'
        parameters:
          type: array
          description: Ordered named JSON parameters for the selected operation.
          items:
            $ref: '#/components/schemas/ModelInvocationParameter'
        outputMode:
          $ref: '#/components/schemas/ModelInvocationOutputMode'
        offline:
          type: boolean
          description: Whether resolution and preparation must remain cache-only.
    GenericModelInvocationResponse:
      type: object
      additionalProperties: false
      required:
        - outputs
      description: Provider-neutral generic model invocation result with ordered slot-named outputs.
      properties:
        outputs:
          type: array
          description: Ordered outputs. Distinct slots such as ASR transcript and segments remain separate entries.
          items:
            $ref: '#/components/schemas/ModelInvocationOutput'
        failure:
          $ref: '#/components/schemas/ModelInvocationFailure'
          description: Optional typed failure when a transport chooses an envelope rather than an error response.
    ModelInvocationRequest:
      type: object
      additionalProperties: false
      required:
        - operation
      properties:
        operation:
          type: string
          description: Uppercase provider-agnostic operation to invoke, such as `TTS`.
        content:
          $ref: '#/components/schemas/WorkContent'
          description: Ordered invocation input content resolved through optional slot bindings.
        bindings:
          type: array
          description: Optional per-request slot bindings that follow the same contract as `MODEL_INVOKE` workstation bindings.
          items:
            $ref: '#/components/schemas/WorkstationOperationBinding'
        options:
          $ref: '#/components/schemas/ModelInvocationOptions'
    ModelInvocationOptions:
      type: object
      additionalProperties: false
      description: Optional direct-invocation controls for response shaping and transport.
      properties:
        responseMode:
          $ref: '#/components/schemas/ModelInvocationResponseMode'
    ModelInvocationResponseMode:
      type: string
      description: Requested direct-invocation response mode.
      enum:
        - METADATA
        - AUDIO_STREAM
    ModelInvocationResponse:
      type: object
      additionalProperties: false
      required:
        - modelName
        - worker
        - operation
        - providerLocality
        - content
        - bindings
      properties:
        modelName:
          type: string
          description: Concrete public model identifier such as `OMNIVOICE_Q4_K_M`.
        worker:
          type: string
          description: Worker selected to satisfy this invocation.
        operation:
          type: string
          description: Uppercase provider-agnostic operation that was invoked.
        providerLocality:
          $ref: '#/components/schemas/WorkerModelLocality'
        content:
          $ref: '#/components/schemas/WorkContent'
          description: Returned model output as canonical `WorkContent`.
        bindings:
          type: array
          description: Deterministically resolved slot bindings used for the invocation.
          items:
            $ref: '#/components/schemas/ResolvedModelOperationBinding'
    ModelPullDownloadedFile:
      type: object
      required:
        - path
        - bytes
      properties:
        path:
          type: string
          description: Relative file path written under the managed model cache directory.
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: Downloaded file size in bytes.
        sha256:
          type: string
          description: Lowercase SHA-256 checksum for the cached file when known.
    ModelPullOutcome:
      type: string
      description: |
        Compatibility pull outcome projection for one managed runtime. Prefer `managedRuntimePull.pullOutcome` for the canonical managed-runtime vocabulary. `PULLED` maps to managed pull outcome `INSTALLED_SUCCESSFULLY`; `ALREADY_PRESENT` maps to managed pull outcomes `ALREADY_PRESENT` and `ALREADY_READY`; and `FAILED` maps to every non-success managed pull outcome, including `STILL_LOADING`, `TIMED_OUT`, `CANCELLED`, `SOURCE_FETCH_FAILED`, `SOURCE_RESOLUTION_FAILED`, `INTEGRITY_VERIFICATION_FAILED`, `ASSEMBLY_FAILED`, `CACHE_INSTALLATION_FAILED`, `READINESS_EVALUATION_FAILED`, `ASSET_PREPARATION_FAILED`, and `UNSUPPORTED_RUNTIME`. Unknown managed pull outcomes also map to `FAILED` so an unrecognized value cannot be projected as a successful pull.
      enum:
        - PULLED
        - ALREADY_PRESENT
        - FAILED
    ModelPullResponse:
      type: object
      required:
        - modelName
        - managedRuntimePull
        - providerLocality
        - outcome
        - cachePath
        - revision
        - downloadedFiles
      properties:
        modelName:
          type: string
          description: |
            Stable managed runtime identity such as `OMNIVOICE_Q4_K_M`. Mirrors `managedRuntimePull.identity` for compatibility with earlier pull fields.
        managedRuntimePull:
          $ref: '#/components/schemas/ManagedRuntimePullResult'
        providerLocality:
          $ref: '#/components/schemas/WorkerModelLocality'
        outcome:
          $ref: '#/components/schemas/ModelPullOutcome'
        cachePath:
          type: string
          description: |
            Final managed cache directory that now contains the installed runtime assets. Mirrors `managedRuntimePull.cachePath`.
        revision:
          type: string
          description: |
            Managed revision identifier for the installed runtime assets. Mirrors `managedRuntimePull.revision`.
        downloadedFiles:
          type: array
          description: Files that were downloaded or verified as already present for the managed cache entry.
          items:
            $ref: '#/components/schemas/ModelPullDownloadedFile'
    ModelRemoveOutcome:
      type: string
      description: Outcome of removing the selected managed model cache revision.
      enum:
        - REMOVED
    ModelRemoveResponse:
      type: object
      required:
        - modelName
        - revision
        - cachePath
        - outcome
        - bytesRemoved
      properties:
        modelName:
          type: string
          description: Stable managed runtime identity whose cache revision was removed.
        revision:
          type: string
          description: Exact managed cache revision removed by the operation.
        cachePath:
          type: string
          description: Validated absolute path of the removed managed cache revision.
        outcome:
          $ref: '#/components/schemas/ModelRemoveOutcome'
        bytesRemoved:
          type: integer
          format: int64
          minimum: 0
          description: Total size of regular files measured immediately before removal.
    ResolvedModelOperationBinding:
      type: object
      additionalProperties: false
      required:
        - slot
        - source
        - content
      properties:
        slot:
          type: string
          description: Stable input slot name declared by the worker capability.
        source:
          $ref: '#/components/schemas/ResolvedModelOperationBindingSource'
        content:
          $ref: '#/components/schemas/WorkContent'
          description: Resolved content bound to the slot.
    ResolvedModelOperationBindingSource:
      type: string
      description: Source used to resolve one invocation slot binding.
      enum:
        - INPUT
        - CONFIG
        - DEFAULT
        - OMITTED
    ModelCapability:
      type: object
      required:
        - worker
        - providerLocality
        - operations
        - resourceNames
      properties:
        worker:
          type: string
          description: Customer-authored worker name that exposes this capability declaration.
        modelProvider:
          $ref: '#/components/schemas/WorkerModelProvider'
        providerLocality:
          $ref: '#/components/schemas/WorkerModelLocality'
        operations:
          type: array
          description: Operations declared by this worker for the selected model.
          items:
            $ref: '#/components/schemas/ModelInvocationOperation'
        resourceNames:
          type: array
          description: Factory resource names referenced by the worker declaration.
          items:
            type: string
    ModelResourceSummary:
      type: object
      required:
        - name
        - type
        - capacity
      properties:
        name:
          type: string
          description: Factory-authored resource name.
        type:
          $ref: '#/components/schemas/ResourceType'
        capacity:
          type: integer
          minimum: 0
          description: Declared factory capacity for this resource.
        model:
          type: string
          description: Concrete model identifier when the resource is model-specific.
        backend:
          type: string
          description: Local runtime backend identifier for model resources.
        loadPolicy:
          type: string
          description: Local load-policy metadata for model resources.
        provider:
          type: string
          description: Cloud provider identity when the resource models quota or routing.
    ModelStatus:
      type: string
      description: |
        Compatibility readiness projection for one managed runtime. Prefer `managedRuntime.readinessState` for the canonical managed-runtime vocabulary. `READY` maps to managed readiness `READY`; `UNAVAILABLE` maps to managed readiness `MISSING` for local runtimes that still require install or setup.
      enum:
        - READY
        - UNAVAILABLE
    ModelLoadState:
      type: string
      description: |
        Compatibility lifecycle projection for one managed runtime. Prefer `managedRuntime.lifecycleState` for the canonical managed-runtime vocabulary. `UNLOADED` maps to managed lifecycle `NOT_INSTALLED` or `LOADED` depending on cache and load state; `NOT_APPLICABLE` maps to managed lifecycle `NOT_APPLICABLE` for cloud-backed runtimes.
      enum:
        - UNLOADED
        - NOT_APPLICABLE
    ErrorFamily:
      type: string
      description: Stable machine-readable error family for broader client grouping.
      enum:
        - BAD_REQUEST
        - CONFLICT
        - NOT_FOUND
        - GONE
        - INTERNAL_SERVER_ERROR
      x-enum-varnames:
        - ErrorFamilyBadRequest
        - ErrorFamilyConflict
        - ErrorFamilyNotFound
        - ErrorFamilyGone
        - ErrorFamilyInternalServerError
      x-enum-descriptions:
        - Request payload or parameter validation failed.
        - The request conflicts with current resource state.
        - The requested resource does not exist.
        - The requested resource previously existed but is no longer retained.
        - The server failed while handling an otherwise valid request.
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - message
        - family
        - code
      properties:
        message:
          type: string
        family:
          $ref: '#/components/schemas/ErrorFamily'
        code:
          type: string
          description: Stable machine-readable error code.
          enum:
            - BAD_REQUEST
            - FACTORY_SESSION_CONFIG_LOAD_FAILED
            - INVALID_FACTORY_NAME
            - FACTORY_ALREADY_EXISTS
            - INVALID_FACTORY
            - FACTORY_NOT_IDLE
            - STALE_FACTORY_VERSION
            - MOVE_WORK_REQUEST_ALREADY_APPLIED
            - METHOD_NOT_ALLOWED
