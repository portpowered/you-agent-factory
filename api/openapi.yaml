            - $ref: '#/components/schemas/DispatchResponseEventPayload'
            - $ref: '#/components/schemas/WorkStateChangeEventPayload'
            - $ref: '#/components/schemas/FactoryStateResponseEventPayload'
            - $ref: '#/components/schemas/RunResponseEventPayload'
            - $ref: '#/components/schemas/SessionStartedEventPayload'
            - $ref: '#/components/schemas/SessionPausedEventPayload'
            - $ref: '#/components/schemas/SessionResumedEventPayload'
            - $ref: '#/components/schemas/SessionResultUpdatedEventPayload'
            - $ref: '#/components/schemas/SessionCompletedEventPayload'
