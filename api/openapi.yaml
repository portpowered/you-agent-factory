openapi: 3.0.3
info:
  title: Agent Factory API
  version: 0.1.0
  license:
    name: MIT
  description: |
    Current Agent Factory runtime API contract. This file captures existing
    handler behavior for schema standardization and intentionally does not
    redesign route names, pagination, or response fields.
servers:
  - url: http://localhost:7437
    description: Local Agent Factory API server
security: []
tags:
  - name: Work
    description: Runtime work submission and inspection.
  - name: Factory
    description: Named factory activation and current-factory inspection.
  - name: Runtime
    description: Runtime state, event stream, and trace inspection.
  - name: Provider Sessions
    description: Provider-owned session diagnostics for dashboard inspection.
  - name: Models
    description: Model discovery and capability inspection for the current runtime.
  - name: Workflows
    description: Stored workflow inspection.
paths:
  /work:
    post:
      tags:
        - Work
      operationId: submitWork
      summary: Submit work
      description: Submits one work item to the running factory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitWorkRequest'
            examples:
              textOnlyContent:
                summary: Submit one work item with ordered text content parts.
                value:
                  name: summary-draft
                  workTypeName: task
                  content:
                    - type: text
                      text: Draft a short project summary.
                    - type: text
                      text: Keep it under 120 words.
              textPlusImageContent:
                summary: Submit one work item with ordered text and image content parts.
                value:
                  name: screenshot-review
                  workTypeName: task
                  content:
                    - type: text
                      text: Review this screenshot and list the highest-risk UI issues.
                    - type: image
                      file: fixtures/ui/dashboard-error-state.png
      responses:
        '201':
          description: Work was accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitWorkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Work
      operationId: listWork
      summary: List work
      description: Lists current work tokens from the engine state snapshot.
      parameters:
        - $ref: '#/components/parameters/MaxResults'
        - $ref: '#/components/parameters/NextToken'
        - $ref: '#/components/parameters/StateName'
        - $ref: '#/components/parameters/StateType'
        - $ref: '#/components/parameters/SortBy'
      responses:
        '200':
          description: Current work tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /factories/{factory_id}/work:
    post:
      tags:
        - Work
      operationId: submitWorkByFactoryId
      summary: Submit work for one session
      description: Submits one work item to the explicitly selected live factory session. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/FactoryID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitWorkRequest'
      responses:
        '201':
          description: Work was accepted for processing by the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitWorkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Work
      operationId: listWorkByFactoryId
      summary: List work for one session
      description: Lists current work tokens from the engine state snapshot owned by the explicitly selected live factory session.
      parameters:
        - $ref: '#/components/parameters/FactoryID'
        - $ref: '#/components/parameters/MaxResults'
        - $ref: '#/components/parameters/NextToken'
        - $ref: '#/components/parameters/StateName'
        - $ref: '#/components/parameters/StateType'
        - $ref: '#/components/parameters/SortBy'
      responses:
        '200':
          description: Current work tokens for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /work-requests/{request_id}:
    put:
      tags:
        - Work
      operationId: upsertWorkRequest
      summary: Upsert work request
      description: Submits or retries one canonical work request batch. The request identifier in the URL must match the request_id in the JSON body, and repeated request IDs are idempotent.
      parameters:
        - name: request_id
          in: path
          required: true
          description: Stable request identifier used for idempotent submission.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkRequest'
      responses:
        '201':
          description: Work request was accepted or had already been accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertWorkRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /factories/{factory_id}/work-requests/{request_id}:
    put:
      tags:
        - Work
      operationId: upsertWorkRequestByFactoryId
      summary: Upsert work request for one session
      description: Submits or retries one canonical work request batch against the explicitly selected live factory session. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/FactoryID'
        - name: request_id
          in: path
          required: true
          description: Stable request identifier used for idempotent submission.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkRequest'
      responses:
        '201':
          description: Work request was accepted or had already been accepted by the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertWorkRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /work/{id}:
    get:
      tags:
        - Work
      operationId: getWork
      summary: Get work token
      description: Returns one token by token ID from the current marking.
      parameters:
        - $ref: '#/components/parameters/WorkOrTokenID'
      responses:
        '200':
          description: Work token with history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factories/{factory_id}/work/{id}:
    get:
      tags:
        - Work
      operationId: getWorkByFactoryId
      summary: Get work token for one session
      description: Returns one token by token ID from the current marking owned by the explicitly selected live factory session.
      parameters:
        - $ref: '#/components/parameters/FactoryID'
        - $ref: '#/components/parameters/WorkOrTokenID'
      responses:
        '200':
          description: Work token with history for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /events:
    get:
      tags:
        - Runtime
      operationId: getEvents
      summary: Stream factory events
      description: Streams current-process canonical factory events as default Server-Sent Events. Historical events are sent first in ascending tick order, followed by live events on the same connection.
      responses:
        '200':
          description: Factory event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events where each data frame is serialized JSON matching FactoryEvent.
              x-event-schema: '#/components/schemas/FactoryEvent'
        '500':
          $ref: '#/components/responses/InternalError'
  /factories/{factory_id}/events:
    get:
      tags:
        - Runtime
      operationId: getEventsByFactoryId
      summary: Stream factory events for one session
      description: Streams canonical factory events for the explicitly selected live session. Historical events are sent first in ascending tick order, followed by live events on the same connection. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/FactoryID'
      responses:
        '200':
          description: Factory event stream for the targeted session.
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events where each data frame is serialized JSON matching FactoryEvent.
              x-event-schema: '#/components/schemas/FactoryEvent'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /status:
    get:
      tags:
        - Runtime
      operationId: getStatus
      summary: Get runtime status
      description: Returns the current factory lifecycle status, token category counts, and resource availability from the aggregate engine snapshot.
      responses:
        '200':
          description: Current runtime status summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /models:
    get:
      tags:
        - Models
      operationId: listModels
      summary: List discovered models
      description: Lists the concrete model identifiers exposed by the currently loaded runtime configuration together with capability, readiness, locality, load-state, and resource summary data.
      responses:
        '200':
          description: Discovered models for the current runtime.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelsResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /models/{model_name}:
    get:
      tags:
        - Models
      operationId: getModel
      summary: Get one discovered model
      description: Returns one discovered model's readiness, supported operations, resource metadata, worker capabilities, and diagnostics for the currently loaded runtime configuration.
      parameters:
        - name: model_name
          in: path
          required: true
          description: Concrete public model identifier such as `OMNIVOICE_Q4_K_M`.
          schema:
            type: string
      responses:
        '200':
          description: Discovered model detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /models/{model_name}/invocations:
    post:
      tags:
        - Models
      operationId: invokeModel
      summary: Invoke one discovered model directly
      description: Invokes one discovered model through its declared provider-agnostic operation contract using canonical `WorkContent` input and optional slot-binding overrides. Non-streaming clients receive JSON metadata, while audio-producing operations can return a streamed audio body when requested.
      parameters:
        - name: model_name
          in: path
          required: true
          description: Concrete public model identifier such as `OMNIVOICE_Q4_K_M`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelInvocationRequest'
      responses:
        '200':
          description: Successful model invocation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInvocationResponse'
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Streamed audio body for audio-producing invocations when `options.responseMode` requests `AUDIO_STREAM`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /models/{model_name}/pull:
    post:
      tags:
        - Models
      operationId: pullModel
      summary: Pull local model assets into the managed cache
      description: Pulls the required local assets for one discovered model into the managed cache directory. Cloud-backed models and unsupported local targets return actionable errors instead of silently succeeding.
      parameters:
        - name: model_name
          in: path
          required: true
          description: Concrete public model identifier such as `OMNIVOICE_Q4_K_M`.
          schema:
            type: string
      responses:
        '200':
          description: Successful local-model asset pull or confirmation that the managed cache already contained the required revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPullResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factories/{factory_id}/status:
    get:
      tags:
        - Runtime
      operationId: getStatusByFactoryId
      summary: Get runtime status for one session
      description: Returns the current factory lifecycle status, token category counts, and resource availability from the aggregate engine snapshot owned by the explicitly selected live factory session.
      parameters:
        - $ref: '#/components/parameters/FactoryID'
      responses:
        '200':
          description: Current runtime status summary for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /provider-sessions/detail:
    get:
      tags:
        - Provider Sessions
      operationId: getProviderSessionDetails
      summary: Get provider session details
      description: Loads a known Codex provider-session file by provider-session metadata. The browser supplies provider, kind, and identifier values; the server resolves the matching rollout file under the configured Codex sessions root and never accepts a raw filesystem path.
      parameters:
        - name: provider
          in: query
          required: true
          description: Provider that emitted the session identifier. Only codex sessions are currently loadable.
          schema:
            $ref: '#/components/schemas/LoadableProviderSessionProvider'
        - name: kind
          in: query
          required: true
          description: Provider-session identifier kind. Only session_id is currently loadable.
          schema:
            $ref: '#/components/schemas/LoadableProviderSessionKind'
        - name: id
          in: query
          required: true
          description: Provider-session identifier to resolve. This is an identifier, not a filesystem path.
          schema:
            type: string
      responses:
        '200':
          description: Parsed provider-session details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSessionDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory:
    post:
      tags:
        - Factory
      operationId: createFactory
      summary: Create factory
      description: Stores one factory definition and activates it as the current factory when the runtime is idle. The reserved `UNDEFINED` identifier is for `GET /factory/~current` readback only and cannot be activated as a customer-named factory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Factory'
      responses:
        '201':
          description: Factory was stored and activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factory'
        '400':
          $ref: '#/components/responses/CreateFactoryBadRequest'
        '409':
          $ref: '#/components/responses/CreateFactoryConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions:
    get:
      tags:
        - Factory
      operationId: listFactorySessions
      summary: List live factory sessions
      description: Lists every live factory session that the shared runtime host is currently keeping open, including the reserved default session.
      responses:
        '200':
          description: Live factory sessions that can be rendered as workspace tabs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFactorySessionsResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Factory
      operationId: openFactorySession
      summary: Open another live factory session
      description: Opens another live factory session from a folder path and optional target selection. When the folder exposes more than one runnable target and no explicit target was provided, the response returns typed target metadata instead of creating a session yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenFactorySessionRequest'
      responses:
        '200':
          description: Session was opened or the caller needs to choose one of the returned runnable targets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenFactorySessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}:
    delete:
      tags:
        - Factory
      operationId: closeFactorySession
      summary: Close one live factory session
      description: Stops the selected live factory session, removes it from the workspace session list, and leaves all remaining sessions running unchanged.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
          description: Stable live factory session identifier. Use `~default` to close the default compatibility session explicitly.
      responses:
        '204':
          description: Session was stopped and removed from the live workspace.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory/~current:
    get:
      tags:
        - Factory
      operationId: getCurrentFactory
      summary: Get current factory
      description: Returns the canonical current-factory payload from the durable current-factory pointer or, when no pointer exists yet, from the active default root runtime. Default-runtime responses use the reserved `UNDEFINED` identifier in `Factory.name`.
      responses:
        '200':
          description: Current active factory or the active default root runtime when no current-factory pointer exists yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factory'
              examples:
                defaultRootRuntime:
                  summary: Default root runtime is active.
                  value:
                    name: UNDEFINED
                    workTypes:
                      - name: task
                        states:
                          - name: init
                            type: INITIAL
                          - name: done
                            type: TERMINAL
                    workers:
                      - name: planner
                        type: MODEL_WORKER
                        modelProvider: CLAUDE
                        executorProvider: SCRIPT_WRAP
                        model: claude-sonnet-4-20250514
                    workstations:
                      - name: plan-task
                        behavior: STANDARD
                        type: MODEL_WORKSTATION
                        worker: planner
                        inputs:
                          - workType: task
                            state: init
                        outputs:
                          - workType: task
                            state: done
        '404':
          $ref: '#/components/responses/CurrentFactoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factories/{factory_id}/factory/~current:
    get:
      tags:
        - Factory
      operationId: getCurrentFactoryByFactoryId
      summary: Get current factory for one session
      description: Returns the current factory definition owned by the explicitly selected live session. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/FactoryID'
      responses:
        '200':
          description: Current active factory definition for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factory'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factories/{factory_id}/factory/~current/editable-definition:
    get:
      tags:
        - Factory
      operationId: getEditableCurrentFactoryDefinitionByFactoryId
      summary: Get editable current factory definition for one session
      description: Returns the complete current factory definition for graph editing together with version metadata for the explicitly selected live session. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/FactoryID'
      responses:
        '200':
          description: Editable current factory definition and version metadata for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditableFactoryDefinition'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Factory
      operationId: saveEditableCurrentFactoryDefinitionByFactoryId
      summary: Save editable current factory definition for one session
      description: Submits one complete replacement for the current factory definition owned by the explicitly selected live session. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/FactoryID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveEditableFactoryDefinitionRequest'
      responses:
        '200':
          description: Saved editable factory definition and new version metadata for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditableFactoryDefinition'
        '400':
          $ref: '#/components/responses/SaveEditableFactoryDefinitionBadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SaveEditableFactoryDefinitionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory/~current/workstations/{workstation_name}/prompt-template-contract:
    get:
      tags:
        - Factory
      operationId: getCurrentFactoryWorkstationPromptTemplateContract
      summary: Get workstation prompt-template contract
      description: Returns the authoritative prompt-variable reference and unavailable-access patterns for the selected current-factory workstation editing context.
      parameters:
        - name: workstation_name
          in: path
          required: true
          description: Customer-authored workstation name to inspect in the current factory.
          schema:
            type: string
      responses:
        '200':
          description: Prompt-template contract for the selected workstation editing context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplateContract'
        '404':
          $ref: '#/components/responses/CurrentFactoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory/~current/editable-definition:
    get:
      tags:
        - Factory
      operationId: getEditableCurrentFactoryDefinition
      summary: Get editable current factory definition
      description: Returns the complete current factory definition for graph editing together with hybrid logical timestamp metadata clients must carry into saves for stale-edit detection.
      responses:
        '200':
          description: Editable current factory definition and version metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditableFactoryDefinition'
        '404':
          $ref: '#/components/responses/CurrentFactoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Factory
      operationId: saveEditableCurrentFactoryDefinition
      summary: Save editable current factory definition
      description: Submits one complete replacement for the current factory definition. The payload preserves all untouched fields because the full Factory contract is saved through the same canonical factory persistence path used by named-factory activation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveEditableFactoryDefinitionRequest'
      responses:
        '200':
          description: Saved editable factory definition and new version metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditableFactoryDefinition'
        '400':
          $ref: '#/components/responses/SaveEditableFactoryDefinitionBadRequest'
        '404':
          $ref: '#/components/responses/CurrentFactoryNotFound'
        '409':
          $ref: '#/components/responses/SaveEditableFactoryDefinitionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory/~current/workstations/{workstation_name}/prompt-template-validation:
    post:
      tags:
        - Factory
      operationId: validateCurrentFactoryWorkstationPromptTemplate
      summary: Validate workstation prompt template
      description: Validates a prompt draft against the authoritative current-factory workstation prompt contract and returns typed syntax or variable diagnostics.
      parameters:
        - name: workstation_name
          in: path
          required: true
          description: Customer-authored workstation name to validate against in the current factory.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptTemplateValidationRequest'
      responses:
        '200':
          description: Prompt validation result for the selected workstation editing context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplateValidationResult'
        '404':
          $ref: '#/components/responses/CurrentFactoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    FactoryID:
      name: factory_id
      in: path
      required: true
      description: Stable live factory session identifier. Use `~default` to target the default compatibility session explicitly.
      schema:
        type: string
    MaxResults:
      name: maxResults
      in: query
      required: false
      description: Optional positive page size. Omit to use the default page size; non-positive values fall back to the default after successful integer binding.
      schema:
        type: integer
        minimum: 1
        default: 50
    NextToken:
      name: nextToken
      in: query
      required: false
      description: Optional base64-encoded token ID cursor.
      schema:
        type: string
    StateName:
      name: state.name
      in: query
      required: false
      description: Optional current work state name filter.
      schema:
        type: string
    StateType:
      name: state.type
      in: query
      required: false
      description: Optional current work state type filter.
      schema:
        $ref: '#/components/schemas/WorkStateType'
    SortBy:
      name: sortBy
      in: query
      required: false
      description: Optional list-work sort field. Use state.type to order by current work state type.
      schema:
        type: string
        enum:
          - state.type
    WorkOrTokenID:
      name: id
      in: path
      required: true
      description: Work or token identifier, depending on route.
      schema:
        type: string
  responses:
    BadRequest:
      description: Request payload or parameter was invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CreateFactoryBadRequest:
      description: Named factory name or payload was invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidFactoryName:
              summary: Factory name failed validation.
              value:
                message: Factory name must be a safe directory segment without path separators.
                family: BAD_REQUEST
                code: INVALID_FACTORY_NAME
            invalidFactory:
              summary: Factory payload failed validation.
              value:
                message: Factory payload is not a valid Agent Factory definition.
                family: BAD_REQUEST
                code: INVALID_FACTORY
    CreateFactoryConflict:
      description: Named factory could not be activated because the name already exists or the current runtime is not idle.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            factoryAlreadyExists:
              summary: Factory name already exists.
              value:
                message: Named factory already exists.
                family: CONFLICT
                code: FACTORY_ALREADY_EXISTS
            factoryNotIdle:
              summary: Runtime is not idle.
              value:
                message: Current factory runtime must be idle before activation.
                family: CONFLICT
                code: FACTORY_NOT_IDLE
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CurrentFactoryNotFound:
      description: Current named factory was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            currentFactoryMissing:
              summary: No current named factory is available.
              value:
                message: Current named factory not found.
                family: NOT_FOUND
                code: NOT_FOUND
    SaveEditableFactoryDefinitionBadRequest:
      description: Editable factory definition save request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidFactory:
              summary: Factory payload failed validation.
              value:
                message: Factory payload is not a valid Agent Factory definition.
                family: BAD_REQUEST
                code: INVALID_FACTORY
                targets:
                  - kind: form
                    field: factoryDefinition
    SaveEditableFactoryDefinitionConflict:
      description: Editable factory definition could not be saved because the runtime or submitted version is not safe to replace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            factoryNotIdle:
              summary: Runtime is not idle.
              value:
                message: Current factory runtime must be idle before activation.
                family: CONFLICT
                code: FACTORY_NOT_IDLE
                targets:
                  - kind: save
                    id: active-work
    InternalError:
      description: Server failed while reading or building runtime state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    SubmitWorkRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - workTypeName
      properties:
        name:
          type: string
          description: Required authored name for this single-work submission.
        workTypeName:
          type: string
          description: Configured work type name from factory.json to submit to.
        currentChainingTraceId:
          type: string
          description: Explicit chaining-trace identifier for the submitted work.
        traceId:
          type: string
          description: Legacy trace identifier retained for compatibility; prefer currentChainingTraceId.
        content:
          $ref: '#/components/schemas/WorkContent'
          description: Optional canonical ordered work content parts for this submission.
        payload:
          description: Opaque work payload forwarded as raw JSON.
        tags:
          $ref: '#/components/schemas/StringMap'
        relations:
          type: array
          description: Optional token-level runtime relations preserved on the submitted work item.
          items:
            $ref: '#/components/schemas/SubmitRelation'
    SubmitRelation:
      type: object
      additionalProperties: false
      required:
        - type
        - targetWorkId
      properties:
        type:
          $ref: '#/components/schemas/RelationType'
        targetWorkId:
          type: string
          description: Target runtime work identifier for the relation.
        requiredState:
          type: string
          description: Required target state before the dependency can proceed.
    SubmitWorkResponse:
      type: object
      additionalProperties: false
      required:
        - traceId
      properties:
        traceId:
          type: string
    UpsertWorkRequestResponse:
      type: object
      additionalProperties: false
      required:
        - requestId
        - traceId
      properties:
        requestId:
          type: string
        traceId:
          type: string
    ListWorkResponse:
      type: object
      additionalProperties: false
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Work'
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
    PaginationContext:
      type: object
      additionalProperties: false
      required:
        - maxResults
      properties:
        maxResults:
          type: integer
        nextToken:
          type: string
    TokenResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - placeId
        - workId
        - workType
        - traceId
        - createdAt
        - enteredAt
      properties:
        id:
          type: string
        placeId:
          type: string
        name:
          type: string
        workId:
          type: string
        workType:
          type: string
        chainingTraceDepth:
          type: integer
          minimum: 1
        currentChainingTraceId:
          type: string
        previousChainingTraceIds:
          type: array
          items:
            type: string
        traceId:
          type: string
        content:
          $ref: '#/components/schemas/WorkContent'
          description: Ordered canonical content parts preserved on this work token.
        tags:
          $ref: '#/components/schemas/StringMap'
        createdAt:
          type: string
          format: date-time
        enteredAt:
          type: string
          format: date-time
        history:
          $ref: '#/components/schemas/TokenHistory'
    TokenHistory:
      type: object
      additionalProperties: false
      properties:
        totalVisits:
          $ref: '#/components/schemas/IntegerMap'
        consecutiveFailures:
          $ref: '#/components/schemas/IntegerMap'
        placeVisits:
          $ref: '#/components/schemas/IntegerMap'
        lastError:
          type: string
    ResourceUsage:
      type: object
      additionalProperties: false
      required:
        - name
        - available
        - total
      properties:
        name:
          type: string
        available:
          type: integer
        total:
          type: integer
    ResourceRequirement:
      type: object
      additionalProperties: false
      required:
        - name
        - capacity
      properties:
        name:
          type: string
        capacity:
          type: integer
          minimum: 1
    StatusCategories:
      type: object
      additionalProperties: false
      required:
        - initial
        - processing
        - terminal
        - failed
      properties:
        initial:
          type: integer
        processing:
          type: integer
        terminal:
          type: integer
        failed:
          type: integer
    StatusResponse:
      type: object
      additionalProperties: false
      required:
        - categories
        - factoryState
        - runtimeStatus
        - totalTokens
      properties:
        categories:
          $ref: '#/components/schemas/StatusCategories'
        factoryState:
          type: string
        runtimeStatus:
          type: string
        totalTokens:
          type: integer
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceUsage'
    ListModelsResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          description: Discovered models exposed by the currently loaded runtime configuration.
          items:
            $ref: '#/components/schemas/ModelSummary'
    ModelSummary:
      type: object
      required:
        - name
        - providerLocality
        - status
        - loadState
        - operations
        - modalities
        - resources
      properties:
        name:
          type: string
          description: Concrete public model identifier such as `OMNIVOICE_Q4_K_M`.
        providerLocality:
          $ref: '#/components/schemas/WorkerModelLocality'
        status:
          $ref: '#/components/schemas/ModelStatus'
        loadState:
          $ref: '#/components/schemas/ModelLoadState'
        operations:
          type: array
          description: Provider-agnostic operations supported by the discovered model.
          items:
            $ref: '#/components/schemas/ModelOperation'
        modalities:
          type: array
          description: Uppercase content modalities observed across the model's declared operation inputs and outputs.
          items:
            $ref: '#/components/schemas/ModelOperationContentType'
        resources:
          type: array
          description: Factory resource summaries associated with this model's workers or explicit model metadata.
          items:
            $ref: '#/components/schemas/ModelResourceSummary'
    ModelDetail:
      type: object
      required:
        - name
        - providerLocality
        - status
        - loadState
        - operations
        - modalities
        - resources
        - capabilities
        - diagnostics
      properties:
        name:
          type: string
          description: Concrete public model identifier such as `OMNIVOICE_Q4_K_M`.
        providerLocality:
          $ref: '#/components/schemas/WorkerModelLocality'
        status:
          $ref: '#/components/schemas/ModelStatus'
        loadState:
          $ref: '#/components/schemas/ModelLoadState'
        operations:
          type: array
          description: Union of provider-agnostic operations supported by workers for this model.
          items:
            $ref: '#/components/schemas/ModelOperation'
        modalities:
          type: array
          description: Uppercase content modalities observed across all declared operation inputs and outputs.
          items:
            $ref: '#/components/schemas/ModelOperationContentType'
        resources:
          type: array
          description: Factory resource summaries associated with this model's workers or explicit model metadata.
          items:
            $ref: '#/components/schemas/ModelResourceSummary'
        capabilities:
          type: array
          description: Worker-scoped capability declarations that contribute to this discovered model.
          items:
            $ref: '#/components/schemas/ModelCapability'
        diagnostics:
          $ref: '#/components/schemas/StringMap'
    ModelInvocationRequest:
      type: object
      additionalProperties: false
      required:
        - operation
      properties:
        operation:
          type: string
          description: Uppercase provider-agnostic operation to invoke, such as `TTS`.
        content:
          $ref: '#/components/schemas/WorkContent'
          description: Ordered invocation input content resolved through optional slot bindings.
        bindings:
          type: array
          description: Optional per-request slot bindings that follow the same contract as `MODEL_INVOKE` workstation bindings.
          items:
            $ref: '#/components/schemas/WorkstationOperationBinding'
        options:
          $ref: '#/components/schemas/ModelInvocationOptions'
    ModelInvocationOptions:
      type: object
      additionalProperties: false
      description: Optional direct-invocation controls for response shaping and transport.
      properties:
        responseMode:
          $ref: '#/components/schemas/ModelInvocationResponseMode'
    ModelInvocationResponseMode:
      type: string
      description: Requested direct-invocation response mode.
      enum:
        - METADATA
        - AUDIO_STREAM
    ModelInvocationResponse:
      type: object
      additionalProperties: false
      required:
        - modelName
        - worker
        - operation
        - providerLocality
        - content
        - bindings
      properties:
        modelName:
          type: string
          description: Concrete public model identifier such as `OMNIVOICE_Q4_K_M`.
        worker:
          type: string
          description: Worker selected to satisfy this invocation.
        operation:
          type: string
          description: Uppercase provider-agnostic operation that was invoked.
        providerLocality:
          $ref: '#/components/schemas/WorkerModelLocality'
        content:
          $ref: '#/components/schemas/WorkContent'
          description: Returned model output as canonical `WorkContent`.
        bindings:
          type: array
          description: Deterministically resolved slot bindings used for the invocation.
          items:
            $ref: '#/components/schemas/ResolvedModelOperationBinding'
    ModelPullDownloadedFile:
      type: object
      required:
        - path
        - bytes
      properties:
        path:
          type: string
          description: Relative file path written under the managed model cache directory.
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: Downloaded file size in bytes.
        sha256:
          type: string
          description: Lowercase SHA-256 checksum for the cached file when known.
    ModelPullOutcome:
      type: string
      description: Outcome of a managed local-model asset pull request.
      enum:
        - PULLED
        - ALREADY_PRESENT
    ModelPullResponse:
      type: object
      required:
        - modelName
        - providerLocality
        - outcome
        - cachePath
        - revision
        - downloadedFiles
      properties:
        modelName:
          type: string
          description: Concrete public model identifier such as `OMNIVOICE_Q4_K_M`.
        providerLocality:
          $ref: '#/components/schemas/WorkerModelLocality'
        outcome:
          $ref: '#/components/schemas/ModelPullOutcome'
        cachePath:
          type: string
          description: Final managed cache directory that now contains the pulled model assets.
        revision:
          type: string
          description: Pulled source revision identifier, such as an upstream repository commit SHA.
        downloadedFiles:
          type: array
          description: Files that were downloaded or verified as already present for the managed cache entry.
          items:
            $ref: '#/components/schemas/ModelPullDownloadedFile'
    ResolvedModelOperationBinding:
      type: object
      additionalProperties: false
      required:
        - slot
        - source
        - content
      properties:
        slot:
          type: string
          description: Stable input slot name declared by the worker capability.
        source:
          $ref: '#/components/schemas/ResolvedModelOperationBindingSource'
        content:
          $ref: '#/components/schemas/WorkContent'
          description: Resolved content bound to the slot.
    ResolvedModelOperationBindingSource:
      type: string
      description: Source used to resolve one invocation slot binding.
      enum:
        - INPUT
        - CONFIG
        - DEFAULT
        - OMITTED
    ModelCapability:
      type: object
      required:
        - worker
        - providerLocality
        - operations
        - resourceNames
      properties:
        worker:
          type: string
          description: Customer-authored worker name that exposes this capability declaration.
        modelProvider:
          $ref: '#/components/schemas/WorkerModelProvider'
        providerLocality:
          $ref: '#/components/schemas/WorkerModelLocality'
        operations:
          type: array
          description: Operations declared by this worker for the selected model.
          items:
            $ref: '#/components/schemas/ModelOperation'
        resourceNames:
          type: array
          description: Factory resource names referenced by the worker declaration.
          items:
            type: string
    ModelResourceSummary:
      type: object
      required:
        - name
        - type
        - capacity
      properties:
        name:
          type: string
          description: Factory-authored resource name.
        type:
          $ref: '#/components/schemas/ResourceType'
        capacity:
          type: integer
          minimum: 0
          description: Declared factory capacity for this resource.
        model:
          type: string
          description: Concrete model identifier when the resource is model-specific.
        backend:
          type: string
          description: Local runtime backend identifier for model resources.
        loadPolicy:
          type: string
          description: Local load-policy metadata for model resources.
        provider:
          type: string
          description: Cloud provider identity when the resource models quota or routing.
    ModelStatus:
      type: string
      description: Readiness status derived from the currently loaded runtime configuration and declared resources for one discovered model.
      enum:
        - READY
        - UNAVAILABLE
    ModelLoadState:
      type: string
      description: Runtime-visible load state for one discovered model. Before local model-manager support lands, local discovered models report `UNLOADED` and cloud-backed models report `NOT_APPLICABLE`.
      enum:
        - UNLOADED
        - NOT_APPLICABLE
    ErrorFamily:
      type: string
      description: Stable machine-readable error family for broader client grouping.
      enum:
        - BAD_REQUEST
        - CONFLICT
        - NOT_FOUND
        - INTERNAL_SERVER_ERROR
      x-enum-varnames:
        - ErrorFamilyBadRequest
        - ErrorFamilyConflict
        - ErrorFamilyNotFound
        - ErrorFamilyInternalServerError
      x-enum-descriptions:
        - Request payload or parameter validation failed.
        - The request conflicts with current resource state.
        - The requested resource does not exist.
        - The server failed while handling an otherwise valid request.
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - message
        - family
        - code
      properties:
        message:
          type: string
        family:
          $ref: '#/components/schemas/ErrorFamily'
        code:
          type: string
          description: Stable machine-readable error code.
          enum:
            - BAD_REQUEST
            - INVALID_FACTORY_NAME
            - FACTORY_ALREADY_EXISTS
            - INVALID_FACTORY
            - FACTORY_NOT_IDLE
            - STALE_FACTORY_VERSION
            - NOT_FOUND
            - INTERNAL_ERROR
          x-enum-descriptions:
            - Request payload or parameter validation failed.
            - Named factory name validation failed.
            - Submitted named factory already exists.
            - Submitted named factory payload failed validation.
            - Current factory runtime is not idle and cannot activate a new named factory.
            - Submitted editable factory definition was based on an older version than the current definition.
            - The requested resource does not exist.
            - The server failed while handling an otherwise valid request.
        targets:
          type: array
          description: Optional structured error targets that clients can map to forms, graph nodes, graph edges, fields, or save-level messages.
          items:
            $ref: '#/components/schemas/ErrorTarget'
    ErrorTarget:
      type: object
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          type: string
          description: Client-visible target category such as form, node, edge, field, or save.
        id:
          type: string
          description: Optional graph entity, relationship, or save condition identifier.
        field:
          type: string
          description: Optional request or form field path associated with the error.
    HybridLogicalTimestamp:
      type: object
      additionalProperties: false
      required:
        - logical
        - physical
      properties:
        logical:
          type: integer
          format: int64
          minimum: 0
          description: Monotonic Lamport-style logical component derived from the persisted factory definition version.
        physical:
          type: string
          format: date-time
          description: UTC physical timestamp component for the persisted factory definition version.
    EditableFactoryDefinition:
      type: object
      additionalProperties: false
      required:
        - factoryDefinition
        - version
      properties:
        factoryDefinition:
          $ref: '#/components/schemas/Factory'
        version:
          $ref: '#/components/schemas/HybridLogicalTimestamp'
    SaveEditableFactoryDefinitionRequest:
      type: object
      additionalProperties: false
      required:
        - factoryDefinition
      properties:
        factoryDefinition:
          $ref: '#/components/schemas/Factory'
        baseVersion:
          $ref: '#/components/schemas/HybridLogicalTimestamp'
    ProviderSessionDetailResponse:
      type: object
      additionalProperties: false
      required:
        - providerSession
        - source
        - parse
        - transcript
      properties:
        providerSession:
          $ref: '#/components/schemas/LoadableProviderSessionRef'
        source:
          $ref: '#/components/schemas/ProviderSessionSourceMetadata'
        parse:
          $ref: '#/components/schemas/CodexSessionParseSummary'
        transcript:
          type: array
          description: Ordered transcript entries extracted from the provider-session stream.
          items:
            $ref: '#/components/schemas/CodexSessionTranscriptEntry'
    FactorySessionTargetRef:
      type: object
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - default
            - named
        name:
          type: string
    FactorySessionTarget:
      type: object
      additionalProperties: false
      required:
        - ref
        - label
        - folderPath
        - factoryDir
        - project
      properties:
        ref:
          $ref: '#/components/schemas/FactorySessionTargetRef'
        label:
          type: string
        folderPath:
          type: string
        factoryDir:
          type: string
        project:
          type: string
    FactorySessionSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - target
        - folderPath
        - factoryDir
        - project
        - isDefault
      properties:
        id:
          type: string
        target:
          $ref: '#/components/schemas/FactorySessionTargetRef'
        folderPath:
          type: string
        factoryDir:
          type: string
        project:
          type: string
        isDefault:
          type: boolean
    ListFactorySessionsResponse:
      type: object
      additionalProperties: false
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/FactorySessionSummary'
    OpenFactorySessionRequest:
      type: object
      additionalProperties: false
      required:
        - folderPath
      properties:
        folderPath:
          type: string
        target:
          $ref: '#/components/schemas/FactorySessionTargetRef'
    OpenFactorySessionResponse:
      type: object
      additionalProperties: false
      properties:
        session:
          $ref: '#/components/schemas/FactorySessionSummary'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/FactorySessionTarget'
    LoadableProviderSessionRef:
      type: object
      additionalProperties: false
      required:
        - provider
        - kind
        - id
      properties:
        provider:
          $ref: '#/components/schemas/LoadableProviderSessionProvider'
        kind:
          $ref: '#/components/schemas/LoadableProviderSessionKind'
        id:
          type: string
          description: Provider-session identifier to resolve. This is an identifier, not a filesystem path.
    LoadableProviderSessionProvider:
      type: string
      description: Canonical provider value for provider-session detail requests that can be loaded by the API.
      x-enum-varnames:
        - Codex
      enum:
        - codex
    LoadableProviderSessionKind:
      type: string
      description: Canonical provider-session identifier kind for provider-session detail requests that can be loaded by the API.
      x-enum-varnames:
        - SessionID
      enum:
        - session_id
    ProviderSessionSourceMetadata:
      type: object
      additionalProperties: false
      required:
        - relativePath
        - sizeBytes
      properties:
        relativePath:
          type: string
          description: Path to the loaded session file relative to the configured Codex sessions root.
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          description: Size of the loaded session file in bytes.
        modifiedAt:
          type: string
          format: date-time
          description: Filesystem modification time when available.
    CodexSessionParseSummary:
      type: object
      additionalProperties: false
      required:
        - eventCount
        - lineCount
        - malformedLineCount
        - unknownEventCount
        - turns
        - functionCalls
        - reasoning
        - parseErrors
        - unknownEvents
      properties:
        eventCount:
          type: integer
          minimum: 0
          description: Number of JSON event records parsed from the session stream.
        lineCount:
          type: integer
          minimum: 0
          description: Number of non-empty event-stream lines inspected.
        malformedLineCount:
          type: integer
          minimum: 0
          description: Number of non-empty lines that could not be parsed as JSON objects.
        unknownEventCount:
          type: integer
          minimum: 0
          description: Number of parsed JSON events without a recognized type field.
        turns:
          type: array
          description: Chronological execution turns inferred from turn boundaries and response activity.
          items:
            $ref: '#/components/schemas/CodexSessionTurnSummary'
        functionCalls:
          type: array
          description: Function and tool calls observed in chronological order.
          items:
            $ref: '#/components/schemas/CodexSessionFunctionCallSummary'
        reasoning:
          type: array
          description: Reasoning entries or summaries observed in chronological order.
          items:
            $ref: '#/components/schemas/CodexSessionReasoningSummary'
        tokenUsage:
          $ref: '#/components/schemas/CodexSessionTokenUsage'
        parseErrors:
          type: array
          description: Line-level parse errors for malformed event-stream records.
          items:
            $ref: '#/components/schemas/CodexSessionLineError'
        unknownEvents:
          type: array
          description: Compact list of events with unknown or unsupported type fields.
          items:
            $ref: '#/components/schemas/CodexSessionUnknownEvent'
    CodexSessionTurnSummary:
      type: object
      additionalProperties: false
      required:
        - index
        - eventCount
        - responseItemCount
        - functionCallCount
        - reasoningCount
      properties:
        index:
          type: integer
          minimum: 1
          description: One-based chronological execution turn index.
        eventCount:
          type: integer
          minimum: 0
          description: Number of parsed events associated with the turn.
        responseItemCount:
          type: integer
          minimum: 0
          description: Number of response_item records associated with the turn.
        functionCallCount:
          type: integer
          minimum: 0
          description: Number of function or tool calls associated with the turn.
        reasoningCount:
          type: integer
          minimum: 0
          description: Number of reasoning entries associated with the turn.
        startedAt:
          type: string
          format: date-time
          description: First event timestamp associated with the turn when present.
    CodexSessionFunctionCallSummary:
      type: object
      additionalProperties: false
      required:
        - order
        - type
      properties:
        order:
          type: integer
          minimum: 1
          description: Chronological order of the function or tool call in the session stream.
        turnIndex:
          type: integer
          minimum: 1
          description: One-based execution turn index associated with the call when inferable.
        callId:
          type: string
          description: Provider call identifier when present in the session stream.
        type:
          type: string
          description: Raw response item type for the call, such as function_call or custom_tool_call.
        name:
          type: string
          description: Function or tool name when present.
        arguments:
          type: string
          description: Compact argument payload when present.
        output:
          type: string
          description: Compact output payload when present.
        status:
          type: string
          description: Result status inferred from the call output or explicit status fields.
    CodexSessionReasoningSummary:
      type: object
      additionalProperties: false
      required:
        - order
        - sourceType
      properties:
        order:
          type: integer
          minimum: 1
          description: Chronological order of the reasoning entry in the session stream.
        turnIndex:
          type: integer
