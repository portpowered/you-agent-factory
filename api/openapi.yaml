          description: Optional human-readable reason for the move.
    FactoryStateResponseEventPayload:
      type: object
      additionalProperties: false
      required:
        - state
      properties:
        previousState:
          $ref: '#/components/schemas/FactoryState'
        state:
          $ref: '#/components/schemas/FactoryState'
        reason:
          type: string
    RunResponseEventPayload:
      type: object
      additionalProperties: false
      properties:
        state:
          $ref: '#/components/schemas/FactoryState'
        reason:
          type: string
        wallClock:
          $ref: '#/components/schemas/WallClock'
