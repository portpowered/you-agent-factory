            - $ref: '#/components/schemas/OrchestratorCheckpointWrittenEventPayload'
            - $ref: '#/components/schemas/DispatchQueuedEventPayload'
            - $ref: '#/components/schemas/DispatchInterruptedEventPayload'
            - $ref: '#/components/schemas/DispatchReconciledEventPayload'
