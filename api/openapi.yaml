          additionalProperties: false
          description: Exact provider continuation identity when supplied.
          properties:
            provider:
              type: string
            kind:
              type: string
            id:
              type: string
        providerSelection:
          type: object
          additionalProperties: false
          description: Explicit provider and runner selection facts.
          properties:
            runnerId:
              type: string
            source:
              $ref: '#/components/schemas/RunnerSelectionSource'
            executorProvider:
              type: string
            modelProvider:
              type: string
        model:
          type: string
          description: Explicit model selection when supplied.
        reasoningEffort:
          type: string
          description: Explicit reasoning-effort selection when supplied.
        capabilities:
          $ref: '#/components/schemas/FactoryResponseEventCapabilities'
    FactoryResponseEventRunPayload:
      type: object
      additionalProperties: false
      description: Run-scoped lifecycle metadata payload.
      properties:
        status:
          type: string
          description: Run lifecycle status when applicable.
    FactoryResponseEventTurnPayload:
      type: object
      additionalProperties: false
      description: Turn-scoped lifecycle metadata payload.
      properties:
        turnIndex:
          type: integer
          format: int32
          minimum: 0
          description: Zero-based turn index within the run when applicable.
        status:
          type: string
          description: Turn lifecycle status when applicable.
    FactoryResponseEventMessagePayload:
      type: object
      additionalProperties: false
      description: Message snapshot payload with typed content blocks.
      required:
        - role
        - contentBlocks
      properties:
        role:
          type: string
          description: Message role such as assistant or user.
        contentBlocks:
          type: array
          minItems: 1
          description: Ordered typed content blocks for the message snapshot.
          items:
            $ref: '#/components/schemas/FactoryResponseEventContentBlock'
        partial:
          type: boolean
          description: When true, the snapshot carries bounded timeout or cancellation capture and must not be treated as an authoritative final response.
    FactoryResponseEventMessageDeltaPayload:
      type: object
      additionalProperties: false
      description: Incremental message content delta for one content block.
      required:
        - contentBlockIndex
        - contentBlockKind
      properties:
        contentBlockIndex:
          type: integer
          format: int32
          minimum: 0
          description: Zero-based index of the content block receiving the delta.
        contentBlockKind:
          $ref: '#/components/schemas/FactoryResponseEventContentBlockKind'
        textDelta:
          type: string
          description: Incremental text appended to the targeted content block.
    FactoryResponseEventReasoningPayload:
      type: object
      additionalProperties: false
      description: Reasoning summary snapshot or delta payload.
      properties:
        summary:
          type: string
          description: Full reasoning summary text when emitting a snapshot.
        summaryDelta:
          type: string
          description: Incremental reasoning summary text when emitting a delta.
    FactoryResponseEventToolPayload:
      type: object
      additionalProperties: false
      description: Tool lifecycle metadata with bounded argument and result summaries.
      required:
        - toolCallId
        - toolName
      properties:
        toolCallId:
          type: string
          description: Stable tool call identifier within the run.
        toolName:
          type: string
          description: Declared tool name for the invocation.
        status:
          type: string
          description: Tool lifecycle status when applicable.
        argumentsSummary:
          type: object
          description: Bounded summary of tool arguments. Not a raw provider protocol payload.
          additionalProperties: true
        resultSummary:
          type: object
          description: Bounded summary of tool results. Not a raw provider protocol payload.
          additionalProperties: true
    FactoryResponseEventToolDeltaPayload:
      type: object
      additionalProperties: false
      description: Incremental tool output delta payload.
      required:
        - toolCallId
        - outputDelta
      properties:
        toolCallId:
          type: string
          description: Stable tool call identifier receiving output.
        outputDelta:
          type: string
          description: Incremental tool output text.
    FactoryResponseEventFileChangePayload:
      type: object
      additionalProperties: false
      description: Observed file mutation payload.
      required:
        - path
        - operation
      properties:
        path:
          type: string
          description: Observed file path relative to the workspace or artifact root.
        operation:
          type: string
          description: Observed file operation such as create, update, or delete.
        summary:
          type: string
          description: Optional human-readable summary of the mutation.
    FactoryResponseEventPlanPayload:
      type: object
      additionalProperties: false
      description: Published plan update payload.
      properties:
        steps:
          type: array
          description: Ordered plan steps when emitting a plan snapshot.
          items:
            $ref: '#/components/schemas/FactoryResponseEventPlanStep'
        summary:
          type: string
          description: Optional plan summary text.
    FactoryResponseEventPlanStep:
      type: object
      additionalProperties: false
      description: One step in a published plan snapshot.
      required:
        - id
        - description
      properties:
        id:
          type: string
          description: Stable plan step identifier.
        description:
          type: string
          description: Human-readable step description.
        status:
          type: string
          description: Plan step status when applicable.
    FactoryResponseEventProgressPayload:
      type: object
      additionalProperties: false
      description: Coarse progress notification payload.
      required:
        - label
      properties:
        label:
          type: string
          description: Short progress label for UI or CLI consumers.
        message:
          type: string
          description: Optional longer progress message.
        percentComplete:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Optional completion percentage when known.
    FactoryResponseEventUsagePayload:
      type: object
      additionalProperties: false
      description: Token or model usage accounting payload.
      properties:
        inputTokens:
          type: integer
          format: int64
          minimum: 0
          description: Reported input token count when available.
        outputTokens:
          type: integer
          format: int64
          minimum: 0
          description: Reported output token count when available.
        totalTokens:
          type: integer
          format: int64
          minimum: 0
          description: Reported total token count when available.
        model:
          type: string
          description: Model identifier associated with the usage report.
    FactoryResponseEventErrorPayload:
      type: object
      additionalProperties: false
      description: Provider-neutral error payload with optional retry metadata.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable provider-neutral error code.
        message:
          type: string
          description: Human-readable error message.
        retryable:
          type: boolean
          description: Whether the error may be retried.
        retryAfterSeconds:
          type: integer
          format: int64
          minimum: 0
          description: Suggested retry delay in seconds when retryable.
        retryAttempt:
          type: integer
          format: int32
          minimum: 0
          description: Retry attempt count when applicable.
    FactoryResponseEventStreamGapPayload:
      description: Discontinuity marker for either unavailable retained response-event sequences or an affected provider item whose lifecycle could not be fully observed. Retention gaps include fromSequence, toSequence, and firstAvailableSequence; item-scoped gaps include affectedItemId and reason. The alternatives are exclusive so empty, partial, and mixed payloads are rejected.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - fromSequence
            - toSequence
            - firstAvailableSequence
          properties:
            fromSequence:
              type: integer
              format: int64
              minimum: 0
              description: Lowest unavailable published sequence greater than the reader's cursor.
            toSequence:
              type: integer
              format: int64
              minimum: 0
              description: Highest unavailable published sequence in the reader's catch-up window.
            firstAvailableSequence:
              type: integer
              format: int64
              minimum: 1
              description: First retained sequence available after the gap.
            reason:
              type: string
              minLength: 1
              description: Retention-gap reason such as retention_window.
        - type: object
          additionalProperties: false
          required:
            - affectedItemId
            - reason
          properties:
            affectedItemId:
              type: string
              minLength: 1
              description: Stable item identifier affected by a provider lifecycle discontinuity.
            toolCallId:
              type: string
              minLength: 1
              description: Provider tool-call identifier when the affected item is a tool lifecycle.
            reason:
              type: string
              minLength: 1
              description: Provider gap reason such as provider_reconnect or provider_terminated.
    FactorySaveMode:
      type: string
      description: Explicit save mode for session-scoped factory submission. Omitted mode on PUT /factory-sessions/{session_id}/factory defaults to REPLACE_CURRENT.
      default: REPLACE_CURRENT
      x-enum-varnames:
        - FactorySaveModeReplaceCurrent
        - FactorySaveModeUpsertNamedAndActivate
      enum:
        - REPLACE_CURRENT
        - UPSERT_NAMED_AND_ACTIVATE
      x-enum-descriptions:
        - Replace the factory already current in the selected live session.
        - Create or replace a named factory under the session root and activate it in that session.
    SaveFactoryForSessionRequest:
      type: object
      description: Session-scoped factory submission payload for PUT /factory-sessions/{session_id}/factory.
      additionalProperties: false
      required:
        - factory
      properties:
        mode:
          $ref: '#/components/schemas/FactorySaveMode'
          default: REPLACE_CURRENT
        factory:
          $ref: '#/components/schemas/Factory'
      example:
        mode: REPLACE_CURRENT
        factory:
          name: alpha
          version:
            logical: '2'
            physical: '2026-05-30T12:00:00.000000000Z'
          workTypes:
            - name: task
              states:
                - name: init
                  type: INITIAL
                - name: done
                  type: TERMINAL
          workers:
            - name: planner
              type: MODEL_WORKER
              modelProvider: CLAUDE
              executorProvider: SCRIPT_WRAP
              model: claude-sonnet-4-20250514
          workstations:
            - name: plan-task
              behavior: STANDARD
              type: MODEL_WORKSTATION
              worker: planner
              inputs:
                - workType: task
                  state: init
              outputs:
                - workType: task
                  state: done
    Factory:
      type: object
      description: Top-level factory.json contract. Declare the work types, resources, portability resources, workers, and workstations that make up one authored factory here. Guarded loop breakers should be authored as guarded LOGICAL_MOVE workstations using VISIT_COUNT guards instead of a top-level exhaustion-rules field.
      additionalProperties: false
      required:
        - name
      properties:
        name:
          $ref: '#/components/schemas/FactoryName'
        description:
          allOf:
            - $ref: '#/components/schemas/NameValue'
          description: Optional localized customer-facing explanation of this Factory.
        id:
          type: string
          description: Factory identifier used as the factory-level template context fallback.
        runner:
          allOf:
            - $ref: '#/components/schemas/RunnerID'
          description: Default runner selection for the factory when a workstation does not declare its own runner override.
        factoryDirectory:
          type: string
          description: Directory that contained the factory.json used for this serialized runtime config.
        sourceDirectory:
          type: string
          description: Original source directory for record/replay and drift diagnostics.
        version:
          allOf:
            - $ref: '#/components/schemas/HybridLogicalTimestamp'
          description: Server-managed current-factory version metadata. Clients should echo this value on complete replacement saves when they want stale-write detection, but durable factory configuration does not treat it as customer-authored topology.
        metadata:
          allOf:
            - $ref: '#/components/schemas/StringMap'
          description: Free-form factory-level metadata carried through runtime serialization and replay diagnostics.
        orchestrator:
          allOf:
            - $ref: '#/components/schemas/FactoryOrchestrator'
          description: Authored orchestrator identity for this factory. When omitted, existing Petri factories load through compatibility defaulting to orchestrator.kind = PETRI.
        inputTypes:
          type: array
          description: Named input kinds accepted by the factory. The default input type is implicit and must not be declared.
          items:
            $ref: '#/components/schemas/InputType'
        invocationReturn:
          allOf:
            - $ref: '#/components/schemas/InvocationReturn'
          description: Optional factory-authored invocation primary-result policy shared by CLI and API entrypoints. When omitted, runtimes use the SUBMITTED_WORK_TERMINAL fallback and return the first terminal content for the work item originally submitted by the invocation.
        invocationSignature:
          allOf:
            - $ref: '#/components/schemas/FactoryInvocationSignature'
          description: Optional canonical callable argument contract shared by CLI, API, dashboard, docs, and packaged factories. When omitted, callers use the factory's compatibility invocation behavior.
        examples:
          type: array
          description: Ordered runnable invocation examples. Canonical Factory documents write examples here; legacy invocationSignature.examples are accepted only by the Factory input compatibility mapper.
          items:
            $ref: '#/components/schemas/FactoryInvocationExample'
        webhooks:
          type: array
          description: Optional outbound webhook subscriptions. Existing Factory definitions without this field do not start outbound delivery work.
          items:
            $ref: '#/components/schemas/FactoryWebhook'
        guards:
          type: array
          description: Root-level guards that apply across the factory instead of one specific workstation or input.
          items:
            $ref: '#/components/schemas/FactoryGuard'
        workTypes:
          type: array
          description: Customer-authored work item categories and the lifecycle states each one can occupy.
          items:
            $ref: '#/components/schemas/WorkType'
        resources:
          type: array
          description: Shared capacity pools that workers or workstations can consume while work is executing.
          items:
            $ref: '#/components/schemas/Resource'
        supportingFiles:
          allOf:
            - $ref: '#/components/schemas/ResourceManifest'
          description: Optional portability manifest for validation-only external tools and portable bundled files. During v1 factory sharing, bundled INPUT files represent a share-time snapshot of the source factory's current inputs work so recipients restore detached starter-work copies that no longer sync back to the original factory. This contract is distinct from runtime-capacity resources.
        layout:
          allOf:
            - $ref: '#/components/schemas/FactoryLayout'
          description: Optional non-executable graph editor layout metadata keyed by canonical graph node and edge ids.
        workers:
          type: array
          description: Reusable worker definitions that workstations reference by name when dispatching work.
          items:
            $ref: '#/components/schemas/Worker'
        workstations:
          type: array
          description: Processing steps that consume work, invoke workers, and emit the next work states.
          items:
            $ref: '#/components/schemas/Workstation'
    FactoryWebhook:
      type: object
      additionalProperties: true
      required:
        - name
        - enabled
        - url
        - signingSecretRef
        - filter
      description: One Factory-configured outbound webhook subscription. Secret material is represented only by a reference and is resolved at delivery time.
      properties:
        name:
          type: string
          minLength: 1
          description: Unique customer-authored subscription name.
        enabled:
          type: boolean
          description: Whether this subscription is active for future canonical events.
        url:
          type: string
          minLength: 1
          description: Absolute HTTP or HTTPS destination URL.
        signingSecretRef:
          type: string
          minLength: 1
          description: Secret reference resolved by the delivery boundary; raw secret values are never part of Factory configuration.
        filter:
          $ref: '#/components/schemas/FactoryWebhookFilter'
        deliveryPolicy:
          allOf:
            - $ref: '#/components/schemas/FactoryWebhookDeliveryPolicy'
          description: Optional bounded delivery policy. Omitted fields use the documented defaults.
    FactoryWebhookFilter:
      type: object
      additionalProperties: true
      required:
        - eventTypes
      description: Canonical event filter for one outbound webhook subscription.
      properties:
        eventTypes:
          type: array
          minItems: 1
          description: Canonical event types selected for delivery.
          items:
            $ref: '#/components/schemas/FactoryWebhookEventType'
        dispatchStatuses:
          type: array
          minItems: 1
          description: Optional canonical dispatch statuses applied only to dispatch event types.
          items:
            $ref: '#/components/schemas/FactoryWebhookDispatchStatus'
    FactoryWebhookEventType:
      type: string
      description: Canonical Factory Event types supported by outbound webhook filters.
      enum:
        - WORK_STATE_CHANGE
        - DISPATCH_RESPONSE
        - DISPATCH_RECONCILED
        - DISPATCH_INTERRUPTED
    FactoryWebhookDispatchStatus:
      type: string
      description: Canonical dispatch statuses supported by outbound webhook filters.
      enum:
        - FAILED
        - INTERRUPTED
    FactoryWebhookDeliveryPolicy:
      type: object
      additionalProperties: true
      description: Bounded outbound delivery policy. Durations use Go duration syntax. Omitted values resolve to a 10 second request timeout, 5 total attempts, 1 second initial backoff, 2.0 multiplier, and 30 second maximum backoff.
      properties:
        requestTimeout:
          type: string
          description: Positive Go duration allowed for one HTTP request attempt.
        maxAttempts:
          type: integer
          minimum: 1
          description: Total delivery attempts including the initial request.
        initialBackoff:
          type: string
          description: Positive Go duration before the first retry.
        backoffMultiplier:
          type: number
          minimum: 1
          description: Exponential retry multiplier; values below 1 are not supported.
        maxBackoff:
          type: string
          description: Positive Go duration cap for one retry delay; it must not be below initialBackoff.
    FactoryOrchestrator:
      type: object
      additionalProperties: false
      required:
        - kind
      description: Authored orchestrator identity for one factory. When omitted, existing Petri factories load through compatibility defaulting to orchestrator.kind = PETRI.
      properties:
        kind:
          $ref: '#/components/schemas/FactoryOrchestratorKind'
        petri:
          allOf:
            - $ref: '#/components/schemas/FactoryOrchestratorPetriConfig'
          description: Petri-specific orchestrator configuration. Required only when kind = PETRI and additional Petri options are authored.
        javascript:
          allOf:
            - $ref: '#/components/schemas/FactoryOrchestratorJavaScriptConfig'
          description: JavaScript-specific orchestrator configuration. Required when kind = JAVASCRIPT.
    FactoryOrchestratorKind:
      type: string
      description: Authored orchestration engine for one factory. PETRI factories use the existing Petri graph semantics. JAVASCRIPT factories use workflow source identity and policy instead of Petri graph fields.
      enum:
        - PETRI
        - JAVASCRIPT
    FactoryOrchestratorPetriConfig:
      type: object
      additionalProperties: false
      description: Petri-specific orchestrator configuration. Existing Petri factories may omit this block and rely on compatibility defaulting to orchestrator.kind = PETRI.
    FactoryOrchestratorJavaScriptConfig:
      type: object
      additionalProperties: false
      description: JavaScript-specific orchestrator configuration. JavaScript factories do not require Petri graph fields and instead declare workflow source identity, metadata, args schema, and default policy here.
      properties:
        dialect:
          type: string
          description: Optional JavaScript dialect label for the authored workflow source.
        sourceRef:
          type: string
          description: Factory-relative or authored reference to the workflow source file.
        inlineSource:
          allOf:
            - $ref: '#/components/schemas/FactoryOrchestratorJavaScriptInlineSource'
          description: Inline workflow source when the factory carries source text directly.
        sourceHash:
          type: string
          description: Optional content hash for the resolved workflow source.
        entrypoint:
          type: string
          description: Optional exported entrypoint or phase name used to start the workflow.
        metadata:
          allOf:
            - $ref: '#/components/schemas/StringMap'
          description: Free-form JavaScript orchestrator metadata for authoring and diagnostics.
        argsSchema:
          type: object
          additionalProperties: true
          description: JSON Schema object describing workflow invocation arguments.
        defaultPolicy:
          type: object
          additionalProperties: true
          description: Default JavaScript workflow policy object applied when no runtime override exists.
        agents:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FactoryOrchestratorJavaScriptAgent'
          description: Named child-agent roles and their operator worker preset defaults.
    FactoryOrchestratorJavaScriptInlineSource:
      type: object
      additionalProperties: false
      required:
        - encoding
        - inline
      description: Inline JavaScript workflow source carried directly in the factory definition.
      properties:
        encoding:
          type: string
          enum:
            - utf-8
          description: Declared content encoding for the inline workflow source.
        inline:
          type: string
          description: Inline JavaScript workflow source text.
    FactoryInvocationSignature:
      type: object
      additionalProperties: true
      description: Canonical callable argument contract for invoking one factory. When present, CLI, API, dashboard, docs, and packaged-factory surfaces should discover and normalize invocation inputs from this shared schema instead of transport- or factory-specific argument definitions.
      properties:
        parameters:
          type: array
          description: Declared invocation parameters keyed by canonical parameter name.
          items:
            $ref: '#/components/schemas/FactoryInvocationParameter'
        unknownNamedArgumentPolicy:
          allOf:
            - $ref: '#/components/schemas/FactoryInvocationUnknownNamedArgumentPolicy'
          description: Policy for named inputs that do not match any declared parameter binding.
        outputContract:
          allOf:
            - $ref: '#/components/schemas/FactoryInvocationOutputContract'
          description: Optional customer-facing hint for the factory's primary output shape.
    FactoryInvocationParameter:
      type: object
      additionalProperties: true
      required:
        - name
      description: One canonical invocation parameter declared on a factory.
      properties:
        name:
          type: string
          description: Internal canonical parameter name used for normalized argument maps and interpolation.
        description:
          type: string
          description: Customer-facing description rendered in help, docs, and form controls.
        externalName:
          type: string
          description: Preferred named-argument key shown to callers, such as `output`.
        aliases:
          type: array
          description: Additional accepted named-argument keys that normalize to this parameter.
          items:
            type: string
        typeHint:
          allOf:
            - $ref: '#/components/schemas/FactoryInvocationParameterTypeHint'
          description: String-first hint that guides parsing, docs, and dashboard form selection.
        valueMode:
          allOf:
            - $ref: '#/components/schemas/FactoryInvocationParameterValueMode'
          description: Declares whether the parameter consumes one value, repeated values, variadic values, or file contents.
        required:
          type: boolean
          description: When true, invocation normalization must reject requests that omit this parameter.
        sensitive:
          type: boolean
          description: When true, diagnostics must preserve names and source metadata but redact concrete values.
        choices:
          type: array
          description: Optional allowed string values for this parameter.
          items:
            type: string
        defaultValue:
          type: string
          description: Default string value used when an omitted parameter resolves to one effective value.
        defaultValues:
          type: array
          description: Default string values used when an omitted parameter resolves to multiple effective values.
          items:
            type: string
        bindings:
          type: array
          description: Accepted invocation bindings for this parameter across positional, named, and stdin sources.
          items:
            $ref: '#/components/schemas/FactoryInvocationParameterBinding'
    FactoryInvocationParameterBinding:
      type: object
      additionalProperties: true
      required:
        - kind
      description: One public binding that exposes a parameter to callers.
      properties:
        kind:
          allOf:
            - $ref: '#/components/schemas/FactoryInvocationParameterBindingKind'
          description: Binding kind used to route invocation input into the parameter.
        position:
          type: integer
          minimum: 1
          description: 1-based positional slot used when kind is POSITIONAL.
    FactoryInvocationParameterBindingKind:
      type: string
      description: Public invocation binding kinds supported by factory signatures.
      enum:
        - POSITIONAL
        - NAMED
        - STDIN
        - NAMED_REST
    FactoryInvocationParameterTypeHint:
      type: string
      description: String-first parsing and UI hint for one factory invocation parameter.
      enum:
        - STRING
        - PATH
        - FILE_PATH
        - DIRECTORY_PATH
        - NUMBER_STRING
        - BOOLEAN_STRING
    FactoryInvocationParameterValueMode:
      type: string
      description: Declares how one invocation parameter consumes one or more string values.
      enum:
        - EXACT
        - REPEATED
        - VARIADIC
        - FILE_CONTENTS
    FactoryInvocationUnknownNamedArgumentPolicy:
      type: string
      description: Policy for named inputs that do not match any declared parameter binding.
      enum:
        - REJECT
        - ALLOW
        - COLLECT
    FactoryInvocationOutputContract:
      type: object
      additionalProperties: true
      description: Customer-facing output hint for a factory invocation signature.
      properties:
        mode:
          allOf:
            - $ref: '#/components/schemas/FactoryInvocationOutputContractMode'
          description: High-level output contract mode exposed to callers.
        pathParameter:
          type: string
          description: Parameter name that controls the destination path when the factory writes output to disk.
        contentType:
          type: string
          description: Output media type hint for docs, API consumers, and dashboard affordances.
        fileExtension:
          type: string
          description: Suggested file extension when the output mode writes a file.
        description:
          type: string
          description: Human-readable summary of the primary output contract.
    FactoryInvocationOutputContractMode:
      type: string
      description: High-level output shape hint exposed by a factory invocation signature.
      enum:
        - INLINE
        - FILE
        - JSON
    FactoryInvocationExample:
      type: object
      additionalProperties: true
      required:
        - name
        - description
        - args
      description: One example invocation for docs, help, and packaged-factory inspection.
      properties:
        name:
          type: string
          minLength: 1
          description: Stable example name.
        description:
          allOf:
            - $ref: '#/components/schemas/NameValue'
          description: Localized customer-facing explanation of what the example does.
        args:
          allOf:
            - $ref: '#/components/schemas/FactoryInvocationArguments'
          description: Structured invocation arguments; values are never parsed or executed while loading the Factory.
    FactoryInvocationArguments:
      type: object
      description: Structured Factory invocation arguments keyed by parameter name, external name, or alias. Each value is either one string or an ordered array of strings.
      additionalProperties:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
    InvocationReturn:
      type: object
      additionalProperties: true
      required:
        - policy
      description: Factory-authored policy for selecting the primary result returned by CLI and API invocations. When omitted from a Factory, runtimes use the documented SUBMITTED_WORK_TERMINAL fallback.
      properties:
        policy:
          allOf:
            - $ref: '#/components/schemas/InvocationReturnPolicy'
          description: Return selection policy for this factory.
        workTypeName:
          type: string
          description: Work type name used by EXPLICIT policy selection.
        terminalState:
          type: string
          description: Authored terminal state name used by EXPLICIT policy selection.
        workName:
          type: string
          description: Optional authored work name filter used by EXPLICIT policy selection.
    InvocationReturnPolicy:
      type: string
      description: Primary-result selection policy for factory invocation responses. SUBMITTED_WORK_TERMINAL traces the work submitted by the invocation until it reaches its first terminal output. EXPLICIT selects configured work content from the invocation submit scope.
      enum:
        - SUBMITTED_WORK_TERMINAL
        - EXPLICIT
    FactoryGuard:
      type: object
      description: Factory-level guard attached at the root factory definition.
      additionalProperties: false
      required:
        - type
        - modelProvider
        - refreshWindow
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/FactoryGuardType'
          description: Factory-level guard condition to evaluate before dispatch-ready transitions can proceed.
        modelProvider:
          allOf:
            - $ref: '#/components/schemas/ProviderIdentity'
          description: Provider whose inference-throttle history controls this factory-level guard.
        model:
          type: string
          description: Optional model name to scope throttling more narrowly than the provider-level window.
        refreshWindow:
          type: string
          description: Duration string that controls how long the factory should keep re-checking throttle history before allowing the lane again.
    ResourceManifest:
      type: object
      additionalProperties: false
      description: Canonical portability manifest for Agent Factory bundles. Required tools are validation-only PATH dependencies; bundled files carry portable content for restoration inside the factory boundary.
      properties:
        requiredTools:
          type: array
          description: Declarative external tools that must already resolve on PATH. These entries are validated but not embedded or installed.
          items:
            $ref: '#/components/schemas/RequiredTool'
        bundledFiles:
          type: array
          description: Portable bundled files that belong inside the factory boundary. Entries are explicit only, use factory-relative target paths, and must stay under the canonical script, docs, or inputs roots for SCRIPT, DOC, or INPUT entries, or match the supported root-helper allowlist for ROOT_HELPER entries. Export, share, flatten, and materialize flows auto-discover SCRIPT and DOC files under the documented factory subtrees, but ROOT_HELPER entries such as Makefile are opt-in manifest entries that travel only when explicitly declared here. In v1 shared-factory flows, INPUT entries capture the source factory's current starter work at share time and are restored as independent recipient copies.
          items:
            $ref: '#/components/schemas/BundledFile'
    RequiredTool:
      type: object
      additionalProperties: true
      required:
        - name
        - command
      description: One declarative external tool dependency for a portable factory.
      properties:
        name:
          type: string
          description: Human-readable tool name used in manifests and validation output.
        command:
          type: string
          description: Executable lookup token that must resolve on PATH.
        purpose:
          type: string
          description: Optional explanation of why the portable factory requires this tool.
        versionArgs:
          type: array
          description: Optional argument vector used by future validation flows to probe the tool version without changing the executable lookup token.
          items:
            type: string
    BundledFile:
      type: object
      additionalProperties: true
      required:
        - type
        - targetPath
        - content
      description: One explicit portable bundled file entry carried by the factory portability manifest. SCRIPT files target factory/scripts/..., DOC files target factory/docs/..., INPUT files target factory/inputs/<work-type>/<channel>/..., and ROOT_HELPER files target supported project-root helper paths such as Makefile only when declared explicitly in bundledFiles. Export and flatten do not auto-discover project-root helpers. In v1 shared-factory exports, INPUT entries encode a share-time snapshot of starter work that is copied into the recipient factory as detached seeded work.
      properties:
        id:
          type: string
          description: Durable bundled-file identifier used by portable layout and graph editor references. When omitted on input, the canonical targetPath is materialized as the stable identifier.
        type:
          type: string
          enum:
            - SCRIPT
            - DOC
            - INPUT
            - ROOT_HELPER
          description: Portable file class. SCRIPT entries target factory/scripts/..., DOC entries target factory/docs/..., INPUT entries target factory/inputs/<work-type>/<channel>/..., and ROOT_HELPER entries target supported project-root helper files such as Makefile only when explicitly declared in bundledFiles. Shared-factory INPUT entries snapshot current source inputs at share time instead of creating a live link.
        targetPath:
          type: string
          description: Canonical factory-relative restoration target for the bundled file. Absolute paths, backslash-separated paths, and paths that require dot-segment normalization are rejected.
        content:
          $ref: '#/components/schemas/BundledFileContent'
    BundledFileContent:
      type: object
      additionalProperties: true
      required:
        - encoding
        - inline
      description: Inline content payload for a portable bundled file.
      properties:
        encoding:
          type: string
          enum:
            - utf-8
          description: Declared content encoding for the inline payload. V1 bundled files use UTF-8 text content.
        inline:
          type: string
          description: Inline bundled file content carried in the manifest. SCRIPT and DOC files under factory/scripts/ and factory/docs/ may be discovered during flatten, but supported root helper paths such as Makefile are bundled only when they appear as explicit ROOT_HELPER entries in bundledFiles.
    InputType:
      type: object
      additionalProperties: true
      description: Declared types of inputs. Used to force the inputs of a certain work type to be of a certain shape, like a specific JSON structure.
      required:
        - name
        - type
      properties:
        name:
          type: string
          description: Input type name. The reserved name "default" is implicit.
        type:
          $ref: '#/components/schemas/InputKind'
    InputKind:
      type: string
      enum:
        - DEFAULT
      description: Kinds of input. `DEFAULT` passes opaque input through to workstations as-is.
    WorkType:
      type: object
      additionalProperties: false
      description: A named category of work that can move through the factory. Each work type declares the lifecycle states its work items can occupy.
      required:
        - name
        - states
      properties:
        id:
          type: string
          description: Optional durable public identifier for this work type. When present, graph and layout references should use this id instead of the mutable name.
        name:
          type: string
          description: Customer-authored work type name referenced by workstation inputs, outputs, and submitted work.
        description:
          allOf:
            - $ref: '#/components/schemas/NameValue'
          description: Optional localized customer-facing explanation of this work type.
        states:
          type: array
          description: Lifecycle states available for work items of this type.
          items:
            $ref: '#/components/schemas/WorkState'
        handlingBehavior:
          type: array
          description: Optional CLI routing markers for this work type. Factories used with you run --factory must declare handlingBehavior DEFAULT on exactly one work type.
          items:
            $ref: '#/components/schemas/WorkTypeHandlingBehavior'
        expectedArtifacts:
          type: array
          description: Expected output declarations inherited by workstations handling this work type.
          items:
            $ref: '#/components/schemas/ExpectedArtifact'
    WorkState:
      type: object
      additionalProperties: false
      description: A lifecycle state that a work item can occupy inside one work type.
      required:
        - name
        - type
      properties:
        id:
          type: string
          description: Optional durable public identifier for this state within its work type. When present, graph and layout references should use this id instead of the mutable name.
        name:
          type: string
          description: Customer-authored state name referenced by workstation inputs and outputs.
        type:
          allOf:
            - $ref: '#/components/schemas/WorkStateType'
          description: Lifecycle category for this state, such as initial, processing, terminal, or failed.
    WorkStateType:
      type: string
      description: 'Categories of work states. The factory runtime treats these categories differently for lifecycle tracking and metrics purposes. Initial: The work is waiting to be picked up by a workstation. Processing: The work has been partially processed, and is continuing through its lifecycle. Terminal: The work has completed successfully. Failed: The work has failed.'
      enum:
        - INITIAL
        - PROCESSING
        - TERMINAL
        - FAILED
    Resource:
      description: Shared capacity that limits how much work the factory can run at once, such as worker slots or external service quotas.
      type: object
      additionalProperties: false
      required:
        - name
        - capacity
      properties:
        id:
          type: string
          description: Optional durable public identifier for this resource. When present, graph and layout references should use this id instead of the mutable name.
        name:
          type: string
          description: Resource name referenced from worker requirements and workstation resourceUsage entries.
        type:
          allOf:
            - $ref: '#/components/schemas/ResourceType'
          description: Optional uppercase resource family, such as `MODEL`, `PROVIDER_QUOTA`, or `INVOCATION_SLOT`.
        capacity:
          type: integer
          minimum: 1
          description: Total units of this resource available to the factory at one time.
        model:
          type: string
          description: Stable managed runtime identity for `MODEL` resources, such as `OMNIVOICE_Q4_K_M`. Packaged and authored factories declare the same managed-runtime dependency through this field plus matching `MODEL_WORKER.model` values.
        backend:
          type: string
          description: Managed runtime backend identifier for `MODEL` resources, such as `LLAMACPP`. Backend selection stays provider-agnostic in customer-facing factory config.
        loadPolicy:
          type: string
          description: Managed runtime load policy for `MODEL` resources, such as `ON_DEMAND` or `EAGER`.
        provider:
          type: string
          description: Provider identity associated with this resource, especially for `PROVIDER_QUOTA` resources.
    ResourceType:
      type: string
      description: Uppercase resource families supported by the public factory-config contract.
      enum:
        - MODEL
        - PROVIDER_QUOTA
        - INVOCATION_SLOT
    Worker:
      description: A reusable worker definition that tells the factory how a workstation should execute work, such as through a model-backed agent or a script.
      type: object
      additionalProperties: true
      not:
        required:
          - promptFile
      required:
        - name
      properties:
        id:
          type: string
          description: Optional durable public identifier for this worker. When present, graph and layout references should use this id instead of the mutable name.
        name:
          type: string
          description: Worker name referenced by Workstation.worker.
        description:
          allOf:
            - $ref: '#/components/schemas/NameValue'
          description: Optional localized customer-facing explanation of this worker.
        type:
          allOf:
            - $ref: '#/components/schemas/WorkerType'
          description: Worker implementation family to instantiate for this definition.
        provider:
          allOf:
            - $ref: '#/components/schemas/HostedWorkerProvider'
          description: Built-in hosted provider identity when this worker uses repository-owned hosted execution.
        model:
          type: string
          description: Model identifier to request from the configured model provider when this worker uses model execution.
        modelProvider:
          oneOf:
            - $ref: '#/components/schemas/ProviderIdentity'
            - type: string
              pattern: ^\$\{[A-Za-z0-9_.-]+\}$
          description: 'Canonical provider identity used for model routing and provider diagnostics, or an exact invocation-parameter placeholder such as `${modelProvider}`. For `executorProvider: ACP`, this names the configured ACP integration, such as `cursor-acp`. Extension identities use lowercase standardized syntax; built-in values such as `CLAUDE` and `CODEX` remain compatibility conveniences.'
        reasoningEffort:
          $ref: '#/components/schemas/ReasoningEffort'
        modelLocality:
          allOf:
            - $ref: '#/components/schemas/WorkerModelLocality'
          description: Provider locality for this model capability declaration. Use `LOCAL` for embedded or host-managed inference and `CLOUD` for remote provider execution.
        executorProvider:
          allOf:
            - $ref: '#/components/schemas/WorkerProvider'
          description: Execution mechanism. Use `ACP` for ACP-backed workers and put the configured integration identity (for example `cursor-acp`) in modelProvider. `SCRIPT_WRAP` remains the command-wrapper compatibility value; legacy named executor identities remain accepted during migration.
        operations:
          type: array
          description: Provider-agnostic model operations that this worker can execute, including named input and output slots.
          items:
            $ref: '#/components/schemas/ModelOperation'
        command:
          type: string
          description: Command to execute when this worker runs through a command or script provider.
        args:
          type: array
          description: Additional command arguments passed to the configured command.
          items:
            type: string
        resources:
          type: array
          description: Resource capacity this worker requires before it can be dispatched.
          items:
            $ref: '#/components/schemas/ResourceRequirement'
        timeout:
          type: string
          description: Optional Go duration that caps one worker execution attempt.
        stopToken:
          type: string
          description: Marker that tells model-oriented workers where to stop generated output when the provider supports it.
        skipPermissions:
          type: boolean
          description: When true, bypasses permission checks for providers that support permission gating.
        auth:
          allOf:
            - $ref: '#/components/schemas/HostedWorkerAuth'
          description: Hosted-worker authentication contract. V1 hosted workers accept only auth.secretRef.
        linear:
          allOf:
            - $ref: '#/components/schemas/HostedLinearWorkerConfig'
          description: Provider-specific configuration for the built-in hosted LINEAR worker.
        agentTools:
          allOf:
            - $ref: '#/components/schemas/AgentWorkerToolsConfig'
          description: Explicit agent-loop tool policy for AGENT_WORKER definitions. Omit or set policy DISABLED to run agent loops without advertising or executing tools.
        body:
          type: string
          description: Inline worker instructions or script body when the worker is authored directly in factory config.
    AgentWorkerToolsConfig:
      type: object
      additionalProperties: false
      description: Explicit agent-loop tool policy for AGENT_WORKER definitions. Tool execution stays disabled unless this block is present with a non-DISABLED policy.
      required:
        - policy
      properties:
        policy:
          allOf:
            - $ref: '#/components/schemas/AgentWorkerToolPolicy'
          description: Required executor policy for agent-loop tool use on this worker.
    AgentWorkerToolPolicy:
      type: string
      description: Explicit tool execution policy for AGENT_WORKER agent loops. DISABLED runs the harness in no-tools mode. READ_ONLY exposes bounded filesystem read tools. ENABLED adds bounded filesystem write capability for the first supported tool set.
      enum:
        - DISABLED
        - READ_ONLY
        - ENABLED
    WorkerType:
      type: string
      description: Worker implementation families supported by the public factory-config contract.
      enum:
        - INFERENCE_WORKER
        - AGENT_WORKER
        - SCRIPT_WORKER
        - POLLER_WORKER
        - MODEL_WORKER
        - HOSTED_WORKER
    WorkerModelProvider:
      type: string
      description: Built-in model-provider constants retained as generated-client conveniences. Authored modelProvider fields use the open ProviderIdentity contract, so this list is not an exhaustive provider inventory.
      enum:
        - CLAUDE
        - CODEX
        - ANTIGRAVITY
    ProviderIdentity:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^(?:[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*|ANTIGRAVITY|ANTHROPIC|CLAUDE|CODEX|OPENAI)$
      description: Open provider identity used by authored modelProvider fields. Extension identities use lowercase letters and digits separated by dots or hyphens. Built-in identities and documented legacy aliases remain accepted compatibility spellings. For example, `customer.provider` is a valid extension identity.
    ProviderCatalog:
      type: object
      additionalProperties: false
      description: Versioned public collection of provider manifests.
      required:
        - formatVersion
        - providerSchema
        - providers
      properties:
        formatVersion:
          type: string
          enum:
            - 1.0.0
          description: Provider Catalog document format version.
        providerSchema:
          type: string
          format: uri
          enum:
            - https://schemas.you.dev/model-providers/provider-manifest/1.0.0.schema.json
          description: Immutable JSON Schema identifier used to validate every provider entry.
        publicationProvenance:
          type: object
          additionalProperties: false
          description: Optional source-revision provenance supplied by a publication staging process.
          required:
            - sourceRepository
            - sourceCommit
          properties:
            sourceRepository:
              type: string
              format: uri
              description: Public source repository from which the catalog was published.
            sourceCommit:
              type: string
              pattern: ^[0-9a-f]{40}$
              description: Full immutable Git commit identifying the published source tree.
        providers:
          type: array
          description: Provider manifests in canonical provider-ID order.
          items:
            $ref: '#/components/schemas/ProviderManifest'
    ProviderManifest:
      type: object
      additionalProperties: false
      description: Public, data-only metadata for one model-provider integration. A manifest describes evidenced maximum behavior and publication posture; it never reports current-machine installation, authentication, readiness, pricing, or runtime registration.
      required:
        - id
        - aliases
        - displayName
        - description
        - documentation
        - technicalSupportLevel
        - implementationAvailability
        - maximumExecutionCapabilities
        - maximumResponseFidelityCapabilities
        - discovery
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*$
          description: Stable canonical lowercase provider identifier.
        aliases:
          type: array
          uniqueItems: true
          description: Alternate lowercase identifiers; aliases must not equal or shadow any catalog ID or alias.
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*$
        displayName:
          allOf:
            - $ref: '#/components/schemas/NameValue'
          description: Localizable customer-facing provider name.
        description:
          allOf:
            - $ref: '#/components/schemas/NameValue'
          description: Localizable customer-facing provider summary.
        documentation:
          type: array
          minItems: 1
          uniqueItems: true
          description: Stable public documentation links for this provider.
          items:
            $ref: '#/components/schemas/ProviderDocumentationLink'
        technicalSupportLevel:
          $ref: '#/components/schemas/ProviderTechnicalSupportLevel'
        implementationAvailability:
          $ref: '#/components/schemas/ProviderImplementationAvailability'
        maximumExecutionCapabilities:
          $ref: '#/components/schemas/ProviderExecutionCapabilities'
        maximumResponseFidelityCapabilities:
          $ref: '#/components/schemas/ProviderResponseFidelityCapabilities'
        discovery:
          $ref: '#/components/schemas/ProviderDiscoveryPrerequisites'
        harness:
          $ref: '#/components/schemas/ProviderHarness'
        modelCatalogPosture:
          $ref: '#/components/schemas/ProviderModelCatalogPosture'
        harnessRoutes:
          type: array
          maxItems: 32
          description: Directional routes implemented by the provider harness, independent of any model catalog claim.
          items:
            $ref: '#/components/schemas/ProviderModality'
        evidence:
          type: array
          maxItems: 64
          uniqueItems: true
          description: Bounded evidence records used to qualify capability facts in this manifest.
          items:
            $ref: '#/components/schemas/ProviderCapabilityEvidence'
        models:
          type: array
          description: Named provider models and their complete capability facts in canonical model-ID order.
          items:
            $ref: '#/components/schemas/ProviderModel'
        tools:
          type: array
          description: Named provider tool facts in canonical tool-name order.
          items:
            $ref: '#/components/schemas/ProviderTool'
        knownLimits:
          type: array
          description: Named provider constraints and bounded behavior facts in canonical name order.
          items:
            $ref: '#/components/schemas/ProviderKnownLimit'
        deprecation:
          $ref: '#/components/schemas/ProviderDeprecation'
    ProviderCapabilitySupport:
      type: string
      description: Evidence state shared by harness, modality, and tool capability facts.
      enum:
        - supported
        - unsupported
        - conditional
        - unknown
    ProviderCapabilityEvidence:
      type: object
      additionalProperties: false
      description: Bounded evidence record qualifying one or more published capability facts.
      required:
        - id
        - kind
        - verifiedOn
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9._-]*$
          description: Stable manifest-local evidence identifier.
        kind:
          $ref: '#/components/schemas/ProviderCapabilityEvidenceKind'
        verifiedOn:
          type: string
          format: date
          description: UTC calendar date on which the evidence was checked.
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          pattern: ^https://(?:[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?\.)+[A-Za-z]{2,}(?::[0-9]+)?(?:[/?#].*)?$
          description: Optional public HTTPS source for the evidence.
        harnessVersion:
          type: string
          minLength: 1
          maxLength: 128
          description: Optional harness version used when the evidence was checked.
        factRefs:
          type: array
          maxItems: 64
          uniqueItems: true
          description: Optional bounded references to facts qualified by this record.
          items:
            type: string
            minLength: 1
            maxLength: 256
    ProviderCapabilityEvidenceKind:
      type: string
      description: Source class for evidence supporting a published capability fact.
      enum:
        - primary_documentation
        - protocol_probe
        - conformance_fixture
        - maintainer_assertion
    ProviderModelCatalogPosture:
      type: string
      description: How a provider's model identifiers are known to the published catalog.
      enum:
        - exact
        - runtime_discovered
        - operator_selected
        - unknown
    ProviderHarness:
      type: object
      additionalProperties: false
      description: Provider harness metadata, kept separate from model capability facts.
      required:
        - kind
      properties:
        kind:
          $ref: '#/components/schemas/ProviderHarnessKind'
        acpSupport:
          $ref: '#/components/schemas/ProviderACPSupport'
    ProviderHarnessKind:
      type: string
      description: Execution harness family represented by a provider manifest.
      enum:
        - native_cli
        - acp
    ProviderACPSupport:
      type: object
      additionalProperties: false
      description: Typed ACP support metadata for a provider harness.
      required:
        - support
      oneOf:
        - type: object
          required:
            - condition
          properties:
            support:
              type: string
              enum:
                - conditional
            condition:
              type: string
              minLength: 1
              maxLength: 512
        - type: object
          properties:
            support:
              type: string
              enum:
                - supported
                - unsupported
                - unknown
      properties:
        support:
          $ref: '#/components/schemas/ProviderCapabilitySupport'
        condition:
          type: string
          minLength: 1
          maxLength: 512
          description: Bounded operator-visible condition required when ACP support is conditional.
        protocolVersion:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9][A-Za-z0-9._/-]*$
          description: ACP protocol version known to the manifest author.
        resourceDelivery:
          $ref: '#/components/schemas/ProviderACPResourceDelivery'
        evidenceRefs:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          description: Stable IDs of evidence records qualifying ACP support.
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[a-z][a-z0-9._-]*$
    ProviderACPResourceDelivery:
      type: string
      description: Evidence state for delivering a resource through the ACP harness.
      enum:
        - implemented
        - unsupported
        - conditional
        - unknown
    ProviderMediaConstraints:
      type: object
      additionalProperties: false
      description: Optional bounded media constraints for one modality route.
      properties:
        mediaTypes:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          description: Accepted or emitted media types, such as image/png or audio/wav.
          items:
            type: string
            minLength: 3
            maxLength: 128
            pattern: ^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+$
        maxBytes:
          type: integer
          format: int64
          minimum: 1
          description: Maximum payload size in bytes when documented.
        maxDurationSeconds:
          type: number
          minimum: 0
          description: Maximum media duration in seconds when documented.
        maxItems:
          type: integer
          minimum: 1
          description: Maximum number of media items accepted or emitted in one route.
    ProviderTechnicalSupportLevel:
      type: string
      description: Maintainer-verified technical support posture for a provider integration. This value does not describe whether the provider is installed or ready on the current machine.
      enum:
        - production
        - experimental
        - not-supported
    ProviderImplementationAvailability:
      type: string
      description: How an implementation is supplied. Availability is publication metadata, not a live readiness or installation result.
      enum:
        - bundled
        - externally-supplied
        - catalog-only
    ProviderDocumentationLink:
      type: object
      additionalProperties: false
      description: One stable public documentation resource for a provider.
      required:
        - kind
        - url
      properties:
        kind:
          $ref: '#/components/schemas/ProviderDocumentationLinkKind'
        url:
          type: string
          format: uri
          minLength: 1
          pattern: ^https://(?:[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?\.)+[A-Za-z]{2,}(?::[0-9]+)?(?:[/?#].*)?$
          description: Public HTTPS documentation URL with a DNS hostname. Machine-local, IP-address, and credential-bearing URLs are invalid.
    ProviderDocumentationLinkKind:
      type: string
      description: Purpose of one stable public provider documentation link.
      enum:
        - homepage
        - setup
        - reference
        - support
    ProviderExecutionCapabilities:
      type: object
      additionalProperties: false
      description: Maximum evidenced execution features of the provider integration. These values are independent of support posture and do not imply current-machine readiness.
      required:
        - promptSubmission
        - imageInput
        - sessionResume
        - structuredOutput
        - permissionBypass
        - toolExecution
        - workingDirectory
        - worktree
      properties:
        promptSubmission:
          type: boolean
          description: Accepts authored prompt input for execution.
        imageInput:
          type: boolean
          description: Accepts image content as invocation input.
        sessionResume:
          type: boolean
          description: Can continue an identified provider session.
        structuredOutput:
          type: boolean
          description: Can constrain authoritative output using a structured schema.
        permissionBypass:
          type: boolean
          description: Can explicitly bypass the provider's normal permission and sandbox prompts.
        toolExecution:
          type: boolean
          description: Can execute provider-managed tools during an invocation.
        workingDirectory:
          type: boolean
          description: Can execute with an explicit working directory.
        worktree:
          type: boolean
          description: Can execute against an isolated source-control worktree.
    ProviderResponseFidelityCapabilities:
      type: object
      additionalProperties: false
      description: Maximum evidenced response-event fidelity of the provider integration. Capabilities describe observable output independently of support posture.
      required:
        - nativeStreaming
        - messageDeltas
        - messageSnapshots
        - reasoningSummaries
        - toolLifecycle
        - toolOutputDeltas
        - fileChanges
        - plans
        - usage
        - stableItemIds
        - providerReconnect
      properties:
        nativeStreaming:
          type: boolean
          description: Exposes native streaming observations.
        messageDeltas:
          type: boolean
          description: Emits incremental assistant-message deltas.
        messageSnapshots:
          type: boolean
          description: Emits assistant-message snapshots.
        reasoningSummaries:
          type: boolean
          description: Emits reasoning summaries or reasoning deltas.
        toolLifecycle:
          type: boolean
          description: Emits correlated tool lifecycle metadata.
        toolOutputDeltas:
          type: boolean
          description: Emits incremental tool-output deltas.
        fileChanges:
          type: boolean
          description: Emits observed file changes.
        plans:
          type: boolean
          description: Emits plan updates.
        usage:
          type: boolean
          description: Emits usage accounting.
        stableItemIds:
          type: boolean
          description: Assigns stable item identifiers across response events.
        providerReconnect:
          type: boolean
          description: Supports reconnecting an interrupted provider response stream.
    ProviderDiscoveryPrerequisites:
      type: object
      additionalProperties: false
      description: 'Static, credential-free facts that tooling may use to explain how a provider can be discovered. Only names and endpoint kinds are published: credential values, environment values, endpoint addresses, machine-local paths, installation/readiness state, and pricing are outside this contract.'
      required:
        - executableNames
        - endpointKinds
        - configurationKeys
      properties:
        executableNames:
          type: array
          uniqueItems: true
          description: Executable basenames that may supply the provider integration.
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        endpointKinds:
          type: array
          uniqueItems: true
          description: Credential-free endpoint transport kinds; addresses and live status are not published.
          items:
            $ref: '#/components/schemas/ProviderDiscoveryEndpointKind'
        configurationKeys:
          type: array
          uniqueItems: true
          description: Required configuration-key names only; configuration and environment values are forbidden.
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z][A-Za-z0-9._-]*$
        prerequisites:
          type: array
          uniqueItems: true
          description: Sanitized executable, authentication, workspace, or configuration requirements.
          items:
            $ref: '#/components/schemas/ProviderDiscoveryPrerequisite'
    ProviderDiscoveryPrerequisite:
      type: object
      additionalProperties: false
      description: Sanitized prerequisite guidance that never carries a secret or machine-local value.
      required:
        - kind
        - name
        - description
      properties:
        kind:
          type: string
          enum:
            - executable
            - authentication
            - workspace
            - configuration
          description: Sanitized prerequisite category.
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9._-]*$
          description: Stable prerequisite name, never a secret value.
        description:
          type: string
          minLength: 1
          maxLength: 256
          description: Bounded setup guidance without environment values or paths.
    ProviderDiscoveryEndpointKind:
      type: string
      description: Static endpoint transport kind that may be checked without credentials.
      enum:
        - local-http
        - remote-http
        - stdio
        - unix-socket
    ProviderEffort:
      type: string
      description: Provider-supported reasoning effort setting for one model.
      enum:
        - minimal
        - low
        - medium
        - high
        - xhigh
        - max
    ProviderModel:
      type: object
      additionalProperties: false
      description: Capability facts for one named model exposed by a provider.
      required:
        - id
        - efforts
        - modalities
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          description: Exact model identifier accepted by the provider adapter.
        efforts:
          type: array
          uniqueItems: true
          description: Reasoning effort values accepted independently by this model.
          items:
            $ref: '#/components/schemas/ProviderEffort'
        modalities:
          type: array
          uniqueItems: true
          description: Complete directional modality facts, including unsupported values.
          items:
            $ref: '#/components/schemas/ProviderModality'
    ProviderModality:
      type: object
      additionalProperties: false
      description: One explicit directional modality fact for a harness route or model.
      required:
        - direction
        - modality
        - support
        - transport
      oneOf:
        - type: object
          required:
            - condition
          properties:
            support:
              type: string
              enum:
                - conditional
            condition:
              type: string
              minLength: 1
              maxLength: 512
        - type: object
          properties:
            support:
              type: string
              enum:
                - supported
                - unsupported
                - unknown
      properties:
        direction:
          $ref: '#/components/schemas/ProviderModalityDirection'
        modality:
          $ref: '#/components/schemas/ProviderModalityKind'
        support:
          $ref: '#/components/schemas/ProviderModalitySupport'
        transport:
          $ref: '#/components/schemas/ProviderModalityTransport'
        condition:
          type: string
          minLength: 1
          maxLength: 512
          description: Bounded operator-visible condition required when support is conditional.
        mediaConstraints:
          $ref: '#/components/schemas/ProviderMediaConstraints'
        evidenceRefs:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          description: Stable IDs of evidence records qualifying this fact.
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[a-z][a-z0-9._-]*$
    ProviderModalityDirection:
      type: string
      description: Direction in which a provider model accepts or emits a modality.
      enum:
        - input
        - output
    ProviderModalityKind:
      type: string
      description: Media or content modality understood by a provider model.
      enum:
        - text
        - image
        - audio
        - video
    ProviderModalitySupport:
      type: string
      description: Evidence state for a directional harness or model modality fact.
      enum:
        - supported
        - unsupported
        - conditional
        - unknown
    ProviderModalityTransport:
      type: string
      description: How a supported modality is supplied or returned.
      enum:
        - inline
        - file_path
        - acp_resource
        - tool_mediated
        - none
    ProviderTool:
      type: object
      additionalProperties: false
      description: One named provider tool fact used for execution planning.
      required:
        - name
        - support
        - description
      oneOf:
        - type: object
          required:
            - condition
          properties:
            support:
              type: string
              enum:
                - conditional
            condition:
              type: string
              minLength: 1
              maxLength: 512
        - type: object
          properties:
            support:
              type: string
              enum:
                - supported
                - unsupported
                - unknown
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9._-]*$
          description: Stable provider-neutral tool name.
        support:
          $ref: '#/components/schemas/ProviderToolSupport'
        description:
          type: string
          minLength: 1
          maxLength: 256
          description: Bounded explanation of the tool fact.
        condition:
          type: string
          minLength: 1
          maxLength: 512
          description: Bounded operator-visible condition required when tool support is conditional.
        evidenceRefs:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          description: Stable IDs of evidence records qualifying this tool fact.
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[a-z][a-z0-9._-]*$
        availability:
          $ref: '#/components/schemas/ProviderToolAvailability'
        defaultEnabled:
          type: boolean
          nullable: true
          description: Whether the tool is enabled by default; null means the default is unknown or operator-defined.
        outputModalities:
          type: array
          maxItems: 16
          uniqueItems: true
          description: Tool-produced modalities, kept separate from direct model output modalities.
          items:
            $ref: '#/components/schemas/ProviderToolOutputModality'
    ProviderToolSupport:
      type: string
      description: Evidence state for a named provider tool fact.
      enum:
        - supported
        - unsupported
        - conditional
        - unknown
    ProviderToolAvailability:
      type: string
      description: How a named tool becomes available to the provider harness.
      enum:
        - built_in
        - optional
        - operator_configured
        - external
        - unknown
    ProviderToolOutputModality:
      type: object
      additionalProperties: false
      description: A modality produced by a tool, explicitly separate from direct model output.
      required:
        - modality
        - support
        - transport
      oneOf:
        - type: object
          required:
            - condition
          properties:
            support:
              type: string
              enum:
                - conditional
            condition:
              type: string
              minLength: 1
              maxLength: 512
        - type: object
          properties:
            support:
              type: string
              enum:
                - supported
                - unsupported
                - unknown
      properties:
        modality:
          $ref: '#/components/schemas/ProviderModalityKind'
        support:
          $ref: '#/components/schemas/ProviderCapabilitySupport'
        transport:
          $ref: '#/components/schemas/ProviderModalityTransport'
        condition:
          type: string
          minLength: 1
          maxLength: 512
          description: Bounded operator-visible condition required when support is conditional.
        mediaConstraints:
          $ref: '#/components/schemas/ProviderMediaConstraints'
        evidenceRefs:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          description: Stable IDs of evidence records qualifying this tool output fact.
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[a-z][a-z0-9._-]*$
    ProviderKnownLimit:
      type: object
      additionalProperties: false
      description: Named bounded provider constraint or documented behavior.
      required:
        - name
        - kind
        - unit
        - description
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9._-]*$
          description: Stable machine-readable limit name.
        kind:
          $ref: '#/components/schemas/ProviderKnownLimitKind'
        unit:
          type: string
          minLength: 1
          maxLength: 64
          description: Unit or flag domain for the value.
        description:
          type: string
          minLength: 1
          maxLength: 512
          description: Bounded operator-facing explanation of the limit.
        maximum:
          type: integer
          format: int64
          minimum: 1
          description: Positive numeric maximum when kind is maximum.
        default:
          type: integer
          format: int64
          minimum: 1
          description: Positive numeric default when kind is default.
        value:
          type: string
          minLength: 1
          maxLength: 256
          description: Bounded non-numeric behavior value when kind is behavior.
    ProviderKnownLimitKind:
      type: string
      description: Meaning of the value recorded by one named provider limit fact.
      enum:
        - maximum
        - default
        - behavior
    ProviderDeprecation:
      type: object
      additionalProperties: false
      description: Coherent metadata for a deprecated provider entry. Presence of this object means the provider is deprecated. replacementProviderId, when present, must name a different canonical provider in the same catalog; it cannot identify the deprecated provider itself.
      required:
        - deprecatedSince
        - reason
      properties:
        deprecatedSince:
          type: string
          format: date
          description: UTC calendar date on which the catalog began marking the provider deprecated.
        reason:
          allOf:
            - $ref: '#/components/schemas/NameValue'
          description: Localizable explanation of why the provider is deprecated.
        replacementProviderId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*$
          description: Canonical ID of a different, non-deprecated replacement provider in this catalog.
    WorkerModelLocality:
      type: string
      description: Provider locality for a model worker capability declaration.
      enum:
        - LOCAL
        - CLOUD
    WorkerProvider:
      type: string
      description: Worker execution mechanism. Canonical values are ACP and SCRIPT_WRAP; extensible lowercase identities remain accepted for compatibility with existing factories.
      minLength: 1
      maxLength: 128
      pattern: ^(?:ACP|SCRIPT_WRAP|\$\{[A-Za-z0-9_.-]+\}|[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*)$
    ModelOperation:
      type: object
      additionalProperties: true
      required:
        - name
      description: One provider-agnostic operation exposed by a model worker, such as `TTS`.
      properties:
        name:
          $ref: '#/components/schemas/ModelOperationName'
        inputs:
          type: array
          description: Named operation input slots this worker can consume.
          items:
            $ref: '#/components/schemas/ModelOperationSlot'
        outputs:
          type: array
          description: Named operation output slots this worker can produce.
          items:
            $ref: '#/components/schemas/ModelOperationSlot'
    ModelOperationSlot:
      type: object
      additionalProperties: true
      required:
        - name
        - contentTypes
      description: One named capability slot declared by a model operation.
      properties:
        name:
          type: string
          description: Stable slot name used by workstation-side bindings and diagnostics.
        contentTypes:
          type: array
          minItems: 1
          description: Uppercase content types accepted or produced by this slot.
          items:
            $ref: '#/components/schemas/ModelOperationContentType'
        required:
          type: boolean
          description: Whether this input slot must be resolved before invocation starts. Output slots omit this field when not needed.
    ModelOperationContentType:
      type: string
      description: Uppercase content-part categories supported by worker model-operation capability slots.
      enum:
        - TEXT
        - IMAGE
        - AUDIO
        - JSON
        - BINARY
    RunnerID:
      type: string
      description: Stable built-in runner identifiers supported by factory and workstation runner selection.
      enum:
        - codex
        - claude
        - antigravity
    RunnerSelectionSource:
      type: string
      description: Configuration layer that supplied the resolved built-in runner selection for a dispatch.
      enum:
        - workstation
        - factory
        - legacy_provider
        - default
      x-enum-descriptions:
        - Workstation-level runner override resolved the dispatch target.
        - Factory-level default runner resolved the dispatch target.
        - Worker modelProvider compatibility resolved the dispatch target when no explicit runner override is set.
        - The documented default Codex runner resolved the dispatch target.
    Workstation:
      description: A processing step in the factory graph. Workstations consume authored work states, run a worker or logical move, and emit the next work states.
      type: object
      additionalProperties: true
      not:
        required:
          - join
      required:
        - name
        - inputs
      properties:
        id:
          type: string
          description: Optional durable public identifier for this workstation. Graph and layout references should use this id instead of the mutable name.
        name:
          type: string
          description: Customer-authored workstation name used by guards, diagnostics, and authored references.
        description:
          allOf:
            - $ref: '#/components/schemas/NameValue'
          description: Optional localized customer-facing explanation of this workstation.
        behavior:
          allOf:
            - $ref: '#/components/schemas/WorkstationKind'
          description: Scheduling behavior for this workstation, such as STANDARD, REPEATER, or CRON execution.
        type:
          allOf:
            - $ref: '#/components/schemas/WorkstationType'
          description: Runtime workstation implementation type, equivalent to the workstation AGENTS.md frontmatter type.
        operation:
          allOf:
            - $ref: '#/components/schemas/ModelOperationName'
          description: Uppercase provider-agnostic operation requested by `MODEL_INVOKE` workstations, such as `TTS`.
        operationBindings:
          type: array
          description: Optional workstation-authored slot bindings that resolve operation inputs from runtime content or static config content.
          items:
            $ref: '#/components/schemas/WorkstationOperationBinding'
        worker:
          type: string
          description: Name of a worker declared in the workers list. Omit this field for HUMAN_APPROVAL workstations.
        runner:
          allOf:
            - $ref: '#/components/schemas/RunnerID'
          description: Optional workstation-specific runner override. When omitted, dispatch falls back to the factory runner, then worker modelProvider compatibility when no explicit runner is configured, then the default codex runner.
        promptFile:
          type: string
          description: Path to a prompt template file loaded for model-oriented workstation execution.
        outputSchema:
          type: string
          description: JSON schema string used to validate or parse structured model output when configured.
        outputContract:
          type: string
          description: Provider-neutral semantic contract applied to a successful workstation response after provider execution.
        outcomeFormat:
          allOf:
            - $ref: '#/components/schemas/WorkstationOutcomeFormat'
          description: Optional worker-output parsing mode for model workstations. When set to `decision-envelope`, agent output is parsed as a reviewer/checker JSON envelope that maps directly onto WorkResult outcome, feedback, output, and optional recorded output work instead of stop-token routing.
        limits:
          allOf:
            - $ref: '#/components/schemas/WorkstationLimits'
          description: Retry and execution ceilings applied to this workstation.
        workPropagation:
          allOf:
            - $ref: '#/components/schemas/WorkPropagation'
          description: Optional policy for whether downstream work uses the workstation output payload or preserves the consumed input payload.
        body:
          type: string
          description: Inline workstation instructions or script body when authored directly in factory config.
        cron:
          allOf:
            - $ref: '#/components/schemas/WorkstationCron'
          description: Cron trigger configuration for workstations whose behavior is CRON.
        inputs:
          type: array
          description: Work states this workstation can consume before it dispatches.
          items:
            $ref: '#/components/schemas/WorkstationIO'
        outputs:
          type: array
          description: Work states emitted after a non-classifier workstation succeeds. Classifier workstations must use classificationRoutes instead of normal success outputs.
          items:
            $ref: '#/components/schemas/WorkstationIO'
        classificationRoutes:
          type: array
          description: Explicit label-to-destination routing used only by CLASSIFIER_WORKSTATION definitions. Each route must declare a unique non-empty label and one or more outputs.
          items:
            $ref: '#/components/schemas/ClassificationRoute'
        onContinue:
          type: array
          description: Optional destination emitted when the workstation makes partial progress and should continue iterating. Classifier workstations must not declare onContinue.
          items:
            $ref: '#/components/schemas/WorkstationIO'
        onRejection:
          type: array
          description: Optional destination emitted when the worker rejects the current work without a hard failure. Classifier workstations must not declare onRejection.
          items:
            $ref: '#/components/schemas/WorkstationIO'
        onFailure:
          type: array
          description: Optional destination emitted when the workstation fails permanently.
          items:
            $ref: '#/components/schemas/WorkstationIO'
        expectedArtifacts:
          type: array
          description: Expected output declarations added by this workstation to its applicable work type contract.
          items:
            $ref: '#/components/schemas/ExpectedArtifact'
        resources:
          type: array
          description: Resource capacity this workstation consumes while one dispatch is in flight.
          items:
            $ref: '#/components/schemas/ResourceRequirement'
        copyReferencedScripts:
          type: boolean
          description: Copy supported referenced script files into the expanded workstation layout when config expand runs.
        guards:
          type: array
          description: Guarded loop breakers should use `VISIT_COUNT` guards here with a `LOGICAL_MOVE` workstation instead of top-level exhaustion rules.
          items:
            $ref: '#/components/schemas/WorkstationGuard'
        stopWords:
          type: array
          description: Stop words authored on the topology entry for model-oriented dispatches.
          items:
            type: string
        workingDirectory:
          type: string
          description: Go template resolved from token tags at dispatch time.
        worktree:
          type: string
          description: Go template resolved and passed as the worktree path to CLI dispatchers.
        env:
          allOf:
            - $ref: '#/components/schemas/StringMap'
          description: Environment variables added to the workstation execution context.
    WorkstationOutcomeFormat:
      type: string
      description: Optional worker-output parsing mode for model workstations. When set to `decision-envelope`, agent output is parsed as a reviewer/checker JSON envelope that maps directly onto WorkResult outcome, feedback, output, and optional recorded output work instead of stop-token routing.
      enum:
        - decision-envelope
    ClassificationRoute:
      type: object
      additionalProperties: true
      required:
        - label
        - outputs
      properties:
        label:
          type: string
          description: Case-sensitive classifier label that must match the trimmed classifier output exactly.
        outputs:
          type: array
          description: One or more authored destinations emitted when this classifier label is selected.
          items:
            $ref: '#/components/schemas/WorkstationIO'
    WorkstationLimits:
      type: object
      description: Retry and execution ceilings applied to one workstation definition.
      additionalProperties: true
      properties:
        maxRetries:
          type: integer
          description: Maximum number of retry attempts after a failed dispatch before the workstation gives up.
        maxExecutionTime:
          type: string
          description: Go duration limit for one dispatch attempt before it times out.
        maxGeneratedWorkItems:
          type: integer
          minimum: 1
          description: Fixed maximum number of Work items one accepted worker-emitted FACTORY_REQUEST_BATCH may contain.
        maxGeneratedWorkItemsArgument:
          type: string
          description: Optional invocation argument whose positive integer value tightens the fixed generated-Work ceiling.
        maxGeneratedWorkItemsArgumentOffset:
          type: integer
          minimum: 0
          description: Offset added to the invocation argument before applying the generated-Work ceiling.
    WorkstationKind:
      type: string
      default: STANDARD
      description: Scheduling kind for a workstation, which determines how the engine schedules and dispatches work to it. Standard workstations are scheduled as soon as their inputs are ready, and can have multiple work items in-flight at the same time.  Repeater workstations are triggered whenever their inputs change, and will reloop the outputs on rejection back to the initial place. Cron workstations create internal time work and dispatch their configured worker when time and input guards are satisfied. Poller workstations bind a poller-capable worker that the service runtime supervises as a long-lived ingress loop.
      enum:
        - STANDARD
        - REPEATER
        - CRON
        - POLLER
    WorkstationType:
      type: string
      description: Runtime workstation implementation types supported by the public factory-config contract.
      enum:
        - INFERENCE_RUN
        - AGENT_RUN
        - SCRIPT_RUN
        - POLLER_RUN
        - MODEL_WORKSTATION
        - MODEL_INVOKE
        - LOGICAL_MOVE
        - CLASSIFIER_WORKSTATION
        - HUMAN_APPROVAL
    WorkstationCron:
      type: object
      description: Trigger timing for scheduled workstations. Provide exactly one of a five-field cron schedule or a positive duration in every; Factory validation enforces the exclusive choice.
      additionalProperties: true
      properties:
        schedule:
          type: string
          description: Standard five-field cron expression used to produce internal time work while the factory service is running.
        every:
          type: string
          description: Positive Go duration interval, such as 30s, 5m, 1h, or 1h30m, used instead of schedule.
        triggerAtStart:
          type: boolean
          default: false
          description: When true, service startup submits one immediate internal time work item before waiting for the next scheduled cron fire.
        jitter:
          type: string
          description: Non-negative Go duration used as the maximum deterministic delay added to scheduled time tokens. Defaults to "0s".
        expiryWindow:
          type: string
          description: Positive Go duration after due_at before a stale cron time token expires and can be consumed by the system expiry transition. Defaults to the duration until the next scheduled cron fire when omitted.
    WorkPropagation:
      type: object
      additionalProperties: false
      required:
        - mode
      description: Optional workstation policy for how downstream work receives payload content after this workstation completes. When omitted, downstream work uses the workstation output payload.
      properties:
        mode:
          allOf:
            - $ref: '#/components/schemas/WorkPropagationMode'
          description: Propagation mode for downstream work payload selection after this workstation succeeds.
    WorkPropagationMode:
      type: string
      description: Work payload propagation mode for a workstation. OUTPUT_AS_PAYLOAD uses the workstation output as the downstream work payload. PRESERVE_INPUT keeps the consumed input payload for downstream work instead of replacing it with the workstation output.
      enum:
        - OUTPUT_AS_PAYLOAD
        - PRESERVE_INPUT
    GuardType:
      type: string
      description: Guard condition attached to a workstation or one of its specific inputs.
      enum:
        - VISIT_COUNT
        - MATCHES_FIELDS
        - ALL_CHILDREN_COMPLETE
        - ANY_CHILD_FAILED
        - SAME_NAME
        - SAME_TRACE_ID
    Guard:
      type: object
      description: Shared guard attached either to a workstation as a whole or to one specific workstation input.
      additionalProperties: false
      required:
        - type
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/GuardType'
          description: Guard condition to evaluate for this workstation-level or input-level attachment.
        workstation:
          type: string
          description: For `VISIT_COUNT` guards, the workstation whose visits are counted.
        maxVisits:
          type: integer
          minimum: 1
          description: For `VISIT_COUNT` guards, the fixed visit ceiling.
        maxVisitsArgument:
          type: string
          description: Optional invocation argument whose positive integer value tightens the fixed visit ceiling.
        matchConfig:
          allOf:
            - $ref: '#/components/schemas/GuardMatchConfig'
          description: For `MATCHES_FIELDS` guards, the field-selector configuration used to compare candidate inputs.
        parentInput:
          type: string
          description: For parent-aware input guards, the parent workType name from another input in the same workstation.
        matchInput:
          type: string
          description: For `SAME_NAME` and `SAME_TRACE_ID` input guards, the peer input workType name from another input in the same workstation.
        spawnedBy:
          type: string
          description: For dynamic fanout input guards, the workstation that spawns the children for count tracking.
    GuardMatchConfig:
      type: object
      additionalProperties: false
      required:
        - inputKey
      properties:
        inputKey:
          type: string
          minLength: 1
          description: Field selector resolved against each candidate input, such as `.Name` or `.Tags["_last_output"]`.
    WorkstationIO:
      type: object
      description: One authored work-state reference consumed or emitted by a workstation.
      additionalProperties: true
      required:
        - workType
        - state
      properties:
        workType:
          type: string
          description: Name of the work type consumed or emitted at this edge of the workstation.
        state:
          type: string
          description: Name of the work state consumed or emitted for the referenced work type.
        guards:
          type: array
          description: Per-input guards that must pass before this specific input can be used.
          items:
            $ref: '#/components/schemas/InputGuard'
    Transition:
      type: object
      additionalProperties: false
      required:
        - from
        - to
      properties:
        from:
          type: string
          description: Source workstation name.
        to:
          type: string
          description: Destination workstation name.
    PromptTemplateContract:
      type: object
      additionalProperties: false
      required:
        - availableVariables
        - inputCount
        - unavailableAccessPatterns
      properties:
        availableVariables:
          type: array
          description: Available prompt-template variables for the selected workstation editing context.
          items:
            $ref: '#/components/schemas/PromptTemplateVariableReference'
        inputCount:
          type: integer
          minimum: 0
          description: Number of authored inputs on the selected workstation, which controls valid `.Inputs[N]` access.
        unavailableAccessPatterns:
          type: array
          description: Unsupported or unavailable variable access patterns for the selected workstation editing context.
          items:
            $ref: '#/components/schemas/PromptTemplateUnavailableAccessPattern'
    PromptTemplateVariableReference:
      type: object
      additionalProperties: false
      required:
        - category
        - description
        - example
        - path
      properties:
        category:
          type: string
          enum:
            - ROOT
            - INPUT
            - HISTORY
            - CONTEXT
            - MAP_ACCESS
            - DOC
          description: High-level grouping for the variable reference.
        description:
          type: string
          description: User-readable description of what the variable resolves to.
        example:
          type: string
          description: Go template snippet that shows how to reference the variable.
        path:
          type: string
          description: Canonical variable path summary used in diagnostics and help surfaces.
    PromptTemplateUnavailableAccessPattern:
      type: object
      additionalProperties: false
      required:
        - example
        - path
        - reason
      properties:
        example:
          type: string
          description: Representative unsupported template snippet for this access pattern.
        path:
          type: string
          description: Unsupported or unavailable variable path pattern.
        reason:
          type: string
          description: Why the access pattern is unavailable or unsupported in the selected workstation context.
    PromptTemplateValidationRequest:
      type: object
      additionalProperties: false
      required:
        - prompt
      properties:
        prompt:
          type: string
          description: Prompt draft to validate against the selected current-factory workstation contract.
    PromptTemplateValidationResult:
      type: object
      additionalProperties: false
      required:
        - diagnostics
        - valid
      properties:
        diagnostics:
          type: array
          description: Typed validation diagnostics for the submitted prompt draft.
          items:
            $ref: '#/components/schemas/PromptTemplateDiagnostic'
        valid:
          type: boolean
          description: True when the prompt contains no syntax or variable diagnostics.
    PromptTemplateDiagnostic:
      type: object
      additionalProperties: false
      required:
        - endOffset
        - kind
        - message
        - path
        - sourceText
        - startOffset
      properties:
        endOffset:
          type: integer
          description: Inclusive 1-based byte offset where the diagnostic source span ends when available.
        kind:
          type: string
          enum:
            - SYNTAX_ERROR
            - INVALID_VARIABLE
            - UNAVAILABLE_VARIABLE
          description: Diagnostic classification for prompt-template validation.
        message:
          type: string
          description: User-readable explanation of the validation failure.
        path:
          type: string
          description: Canonical variable path or access pattern involved in the diagnostic when available.
        sourceText:
          type: string
          description: Source variable or access expression that triggered the diagnostic when available.
        startOffset:
          type: integer
          description: Inclusive 1-based byte offset where the diagnostic source span starts when available.
    WorkflowDiagnostic:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable workflow diagnostic code.
        message:
          type: string
          description: Customer-readable diagnostic message.
        path:
          type: string
          description: Optional source or config path for the diagnostic.
        line:
          type: integer
          description: Optional 1-based source line number.
        column:
          type: integer
          description: Optional 1-based source column number.
    WorkflowArtifactRootDecision:
      type: object
      additionalProperties: false
      required:
        - requested
        - allowed
      properties:
        requested:
          type: string
          description: Artifact root requested with the workflow source.
        effective:
          type: string
          description: Normalized artifact root when allowed.
        allowed:
          type: boolean
          description: True when the artifact root satisfies policy checks.
        diagnostic:
          $ref: '#/components/schemas/WorkflowDiagnostic'
          description: Diagnostic explaining artifact-root rejection when present.
    WorkflowSourceResolution:
      type: object
      additionalProperties: false
      required:
        - requestKind
        - found
      properties:
        requestKind:
          type: string
          description: Requested workflow source kind.
        requestValue:
          type: string
          description: Original requested workflow source value.
        resolvedKind:
          type: string
          description: Resolved workflow source kind.
        lookupStage:
          type: string
          description: Ordered lookup stage that supplied the resolved source.
        sourceRef:
          type: string
          description: Safe resolved workflow source reference.
        sourceHash:
          type: string
          description: Stable hash of the authored workflow source.
        orchestratorKind:
          type: string
          description: Resolved orchestrator kind for the workflow source.
        dialect:
          type: string
          description: Resolved workflow dialect label.
        found:
          type: boolean
          description: True when a workflow source was resolved.
        diagnostics:
          type: array
          description: Lookup or conflict diagnostics when source resolution fails or conflicts.
          items:
            $ref: '#/components/schemas/WorkflowDiagnostic'
        artifactRoot:
          $ref: '#/components/schemas/WorkflowArtifactRootDecision'
    WorkflowResultConstraints:
      type: object
      additionalProperties: false
      required:
        - requiresStructuredCloneableJson
        - artifactUriScheme
        - maxEmbeddedBytes
        - rejectedValueKinds
      properties:
        requiresStructuredCloneableJson:
          type: boolean
          description: True when workflow return values must be structured-cloneable JSON-compatible values.
        artifactUriScheme:
          type: string
          description: URI scheme used for session-scoped artifact references.
        maxEmbeddedBytes:
          type: integer
          format: int64
          description: Maximum embedded JSON payload size before artifact refs are required.
        rejectedValueKinds:
          type: array
          description: Non-JSON workflow result kinds rejected by the shared contract.
          items:
            type: string
    WorkflowPolicyPreview:
      type: object
      additionalProperties: false
      required:
        - effectivePolicy
        - policyHash
        - maxChildCount
        - maxConcurrency
        - validationIssues
      properties:
        effectivePolicy:
          type: object
          additionalProperties: true
          description: Effective bounded workflow policy for preview or session start.
        policyHash:
          type: string
          description: Stable hash of the effective policy document.
        maxChildCount:
          type: integer
          description: Maximum child agent count allowed by effective policy.
        maxConcurrency:
          type: integer
          description: Maximum concurrent child dispatches allowed by effective policy.
        validationIssues:
          type: array
          description: Policy validation issues for the requested or factory default policy.
          items:
            $ref: '#/components/schemas/WorkflowDiagnostic'
        runnerDecision:
          type: object
          additionalProperties: true
          description: Optional runner allowlist decision for preview surfaces.
        modelDecision:
          type: object
          additionalProperties: true
          description: Optional model allowlist decision for preview surfaces.
        profileDecision:
          type: object
          additionalProperties: true
          description: Optional route profile allowlist decision for preview surfaces.
        timeoutDecisions:
          type: object
          additionalProperties: true
          description: Timeout and budget decisions for preview surfaces.
        budgetDecisions:
          type: object
          additionalProperties: true
          description: Child and concurrency budget decisions for preview surfaces.
    FactoryPreviewRequest:
      type: object
      additionalProperties: false
      required:
        - sourceKind
      properties:
        sourceKind:
          type: string
          description: JavaScript orchestrator factory source request kind for Factory preview.
          enum:
            - FACTORY_ID
            - FACTORY_INLINE
            - WORKFLOW_FILE
            - WORKFLOW_NAME
            - INLINE_WORKFLOW
        sourceValue:
          type: string
          description: Requested workflow name, file ref, factory id, or inline label.
        inlineSource:
          type: string
          description: Inline orchestrator source text for INLINE_WORKFLOW or FACTORY_INLINE requests.
        artifactRoot:
          type: string
          description: Optional absolute artifact root requested with the factory source.
        allowFactoryLookup:
          type: boolean
          description: When true, explicit factory lookup is attempted after ordered workflow lookup.
        projectRoot:
          type: string
          description: Project root used for ordered JavaScript orchestrator source lookup.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Optional JavaScript orchestrator metadata to validate with the source.
        argsSchema:
          type: object
          additionalProperties: true
          description: Optional JSON Schema object describing factory session invocation arguments.
        defaultPolicy:
          type: object
          additionalProperties: true
          description: Optional factory default policy layer merged into the effective policy preview.
        requestedPolicy:
          type: object
          additionalProperties: true
          description: Optional request policy overrides merged into the effective policy preview.
        requestedRunner:
          type: string
          description: Optional runner requested for preview decision projection.
        requestedModel:
          type: string
          description: Optional model requested for preview decision projection.
        requestedProfile:
          type: string
          description: Optional route profile requested for preview decision projection.
        timeoutMillis:
          type: integer
          format: int64
          description: Optional requested timeout in milliseconds for preview decision projection.
    FactoryPreviewResult:
      type: object
      additionalProperties: false
      required:
        - valid
        - sourceResolution
        - sourceValidationIssues
        - policyPreview
        - resultConstraints
      properties:
        valid:
          type: boolean
          description: True when source resolution, validation, policy, and artifact-root checks pass for Factory preview.
        sourceResolution:
          $ref: '#/components/schemas/WorkflowSourceResolution'
        sourceValidationIssues:
          type: array
          description: JavaScript orchestrator source, loader, and validation diagnostics.
          items:
            $ref: '#/components/schemas/WorkflowDiagnostic'
        policyPreview:
          $ref: '#/components/schemas/WorkflowPolicyPreview'
        resultConstraints:
          $ref: '#/components/schemas/WorkflowResultConstraints'
    FactoryValidationSeverity:
      type: string
      description: Validation severity for one factory validation target.
      x-enum-varnames:
        - FactoryValidationSeverityError
        - FactoryValidationSeverityWarning
        - FactoryValidationSeverityHint
      enum:
        - error
        - warning
        - hint
    FactoryValidationSubjectType:
      type: string
      description: Factory-domain component type referenced by one validation target subject.
      x-enum-varnames:
        - FactoryValidationSubjectTypeFactory
        - FactoryValidationSubjectTypeWorkstation
        - FactoryValidationSubjectTypeWorkType
        - FactoryValidationSubjectTypeWorkState
        - FactoryValidationSubjectTypeWorker
        - FactoryValidationSubjectTypeResource
        - FactoryValidationSubjectTypeRoute
      enum:
        - FACTORY
        - WORKSTATION
        - WORK_TYPE
        - WORK_STATE
        - WORKER
        - RESOURCE
        - ROUTE
    FactoryValidationSubjectLocation:
      type: string
      description: Factory-domain location within the subject component referenced by one validation target.
      x-enum-varnames:
        - FactoryValidationSubjectLocationOnRejection
        - FactoryValidationSubjectLocationOnFailure
        - FactoryValidationSubjectLocationOutputs
        - FactoryValidationSubjectLocationInputs
        - FactoryValidationSubjectLocationStates
        - FactoryValidationSubjectLocationTerminal
        - FactoryValidationSubjectLocationReference
        - FactoryValidationSubjectLocationDefinition
      enum:
        - ON_REJECTION
        - ON_FAILURE
        - OUTPUTS
        - INPUTS
        - STATES
        - TERMINAL
        - REFERENCE
        - DEFINITION
    FactoryValidationSubject:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - location
      properties:
        type:
          $ref: '#/components/schemas/FactoryValidationSubjectType'
        id:
          type: string
          description: Stable component identifier or name for the affected factory component.
        location:
          $ref: '#/components/schemas/FactoryValidationSubjectLocation'
    FactoryValidationTarget:
      type: object
      additionalProperties: false
      required:
        - code
        - severity
        - message
        - subject
      properties:
        code:
          type: string
          description: Stable machine-readable validation rule identifier.
        severity:
          $ref: '#/components/schemas/FactoryValidationSeverity'
        message:
          type: string
          description: Human-readable explanation suitable for dialogs and summaries.
        subject:
          $ref: '#/components/schemas/FactoryValidationSubject'
        path:
          type: string
          description: Canonical Factory definition path for the affected value when one is available.
    FactoryValidationResult:
      type: object
      additionalProperties: false
      required:
        - targets
      properties:
        targets:
          type: array
          description: Canonical validation targets for the submitted factory definition.
          items:
            $ref: '#/components/schemas/FactoryValidationTarget'
      example:
        targets:
          - code: factory.workstation.missingRejectionRoute
            severity: error
            message: Workstation repeater must define a reject route.
            subject:
              type: WORKSTATION
              id: repeater
              location: ON_REJECTION
          - code: factory.workType.missingCompletionState
            severity: error
            message: Work type task must declare a completion state.
            subject:
              type: WORK_TYPE
              id: task
              location: STATES
    GlobalConfig:
      type: object
      additionalProperties: true
      description: Shared operator configuration stored in .you-agent-factory/config.json.
      properties:
        backendScopeID:
          type: string
          description: Stable identifier for the local provider-backed runtime boundary.
        defaults:
          $ref: '#/components/schemas/GlobalConfigDefaults'
        priceTable:
          $ref: '#/components/schemas/GlobalConfigPriceTable'
        runtime:
          $ref: '#/components/schemas/GlobalConfigRuntime'
        models:
          $ref: '#/components/schemas/GlobalConfigModels'
        workers:
          $ref: '#/components/schemas/GlobalConfigWorkers'
        workerPresets:
          type: array
          description: Named worker model presets loaded from the shared configuration file.
          items:
            $ref: '#/components/schemas/GlobalConfigWorkerPreset'
    GlobalConfigDefaults:
      type: object
      additionalProperties: true
      description: Operator defaults that participate independently in file, environment, and flag precedence.
      properties:
        workerModelProvider:
          type: string
          description: Default worker model provider, including supported aliases and symbolic DEFAULT resolution.
        workerModel:
          type: string
          description: Default worker model name.
    GlobalConfigPriceTable:
      type: object
      additionalProperties: true
      description: Operator-authored USD rates per one million tokens. Omit this property to use an empty table; no provider or model prices are supplied by default.
      required:
        - currency
        - models
      properties:
        currency:
          type: string
          enum:
            - USD
          description: Currency used by every configured rate. This contract supports USD only.
        models:
          type: array
          description: Deterministic provider/model price entries.
          items:
            $ref: '#/components/schemas/GlobalConfigPriceTableModel'
    GlobalConfigPriceTableModel:
      type: object
      additionalProperties: true
      description: Exact operator-authored rates for one provider and model identity.
      required:
        - provider
        - model
        - inputPerMillionTokens
        - outputPerMillionTokens
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 128
          description: Canonical provider identity or a supported built-in alias; the Operator Settings decoder trims and canonicalizes this value.
        model:
          type: string
          minLength: 1
          description: Exact model identifier. It is trimmed but never guessed or aliased.
        inputPerMillionTokens:
          type: string
          pattern: ^[0-9]+(?:\.[0-9]+)?$
          description: Non-negative USD rate per one million uncached input tokens.
        outputPerMillionTokens:
          type: string
          pattern: ^[0-9]+(?:\.[0-9]+)?$
          description: Non-negative USD rate per one million non-reasoning output tokens.
        cachedInputPerMillionTokens:
          type: string
          pattern: ^[0-9]+(?:\.[0-9]+)?$
          description: Optional non-negative USD rate per one million cached input tokens.
        reasoningOutputPerMillionTokens:
          type: string
          pattern: ^[0-9]+(?:\.[0-9]+)?$
          description: Optional non-negative USD rate per one million reasoning output tokens.
    GlobalConfigRuntime:
      type: object
      additionalProperties: true
      description: Runtime observability settings loaded from operator configuration before command-line overrides.
      properties:
        logging:
          allOf:
            - $ref: '#/components/schemas/GlobalConfigRuntimeArtifactSettings'
          description: Structured runtime log storage settings. Omitted values use the documented production defaults.
        metrics:
          allOf:
            - $ref: '#/components/schemas/GlobalConfigRuntimeArtifactSettings'
          description: Runtime metrics storage settings. Omitted values use the documented production defaults.
    GlobalConfigRuntimeArtifactSettings:
      type: object
      additionalProperties: true
      description: Rolling-file storage settings for one runtime observability artifact.
      properties:
        directory:
          type: string
          minLength: 1
          description: Optional artifact root. Omission uses the runtime-owned directory below the operator home.
        maxSizeMB:
          type: integer
          minimum: 1
          default: 100
          description: Maximum artifact file size in megabytes before rotation.
        maxBackups:
          type: integer
          minimum: 1
          default: 20
          description: Maximum number of rotated artifact files to retain.
        maxAgeDays:
          type: integer
          minimum: 1
          default: 30
          description: Maximum age in days for rotated artifact files.
        compress:
          type: boolean
          default: false
          description: Whether rotated artifact files are gzip-compressed.
    GlobalConfigModels:
      type: object
      description: Optional operator model overlays keyed by model name. A model entry may override one or more built-in fields or fully describe a new model name.
      additionalProperties:
        $ref: '#/components/schemas/GlobalConfigModel'
    GlobalConfigModel:
      type: object
      additionalProperties: true
      description: Optional operator overlay for one model. Omitted fields preserve a built-in definition; new model names must provide every field.
      properties:
        source:
          type: string
          minLength: 1
          description: Model source path or provider-neutral source URI.
        backend:
          type: string
          minLength: 1
          description: Provider-neutral backend identity selected for this model.
        loadPolicy:
          $ref: '#/components/schemas/GlobalConfigModelLoadPolicy'
        operations:
          type: array
          minItems: 1
          description: Ordered generic operation names supported by this model.
          items:
            $ref: '#/components/schemas/GlobalConfigModelOperation'
    GlobalConfigModelLoadPolicy:
      type: string
      description: Operator model load policy. Runtime activation is owned by Models.
      enum:
        - ON_DEMAND
    GlobalConfigModelOperation:
      type: string
      description: Generic provider-neutral operation contract name.
      enum:
        - OMNI
        - EMBED
        - TTS
        - ASR
    GlobalConfigWorkerPreset:
      type: object
      additionalProperties: true
      description: Named worker model selection available to Factory Session runtime opening.
      required:
        - id
        - modelProvider
      properties:
        id:
          type: string
          minLength: 1
          pattern: ".*[^\t-\r \N\_  - \L\P  　].*"
          description: Non-empty preset identifier after surrounding whitespace is trimmed.
        modelProvider:
          $ref: '#/components/schemas/GlobalConfigWorkerPresetModelProvider'
        model:
          type: string
          description: Optional model name, trimmed when present.
        reasoningEffort:
          $ref: '#/components/schemas/GlobalConfigWorkerPresetReasoningEffort'
    GlobalConfigWorkerPresetModelProvider:
      type: string
      description: Canonical provider identity or built-in compatibility alias; surrounding whitespace is trimmed, and symbolic DEFAULT is not accepted for presets.
      pattern: "^[\t-\r \N\_  - \L\P  　]*(?:[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*|ANTIGRAVITY|ANTHROPIC|CLAUDE|CODEX|OPENAI)[\t-\r \N\_  - \L\P  　]*$"
    GlobalConfigWorkerPresetReasoningEffort:
      type: string
      description: Optional reasoning effort; surrounding whitespace and letter case are normalized, and an empty value is treated as unspecified.
      pattern: "^[\t-\r \N\_  - \L\P  　]*(?:[mM][iI][nN][iI][mM][aA][lL]|[lL][oO][wW]|[mM][eE][dD][iI][uU][mM]|[hH][iI][gG][hH]|[xX][hH][iI][gG][hH]|[mM][aA][xX])?[\t-\r \N\_  - \L\P  　]*$"
    WorkRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - type
      properties:
        requestId:
          type: string
          description: Stable client-provided request identifier used for idempotent batch submission.
        currentChainingTraceId:
          type: string
          description: Optional default chaining-trace identifier applied to submitted work items that omit it.
        type:
          $ref: '#/components/schemas/WorkRequestType'
        works:
          type: array
          description: A batch of work items to be submitted together. Each Work payload uses the compact UTF-8 JSON byte limit documented by the Work schema; a batch is rejected atomically when any Work exceeds 65,536 bytes.
          items:
            $ref: '#/components/schemas/Work'
        relations:
          type: array
          description: Relationships between submitted or already-boarded work items.
          items:
            $ref: '#/components/schemas/WorkRequestRelation'
    WorkRequestRelation:
      type: object
      additionalProperties: false
      description: Relationship declared while admitting a Work Request. A target may be identified by its exact board name, stable Work ID, or both. When both are supplied they must resolve to the same Work.
      required:
        - type
        - sourceWorkName
      anyOf:
        - required:
            - targetWorkName
        - required:
            - targetWorkId
      properties:
        type:
          $ref: '#/components/schemas/RelationType'
        sourceWorkName:
          type: string
        targetWorkId:
          type: string
          description: Stable Work ID on the selected Factory Session board.
        targetWorkName:
          type: string
          description: Exact Work name on the selected Factory Session board.
        requiredState:
          type: string
    WorkRequestType:
      description: Kind of work request accepted by the factory.
      type: string
      x-enum-varnames:
        - WorkRequestTypeFactoryRequestBatch
      enum:
        - FACTORY_REQUEST_BATCH
      x-enum-descriptions:
        - Normalized request containing one or more work items and their relationships.
    Work:
      type: object
      description: A piece of work.
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          description: A human readable name for the work, not unique
        confirmationState:
          $ref: '#/components/schemas/ConfirmationState'
          x-go-type-skip-optional-pointer: true
          description: Whether the reported Work state or outcome is covered by completed recording storage.
        workId:
          type: string
          description: Unique identifier for the work
        requestId:
          type: string
          description: Identifier for the original request that created this work, if applicable
        workTypeName:
          type: string
          description: Configured work type name from factory.json for this submitted work item.
        supersededBy:
          type: string
          description: Optional successor Work ID when this terminal or failed same-name Work item has been superseded by a later admission.
        state:
          $ref: '#/components/schemas/WorkState'
          description: Current lifecycle state for this work item when returned by read APIs. Submit requests use the state's name when an explicit initial state is provided.
        chainingTraceDepth:
          type: integer
          minimum: 1
          description: Current chaining depth for this work item when the runtime already knows its upstream lineage.
        currentChainingTraceId:
          type: string
          description: Explicit chaining-trace identifier for this submitted work item.
        previousChainingTraceIds:
          type: array
          description: Explicit predecessor chaining traces that directly caused this work item.
          items:
            type: string
        traceId:
          type: string
          description: Legacy trace identifier retained for compatibility; prefer currentChainingTraceId.
        content:
          $ref: '#/components/schemas/WorkContent'
          description: Optional canonical ordered work content parts for this work item.
        payload:
          description: Opaque work payload forwarded as raw JSON. Each submitted Work payload is limited to 65,536 bytes measured from its compact UTF-8 JSON value; exactly 65,536 bytes is allowed. A batch is rejected atomically with a 400 BAD_REQUEST ErrorResponse when any Work payload exceeds this limit. The reported payloadBytes value is a byte count, not a character count.
        structuredResult:
          description: Optional JSON value produced by a workstation whose outputSchema validated the worker response. JSON null is distinct from an omitted value.
        tags:
          $ref: '#/components/schemas/StringMap'
          description: Key-value pairs for storing arbitrary metadata about the work. Both keys and values are strings.
        relations:
          type: array
          description: Current outbound relationships attached to this listed source work item when returned by read APIs.
          items:
            $ref: '#/components/schemas/Relation'
        expectedArtifacts:
          type: array
          description: Effective expected artifact declarations and their latest recorded verification state.
          items:
            $ref: '#/components/schemas/WorkExpectedArtifact'
        stopSummary:
          $ref: '#/components/schemas/FactoryStopSummary'
          description: Canonical stopped-state summary for existing work inspection reads when this work item explains paused, blocked, needs-human, or interrupted automation.
        humanApproval:
          $ref: '#/components/schemas/HumanApproval'
          description: Pending HUMAN_APPROVAL request currently owning this Work item, when present.
        failureDetail:
          $ref: '#/components/schemas/FailureDetail'
          description: Most recent bounded failure detail when this Work item is currently in a failed state.
    ConfirmationState:
      type: string
      description: Whether the reported state or outcome is covered by completed recording storage.
      enum:
        - CONFIRMED
        - UNCONFIRMED
    WorkRead:
      type: object
      required:
        - confirmationState
      properties:
        confirmationState:
          $ref: '#/components/schemas/ConfirmationState'
      allOf:
        - $ref: '#/components/schemas/Work'
        - type: object
          required:
            - confirmationState
          properties:
            confirmationState:
              $ref: '#/components/schemas/ConfirmationState'
      description: Work returned by a read API. The confirmation state describes only whether the reported Work state or outcome is covered by completed recording storage.
    WorkContent:
      type: array
      description: Ordered canonical content parts for one work item.
      items:
        $ref: '#/components/schemas/WorkContentPart'
    WorkContentPart:
      description: One ordered canonical content part on a work item.
      oneOf:
        - $ref: '#/components/schemas/WorkTextContentPart'
        - $ref: '#/components/schemas/WorkImageContentPart'
        - $ref: '#/components/schemas/WorkAudioContentPart'
        - $ref: '#/components/schemas/WorkJsonContentPart'
        - $ref: '#/components/schemas/WorkBinaryContentPart'
    WorkContentPartType:
      type: string
      description: Supported canonical work content part types. Legacy lowercase text and image values remain accepted for backward compatibility.
      enum:
        - text
        - image
        - TEXT
        - IMAGE
        - AUDIO
        - JSON
        - BINARY
    WorkContentMetadata:
      type: object
      additionalProperties: true
      description: Optional metadata attached to one work content part.
    WorkContentCommonFields:
      type: object
      properties:
        slot:
          type: string
          description: Optional slot name used by model-operation binding selectors and diagnostics.
        label:
          type: string
          description: Optional caller-defined label for slot binding or diagnostics.
        role:
          type: string
          description: Optional semantic role for model-operation authoring.
        contentType:
          type: string
          description: Optional MIME content type for file-backed or structured parts.
        artifactId:
          type: string
          description: Optional artifact identifier for externally materialized content.
        metadata:
          $ref: '#/components/schemas/WorkContentMetadata'
    WorkTextContentPart:
      description: Ordered inline text content for one work item.
      allOf:
        - $ref: '#/components/schemas/WorkContentCommonFields'
        - type: object
          required:
            - type
            - text
          properties:
            type:
              allOf:
                - $ref: '#/components/schemas/WorkContentPartType'
              enum:
                - text
                - TEXT
            text:
              type: string
              description: Inline text content preserved in canonical part order.
    WorkImageContentPart:
      description: Ordered image content for one work item.
      allOf:
        - $ref: '#/components/schemas/WorkContentCommonFields'
        - type: object
          required:
            - type
            - url
          properties:
            type:
              allOf:
                - $ref: '#/components/schemas/WorkContentPartType'
              enum:
                - image
                - IMAGE
            url:
              $ref: '#/components/schemas/WorkContentURLProperty'
            file:
              $ref: '#/components/schemas/WorkContentDeprecatedFileProperty'
    WorkAudioContentPart:
      description: Ordered audio content for one work item.
      allOf:
        - $ref: '#/components/schemas/WorkContentCommonFields'
        - type: object
          required:
            - type
            - url
          properties:
            type:
              allOf:
                - $ref: '#/components/schemas/WorkContentPartType'
              enum:
                - AUDIO
            url:
              $ref: '#/components/schemas/WorkContentURLProperty'
            file:
              $ref: '#/components/schemas/WorkContentDeprecatedFileProperty'
    WorkJsonContentPart:
      description: Ordered JSON content for one work item.
      allOf:
        - $ref: '#/components/schemas/WorkContentCommonFields'
        - type: object
          required:
            - type
            - json
          properties:
            type:
              allOf:
                - $ref: '#/components/schemas/WorkContentPartType'
              enum:
                - JSON
            json:
              description: Arbitrary JSON value preserved in canonical part order.
    WorkBinaryContentPart:
      description: Ordered binary content for one work item.
      allOf:
        - $ref: '#/components/schemas/WorkContentCommonFields'
        - type: object
          required:
            - type
            - url
          properties:
            type:
              allOf:
                - $ref: '#/components/schemas/WorkContentPartType'
              enum:
                - BINARY
            url:
              $ref: '#/components/schemas/WorkContentURLProperty'
            file:
              $ref: '#/components/schemas/WorkContentDeprecatedFileProperty'
    Relation:
      type: object
      additionalProperties: false
      required:
        - type
        - sourceWorkName
        - targetWorkName
      properties:
        type:
          $ref: '#/components/schemas/RelationType'
        targetWorkId:
          type: string
        targetWorkName:
          type: string
        sourceWorkName:
          type: string
        requiredState:
          type: string
    RelationType:
      type: string
      description: Relationship category between two pieces of work.
      x-enum-varnames:
        - RelationTypeDependsOn
        - RelationTypeParentChild
        - RelationTypeSpawnedBy
      enum:
        - DEPENDS_ON
        - PARENT_CHILD
        - SPAWNED_BY
      x-enum-descriptions:
        - Source work cannot proceed until the target work reaches the required state.
        - Target work is a child of the source work.
        - Target work was generated by a workstation handling the source work.
    WorkContentURLProperty:
      type: string
      minLength: 1
      description: Canonical content reference for file-backed parts. Supported schemes are file://, http://, https://, data:, and you-artifact:// for session-scoped factory artifact refs.
    WorkContentDeprecatedFileProperty:
      type: string
      description: Deprecated host-local file path. Use url instead. Legacy values may be normalized to url at ingest during migration.
    SubmitWorkContentURLProperty:
      type: string
      minLength: 1
      description: Canonical content URL for the submitted file-backed item. Supported schemes are file://, http://, https://, and data:.
    ModelOperationName:
      type: string
      description: Uppercase public operation identifier such as `TTS`, `ASR`, or `EMBED`.
      pattern: ^[A-Z][A-Z0-9_]*$
    WorkstationOperationBindingSelector:
      type: object
      additionalProperties: true
      description: Selector fields used to resolve one content part from ordered runtime input.
      properties:
        slot:
          type: string
          description: Match a content part by its authored slot field.
        label:
          type: string
          description: Match a content part by its label field.
        type:
          allOf:
            - $ref: '#/components/schemas/ModelOperationContentType'
          description: Match a content part by its uppercase public type.
        role:
          type: string
          description: Match a content part by its role field.
    WorkstationOperationBinding:
      type: object
      additionalProperties: true
      required:
        - slot
      description: One workstation-authored binding for a provider-agnostic model-operation input slot.
      properties:
        slot:
          type: string
          description: Stable input slot name declared by the worker operation.
        selector:
          allOf:
            - $ref: '#/components/schemas/WorkstationOperationBindingSelector'
          description: Ordered runtime-input selector used before falling back to config or default content.
        config:
          allOf:
            - $ref: '#/components/schemas/WorkContent'
          description: Static authored content bound directly or used as the first fallback when runtime input does not match.
        defaultContent:
          allOf:
            - $ref: '#/components/schemas/WorkContent'
          description: Optional final fallback content when neither runtime input nor config content resolves the slot.
    FactoryOrchestratorJavaScriptAgent:
      type: object
      additionalProperties: false
      description: Default worker selection for one named JavaScript child-agent role.
      required:
        - preset
      properties:
        preset:
          type: string
          minLength: 1
          description: Operator worker preset inherited by child calls using this agent id.
    FactoryGuardType:
      type: string
      description: Factory-level guard condition attached at the root factory definition.
      enum:
        - INFERENCE_THROTTLE_GUARD
    WorkTypeHandlingBehavior:
      type: string
      description: Declares how the CLI should route simplified one-shot prompt submissions for this work type. DEFAULT marks the single work type that receives positional prompts from you run --factory.
      enum:
        - DEFAULT
    ExpectedArtifact:
      type: object
      additionalProperties: true
      description: One expected output declaration relative to the dispatch workspace. Pattern is a workspace-relative literal path or glob and may use the replay-safe dispatch template fields `.Inputs` (the replay-safe fields are documented by `ExpectedArtifactTemplateInput`), `.Context.Project`, and `.Context.SessionID` inside a Go template action. Prompt-only fields, host paths, environment variables, and Factory documentation are not supported.
      required:
        - name
        - pattern
      properties:
        name:
          type: string
          minLength: 1
          description: Customer-visible name for this expected output declaration.
        pattern:
          type: string
          minLength: 1
          description: Workspace-relative literal path or glob template to verify.
        nonEmpty:
          type: boolean
          default: false
          description: Require every regular file matched by the pattern to be non-empty.
    FactoryLayoutPoint:
      type: object
      description: Two-dimensional authored graph layout coordinate.
      additionalProperties: false
      required:
        - x
        - 'y'
      properties:
        x:
          type: number
          description: Horizontal graph layout coordinate in authored canvas space.
        'y':
          type: number
          description: Vertical graph layout coordinate in authored canvas space.
    FactoryLayoutSize:
      type: object
      description: Authored node size in graph canvas units.
      additionalProperties: false
      required:
        - width
        - height
      properties:
        width:
          type: number
          description: Authored node width.
        height:
          type: number
          description: Authored node height.
    FactoryLayoutImageSource:
      type: object
      description: Extensible discriminated image-source shape. Version 1 supports only embedded raster data.
      additionalProperties: false
      required:
        - kind
        - mediaType
        - data
      properties:
        kind:
          type: string
          enum:
            - EMBEDDED
          description: Source variant discriminator. EMBEDDED carries portable base64 raster data.
        mediaType:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
          description: Declared media type for the embedded raster.
        data:
          type: string
          format: byte
          minLength: 4
          maxLength: 2796204
          description: Strict padded base64 payload for the embedded raster source, limited to 2 MiB after decoding.
    FactoryLayoutImage:
      type: object
      description: Inert embedded-raster image content with required alternative text.
      additionalProperties: false
      required:
        - source
        - alternativeText
      properties:
        source:
          $ref: '#/components/schemas/FactoryLayoutImageSource'
        alternativeText:
          type: string
          minLength: 1
          maxLength: 500
          pattern: \S
          description: Literal alternative text for the embedded image.
    FactoryLayoutEmptyState:
      type: object
      description: Inert presentation content for one canonical topology node when it has no live activity. It is definition metadata only and does not create events or runtime behavior.
      additionalProperties: false
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - text
          properties:
            text:
              type: string
              minLength: 1
              maxLength: 500
              pattern: \S
              description: Literal empty-state text. It is not rendered as HTML or Markdown.
        - type: object
          additionalProperties: false
          required:
            - image
          properties:
            image:
              $ref: '#/components/schemas/FactoryLayoutImage'
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          pattern: \S
          description: Literal empty-state text. It is not rendered as HTML or Markdown.
        image:
          $ref: '#/components/schemas/FactoryLayoutImage'
    FactoryLayoutNode:
      type: object
      description: Portable graph node layout keyed by canonical graph node id.
      additionalProperties: false
      required:
        - id
        - position
      properties:
        id:
          type: string
          minLength: 1
          pattern: \S
          description: Canonical graph node id such as workstation:<workstationId>.
        position:
          $ref: '#/components/schemas/FactoryLayoutPoint'
        size:
          $ref: '#/components/schemas/FactoryLayoutSize'
        locked:
          type: boolean
          description: Optional authored node lock flag for future editor affordances.
        emptyState:
          $ref: '#/components/schemas/FactoryLayoutEmptyState'
    FactoryLayoutEdge:
      type: object
      description: Portable graph edge layout keyed by canonical graph edge id.
      additionalProperties: false
      required:
        - id
      properties:
        id:
          type: string
          description: Canonical graph edge id such as workstation-output:workstation:review->work-state:task:done.
        waypoints:
          type: array
          description: Optional authored intermediate edge points in graph canvas space.
          items:
            $ref: '#/components/schemas/FactoryLayoutPoint'
        labelPosition:
          $ref: '#/components/schemas/FactoryLayoutPoint'
    FactoryLayoutBounds:
      type: object
      description: Authored rectangular bounds in graph canvas units.
      additionalProperties: false
      required:
        - x
        - 'y'
        - width
        - height
      properties:
        x:
          type: number
          description: Left graph layout coordinate.
        'y':
          type: number
          description: Top graph layout coordinate.
        width:
          type: number
          description: Authored group width.
        height:
          type: number
          description: Authored group height.
    FactoryLayoutGroup:
      type: object
      description: Portable background grouping metadata for graph canvas presentation.
      additionalProperties: false
      required:
        - id
        - bounds
        - nodeIds
      properties:
        id:
          type: string
          description: Stable authored group id for future layout editing.
        label:
          type: string
          description: Optional visible group label.
        bounds:
          $ref: '#/components/schemas/FactoryLayoutBounds'
        nodeIds:
          type: array
          description: Canonical graph node ids visually contained by this group.
          items:
            type: string
        parentGroupId:
          type: string
          nullable: true
          description: Reserved for future nested groups. Omit or set null for flat groups.
        color:
          type: string
          description: Optional authored group accent or fill color.
        locked:
          type: boolean
          description: Optional authored group lock flag for future editor affordances.
    FactoryLayoutAnnotationPosition:
      type: object
      description: Explicit finite annotation position in canvas units. Each coordinate is bounded to keep portable layout metadata safe to render.
      additionalProperties: false
      required:
        - x
        - 'y'
      properties:
        x:
          type: number
          minimum: -100000
          maximum: 100000
          description: Horizontal canvas coordinate between -100,000 and 100,000 inclusive.
        'y':
          type: number
          minimum: -100000
          maximum: 100000
          description: Vertical canvas coordinate between -100,000 and 100,000 inclusive.
    FactoryLayoutAnnotationSize:
      type: object
      description: Optional finite annotation dimensions in canvas units. Image annotations require this size; note annotations may omit it.
      additionalProperties: false
      required:
        - width
        - height
      properties:
        width:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 10000
          description: Positive authored width no greater than 10,000 canvas units.
        height:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 10000
          description: Positive authored height no greater than 10,000 canvas units.
    FactoryLayoutNoteTone:
      type: string
      description: Presentation-only tone for a note annotation.
      enum:
        - NEUTRAL
        - ACCENT
        - INFO
        - SUCCESS
        - WARNING
        - DANGER
    FactoryLayoutNote:
      type: object
      description: Literal plain-text note content. Line breaks are preserved as authored text and are not interpreted as Markdown or HTML.
      additionalProperties: false
      required:
        - body
        - tone
      properties:
        title:
          type: string
          maxLength: 160
          description: Optional literal plain-text note title.
        body:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: \S
          description: Required literal plain-text note body.
        tone:
          $ref: '#/components/schemas/FactoryLayoutNoteTone'
    FactoryLayoutAnnotationKind:
      type: string
      description: The inert annotation content variant.
      enum:
        - NOTE
        - IMAGE
    FactoryLayoutAnnotation:
      type: object
      description: Inert positioned canvas annotation. Its kind selects either note or image content; annotations never identify graph nodes or edges, and connection-like fields are invalid.
      additionalProperties: false
      required:
        - id
        - kind
        - position
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - id
            - kind
            - position
            - note
          properties:
            id:
              type: string
            kind:
              type: string
              enum:
                - NOTE
            position:
              $ref: '#/components/schemas/FactoryLayoutAnnotationPosition'
            size:
              $ref: '#/components/schemas/FactoryLayoutAnnotationSize'
            note:
              $ref: '#/components/schemas/FactoryLayoutNote'
        - type: object
          additionalProperties: false
          required:
            - id
            - kind
            - position
            - size
            - image
          properties:
            id:
              type: string
            kind:
              type: string
              enum:
                - IMAGE
            position:
              $ref: '#/components/schemas/FactoryLayoutAnnotationPosition'
            size:
              $ref: '#/components/schemas/FactoryLayoutAnnotationSize'
            image:
              $ref: '#/components/schemas/FactoryLayoutImage'
      properties:
        id:
          type: string
          minLength: 1
          pattern: \S
          description: Stable annotation identifier unique within this layout.
        kind:
          $ref: '#/components/schemas/FactoryLayoutAnnotationKind'
        position:
          $ref: '#/components/schemas/FactoryLayoutAnnotationPosition'
        size:
          $ref: '#/components/schemas/FactoryLayoutAnnotationSize'
        note:
          $ref: '#/components/schemas/FactoryLayoutNote'
        image:
          $ref: '#/components/schemas/FactoryLayoutImage'
    FactoryLayoutViewport:
      type: object
      description: Shared authored graph camera position.
      additionalProperties: false
      required:
        - x
        - 'y'
        - zoom
      properties:
        x:
          type: number
          description: Authored viewport horizontal offset.
        'y':
          type: number
          description: Authored viewport vertical offset.
        zoom:
          type: number
          description: Authored viewport zoom factor.
    FactoryLayoutPreferences:
      type: object
      description: Portable graph display defaults that do not alter factory topology.
      additionalProperties: false
      properties:
        direction:
          type: string
          enum:
            - UP
            - DOWN
            - LEFT
            - RIGHT
          description: Preferred authored graph direction for portable layout rendering.
    FactoryLayout:
      type: object
      description: Non-executable portable graph editor layout metadata keyed by canonical graph ids.
      additionalProperties: false
      required:
        - schemaVersion
      properties:
        schemaVersion:
          type: integer
          format: int32
          minimum: 1
          description: Portable layout contract schema version. Version 1 is the initial public layout contract.
        nodes:
          type: array
          description: Optional authored graph node geometry keyed by canonical graph node id.
          items:
            $ref: '#/components/schemas/FactoryLayoutNode'
        edges:
          type: array
          description: Optional authored graph edge geometry keyed by canonical graph edge id.
          items:
            $ref: '#/components/schemas/FactoryLayoutEdge'
        groups:
          type: array
          description: Optional flat background groups keyed independently from topology.
          items:
            $ref: '#/components/schemas/FactoryLayoutGroup'
        annotations:
          type: array
          description: Optional inert positioned notes and embedded-raster images that decorate the canvas without becoming graph topology.
          items:
            $ref: '#/components/schemas/FactoryLayoutAnnotation'
        viewport:
          $ref: '#/components/schemas/FactoryLayoutViewport'
        preferences:
          $ref: '#/components/schemas/FactoryLayoutPreferences'
    HostedWorkerProvider:
      type: string
      description: Built-in repository-owned hosted worker providers supported by the public factory-config contract.
      enum:
        - LINEAR
    ReasoningEffort:
      description: Optional provider-neutral reasoning effort. Surrounding whitespace and letter case are normalized. Omit the field to preserve the selected provider and model default. Factory definitions may use an exact invocation-parameter placeholder such as `${executorReasoningEffort}`.
      type: string
      pattern: "^(?:[\t-\r \N\_  - \L\P  　]*(?:[mM][iI][nN][iI][mM][aA][lL]|[lL][oO][wW]|[mM][eE][dD][iI][uU][mM]|[hH][iI][gG][hH]|[xX][hH][iI][gG][hH]|[mM][aA][xX])?[\t-\r \N\_  - \L\P  　]*|\\$\\{[A-Za-z0-9_.-]+\\})$"
    HostedWorkerAuth:
      description: Hosted-worker authentication contract. V1 hosted workers accept only secret references rather than inline credentials or OAuth-style fields.
      type: object
      additionalProperties: false
      properties:
        secretRef:
          type: string
          description: Referenced secret name that resolves the hosted provider API key at runtime.
    HostedLinearWorkerMapping:
      description: Deterministic issue-to-work mapping fields owned by a hosted Linear worker.
      type: object
      additionalProperties: true
      properties:
        workType:
          type: string
          description: Canonical submitted work type emitted for matched Linear issues.
        state:
          type: string
          description: Canonical submitted work state emitted for matched Linear issues.
    HostedLinearWorkerClaim:
      description: Optional claim-related configuration that v1 hosted Linear workers explicitly allow.
      type: object
      additionalProperties: true
      properties:
        assigneeField:
          type: string
          description: Linear issue field name to use when deriving optional assignee claim metadata.
    HostedLinearWorkerConfig:
      description: Provider-specific poller configuration for the built-in hosted Linear worker.
      type: object
      additionalProperties: true
      properties:
        pollInterval:
          type: string
          description: Optional Go duration that controls how often the hosted Linear worker polls for updates.
        teamIds:
          type: array
          description: Optional Linear team identifiers that bound the poll source.
          items:
            type: string
        stateIds:
          type: array
          description: Optional Linear issue-state identifiers that bound the poll source.
          items:
            type: string
        mapping:
          allOf:
            - $ref: '#/components/schemas/HostedLinearWorkerMapping'
          description: Deterministic mapping fields for canonical work submission generation.
        claim:
          allOf:
            - $ref: '#/components/schemas/HostedLinearWorkerClaim'
          description: Optional claim-related configuration that v1 hosted Linear polling allows.
    InputGuardType:
      type: string
      description: Guard condition attached to one specific workstation input.
      enum:
        - VISIT_COUNT
        - ALL_CHILDREN_COMPLETE
        - ANY_CHILD_FAILED
        - SAME_NAME
        - SAME_TRACE_ID
    InputGuard:
      type: object
      description: Guard attached to one specific workstation input.
      additionalProperties: false
      required:
        - type
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/InputGuardType'
          description: Guard condition to evaluate for this input-level attachment.
        workstation:
          type: string
          description: For `VISIT_COUNT` guards, the workstation whose visits are counted.
        maxVisits:
          type: integer
          minimum: 1
          description: For `VISIT_COUNT` guards, the visit threshold.
        matchConfig:
          allOf:
            - $ref: '#/components/schemas/GuardMatchConfig'
          description: For `MATCHES_FIELDS` guards, the field-selector configuration used to compare candidate inputs.
        parentInput:
          type: string
          description: For parent-aware input guards, the parent workType name from another input in the same workstation.
        matchInput:
          type: string
          description: For `SAME_NAME` and `SAME_TRACE_ID` input guards, the peer input workType name from another input in the same workstation.
        spawnedBy:
          type: string
          description: For dynamic fanout input guards, the workstation that spawns the children for count tracking.
    WorkstationGuardType:
      type: string
      description: Guard condition attached to a workstation as a whole.
      enum:
        - VISIT_COUNT
        - MATCHES_FIELDS
    LogicalRoundTrip:
      type: object
      description: Optional paired workstation policy for charging one logical visit per process/review round trip.
      additionalProperties: true
      required:
        - workstations
        - maxRawVisits
      properties:
        workstations:
          type: array
          minItems: 2
          maxItems: 2
          description: Exactly two workstation names whose visits form one logical round trip.
          items:
            type: string
        maxRawVisits:
          type: integer
          minimum: 1
          description: Absolute raw-visit ceiling across both paired workstations; it must exceed the containing guard's maxVisits.
    WorkstationGuard:
      type: object
      description: Guard attached to a workstation as a whole.
      additionalProperties: false
      required:
        - type
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/WorkstationGuardType'
          description: Guard condition to evaluate for this workstation-level attachment.
        workstation:
          type: string
          description: For `VISIT_COUNT` guards, the workstation whose visits are counted.
        maxVisits:
          type: integer
          minimum: 1
          description: For `VISIT_COUNT` guards, the fixed visit ceiling.
        maxVisitsArgument:
          type: string
          description: Optional invocation argument whose positive integer value tightens the fixed visit ceiling.
        logicalRoundTrip:
          allOf:
            - $ref: '#/components/schemas/LogicalRoundTrip'
          description: Optional paired process/review policy. When present, the containing maxVisits is the logical cycle budget and maxRawVisits is the absolute raw-visit backstop.
        matchConfig:
          allOf:
            - $ref: '#/components/schemas/GuardMatchConfig'
          description: For `MATCHES_FIELDS` guards, the field-selector configuration used to compare candidate inputs.
        parentInput:
          type: string
          description: For parent-aware input guards, the parent workType name from another input in the same workstation.
        matchInput:
          type: string
          description: For `SAME_NAME` and `SAME_TRACE_ID` input guards, the peer input workType name from another input in the same workstation.
        spawnedBy:
          type: string
          description: For dynamic fanout input guards, the workstation that spawns the children for count tracking.
    DispatchCancellation:
      type: object
      additionalProperties: false
      required:
        - reason
      description: Explicit dispatch lifecycle intent. A canceled or superseded dispatch is not a business execution failure and must not route its Work through failure arcs.
      properties:
        reason:
          type: string
          enum:
            - CANCELED
            - SUPERSEDED
    GlobalConfigACPIntegration:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - transport
        - command
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          description: Stable settings-entry identity. This is distinct from the provider name selected by a Worker.
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*$
          description: Canonical Providers catalog identity, such as cursor-acp.
        transport:
          type: string
          enum:
            - stdio
          description: ACP transport. P0 supports stdio only.
        command:
          type: string
          minLength: 1
          maxLength: 4096
          description: Operator-authored ACP launch command preserved as one settings value. It contains no permission or timeout policy.
    GlobalConfigACPAgentProfile:
      type: object
      additionalProperties: false
      required:
        - defaultTarget
      properties:
        defaultTarget:
          type: string
          minLength: 1
          description: Unversioned namespaced Factory target reference, such as factory:@you/factory-builder. Factory Definitions owns enumeration and canonical reference resolution.
        allowedTargets:
          type: array
          minItems: 1
          description: Optional ordered allowlist of unversioned namespaced Factory target references. Order is authored and preserved. Omit this property to leave the profile unrestricted, which makes every installed Factory selectable. An explicitly empty array is rejected, so omission is the only way to express "no restriction".
          items:
            type: string
            minLength: 1
    GlobalConfigACPSettings:
      type: object
      additionalProperties: true
      properties:
        integrations:
          type: array
          description: Operator-selected ACP provider integrations. Availability is derived by the Providers catalog and is never persisted here.
          items:
            $ref: '#/components/schemas/GlobalConfigACPIntegration'
        agentProfile:
          $ref: '#/components/schemas/GlobalConfigACPAgentProfile'
    GlobalConfigWorkers:
      type: object
      additionalProperties: true
      properties:
        acp:
          $ref: '#/components/schemas/GlobalConfigACPSettings'
