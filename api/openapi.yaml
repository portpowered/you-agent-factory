        durationMillis:
          type: integer
          format: int64
        outputWork:
          type: array
          items:
            $ref: '#/components/schemas/Work'
        outputResources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        metadata:
          $ref: '#/components/schemas/StringMap'
    WorkStateChangeEventPayload:
