        targets:
          type: array
          description: Optional canonical validation targets that clients can map to factory graph nodes, handles, and form fields.
          items:
            $ref: '#/components/schemas/FactoryValidationTarget'
        resourceCapacity:
          $ref: '#/components/schemas/FactorySessionResourceCapacityErrorDetails'
          description: Resource accounting for a rejected capacity reduction.
    ShutdownAcceptedResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - message
      properties:
        status:
          type: string
          enum:
            - accepted
        message:
          type: string
          description: Human-readable acknowledgment that graceful shutdown was accepted.
    ErrorTarget:
      type: object
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          type: string
          description: Client-visible target category such as form, node, edge, field, or save.
        id:
          type: string
          description: Optional graph entity, relationship, or save condition identifier.
        field:
          type: string
          description: Optional request or form field path associated with the error.
    HybridLogicalTimestamp:
      type: object
      additionalProperties: false
      required:
        - logical
        - physical
      properties:
        logical:
          type: string
          format: int64
          pattern: ^[0-9]+$
          description: Monotonic Lamport-style logical component derived from the persisted factory definition version. Serialized as a decimal string so JavaScript clients can round-trip the 64-bit value without precision loss.
        physical:
          type: string
          format: date-time
          description: UTC physical timestamp component for the persisted factory definition version.
    ProviderSessionDetailResponse:
      type: object
      additionalProperties: false
      required:
        - providerSession
        - source
        - parse
        - transcript
      properties:
        providerSession:
          $ref: '#/components/schemas/LoadableProviderSessionRef'
        source:
          $ref: '#/components/schemas/ProviderSessionSourceMetadata'
        parse:
          $ref: '#/components/schemas/ProviderSessionParseSummary'
        transcript:
          type: array
          description: Ordered transcript entries extracted from the provider-session stream.
          items:
            $ref: '#/components/schemas/ProviderSessionTranscriptEntry'
    FactorySessionTargetRef:
      type: object
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - default
            - named
        name:
          type: string
    FactorySessionTarget:
      type: object
      additionalProperties: false
      required:
        - ref
        - label
        - folderPath
        - factoryDir
        - project
      properties:
        ref:
          $ref: '#/components/schemas/FactorySessionTargetRef'
        label:
          type: string
        folderPath:
          type: string
        factoryDir:
          type: string
        project:
          type: string
    FactorySessionSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - target
        - folderPath
        - factoryDir
        - project
        - isDefault
      properties:
        id:
          type: string
        target:
          $ref: '#/components/schemas/FactorySessionTargetRef'
        folderPath:
          type: string
        factoryDir:
          type: string
        project:
          type: string
        isDefault:
          type: boolean
        runtime:
          $ref: '#/components/schemas/FactorySessionRuntime'
    FactorySession:
      type: object
      additionalProperties: false
      required:
        - id
        - target
        - folderPath
        - factoryDir
        - project
        - isDefault
        - runtime
      properties:
        id:
          type: string
        target:
          $ref: '#/components/schemas/FactorySessionTargetRef'
        folderPath:
          type: string
        factoryDir:
          type: string
        project:
          type: string
        isDefault:
          type: boolean
        runtime:
          $ref: '#/components/schemas/FactorySessionRuntime'
    FactorySessionRuntime:
      type: object
      additionalProperties: false
      required:
        - orchestratorKind
        - status
        - progress
        - usage
        - lifecycle
      properties:
        orchestratorKind:
          $ref: '#/components/schemas/FactoryOrchestratorKind'
        dialect:
          type: string
          description: JavaScript workflow dialect when orchestrator.kind = JAVASCRIPT.
        sourceRef:
          type: string
          description: Authored JavaScript workflow source reference when applicable.
        sourceHash:
          type: string
          description: Stable hash of the authored JavaScript workflow source.
        policyHash:
          type: string
          description: Stable hash of the effective orchestrator policy.
        status:
          $ref: '#/components/schemas/FactorySessionStatus'
        lifecycleControlStatus:
          $ref: '#/components/schemas/FactorySessionDurableLifecycleStatus'
          description: Canonical Factory Session lifecycle-control status reconstructed from SESSION_PAUSED and SESSION_RESUMED events when present. Live session inspection reads report PAUSED after a successful pause and RUNNING after a successful resume.
        progress:
          $ref: '#/components/schemas/FactorySessionProgress'
        budgets:
          $ref: '#/components/schemas/FactorySessionBudgets'
        usage:
          $ref: '#/components/schemas/FactorySessionUsage'
        lifecycle:
          $ref: '#/components/schemas/FactorySessionLifecycle'
        stopSummary:
          $ref: '#/components/schemas/FactoryStopSummary'
          description: Canonical stopped-state summary for paused, blocked, needs-human, and interrupted inspection paths on the existing Factory Session surface.
        streamIdentity:
          $ref: '#/components/schemas/FactorySessionStreamIdentity'
          description: Backend-authoritative identity for the current live session event stream. Clients must confirm this identity before reusing persisted reconnect cursors or timeline checkpoints.
        petri:
          $ref: '#/components/schemas/FactorySessionPetriProjection'
        javascript:
          $ref: '#/components/schemas/FactorySessionJavaScriptProjection'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/FactoryArtifact'
          description: Shared artifact projections for the session runtime.
        pendingHumanApprovals:
          type: array
          items:
            $ref: '#/components/schemas/HumanApproval'
          description: Durable pending HUMAN_APPROVAL requests reconstructed from canonical events.
    HumanApproval:
      type: object
      additionalProperties: false
      required:
        - approvalId
        - sessionId
        - dispatchId
        - workstationId
        - workstationName
        - decisions
        - status
        - workIds
      description: Safe read-only projection of one durable pending HUMAN_APPROVAL dispatch. The event ledger owns identity and status; display metadata is resolved from the effective factory topology.
      properties:
        approvalId:
          type: string
          description: Stable approval identity derived from the canonical dispatch.
        sessionId:
          type: string
          description: Factory Session that owns the pending approval.
        dispatchId:
          type: string
          description: Dispatch reserved for the pending approval.
        workstationId:
          type: string
          description: Stable authored HUMAN_APPROVAL workstation identity.
        workstationName:
          type: string
          description: Customer-authored workstation name.
        description:
          type: string
          description: Localized safe description resolved from the effective factory.
        decisions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - APPROVE
              - REJECT
        status:
          type: string
          enum:
            - PENDING
        workIds:
          type: array
          items:
            type: string
          description: Work identities consumed by the reserved dispatch.
        eventId:
          type: string
          description: Stable canonical HUMAN_APPROVAL_REQUESTED event identifier.
        requestedAt:
          type: string
          format: date-time
          description: Canonical event time for the pending approval request.
    ListHumanApprovalsResponse:
      type: object
      additionalProperties: false
      required:
        - approvals
      properties:
        approvals:
          type: array
          description: Deterministically ordered pending approvals for one session.
          items:
            $ref: '#/components/schemas/HumanApproval'
    FactoryStopKind:
      type: string
      description: Canonical inspect classification for stopped automation on existing Factory Session and Work surfaces.
      enum:
        - PAUSED
        - BLOCKED
        - NEEDS_HUMAN
        - INTERRUPTED
      x-enum-varnames:
        - PAUSED
        - BLOCKED
        - NEEDSHUMAN
        - INTERRUPTED
    FactoryStopDispatchSummary:
      type: object
      additionalProperties: false
      required:
        - dispatchId
        - status
        - dispatchKind
        - confirmationState
      properties:
        dispatchId:
          type: string
          description: Stable dispatch identifier that most directly explains the stopped state.
        status:
          $ref: '#/components/schemas/FactoryDispatchStatus'
        confirmationState:
          $ref: '#/components/schemas/ConfirmationState'
          description: Whether the reported dispatch status is covered by completed recording storage.
        dispatchKind:
          $ref: '#/components/schemas/FactoryDispatchKind'
        workstationName:
          type: string
          description: Customer-authored workstation name when one existing workstation run explains the stop.
        failureDetail:
          $ref: '#/components/schemas/FailureDetail'
          description: Failure or interruption detail from the latest relevant dispatch when available.
    FactoryStopSummary:
      type: object
      additionalProperties: false
      required:
        - stopKind
        - sessionId
      properties:
        stopKind:
          $ref: '#/components/schemas/FactoryStopKind'
        sessionId:
          type: string
          description: Stable Factory Session identifier that owns the stopped work.
        workId:
          type: string
          description: Relevant work identifier when one work item best explains the stop.
        workName:
          type: string
          description: Relevant work name when one work item best explains the stop.
        workTypeName:
          type: string
          description: Relevant work type name when one work item best explains the stop.
        workState:
          type: string
          description: Current authored work state label such as `goal:blocked` when one work item best explains the stop.
        sessionLifecycleStatus:
          $ref: '#/components/schemas/FactorySessionDurableLifecycleStatus'
          description: Session lifecycle-control status when the stop is explained by pause or another session-level lifecycle condition.
        latestDispatch:
          $ref: '#/components/schemas/FactoryStopDispatchSummary'
        latestResultSummary:
          type: string
          description: Short operator-readable summary of the latest relevant result when one explains the stop better than a dispatch identifier alone.
        suggestedRecoverySurface:
          type: string
          description: Existing operator surface to use next, expressed with current Factory Session and Work vocabulary rather than a goal-specific control route.
        suggestedRecoveryAction:
          type: string
          description: Human-readable next step that names the existing work or session action the operator should take to recover or continue automation.
    FactorySessionStreamIdentity:
      type: object
      additionalProperties: false
      required:
        - backendScopeID
        - logicalSessionKeyID
        - factorySessionID
        - streamGenerationID
      properties:
        backendScopeID:
          type: string
          description: Stable backend process or scope identity for the current live session stream.
        logicalSessionKeyID:
          type: string
          description: Canonical logical-session key derived from the normalized factory session target. This remains stable across live-session remaps for the same target.
        factorySessionID:
          type: string
          description: Stable live Factory Session identifier for the current stream.
        streamGenerationID:
          type: string
          description: Stable generation identifier for the current live session stream incarnation.
        normalizedTarget:
          $ref: '#/components/schemas/FactorySessionLogicalTarget'
    FactorySessionLogicalTarget:
      type: object
      description: |
        Client-safe normalized factory session target metadata derived from canonical
        logical target references. This shape is safe to persist for remap and does not
        expose secrets or internal runtime identifiers.
      additionalProperties: false
      required:
        - kind
        - folderPath
      properties:
        kind:
          $ref: '#/components/schemas/FactorySessionLogicalTargetKind'
        folderPath:
          type: string
          description: Canonical absolute folder path for the normalized factory session target within the backend scope.
        namedTarget:
          type: string
          description: Canonical named target identifier when kind is named.
        providerBoundary:
          $ref: '#/components/schemas/FactorySessionLogicalProviderBoundary'
    FactorySessionLogicalTargetKind:
      type: string
      description: Canonical normalized factory session target kind used for logical identity.
      enum:
        - default
        - named
        - provider
    FactorySessionLogicalProviderBoundary:
      type: object
      description: Stable provider workspace or account boundary for a provider-backed logical session target. Values must not contain secret material.
      additionalProperties: false
      required:
        - provider
        - kind
        - boundary
      properties:
        provider:
          type: string
          description: Provider identifier for the normalized target.
        kind:
          type: string
          description: Provider session kind for the normalized target.
        boundary:
          type: string
          description: Stable provider workspace or account boundary without secret material.
    FactorySessionStatus:
      type: string
      description: Canonical lifecycle status for one live factory session runtime.
      enum:
        - ACTIVE
        - IDLE
        - FINISHED
      x-enum-descriptions:
        - The session runtime is actively processing work.
        - The session runtime is available but not currently processing work.
        - The session runtime has reached a terminal finished state.
    FactorySessionProgress:
      type: object
      additionalProperties: false
      required:
        - factoryState
        - categories
        - inFlightCount
        - totalTokens
      properties:
        factoryState:
          type: string
          description: Factory lifecycle state from the aggregate engine snapshot.
        categories:
          $ref: '#/components/schemas/StatusCategories'
        inFlightCount:
          type: integer
          minimum: 0
          description: Number of dispatches currently in flight for the session.
        totalTokens:
          type: integer
          minimum: 0
          description: Number of customer-visible work tokens in the current marking.
    FactorySessionBudgets:
      type: object
      additionalProperties: false
      description: Effective orchestrator policy budgets projected for one factory session.
      properties:
        maxAgents:
          type: integer
          minimum: 0
          description: Maximum concurrent child-agent dispatches allowed by the effective JavaScript policy.
    FactorySessionUsage:
      type: object
      additionalProperties: false
      required:
        - resources
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceUsage'
          description: Resource availability and consumption for the session runtime.
    FactorySessionLifecycle:
      type: object
      additionalProperties: false
      required:
        - startedAt
        - updatedAt
      properties:
        startedAt:
          type: string
          format: date-time
          description: When the live session runtime started.
        updatedAt:
          type: string
          format: date-time
          description: When the session projection was last refreshed.
        finishedAt:
          type: string
          format: date-time
          description: When the session runtime reached a terminal finished state.
    FactorySessionPetriProjection:
      type: object
      additionalProperties: false
      required:
        - marking
        - enabledTransitions
      properties:
        marking:
          type: array
          items:
            $ref: '#/components/schemas/TokenResponse'
          description: Current Petri marking tokens for the session runtime.
        enabledTransitions:
          type: array
          items:
            $ref: '#/components/schemas/FactorySessionPetriEnabledTransition'
          description: Transitions currently enabled in the Petri marking.
    FactorySessionPetriEnabledTransition:
      type: object
      additionalProperties: false
      required:
        - transitionId
        - workerType
      properties:
        transitionId:
          type: string
          description: Enabled Petri transition identifier.
        workerType:
          type: string
          description: Worker type bound to the enabled transition.
    FactorySessionJavaScriptProjection:
      type: object
      additionalProperties: false
      required:
        - phases
        - childDispatchCounts
        - scriptStatus
      properties:
        phase:
          type: string
          description: Current JavaScript workflow phase name.
        phases:
          type: array
          items:
            type: string
          description: Ordered phase names visible in the session runtime.
        argsDigest:
          type: string
          description: Stable digest of the effective workflow arguments.
        checkpoints:
          type: array
          items:
            $ref: '#/components/schemas/FactorySessionJavaScriptCheckpointRef'
          description: Checkpoint refs and summaries without raw VM checkpoint bodies.
        scriptStatus:
          $ref: '#/components/schemas/FactorySessionJavaScriptScriptStatus'
        childDispatchCounts:
          $ref: '#/components/schemas/FactorySessionJavaScriptChildDispatchCounts'
    FactorySessionJavaScriptCheckpointRef:
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          type: string
          description: Stable checkpoint identifier referenced by the session runtime.
        label:
          type: string
          description: Customer-visible checkpoint label.
        timestamp:
          type: string
          format: date-time
          description: When the checkpoint was recorded.
        summary:
          type: string
          description: Short customer-visible checkpoint summary without raw VM state.
        artifactRef:
          $ref: '#/components/schemas/FactoryArtifactRef'
          description: Orchestrator-owned checkpoint artifact metadata without raw VM state.
    FactorySessionJavaScriptScriptStatus:
      type: string
      description: JavaScript workflow script runtime status for one factory session.
      enum:
        - IDLE
        - RUNNING
        - PAUSED
        - FINISHED
        - FAILED
      x-enum-descriptions:
        - The script runtime is loaded but not executing.
        - The script runtime is actively executing workflow logic.
        - The script runtime is paused and not scheduling new work.
        - The script runtime finished successfully.
        - The script runtime failed and is not scheduling new work.
    FactorySessionJavaScriptChildDispatchCounts:
      type: object
      additionalProperties: false
      required:
        - queued
        - running
        - completed
      properties:
        queued:
          type: integer
          minimum: 0
          description: Child dispatches waiting to start.
        running:
          type: integer
          minimum: 0
          description: Child dispatches currently executing.
        completed:
          type: integer
          minimum: 0
          description: Child dispatches that have completed.
    FactorySessionSyncPreflightResponse:
      type: object
      description: |
        Typed session sync preflight response used before restoring cached dashboard
        checkpoint state or opening the session event stream with a reconnect cursor.
      additionalProperties: false
      required:
        - requestedSessionId
        - reasonCode
        - checkpointReusable
        - reconnectCursor
      properties:
        requestedSessionId:
          type: string
          description: Session selector requested by the client. This may be `~default`.
        reasonCode:
          $ref: '#/components/schemas/FactorySessionSyncPreflightReasonCode'
        backendScopeId:
          type: string
          description: Canonical backend scope identifier for the current server-owned session cache and event history scope.
        logicalSessionKeyId:
          type: string
          description: Canonical logical-session key for the resolved session target. This remains stable across live-session remaps for the same folder and target selector.
        factorySessionId:
          type: string
          description: Resolved live Factory Session identifier for the current preflight target. Clients must persist this value rather than treating `~default` as a durable session identifier.
        streamGenerationId:
          type: string
          description: Canonical event-stream generation identifier for the resolved live Factory Session.
        normalizedTarget:
          $ref: '#/components/schemas/FactorySessionLogicalTarget'
        checkpointReusable:
          type: boolean
          description: True when cached stream-derived checkpoint state is safe to restore for the resolved identity set.
        reconnectCursor:
          $ref: '#/components/schemas/FactorySessionSyncPreflightReconnectCursor'
    FactorySessionSyncPreflightReasonCode:
      type: string
      description: Stable backend-owned session sync preflight outcome code.
      enum:
        - ok
        - cursor_stale
        - session_not_found
        - logical_session_remap
        - invalid_target_reference
        - logical_session_unresolved
    FactorySessionSyncPreflightReconnectCursor:
      type: object
      additionalProperties: false
      required:
        - provided
        - validForStreamGeneration
      properties:
        provided:
          type: boolean
          description: True when the client supplied at least one reconnect cursor field for validation.
        validForStreamGeneration:
          type: boolean
          description: True when the supplied reconnect cursor belongs to the current stream generation for the resolved live session.
        afterEventId:
          type: string
          description: Optional acknowledged FactoryEvent.id supplied by the client.
        afterSequence:
          type: integer
          format: int64
          description: Optional acknowledged FactoryEvent.context.sessionSequence supplied by the client.
    FactorySessionLiveResult:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - status
      properties:
        sessionId:
          type: string
          description: Live factory session identifier for this result read.
        status:
          $ref: '#/components/schemas/FactorySessionStatus'
        resultArtifactRef:
          $ref: '#/components/schemas/FactoryArtifactRef'
          description: Final result artifact reference without raw checkpoint bodies.
        checkpointRefs:
          type: array
          items:
            $ref: '#/components/schemas/FactorySessionJavaScriptCheckpointRef'
          description: Checkpoint refs associated with the terminal session result.
    FactorySessionResult:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - resultStatus
      description: Durable factory-session result retrieval response for final or partial workflow outputs. Non-ready, unavailable, and failed-with-partial states return typed bodies with session identity, current session status, and actionable failure or availability details when known.
      properties:
        sessionId:
          type: string
          description: Stable durable factory-session identifier.
        resultStatus:
          $ref: '#/components/schemas/FactorySessionResultStatus'
