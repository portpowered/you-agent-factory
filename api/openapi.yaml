          schema:
            type: string
      responses:
        '200':
          description: Prompt-template contract for the selected workstation editing context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplateContract'
        '404':
          $ref: '#/components/responses/CurrentFactoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/factory/workstations/{workstation_name}/prompt-template-validation:
    post:
      tags:
        - Factory
      operationId: validateCurrentFactoryWorkstationPromptTemplateBySessionId
      summary: Validate workstation prompt template
      description: Validates a prompt draft against the authoritative current-factory workstation prompt contract and returns typed syntax or variable diagnostics.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - name: workstation_name
          in: path
          required: true
          description: Customer-authored workstation name to validate against in the current factory.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptTemplateValidationRequest'
      responses:
        '200':
          description: Prompt validation result for the selected workstation editing context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplateValidationResult'
        '404':
          $ref: '#/components/responses/CurrentFactoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /packaged-factories:
    get:
      tags:
        - Factory
      operationId: listPackagedFactories
      summary: List built-in packaged factories
      description: Returns the backend-owned built-in factory catalog, including the selected artifacts the dashboard displays. The dashboard must consume this API rather than importing the publication package.
      responses:
        '200':
          description: Published packaged factory catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackagedFactoryCatalogResponse'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    SessionID:
      name: session_id
      in: path
      required: true
      description: Stable live factory session identifier. Use `~default` to target the default compatibility session explicitly.
      schema:
        type: string
    HumanApprovalID:
      name: approval_id
      in: path
      required: true
      description: Stable pending human-approval identifier.
      schema:
        type: string
        minLength: 1
    HumanApprovalStatus:
      name: status
      in: query
      required: false
      description: Optional status filter for pending human approvals.
      schema:
        type: string
        enum:
          - PENDING
    WorkerSessionID:
      name: worker_session_id
      in: path
      required: true
      description: Stable Worker Session identity returned by the Worker Sessions list operation.
      schema:
        type: string
        minLength: 1
    ResourceID:
      name: resource_id
      in: path
      required: true
      description: Stable authored Resource.id. Mutable display names are not accepted as identifiers.
      schema:
        type: string
        minLength: 1
    MaxResults:
      name: maxResults
      in: query
      required: false
      description: Optional positive page size. Omit to use the default page size; non-positive values fall back to the default after successful integer binding.
      schema:
        type: integer
        minimum: 1
        default: 50
    WorkerSessionLimit:
      name: limit
      in: query
      required: false
      description: Optional positive result bound applied after state and origin filters. Omit to use the default page size of 50. Zero and negative values are invalid.
      schema:
        type: integer
        minimum: 1
        default: 50
    NextToken:
      name: nextToken
      in: query
      required: false
      description: Optional base64-encoded token ID cursor.
      schema:
        type: string
    StateName:
      name: state.name
      in: query
      required: false
      description: Optional current work state name filter.
      schema:
        type: string
    StateType:
      name: state.type
      in: query
      required: false
      description: Optional current work state type filter.
      schema:
        $ref: '#/components/schemas/WorkStateType'
    SortBy:
      name: sortBy
      in: query
      required: false
      description: Optional list-work sort field. Use state.type to order by current work state type.
      schema:
        type: string
        enum:
          - state.type
    WorkListName:
      name: name
      in: query
      required: false
      description: Optional work name filter. Matches when the work name contains this value, case-insensitively.
      schema:
        type: string
    WorkListWorkTypeName:
      name: workTypeName
      in: query
      required: false
      description: Optional work type name filter. Matches when workTypeName equals this value exactly.
      schema:
        type: string
    WorkListTraceId:
      name: traceId
      in: query
      required: false
      description: Optional trace filter. Matches when traceId or currentChainingTraceId equals this value exactly.
      schema:
        type: string
    WorkListTerminal:
      name: terminal
      in: query
      required: false
      description: Optional terminality filter. When true, selects Work in canonical TERMINAL or FAILED states. It composes with every other supplied list filter.
      schema:
        type: boolean
    WorkListNonTerminal:
      name: nonTerminal
      in: query
      required: false
      description: Optional terminality filter. When true, selects Work in INITIAL or PROCESSING states. It composes with every other supplied list filter and cannot be selected together with terminal=true.
      schema:
        type: boolean
    WorkListCounts:
      name: counts
      in: query
      required: false
      description: Optional count request. When true, the response includes counts.total for the complete filtered selection before ordering page slicing and pagination.
      schema:
        type: boolean
    WorkListIncludeSuperseded:
      name: includeSuperseded
      in: query
      required: false
      description: Optional historical view. When true, includes terminal or failed same-name Work items that have a later admitted successor; otherwise those superseded rows are omitted before counts and pagination.
      schema:
        type: boolean
    WorkOrTokenID:
      name: id
      in: path
      required: true
      description: Work or token identifier, depending on route.
      schema:
        type: string
    FactorySessionListScope:
      name: scope
      in: query
      required: false
      description: Optional session list scope. Defaults to live for backward-compatible live workspace session listing.
      schema:
        $ref: '#/components/schemas/FactorySessionListScope'
    FactorySessionResultMode:
      name: mode
      in: query
      required: false
      description: Optional durable result retrieval mode. Defaults to final for terminal outputs. partial returns the latest partial workflow output when available.
      schema:
        $ref: '#/components/schemas/FactorySessionResultMode'
    FactorySessionResultIncludeArtifacts:
      name: includeArtifacts
      in: query
      required: false
      description: When true, include artifact metadata refs for materialized outputs. Defaults to false and may return artifact ids only.
      schema:
        type: boolean
        default: false
    DispatchID:
      name: dispatch_id
      in: path
      required: true
      description: Stable factory-session dispatch identifier.
      schema:
        type: string
    FactoryDispatchPhase:
      name: phase
      in: query
      required: false
      description: Exact canonical phase identifier. Unknown phases return an empty collection.
      schema:
        type: string
        minLength: 1
    FactoryDispatchStatusFilter:
      name: status
      in: query
      required: false
      description: Canonical Dispatch lifecycle status.
      schema:
        $ref: '#/components/schemas/FactoryDispatchStatus'
    ArtifactID:
      name: artifact_id
      in: path
      required: true
      description: Stable factory-session artifact identifier.
      schema:
        type: string
    AfterEventId:
      name: after_event_id
      in: query
      required: false
      description: Session-scoped reconnect cursor identifying the last acknowledged FactoryEvent.id. The stream replays only events recorded after this stable event identifier. When both after_event_id and after_sequence are present on GET /factory-sessions/{session_id}/events, after_event_id wins.
      schema:
        type: string
    AfterSequence:
      name: after_sequence
      in: query
      required: false
      description: Session-scoped reconnect cursor identifying the last acknowledged ordering point. Session-scoped FactoryEvent streams prefer FactoryEvent.context.sessionSequence when present and otherwise fall back to FactoryEvent.context.sequence. When both after_event_id and after_sequence are present on GET /factory-sessions/{session_id}/events, after_event_id wins. Cursors that no longer match the retained history boundary surface as cursor_stale on JSON reconnect probes or invalid-cursor 400 responses on SSE open.
      schema:
        type: integer
        minimum: 0
    WorkerSessionAfterPosition:
      name: after_position
      in: query
      required: false
      description: Worker Session reconnect cursor identifying the last acknowledged canonical event position. The stream resumes exclusively after this position; a cursor from another Worker Session, a future position, or an unavailable retained position is rejected with a typed outcome.
      schema:
        type: integer
        format: int64
        minimum: 1
    WorkerSessionStreamGenerationID:
      name: stream_generation_id
      in: query
      required: false
      description: Optional durable Worker Session event-stream generation that qualifies after_position. A generation mismatch never falls back to another history.
      schema:
        type: string
        minLength: 1
    ResponseEventAfterSequence:
      name: after_sequence
      in: query
      required: false
      description: Last acknowledged FactoryResponseEvent.sequence. The stream sends only retained response events with a greater sequence before continuing with live events. Omit this cursor to start at the beginning of retained response-event history. If the cursor predates retained history, the first emitted event is a STREAM_GAP record describing the loss instead of silently skipping it.
      schema:
        type: integer
        format: int64
        minimum: 0
    ResponseEventDispatchID:
      name: dispatch_id
      in: query
      required: false
      description: Return only FactoryResponseEvent records associated with this exact dispatch identifier. Invalid or empty identifiers return the typed bad-request response.
      schema:
        type: string
        minLength: 1
    ResponseEventKind:
      name: kind
      in: query
      required: false
      description: Return FactoryResponseEvent records matching any requested public kind. The parameter may be repeated, for example kind=MESSAGE&kind=TOOL. Invalid or empty kind values return the typed bad-request response.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        items:
          $ref: '#/components/schemas/FactoryResponseEventKind'
    BackendScopeId:
      name: backend_scope_id
      in: query
      required: false
      description: Optional backend scope identifier used with logicalSessionKeyId to resolve the current live Factory Session when the requested session selector is missing or stale. When provided, resolution succeeds only when it matches the active backend scope.
      schema:
        type: string
    LogicalSessionKeyId:
      name: logical_session_key_id
      in: query
      required: false
      description: Optional canonical logical-session key derived from the normalized factory session target. When the requested session selector is missing or stale, resolution uses backendScopeId plus this key to locate the replacement current live Factory Session.
      schema:
        type: string
  responses:
    BadRequest:
      description: Request payload or parameter was invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CreateFactoryBadRequest:
      description: Named factory name or payload was invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidFactoryName:
              summary: Factory name failed validation.
              value:
                message: Factory name must be a safe directory segment without path separators.
                family: BAD_REQUEST
                code: INVALID_FACTORY_NAME
            invalidFactory:
              summary: Factory payload failed validation because a workstation has outputs but no failure route.
              value:
                message: Factory payload is not a valid Agent Factory definition.
                family: BAD_REQUEST
                code: INVALID_FACTORY
                targets:
                  - code: factory.workstation.missingFailureRoute
                    severity: error
                    message: workstation "bob" must define a failure route.
                    subject:
                      type: WORKSTATION
                      id: bob
                      location: ON_FAILURE
            routelessWorkstation:
              summary: Factory payload failed validation because a workstation has no output routes.
              value:
                message: Factory payload is not a valid Agent Factory definition.
                family: BAD_REQUEST
                code: INVALID_FACTORY
                targets:
                  - code: factory.workstation.missingOutputRoutes
                    severity: error
                    message: workstation "bob" must define output routes.
                    subject:
                      type: WORKSTATION
                      id: bob
                      location: OUTPUTS
    CreateFactoryConflict:
      description: Named factory could not be activated because the name already exists or the current runtime is not idle.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            factoryAlreadyExists:
              summary: Factory name already exists.
              value:
                message: Named factory already exists.
                family: CONFLICT
                code: FACTORY_ALREADY_EXISTS
            factoryNotIdle:
              summary: Runtime is not idle.
              value:
                message: Current factory runtime must be idle before activation.
                family: CONFLICT
                code: FACTORY_NOT_IDLE
                targets:
                  - code: factory.runtime.notIdle
                    severity: error
                    message: Current factory runtime must be idle before activation.
                    subject:
                      type: FACTORY
                      id: ''
                      location: DEFINITION
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CurrentFactoryNotFound:
      description: Current named factory was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            currentFactoryMissing:
              summary: No current named factory is available.
              value:
                message: Current named factory not found.
                family: NOT_FOUND
                code: NOT_FOUND
    SaveCurrentFactoryBadRequest:
      description: Current factory save request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidFactory:
              summary: Factory payload failed validation because a workstation has outputs but no failure route.
              value:
                message: Factory payload is not a valid Agent Factory definition.
                family: BAD_REQUEST
                code: INVALID_FACTORY
                targets:
                  - code: factory.workstation.missingFailureRoute
                    severity: error
                    message: workstation "bob" must define a failure route.
                    subject:
                      type: WORKSTATION
                      id: bob
                      location: ON_FAILURE
            routelessWorkstation:
              summary: Factory payload failed validation because a workstation has no output routes.
              value:
                message: Factory payload is not a valid Agent Factory definition.
                family: BAD_REQUEST
                code: INVALID_FACTORY
                targets:
                  - code: factory.workstation.missingOutputRoutes
                    severity: error
                    message: workstation "bob" must define output routes.
                    subject:
                      type: WORKSTATION
                      id: bob
                      location: OUTPUTS
    SaveCurrentFactoryConflict:
      description: Current factory could not be saved because the runtime or submitted version is not safe to replace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            staleFactoryVersion:
              summary: Submitted version is stale.
              value:
                message: Current factory definition is stale. Refresh the graph before saving.
                family: CONFLICT
                code: STALE_FACTORY_VERSION
                targets:
                  - code: factory.version.stale
                    severity: error
                    message: Current factory definition is stale. Refresh the graph before saving.
                    subject:
                      type: FACTORY
                      id: ''
                      location: DEFINITION
            factoryNotIdle:
              summary: Runtime is not idle.
              value:
                message: Current factory runtime must be idle before activation.
                family: CONFLICT
                code: FACTORY_NOT_IDLE
                targets:
                  - code: factory.runtime.notIdle
                    severity: error
                    message: Current factory runtime must be idle before activation.
                    subject:
                      type: FACTORY
                      id: ''
                      location: DEFINITION
    MoveWorkConflict:
      description: Operator move request was already applied for the supplied requestId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            duplicateRequestId:
              summary: Duplicate operator move requestId.
              value:
                message: Operator move request was already applied.
                family: CONFLICT
                code: MOVE_WORK_REQUEST_ALREADY_APPLIED
    ExecutionRequestIdConflict:
      description: The supplied requestId was already used with materially different source, args, orchestrator, or requested policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            requestIdConflict:
              summary: Durable execution requestId conflict.
              value:
                message: requestId was already used with different execution inputs.
                family: CONFLICT
                code: EXECUTION_REQUEST_ID_CONFLICT
    WorkerSessionStartConflict:
      description: The Worker Session start conflicts with an existing reservation or request identity.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WorkerSessionStartUnavailable:
      description: The Worker Session could not cross its event-readiness or Workers-admission barrier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WorkerSessionContinuationConflict:
      description: The Worker Session continuation conflicts with source lifecycle, lineage, idempotency, or Provider Session validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WorkerSessionContinuationUnavailable:
      description: The Worker Session continuation could not cross its event-readiness or Workers-admission barrier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WorkerSessionInterruptBadRequest:
      description: The Worker Session interrupt request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkerSessionInterruptError'
    WorkerSessionInterruptNotFound:
      description: The Worker Session interrupt source was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkerSessionInterruptError'
    WorkerSessionInterruptConflict:
      description: The Worker Session interrupt conflicts with source, lineage, or idempotency state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkerSessionInterruptError'
    WorkerSessionInterruptUnavailable:
      description: The Worker Session interrupt could not cross its cancellation or successor admission barrier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkerSessionInterruptError'
    WorkerSessionInterruptInternalError:
      description: The server failed while handling an otherwise valid Worker Session interrupt.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkerSessionInterruptError'
    WorkerSessionControlConflict:
      description: The Worker Session lifecycle control conflicts with its current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WorkerSessionControlUnavailable:
      description: The Worker Session lifecycle control could not reach its authoritative boundary.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WorkerSessionControlInternalError:
      description: The server failed while applying the Worker Session lifecycle control.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WorkerSessionRecordingUnavailable:
      description: The durable Worker Session recording could not be read.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    FactorySessionLifecycleControlConflict:
      description: Lifecycle control request conflicts with current session state, another in-flight control, or a previously applied control requestId.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
              - $ref: '#/components/schemas/ErrorResponse'
    FactorySessionDeletionConflict:
      description: The selected Factory Session cannot be deleted while it is the default session or its runtime is active.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    FactorySessionResourceCapacityConflict:
      description: Resource capacity admission was rejected because the request revision or Factory Session lifecycle is stale, the requested capacity is below units in use.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FactorySessionResourceCapacityResponse'
              - $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Server failed while reading or building runtime state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ShutdownControlRejected:
      description: The shutdown control is restricted to a loopback peer on this local server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ShutdownControlUnavailable:
      description: The server cannot expose its invocation-local shutdown control.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ResponseEventBadRequest:
      description: Response-event cursor or filter parameters were invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidCursor:
              summary: The response-event reconnect cursor is invalid.
              value:
                message: after_sequence must be a non-negative integer.
                family: BAD_REQUEST
                code: INVALID_RESPONSE_EVENT_CURSOR
            invalidFilter:
              summary: A response-event filter is invalid.
              value:
                message: kind must contain only public FactoryResponseEventKind values.
                family: BAD_REQUEST
                code: INVALID_RESPONSE_EVENT_FILTER
    ResponseEventSessionNotFound:
      description: The explicitly selected Factory Session does not exist. Response-event streaming never falls back to the current or default session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unknownSession:
              summary: The explicit Factory Session identifier was not found.
              value:
                message: Factory Session was not found.
                family: NOT_FOUND
                code: RESPONSE_EVENT_SESSION_NOT_FOUND
    ResponseEventStreamExpired:
      description: The retained response-event stream has expired and can no longer be opened. This is distinct from an invalid cursor or filter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            expiredStream:
              summary: Retained response-event history is no longer available.
              value:
                message: The retained Factory Response Event stream has expired.
                family: GONE
                code: RESPONSE_EVENT_STREAM_EXPIRED
    MetricsSessionScopeUnavailable:
      description: The selected live Factory Session has no retained metrics scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RequestTimeout:
      description: The metrics cost query was canceled before it completed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: The metrics cost query exceeded the server-side completion bound.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    SubmitWorkRequest:
      type: object
      additionalProperties: false
      required:
        - workTypeName
      properties:
        name:
          type: string
          description: Optional authored name for this single-work submission. When omitted, the server assigns the single-work request's canonical identity.
        workTypeName:
          type: string
          description: Configured work type name from factory.json to submit to.
        currentChainingTraceId:
          type: string
          description: Explicit chaining-trace identifier for the submitted work.
        traceId:
          type: string
          description: Legacy trace identifier retained for compatibility; prefer currentChainingTraceId.
        items:
          $ref: '#/components/schemas/SubmitWorkItemList'
          description: Ordered submit-work items authored by the dashboard for structured multimodal submission.
        content:
          $ref: '#/components/schemas/WorkContent'
          description: Optional canonical ordered work content parts for this submission.
        payload:
          description: Opaque work payload forwarded as raw JSON. Each submitted Work payload is limited to 65,536 bytes measured from its compact UTF-8 JSON value; exactly 65,536 bytes is allowed. An oversized submission returns the operation's 400 BAD_REQUEST ErrorResponse with payloadBytes and payloadLimitBytes; those values count bytes, not characters.
        tags:
          $ref: '#/components/schemas/StringMap'
        relations:
          type: array
          description: Optional token-level runtime relations preserved on the submitted work item.
          items:
            $ref: '#/components/schemas/SubmitRelation'
    SubmitRelation:
      type: object
      additionalProperties: false
      required:
        - type
        - targetWorkId
      properties:
        type:
          $ref: '#/components/schemas/RelationType'
        targetWorkId:
          type: string
          description: Target runtime work identifier for the relation.
        requiredState:
          type: string
          description: Required target state before the dependency can proceed.
    SubmitWorkResponse:
      type: object
      additionalProperties: false
      required:
        - traceId
        - requestId
        - accepted
      properties:
        traceId:
          type: string
          description: Trace identifier for the submitted work request batch.
        requestId:
          type: string
          description: Stable request identifier assigned during normalization.
        accepted:
          type: boolean
          description: False when the same requestId was already accepted (idempotent replay).
        workId:
          type: string
          description: Primary work identifier for single-work submits (batch-<requestId>-<name> when omitted).
        name:
          type: string
          description: Submitted work display name.
        workTypeName:
          type: string
          description: Configured work type name for the submitted work.
        sessionId:
          type: string
          description: Factory session that accepted the submit (~default for POST /work).
    InvocationInputSourceKind:
      type: string
      description: Invocation input source category. `text` is the only implemented API source for the text-first invocation slice. `fileRef` and `audioStream` are reserved future source categories and are not accepted by current runtimes.
      enum:
        - text
        - fileRef
        - audioStream
      x-enum-varnames:
        - InvocationInputSourceKindText
        - InvocationInputSourceKindFileRef
        - InvocationInputSourceKindAudioStream
      x-enum-descriptions:
        - Text supplied in canonical WorkContent.
        - Reserved future file-reference input source.
        - Reserved future audio-stream input source.
    InvocationRequest:
      type: object
      additionalProperties: false
      properties:
        sourceKind:
          $ref: '#/components/schemas/InvocationInputSourceKind'
          description: Compatibility input source category selected by the API caller when `content` is supplied. Current runtimes accept `text` only; future multimodal categories are documented in the enum but not implemented by this contract slice.
        content:
          $ref: '#/components/schemas/WorkContent'
          description: 'Canonical text-first compatibility invocation content. Current runtimes resolve exactly one logical text input from this carrier; non-text source categories are reserved for future contract extensions. When `args` is omitted, `content` and `sourceKind: text` preserve the legacy invocation contract.'
        args:
          type: object
          additionalProperties: true
          description: Optional structured invocation arguments keyed by parameter name, externalName, or alias. Values must decode as a string or an array of strings. Signature-backed runtimes normalize these values through the shared backend argument resolver. Compatibility `content` requests should omit `args`.
        requestId:
          type: string
          description: Optional caller-supplied idempotency key for the invocation request.
        timeoutMillis:
          type: integer
          format: int64
          minimum: 1
          description: Optional caller timeout budget in milliseconds for waiting on the primary result.
    InvocationResponse:
      type: object
      additionalProperties: false
      required:
        - requestId
        - traceId
        - status
      properties:
        requestId:
          type: string
          description: Stable invocation request identifier assigned or accepted by the server.
        traceId:
          type: string
          description: Trace identifier for the work submitted by this invocation.
        status:
          $ref: '#/components/schemas/InvocationTerminalStatus'
          description: Terminal invocation status after resolving or failing primary-result selection.
