      operationId: getFactorySessionResults
      summary: Get durable factory session results
      description: >-
        Returns final or partial durable workflow outputs for one factory session.
        Supports mode=final|partial and includeArtifacts=true|false without requiring
        clients to scrape event streams or logs. Non-ready, unavailable, and
        failed-with-partial states return typed FactorySessionResult bodies with
        session identity, current session status, and actionable failure or
        availability details when known.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/FactorySessionResultMode'
        - $ref: '#/components/parameters/FactorySessionResultIncludeArtifacts'
      responses:
        '200':
          description: Durable session result retrieval response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/dispatches:
