  /factory-sessions/{session_id}/resources/{resource_id}/capacity:
    post:
      tags:
        - Factory
      operationId: setFactorySessionResourceCapacity
      summary: Set one Factory Session resource capacity
      description: >-
        Changes the effective capacity of one live Factory Session resource by
        stable Resource.id. The operation is revisioned and idempotent. It does
