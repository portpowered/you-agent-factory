openapi: 3.0.3
info:
  title: Agent Factory API
  version: 0.1.0
  license:
    name: MIT
  description: |
    Current Agent Factory runtime API contract. This file captures existing
    handler behavior for schema standardization and intentionally does not
    redesign route names, pagination, or response fields.
servers:
  - url: http://localhost:7437
    description: Local Agent Factory API server
security: []
tags:
  - name: Work
    description: Runtime work submission and inspection.
  - name: Factory
    description: Named factory activation and current-factory inspection.
  - name: Runtime
    description: Runtime state, event stream, and trace inspection.
  - name: Provider Sessions
    description: Provider-owned session diagnostics for dashboard inspection.
  - name: Models
    description: Model discovery and capability inspection for the current runtime.
  - name: Workflows
    description: Stored workflow inspection.
paths:
  /factory-sessions/{session_id}/work:
    post:
      tags:
        - Work
      operationId: submitWorkBySessionId
      summary: Submit work for one session
      description: Submits one work item to the explicitly selected live factory session. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitWorkRequest'
      responses:
        '201':
          description: Work was accepted for processing by the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitWorkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Work
      operationId: listWorkBySessionId
      summary: List work for one session
      description: Lists current work tokens from the engine state snapshot owned by the explicitly selected live factory session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/MaxResults'
        - $ref: '#/components/parameters/NextToken'
        - $ref: '#/components/parameters/StateName'
        - $ref: '#/components/parameters/StateType'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/WorkListName'
        - $ref: '#/components/parameters/WorkListWorkTypeName'
        - $ref: '#/components/parameters/WorkListTraceId'
      responses:
        '200':
          description: Current work tokens for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/invocations:
    post:
      tags:
        - Work
      operationId: invokeFactorySessionBySessionId
      summary: Invoke one factory session and return its primary result
      description: >-
        Live-session compatibility API for invocations against an already-open
        factory session. This route is not the primary durable workflow
        execution entrypoint; use POST /factory-sessions/async or POST
        /factory-sessions/sync for dynamic workflow-backed durable execution.
        Requests may use legacy text-first compatibility content or structured
        invocationSignature args. Structured args normalize through the shared
        backend argument resolver, while content preserves the legacy
        compatibility carrier. When invocationReturn is omitted, runtimes use
        the documented SUBMITTED_WORK_TERMINAL fallback. Supplying ambiguous
        input sources is rejected with INVOCATION_INPUT_SOURCE_CONFLICT or
        INVOCATION_ARGUMENT_SOURCE_CONFLICT. Empty selected text input is
        rejected with INVOCATION_INPUT_EMPTY. If no primary output can be
        resolved, the response status is FAILED with
        INVOCATION_PRIMARY_RESULT_UNRESOLVED and no primaryResult.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvocationRequest'
      responses:
        '200':
          description: Invocation reached a terminal status for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvocationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/work/staged-files:
    post:
      tags:
        - Work
      operationId: stageSubmitWorkFileBySessionId
      summary: Stage one submit-work file for one session
      description: Accepts one dashboard-authored file payload for the selected factory session, stores it behind a backend-owned staged reference, and returns the staged reference plus identifying metadata for structured submit-work items.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageSubmitWorkFileRequest'
      responses:
        '201':
          description: File payload staged successfully for later session-scoped submit-work use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageSubmitWorkFileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/work-requests/{request_id}:
    put:
      tags:
        - Work
      operationId: upsertWorkRequestBySessionId
      summary: Upsert work request for one session
      description: Submits or retries one canonical work request batch against the explicitly selected live factory session. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - name: request_id
          in: path
          required: true
          description: Stable request identifier used for idempotent submission.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkRequest'
      responses:
        '201':
          description: Work request was accepted or had already been accepted by the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertWorkRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/work/{id}:
    get:
      tags:
        - Work
      operationId: getWorkBySessionId
      summary: Get work for one session
      description: Returns one work item by work or token identifier from the current marking owned by the explicitly selected live factory session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/WorkOrTokenID'
      responses:
        '200':
          description: One work item for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/work/{id}/move:
    post:
      tags:
        - Work
      operationId: moveWorkBySessionId
      summary: Move work to another state for one session
      description: >-
        Moves an existing work item to a named authored marking state in the
        selected live factory session. Rejects moves while the work item is
        consumed by an active dispatch.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/WorkOrTokenID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveWorkRequest'
      responses:
        '200':
          description: Work item at the new marking position for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MoveWorkConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/events:
    get:
      tags:
        - Runtime
      operationId: getEventsBySessionId
      summary: Stream factory events for one session
      x-doc-id: agent-factory/api/factory-session-events
      description: >-
        Canonical FactoryEvent Server-Sent Events stream for dashboard, Factory
        Session, and durable replay traffic scoped to one explicitly selected
        session_id. OpenAPI 3.0.3 cannot structurally declare SSE event ids,
        comment keepalives, or per-connection ordering guarantees, so the
        lifecycle rules below are documented in operation prose rather than as
        unsupported response fields.

        Event ordering: the server sends retained history first in ascending tick
        order, then continues on the same connection with live FactoryEvent
        records. Each text/event-stream data frame is serialized JSON matching
        the FactoryEvent union referenced by x-event-schema.

        Reconnect cursors: pass after_event_id or after_sequence to receive only
        events recorded after the acknowledged point. When both are present,
        after_event_id wins. For session-scoped streams, after_sequence prefers
        FactoryEvent.context.sessionSequence when that field is present;
        otherwise it falls back to FactoryEvent.context.sequence. Omitting both
        cursors starts replay from the beginning of the session's currently
        retained history.

        Replay bounds: live sessions replay only events retained for the current
        stream generation of the targeted Factory Session. Durable execution
        session identifiers replay persisted canonical records for that session
        without crossing into another session. Cursors that no longer match the
        retained history boundary return typed invalid-cursor handling (400 on
        SSE open, cursor_stale on JSON reconnect probe) rather than silently
        skipping events.

        Identity handshake before reconnect: compare the response headers
        X-Factory-Session-Backend-Scope-Id,
        X-Factory-Session-Logical-Session-Key-Id,
        X-Factory-Session-Factory-Session-Id, and
        X-Factory-Session-Stream-Generation-Id with the latest sync-preflight or
        session-read identity set before reusing a persisted reconnect cursor or
        stream-derived cache. A changed streamGenerationId means the current
        stream generation invalidates prior cursors even when factorySessionId is
        unchanged.

        Keepalives: successful SSE responses use Connection keep-alive. Idle
        periods may occur while the Factory Session is waiting for new canonical
        events; clients must treat these as normal waiting state rather than
        terminal stream completion unless the HTTP connection closes.

        Expired-cursor recovery: when Accept includes application/json, the same
        route acts as a reconnect probe and returns
        FactorySessionEventStreamRecovery instead of opening Server-Sent Events.
        cursor_stale outcomes tell clients to retry with omitAfterEventId and
        omitAfterSequence set so the next open omits stale cursors.
        UNKNOWN_SESSION means the selector does not resolve to a live or durable
        session and never falls back to the default session.

        Unknown session identifiers return NOT_FOUND instead of falling back to
        the default session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/AfterEventId'
        - $ref: '#/components/parameters/AfterSequence'
      responses:
        '200':
          description: >-
            Retained catch-up in ascending tick order followed by live
            FactoryEvent records for the targeted session when Accept requests
            text/event-stream, or a JSON FactorySessionEventStreamRecovery
            reconnect probe result when Accept includes application/json.
            Successful SSE responses use Connection keep-alive and may remain
            idle until the next canonical FactoryEvent is recorded.
          headers:
            X-Factory-Session-Backend-Scope-Id:
              description: Stable backend scope identifier for the current live Factory Session event history. Compare this handshake header with session-sync or preflight `backendScopeId` values before reusing reconnect cursors or stream-derived projections.
              schema:
                type: string
            X-Factory-Session-Logical-Session-Key-Id:
              description: Stable logical session key for the resolved Factory Session target within the current backend scope. Compare this handshake header with session-sync or preflight `logicalSessionKeyId` values before reusing reconnect cursors or stream-derived projections.
              schema:
                type: string
            X-Factory-Session-Factory-Session-Id:
              description: Resolved UUID Factory Session identifier for the current live event history. Compare this handshake header with session-sync or preflight `factorySessionId` values before reusing reconnect cursors or stream-derived projections.
              schema:
                type: string
            X-Factory-Session-Stream-Generation-Id:
              description: Opaque invalidation token for the current live Factory Session event history. Compare this handshake header with session-sync or preflight `streamGenerationID` values before reusing reconnect cursors or stream-derived projections.
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events where each data frame is serialized JSON matching FactoryEvent.
              x-event-schema: '#/components/schemas/FactoryEvent'
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionEventStreamRecovery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/response-events:
    get:
      tags:
        - Runtime
      operationId: getFactoryResponseEventsBySessionId
      summary: Stream ephemeral response events for one Factory Session
      description: >-
        Streams ephemeral FactoryResponseEvent observation records for the
        explicitly selected Factory Session. These records are outside
        canonical FactoryEvent replay and never derive canonical Factory state.
        The connection first sends retained matching records in ascending
        response sequence and then continues with live matching records. Each
        SSE id is the decimal FactoryResponseEvent.sequence so reconnect clients
        can acknowledge it with after_sequence. Omitting after_sequence starts
        at the beginning of retained history. When a cursor predates retained
        history, the first emitted record is STREAM_GAP and describes the lost
        range rather than silently skipping it. An unknown session_id returns a
        typed 404 and never falls back to the current or default session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/ResponseEventAfterSequence'
        - $ref: '#/components/parameters/ResponseEventDispatchID'
        - $ref: '#/components/parameters/ResponseEventKind'
      responses:
        '200':
          description: >-
            Retained catch-up followed by live Factory Response Event records
            for the explicitly targeted session.
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  Server-Sent Events where each data record is serialized JSON
                  matching FactoryResponseEvent and each id is its decimal
                  response sequence.
              x-event-schema: '#/components/schemas/FactoryResponseEvent'
        '400':
          $ref: '#/components/responses/ResponseEventBadRequest'
        '404':
          $ref: '#/components/responses/ResponseEventSessionNotFound'
        '410':
          $ref: '#/components/responses/ResponseEventStreamExpired'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/sync-preflight:
    get:
      tags:
        - Runtime
      operationId: getFactorySessionSyncPreflightBySessionId
      summary: Validate cached session sync state for one session
      description: Returns the canonical backend-owned session sync identity set and validates an optional reconnect cursor before the dashboard restores cached checkpoint state or opens the event stream. This route accepts `~default` as a session selector, but clients must persist the returned `factorySessionId` field rather than treating `~default` as a durable live-session identifier.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/BackendScopeId'
        - $ref: '#/components/parameters/LogicalSessionKeyId'
        - $ref: '#/components/parameters/AfterEventId'
        - $ref: '#/components/parameters/AfterSequence'
      responses:
        '200':
          description: Typed session sync preflight outcome for the targeted session selector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionSyncPreflightResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /status:
    get:
      tags:
        - Runtime
      operationId: getStatus
      summary: Get runtime status
      description: Returns the current factory lifecycle status, token category counts, and resource availability from the aggregate engine snapshot.
      responses:
        '200':
          description: Current runtime status summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /models:
    get:
      tags:
        - Models
      operationId: listModels
      summary: List managed runtimes
      description: Lists named managed runtimes exposed by the currently loaded runtime configuration together with readiness, lifecycle state, locality, supported operations, and resource summary data using the managed-runtime contract.
      responses:
        '200':
          description: Managed runtimes for the current runtime.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelsResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /models/{model_name}:
    get:
      tags:
        - Models
      operationId: getModel
      summary: Inspect one managed runtime
      description: Returns one managed runtime's readiness, lifecycle state, supported operations, resource metadata, worker capabilities, and diagnostics for the currently loaded runtime configuration.
      parameters:
        - name: model_name
          in: path
          required: true
          description: Stable managed runtime identity such as `OMNIVOICE_Q4_K_M`.
          schema:
            type: string
      responses:
        '200':
          description: Managed runtime detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /models/{model_name}/invocations:
    post:
      tags:
        - Models
      operationId: invokeModel
      summary: Invoke one discovered model directly
      description: Invokes one discovered model through its declared provider-agnostic operation contract using canonical `WorkContent` input and optional slot-binding overrides. Non-streaming clients receive JSON metadata, while audio-producing operations can return a streamed audio body when requested.
      parameters:
        - name: model_name
          in: path
          required: true
          description: Concrete public model identifier such as `OMNIVOICE_Q4_K_M`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelInvocationRequest'
      responses:
        '200':
          description: Successful model invocation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInvocationResponse'
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Streamed audio body for audio-producing invocations when `options.responseMode` requests `AUDIO_STREAM`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /models/{model_name}/pull:
    post:
      tags:
        - Models
      operationId: pullModel
      summary: Pull or install one managed runtime
      description: Pulls or installs required managed runtime assets into the managed cache using one source-agnostic customer action. Cloud-backed runtimes and unsupported local targets return actionable errors instead of silently succeeding.
      parameters:
        - name: model_name
          in: path
          required: true
          description: Stable managed runtime identity such as `OMNIVOICE_Q4_K_M`.
          schema:
            type: string
      responses:
        '200':
          description: Successful managed runtime pull or install, or confirmation that the managed cache already contained the required revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPullResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/status:
    get:
      tags:
        - Runtime
      operationId: getStatusBySessionId
      summary: Get runtime status for one session
      description: Returns the current factory lifecycle status, token category counts, and resource availability from the aggregate engine snapshot owned by the explicitly selected live factory session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Current runtime status summary for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /provider-sessions/detail:
    get:
      tags:
        - Provider Sessions
      operationId: getProviderSessionDetails
      summary: Get provider session details
      description: Returns parsed provider-session details using a provider-neutral response schema. The browser supplies provider, kind, and identifier query parameters; the server resolves the matching session file under the configured provider sessions root and never accepts a raw filesystem path. Only Codex (`codex`) sessions are currently loadable for this endpoint.
      parameters:
        - name: provider
          in: query
          required: true
          description: Provider that emitted the session identifier. Only codex sessions are currently loadable.
          schema:
            $ref: '#/components/schemas/LoadableProviderSessionProvider'
        - name: kind
          in: query
          required: true
          description: Provider-session identifier kind. Only session_id is currently loadable.
          schema:
            $ref: '#/components/schemas/LoadableProviderSessionKind'
        - name: id
          in: query
          required: true
          description: Provider-session identifier to resolve. This is an identifier, not a filesystem path.
          schema:
            type: string
      responses:
        '200':
          description: Parsed provider-session details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSessionDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factories/preview:
    post:
      tags:
        - Factory
      operationId: previewFactory
      summary: Preview JavaScript orchestrator factory source
      description: >-
        Canonical Factory preview surface for JavaScript orchestrator factories.
        Resolves orchestrator source, validates JavaScript or TypeScript source
        without execution, and projects effective policy, artifact-root, and
        structured-result constraints before Factory Session start.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactoryPreviewRequest'
      responses:
        '200':
          description: Factory preview validation, source resolution, and policy projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactoryPreviewResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-validations:
    post:
      tags:
        - Factory
      operationId: validateFactory
      summary: Validate factory definition
      description: Validates a submitted complete factory definition and returns canonical validation targets without persisting or activating the factory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Factory'
      responses:
        '200':
          description: Validation result for the submitted factory definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactoryValidationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/async:
    post:
      tags:
        - Factory
      operationId: startDurableFactorySessionAsync
      summary: Start durable factory session execution asynchronously
      description: >-
        Primary durable execution entrypoint for dynamic workflow-backed factory
        sessions. Accepts the normalized FactorySessionExecutionRequest, resolves
        the requested source, and returns session identity plus polling links
        without waiting for terminal completion. WORKFLOW_FILE and WORKFLOW_NAME
        sources resolve in order: project `.claude/workflows`, user
        `~/.you-agent-factory/workflows`, package-relative workflow directories,
        built-in/global JavaScript factories, then explicit factory lookup when
        requested or required. Replaying the same requestId with the same
        normalized source, args, orchestrator, and requested policy returns the
        existing session instead of starting duplicate work. Reusing requestId
        with materially different inputs returns 409 Conflict with
        EXECUTION_REQUEST_ID_CONFLICT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionExecutionRequest'
      responses:
        '202':
          description: Durable session execution was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionExecutionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/ExecutionRequestIdConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/sync:
    post:
      tags:
        - Factory
      operationId: startDurableFactorySessionSync
      summary: Start durable factory session execution synchronously
      description: >-
        Durable execution entrypoint that waits for terminal completion or a sync
        timeout before returning. Accepts the same normalized
        FactorySessionExecutionRequest as POST /factory-sessions/async and uses
        the same workflow source resolution order and requestId idempotency
        semantics. When the session reaches a terminal result before timeout, the
        response includes FactorySessionResult. Timeout responses use
        syncOutcome = TIMED_OUT and must not imply the session was canceled
        unless wait.cancelOnTimeout was explicitly true in the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionExecutionRequest'
      responses:
        '200':
          description: Sync durable execution completed, timed out, or returned while still running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionSyncExecutionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/ExecutionRequestIdConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions:
    get:
      tags:
        - Factory
      operationId: listFactorySessions
      summary: List factory sessions
      description: >-
        Lists factory sessions for the requested scope. live returns workspace
        sessions kept open by the runtime host, including the reserved default
        session. persisted returns durable execution sessions stored outside the
        live workspace. all returns both live and persisted summaries. Persisted
        summaries cover active, terminal, interrupted, and stale-lease durable
        sessions without exposing raw workflow source or unrestricted host paths.
      parameters:
        - $ref: '#/components/parameters/FactorySessionListScope'
      responses:
        '200':
          description: Factory session summaries for the requested scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFactorySessionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Factory
      operationId: openFactorySession
      summary: Open another live factory session
      description: >-
        Live-session compatibility API for opening workspace tabs from a folder
        path and optional target selection. This route is not the primary durable
        workflow execution entrypoint; use POST /factory-sessions/async or POST
        /factory-sessions/sync for dynamic workflow-backed durable execution.
        When `validateOnly` is true, the request validates the folder and optional
        target selection without creating a session. When the folder exposes more
        than one runnable target and no explicit target was provided, the response
        returns typed target metadata instead of creating a session yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenFactorySessionRequest'
      responses:
        '200':
          description: Session was opened or the caller needs to choose one of the returned runnable targets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenFactorySessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/result:
    get:
      tags:
        - Factory
      operationId: getFactorySessionResult
      summary: Get one live factory session result
      description: Returns the terminal session result for one live factory session. JavaScript workflow sessions expose final result and checkpoint artifact refs without raw checkpoint bodies or unrestricted host paths. Durable workflow execution results use GET /factory-sessions/{session_id}/results instead.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Terminal session result projection for the targeted live session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLiveResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/results:
    get:
      tags:
        - Factory
      operationId: getFactorySessionResults
      summary: Get durable factory session results
      description: >-
        Returns final or partial durable workflow outputs for one factory session.
        Supports mode=final|partial and includeArtifacts=true|false without requiring
        clients to scrape event streams or logs. Non-ready, unavailable, and
        failed-with-partial states return typed FactorySessionResult bodies with
        session identity, current session status, and actionable failure or
        availability details when known.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/FactorySessionResultMode'
        - $ref: '#/components/parameters/FactorySessionResultIncludeArtifacts'
      responses:
        '200':
          description: Durable session result retrieval response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/dispatches:
    get:
      tags:
        - Factory
      operationId: listFactorySessionDispatches
      summary: List durable factory session dispatches
      description: >-
        Returns dispatch summaries for one factory session with dispatch id,
        status, dispatch kind, phase, label, attempt, runner/model metadata when
        available, provider-session correlation refs, usage, warnings, output
        artifact ids, and failure details. Petri and JavaScript dispatches share
        the neutral summary shape; orchestrator-specific detail is available on
        GET /factory-sessions/{session_id}/dispatches/{dispatch_id}.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/FactoryDispatchPhase'
        - $ref: '#/components/parameters/FactoryDispatchStatusFilter'
      responses:
        '200':
          description: Dispatch summaries for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFactorySessionDispatchesResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/dispatches/{dispatch_id}:
    get:
      tags:
        - Factory
      operationId: getFactorySessionDispatch
      summary: Get one durable factory session dispatch
      description: >-
        Returns one dispatch detail for the targeted session. Petri transition
        dispatches expose optional petri projections and JavaScript workflow
        dispatches expose optional javascript projections without forcing
        orchestrator-specific fields on neutral clients.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/DispatchID'
      responses:
        '200':
          description: Dispatch detail for the targeted session and dispatch id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactoryDispatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/artifacts:
    get:
      tags:
        - Factory
      operationId: listFactorySessionArtifacts
      summary: List durable factory session artifacts
      description: >-
        Returns artifact metadata for one factory session with artifact id, kind,
        visibility, content hash, size, created time, dispatch relation,
        secret-redaction counts, audit mode, and safe retrieval refs without
        exposing unrestricted host filesystem paths by default.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Artifact metadata rows for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFactorySessionArtifactsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/artifacts/{artifact_id}:
    get:
      tags:
        - Factory
      operationId: getFactorySessionArtifact
      summary: Get one durable factory session artifact
      description: >-
        Returns artifact metadata plus inlined content or a safe content ref
        according to artifact visibility and payload size. Responses must not
        expose unrestricted host filesystem paths by default.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/ArtifactID'
      responses:
        '200':
          description: Artifact detail for the targeted session and artifact id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionArtifactDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/approve:
    post:
      tags:
        - Factory
      operationId: approveFactorySession
      summary: Approve one durable factory session
      description: >-
        Approves requested orchestrator policy for one durable factory session
        in AWAITING_APPROVAL state. Returns the updated session or a typed
        lifecycle-control outcome for no-op, invalid-state, terminal-session, or
        conflict cases. Approval responses include the effective policy hash and
        approval preview identity when available.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionApproveRequest'
      responses:
        '200':
          description: Approval applied immediately or the session already satisfied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Approval control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/pause:
    post:
      tags:
        - Factory
      operationId: pauseFactorySession
      summary: Pause one Factory Session
      description: >-
        Pauses one live or durable Factory Session while preserving inspectable
        partial results, dispatches, artifacts, and buffered inbound submissions
        or completed worker results. Live workspace sessions use the same route
        family as durable execution sessions. Automatic progression stops until
        resume. Returns the updated session or a typed lifecycle-control
        outcome for no-op, invalid-state, terminal-session, or conflict cases.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionLifecycleControlRequest'
      responses:
        '200':
          description: Pause applied immediately or the session was already paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Pause control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/resume:
    post:
      tags:
        - Factory
      operationId: resumeFactorySession
      summary: Resume one Factory Session
      description: >-
        Resumes one paused live or durable Factory Session while preserving
        inspectable partial results, dispatches, and artifacts. Live workspace
        sessions use the same route family as durable execution sessions. Wakes
        the runtime internally and drains ready buffered submissions and
        completed worker results without requiring a new external signal.
        Returns the updated session or a typed lifecycle-control outcome for
        no-op, invalid-state, terminal-session, or conflict cases.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionLifecycleControlRequest'
      responses:
        '200':
          description: Resume applied immediately or the session was already running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Resume control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/cancel:
    post:
      tags:
        - Factory
      operationId: cancelFactorySession
      summary: Cancel one durable factory session
      description: >-
        Requests graceful cancellation for one durable factory session while
        preserving inspectable partial results, dispatches, and artifacts.
        Returns the updated session or a typed lifecycle-control outcome for
        no-op, invalid-state, terminal-session, or conflict cases.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionLifecycleControlRequest'
      responses:
        '200':
          description: Cancel applied immediately or the session was already canceled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Cancel control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/terminate:
    post:
      tags:
        - Factory
      operationId: terminateFactorySession
      summary: Terminate one durable factory session
      description: >-
        Forcefully terminates one durable factory session while preserving
        inspectable partial results, dispatches, and artifacts. Returns the
        updated session or a typed lifecycle-control outcome for no-op,
        invalid-state, terminal-session, or conflict cases.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionLifecycleControlRequest'
      responses:
        '200':
          description: Termination applied immediately or the session was already terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Terminate control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/retry-dispatch:
    post:
      tags:
        - Factory
      operationId: retryFactorySessionDispatch
      summary: Retry one durable factory session dispatch
      description: >-
        Retries one failed or interrupted dispatch within the targeted durable
        factory session. The response links the retry to the session and dispatch
        state and preserves inspectable partial results, dispatches, and
        artifacts after the control operation.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionRetryDispatchRequest'
      responses:
        '200':
          description: Retry dispatch applied immediately or produced a typed no-op outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Retry-dispatch control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/interrupt-dispatch:
    post:
      tags:
        - Factory
      operationId: interruptFactorySessionDispatch
      summary: Interrupt one active durable factory session dispatch
      description: >-
        Interrupts one active dispatch within the targeted durable factory
        session. The response links the interruption to the session and dispatch
        state and preserves inspectable partial results, dispatches, and
        artifacts after the control operation.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionInterruptDispatchRequest'
      responses:
        '200':
          description: Interrupt dispatch applied immediately or produced a typed no-op outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Interrupt-dispatch control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/partial-result:
    get:
      tags:
        - Factory
      operationId: getFactorySessionPartialResult
      summary: Get one factory session partial result
      description: Returns the current partial result for one live JavaScript workflow session. Checkpoint artifact refs and summaries are returned without raw checkpoint bodies or unrestricted host paths.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Partial session result projection for the targeted live session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionPartialResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}:
    get:
      tags:
        - Factory
      operationId: getFactorySession
      summary: Get one factory session
      description: >-
        Returns the canonical factory session inspection read model. Live
        workspace sessions return the existing FactorySession projection with
        orchestrator identity, lifecycle status, progress, budgets, usage, and
        kind-specific runtime projections. Durable execution sessions return a
        durable read model with status, resolved source ref/hash, phase
        summaries, progress counts, budgets, usage, policy hash, artifact refs,
        result summary, failure details, and lifecycle timestamps. Responses
        expose public source refs and hashes without raw workflow source or
        diagnostic artifacts.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Canonical factory session inspection read model for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionGetResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Factory
      operationId: closeFactorySession
      summary: Close one live factory session
      description: Stops the selected live factory session, removes it from the workspace session list, and leaves all remaining sessions running unchanged.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
          description: Stable live factory session identifier. Use `~default` to close the default compatibility session explicitly.
      responses:
        '204':
          description: Session was stopped and removed from the live workspace.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/factory:
    get:
      tags:
        - Factory
      operationId: getCurrentFactoryBySessionId
      summary: Get current factory for one session
      description: Returns the current factory definition owned by the explicitly selected live session together with server-managed version metadata for replacement saves. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Current active factory definition and version metadata for the targeted session, or the active default root runtime when the default session has no durable current-factory pointer yet. Default-runtime responses use the reserved `UNDEFINED` identifier in `Factory.name`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factory'
              examples:
                defaultRootRuntime:
                  summary: Default root runtime is active.
                  value:
                    name: UNDEFINED
                    workTypes:
                      - name: task
                        states:
                          - name: init
                            type: INITIAL
                          - name: done
                            type: TERMINAL
                    workers:
                      - name: planner
                        type: MODEL_WORKER
                        modelProvider: CLAUDE
                        executorProvider: SCRIPT_WRAP
                        model: claude-sonnet-4-20250514
                    workstations:
                      - name: plan-task
                        behavior: STANDARD
                        type: MODEL_WORKSTATION
                        worker: planner
                        inputs:
                          - workType: task
                            state: init
                        outputs:
                          - workType: task
                            state: done
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Factory
      operationId: saveCurrentFactoryBySessionId
      summary: Save factory for one session
      description: >-
        Submits one complete factory definition to the explicitly selected live
        session using an explicit save mode. Omitted `mode` defaults to
        `REPLACE_CURRENT`, which replaces the factory already current in the
        session. `UPSERT_NAMED_AND_ACTIVATE` persists under the session factory
        root using `factory.name`, updates the session current-factory pointer,
        and activates that runtime when idle. Clients should echo the
        server-managed `factory.version` field from the latest current-factory
        read for replacement saves. Unknown session identifiers return
        NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveFactoryForSessionRequest'
            examples:
              replaceCurrent:
                summary: Replace the factory already current in the session.
                value:
                  mode: REPLACE_CURRENT
                  factory:
                    name: alpha
                    version:
                      logical: '2'
                      physical: '2026-05-30T12:00:00.000000000Z'
                    workTypes:
                      - name: task
                        states:
                          - name: init
                            type: INITIAL
                          - name: done
                            type: TERMINAL
                    workers: []
                    workstations: []
              upsertNamedAndActivate:
                summary: Create or replace a named factory and activate it in the session.
                value:
                  mode: UPSERT_NAMED_AND_ACTIVATE
                  factory:
                    name: beta
                    workTypes:
                      - name: task
                        states:
                          - name: init
                            type: INITIAL
                          - name: done
                            type: TERMINAL
                    workers: []
                    workstations: []
      responses:
        '200':
          description: Saved current factory definition and new version metadata for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factory'
        '400':
          $ref: '#/components/responses/SaveCurrentFactoryBadRequest'
        '409':
          $ref: '#/components/responses/SaveCurrentFactoryConflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/factory/workstations/{workstation_name}/prompt-template-contract:
    get:
      tags:
        - Factory
      operationId: getCurrentFactoryWorkstationPromptTemplateContractBySessionId
      summary: Get workstation prompt-template contract
      description: Returns the authoritative prompt-variable reference and unavailable-access patterns for the selected current-factory workstation editing context.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - name: workstation_name
          in: path
          required: true
          description: Customer-authored workstation name to inspect in the current factory.
          schema:
            type: string
      responses:
        '200':
          description: Prompt-template contract for the selected workstation editing context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplateContract'
        '404':
          $ref: '#/components/responses/CurrentFactoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/factory/workstations/{workstation_name}/prompt-template-validation:
    post:
      tags:
        - Factory
      operationId: validateCurrentFactoryWorkstationPromptTemplateBySessionId
      summary: Validate workstation prompt template
      description: Validates a prompt draft against the authoritative current-factory workstation prompt contract and returns typed syntax or variable diagnostics.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - name: workstation_name
          in: path
          required: true
          description: Customer-authored workstation name to validate against in the current factory.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptTemplateValidationRequest'
      responses:
        '200':
          description: Prompt validation result for the selected workstation editing context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplateValidationResult'
        '404':
          $ref: '#/components/responses/CurrentFactoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
