          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionResourceCapacityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionResourceCapacityConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/artifacts:
    get:
      tags:
        - Factory
      operationId: listFactorySessionArtifacts
      summary: List durable factory session artifacts
      description: >-
        Returns artifact metadata for one factory session with artifact id, kind,
        visibility, content hash, size, created time, dispatch relation,
        secret-redaction counts, audit mode, and safe retrieval refs without
        exposing unrestricted host filesystem paths by default.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Artifact metadata rows for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFactorySessionArtifactsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/artifacts/{artifact_id}:
    get:
      tags:
        - Factory
      operationId: getFactorySessionArtifact
      summary: Get one durable factory session artifact
      description: >-
