          description: Approval applied immediately or the session already satisfied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Approval control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/pause:
    post:
      tags:
        - Factory
      operationId: pauseFactorySession
      summary: Pause one Factory Session
      description: >-
        Pauses one live or durable Factory Session while preserving inspectable
        partial results, dispatches, artifacts, and buffered inbound submissions
        or completed worker results. Live workspace sessions use the same route
        family as durable execution sessions. Automatic progression stops until
        resume. Returns the updated session or a typed lifecycle-control
        outcome for no-op, invalid-state, terminal-session, or conflict cases.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionLifecycleControlRequest'
      responses:
        '200':
          description: Pause applied immediately or the session was already paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Pause control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/resume:
    post:
      tags:
        - Factory
      operationId: resumeFactorySession
      summary: Resume one Factory Session
      description: >-
        Resumes one paused live or durable Factory Session while preserving
        inspectable partial results, dispatches, and artifacts. Live workspace
        sessions use the same route family as durable execution sessions. Wakes
        the runtime internally and drains ready buffered submissions and
        completed worker results without requiring a new external signal.
        Returns the updated session or a typed lifecycle-control outcome for
        no-op, invalid-state, terminal-session, or conflict cases.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionLifecycleControlRequest'
      responses:
        '200':
          description: Resume applied immediately or the session was already running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Resume control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/cancel:
    post:
      tags:
        - Factory
      operationId: cancelFactorySession
      summary: Cancel one durable factory session
      description: >-
        Requests graceful cancellation for one durable factory session while
        preserving inspectable partial results, dispatches, and artifacts.
        Returns the updated session or a typed lifecycle-control outcome for
        no-op, invalid-state, terminal-session, or conflict cases.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionLifecycleControlRequest'
      responses:
        '200':
          description: Cancel applied immediately or the session was already canceled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Cancel control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/terminate:
    post:
      tags:
        - Factory
      operationId: terminateFactorySession
      summary: Terminate one durable factory session
      description: >-
        Forcefully terminates one durable factory session while preserving
        inspectable partial results, dispatches, and artifacts. Returns the
        updated session or a typed lifecycle-control outcome for no-op,
        invalid-state, terminal-session, or conflict cases.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionLifecycleControlRequest'
      responses:
        '200':
          description: Termination applied immediately or the session was already terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Terminate control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/retry-dispatch:
