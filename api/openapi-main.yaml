openapi: 3.0.3
info:
  title: Agent Factory API
  version: 0.1.0
  license:
    name: MIT
  description: |
    Current Agent Factory runtime API contract. This file captures existing
    handler behavior for schema standardization and intentionally does not
    redesign route names, pagination, or response fields.
servers:
  - url: http://localhost:7437
    description: Local Agent Factory API server
security: []
tags:
  - name: Work
    description: Runtime work submission and inspection.
  - name: Factory
    description: Named factory activation and current-factory inspection.
  - name: Runtime
    description: Runtime state, event stream, and trace inspection.
  - name: Provider Sessions
    description: Provider-owned session diagnostics for dashboard inspection.
  - name: Worker Sessions
    description: Worker Session observations correlated with Factory Work.
  - name: Models
    description: Model discovery and capability inspection for the current runtime.
  - name: Metrics
    description: Canonical runtime usage and exact operator-configured cost reports.
  - name: Workflows
    description: Stored workflow inspection.
paths:
  /metrics:
    get:
      tags:
        - Metrics
      operationId: getMetrics
      summary: Get canonical runtime metrics
      description: >-
        Reads the canonical Factory Visualization metrics projection. The
        default scope covers all retained Factory Sessions. When session_id is
        supplied, the server resolves that public live Factory Session ID
        through Factory Sessions before reading retained metrics; it never
        guesses a scope from the current working directory or definition.
        A valid resolved scope with no retained facts returns an explicit empty
        report.
      parameters:
        - name: session_id
          in: query
          required: false
          description: Optional discoverable live Factory Session identity.
          schema:
            type: string
      responses:
        '200':
          description: Canonical runtime metrics for the selected scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsReport'
        '400':
          $ref: './components/responses/BadRequest.yaml'
        '404':
          $ref: './components/responses/NotFound.yaml'
        '503':
          $ref: './components/responses/MetricsSessionScopeUnavailable.yaml'
  /metrics/costs:
    get:
      tags:
        - Metrics
      operationId: getMetricsCosts
      summary: Get exact runtime cost rollups
      description: >-
        Values canonical Factory Runtime usage with the operator's explicit
        price table. The default scope covers all Factory Sessions. Supplying
        an unknown-but-valid Factory Session ID returns a successful no-usage
        report for that scope rather than unrelated usage. Missing prices are
        returned as UNPRICED rows and are never treated as zero. The server
        bounds one cost query at eight seconds and returns a typed timeout
        response when the canonical read does not complete in that window.
      parameters:
        - name: session_id
          in: query
          required: false
          description: Optional Factory Session identity to scope the report.
          schema:
            type: string
      responses:
        '200':
          description: Exact cost report with priced and unpriced coverage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostsReport'
        '400':
          $ref: './components/responses/BadRequest.yaml'
        '408':
          $ref: './components/responses/RequestTimeout.yaml'
        '500':
          $ref: './components/responses/InternalError.yaml'
        '504':
          $ref: './components/responses/GatewayTimeout.yaml'
  /worker-sessions:
    get:
      tags:
        - Worker Sessions
      operationId: listWorkerSessions
      summary: List top-level Worker Session observations
      description: >-
        Lists Worker Session observations through their stable top-level
        identity across the process. With no scope parameter, the fleet-wide
        view includes direct and Factory-originated observations. Explicit
        direct or factory scope filters remain available. Results are
        deterministically ordered by Worker Session identity and use an opaque
        cursor for bounded pagination. State filters compose with the selected
        origin scope, and limit is applied after filtering.
      parameters:
        - name: scope
          in: query
          required: false
          description: Origin scope to inspect. Omit for the fleet-wide view.
          schema:
            type: string
            enum:
              - direct
              - factory
              - all
            default: all
        - name: state
          in: query
          required: false
          description: Optional repeated Worker Session lifecycle state filters.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - RESERVED
                - STARTING
                - RUNNING
                - PAUSED
                - COMPLETED
                - FAILED
                - CANCELED
                - TERMINATED
        - $ref: '#/components/parameters/MaxResults'
        - $ref: '#/components/parameters/WorkerSessionLimit'
        - $ref: '#/components/parameters/NextToken'
      responses:
        '200':
          description: Deterministically ordered top-level Worker Session observations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkerSessionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Worker Sessions
      operationId: startWorkerSession
      summary: Start one directly resolved Worker Session
      description: >-
        Reserves and starts one already-resolved Worker execution. The server
        returns 202 only after the Worker Session identity is reserved, its
        opening record is retained-readable and subscribable on the returned
        event topic, and Workers has admitted the execution. The requestId is
        required for safe retries; replaying it with the same normalized
        start tuple returns the same Worker Session identity without another
        dispatch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerSessionStartRequest'
      responses:
        '202':
          description: Worker Session was admitted and is observable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerSessionStartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/WorkerSessionStartConflict'
        '503':
          $ref: '#/components/responses/WorkerSessionStartUnavailable'
  /worker-sessions/{worker_session_id}:
    get:
      tags:
        - Worker Sessions
      operationId: getWorkerSessionObservationByWorkerSessionId
      summary: Show one top-level Worker Session observation
      description: >-
        Returns one authoritative Worker Session observation by its stable
        Worker Session identity. Direct observations expose their origin and
        any recorded Provider Session association without requiring callers to
        reconstruct a provider tuple.
      parameters:
        - $ref: '#/components/parameters/WorkerSessionID'
      responses:
        '200':
          description: One top-level Worker Session observation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerSessionObservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /worker-sessions/{worker_session_id}/continue:
    post:
      tags:
        - Worker Sessions
      operationId: continueWorkerSession
      summary: Continue one terminal Worker Session
      description: >-
        Reserves one distinct successor Worker Session for a terminal source
        Worker Session and resumes the exact Provider Session association
        recorded by the server. The requestId and successor identity are
        idempotent inputs. A 202 response is returned only after the successor
        opening event is readable/subscribable and Workers has admitted the
        continuation; terminal output remains asynchronous.
      parameters:
        - $ref: '#/components/parameters/WorkerSessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerSessionContinueRequest'
      responses:
        '202':
          description: The successor Worker Session was admitted and is observable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerSessionContinueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/WorkerSessionContinuationConflict'
        '503':
          $ref: '#/components/responses/WorkerSessionContinuationUnavailable'
  /worker-sessions/{worker_session_id}/interrupt:
    post:
      tags:
        - Worker Sessions
      operationId: interruptWorkerSession
      summary: Interrupt one active Worker Session into a replacement
      description: >-
        Cancels the exact active source Worker Session dispatch, waits for its
        authoritative CANCELED outcome, and admits one distinct successor with
        replacement input. The requestId and successor identity are idempotent
        inputs. A 202 response is returned only after source cancellation and
        successor admission have crossed their authoritative barriers;
        successor terminal output remains asynchronous. Callers that need
        terminal output should inspect or stream the successor Worker Session.
      parameters:
        - $ref: '#/components/parameters/WorkerSessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerSessionInterruptRequest'
      responses:
        '202':
          description: The source was canceled and the replacement successor was admitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerSessionInterruptResponse'
        '400':
          $ref: '#/components/responses/WorkerSessionInterruptBadRequest'
        '404':
          $ref: '#/components/responses/WorkerSessionInterruptNotFound'
        '409':
          $ref: '#/components/responses/WorkerSessionInterruptConflict'
        '500':
          $ref: '#/components/responses/WorkerSessionInterruptInternalError'
        '503':
          $ref: '#/components/responses/WorkerSessionInterruptUnavailable'
  /worker-sessions/{worker_session_id}/pause:
    post:
      tags:
        - Worker Sessions
      operationId: pauseWorkerSession
      summary: Pause one active Worker Session
      description: >-
        Cancels the exact admitted Worker Session dispatch through the
        Workers boundary and returns only after the authoritative PAUSED
        snapshot is available. Repeated requests are idempotent.
      parameters:
        - $ref: '#/components/parameters/WorkerSessionID'
      responses:
        '200':
          description: The Worker Session control result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerSessionControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/WorkerSessionControlConflict'
        '500':
          $ref: '#/components/responses/WorkerSessionControlInternalError'
        '503':
          $ref: '#/components/responses/WorkerSessionControlUnavailable'
  /worker-sessions/{worker_session_id}/resume:
    post:
      tags:
        - Worker Sessions
      operationId: resumeWorkerSession
      summary: Resume one paused Worker Session
      description: >-
        Admits exactly one continuation of a paused Worker Session using the
        exact Provider Session association recorded on that session. Repeated
        requests are idempotent and never select a fallback Provider Session.
      parameters:
        - $ref: '#/components/parameters/WorkerSessionID'
      responses:
        '200':
          description: The Worker Session control result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerSessionControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/WorkerSessionControlConflict'
        '500':
          $ref: '#/components/responses/WorkerSessionControlInternalError'
        '503':
          $ref: '#/components/responses/WorkerSessionControlUnavailable'
  /worker-sessions/{worker_session_id}/cancel:
    post:
      tags:
        - Worker Sessions
      operationId: cancelWorkerSession
      summary: Cancel one Worker Session
      description: >-
        Requests cancellation of the exact admitted Worker Session dispatch.
        Cancellation is terminal and repeated requests are idempotent.
      parameters:
        - $ref: '#/components/parameters/WorkerSessionID'
      responses:
        '200':
          description: The Worker Session control result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerSessionControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/WorkerSessionControlConflict'
        '500':
          $ref: '#/components/responses/WorkerSessionControlInternalError'
        '503':
          $ref: '#/components/responses/WorkerSessionControlUnavailable'
  /worker-sessions/{worker_session_id}/terminate:
    post:
      tags:
        - Worker Sessions
      operationId: terminateWorkerSession
      summary: Terminate one Worker Session
      description: >-
        Requests termination of the exact admitted Worker Session dispatch and
        joins its completion before returning. Repeated and concurrent calls
        are idempotent and return the canonical terminal snapshot.
      parameters:
        - $ref: '#/components/parameters/WorkerSessionID'
      responses:
        '200':
          description: The Worker Session control result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerSessionControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/WorkerSessionControlConflict'
        '500':
          $ref: '#/components/responses/WorkerSessionControlInternalError'
        '503':
          $ref: '#/components/responses/WorkerSessionControlUnavailable'
  /worker-sessions/{worker_session_id}/events:
    get:
      tags:
        - Worker Sessions
      operationId: streamWorkerSessionEventsByTopLevelWorkerSessionId
      summary: Stream top-level Worker Session events
      description: >-
        Streams the retained and live Worker Session Events topic by stable
        Worker Session identity. The server resolves the exact topic from its
        own observation registry; callers do not supply Provider Session
        identity fields. Retained records are emitted first, followed by live
        records unless replayOnly is true.
      parameters:
        - $ref: '#/components/parameters/WorkerSessionID'
        - name: replayOnly
          in: query
          required: false
          description: Drain retained history without registering a live follower.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Retained then live Worker Session event frames.
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events where each data frame is serialized JSON matching WorkerSessionEvent.
              x-event-schema: '#/components/schemas/WorkerSessionEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /worker-sessions/{worker_session_id}/transcript:
    get:
      tags:
        - Worker Sessions
      operationId: readWorkerSessionTranscriptByWorkerSessionId
      summary: Read one top-level Worker Session transcript
      description: >-
        Returns the normalized transcript for a terminal Worker Session by its
        stable identity. Provider Session association and projection are
        resolved by the Worker Sessions service; callers cannot substitute a
        provider, kind, or provider-issued id tuple.
      parameters:
        - $ref: '#/components/parameters/WorkerSessionID'
      responses:
        '200':
          description: Normalized transcript for a finished Worker Session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerSessionTranscriptResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The Worker Session is still active and has no final transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/work:
    post:
      tags:
        - Work
      operationId: submitWorkBySessionId
      summary: Submit work for one session
      description: Submits one work item to the explicitly selected live factory session. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitWorkRequest'
      responses:
        '201':
          description: Work was accepted for processing by the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitWorkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Work
      operationId: listWorkBySessionId
      summary: List work for one session
      description: Lists current work tokens from the engine state snapshot owned by the explicitly selected live factory session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/MaxResults'
        - $ref: '#/components/parameters/NextToken'
        - $ref: '#/components/parameters/StateName'
        - $ref: '#/components/parameters/StateType'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/WorkListName'
        - $ref: '#/components/parameters/WorkListWorkTypeName'
        - $ref: '#/components/parameters/WorkListTraceId'
        - $ref: '#/components/parameters/WorkListTerminal'
        - $ref: '#/components/parameters/WorkListNonTerminal'
        - $ref: '#/components/parameters/WorkListCounts'
        - $ref: '#/components/parameters/WorkListIncludeSuperseded'
      responses:
        '200':
          description: >-
            Current work tokens for the targeted session. All supplied filters
            compose with logical AND before deterministic ordering and
            pagination. When counts=true, counts.total is the complete
            filtered selection before page slicing and is stable across pages
            of an unchanged session snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/approvals:
    get:
      tags:
        - Work
      operationId: listHumanApprovalsBySessionId
      summary: List pending human approvals for one session
      description: >-
        Lists durable HUMAN_APPROVAL requests reconstructed from the canonical
        Factory Event ledger for the explicitly selected Factory Session.
        Results are deterministically ordered by approval identity and are
        read-only in this lane.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/HumanApprovalStatus'
      responses:
        '200':
          description: Deterministically ordered pending approvals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListHumanApprovalsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/approvals/{approval_id}:
    get:
      tags:
        - Work
      operationId: getHumanApprovalBySessionId
      summary: Show one pending human approval
      description: Returns one durable pending HUMAN_APPROVAL projection by stable approval identity.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/HumanApprovalID'
      responses:
        '200':
          description: One pending human approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanApproval'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/worker-sessions:
    get:
      tags:
        - Worker Sessions
      operationId: listWorkerSessionsBySessionId
      summary: List Worker Sessions correlated with one Work item
      description: Returns authoritative Worker Session observations for the requested Work item in the explicitly selected Factory Session. A known Work with no correlated sessions returns an empty sessions array; an unknown Work returns NOT_FOUND.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - name: workId
          in: query
          required: true
          description: Work identity whose Worker Session attempts should be listed.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Deterministically ordered Worker Session observations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkerSessionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorkerSessionRecordingUnavailable'
  /factory-sessions/{session_id}/worker-sessions/events:
    get:
      tags:
        - Worker Sessions
      operationId: streamWorkerSessionEventsBySessionId
      summary: Stream retained and live Worker Session events
      description: >-
        Streams the canonical Worker Session Events topic for the exact
        Provider Session identity in the explicitly selected Factory Session.
        Retained records are emitted first in aggregate order, followed by
        live records unless replayOnly is true. In replay-only mode the
        retained head is captured before delivery, no live follower is
        registered, and one REPLAY_SUMMARY frame closes the stream after the
        retained drain. Each data frame is serialized JSON matching
        WorkerSessionEvent. The terminal event is marked TERMINAL for an active
        session or TERMINAL_REPLAY for an already-terminal session. Source
        failures are emitted as an explicit SOURCE_FAILURE frame so clients
        can preserve complete records already written and return a typed
        non-success result. Every event record carries its Worker Session
        cursor. after_position is exclusive and may be paired with
        stream_generation_id; cursors are scoped to the Worker Session and
        never fall back to another history. The retained snapshot and live
        registration share one handoff, so records committed after the
        captured high-water mark are delivered exactly once. A terminal
        durable recording carries a COMPLETE, DEGRADED, or INCOMPLETE replay
        summary and does not wait for an unavailable live source.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - name: provider
          in: query
          required: true
          description: Provider that issued the correlated session identity.
          schema:
            $ref: '#/components/schemas/LoadableProviderSessionProvider'
        - name: kind
          in: query
          required: true
          description: Provider-session identifier kind.
          schema:
            $ref: '#/components/schemas/LoadableProviderSessionKind'
        - name: id
          in: query
          required: true
          description: Provider-issued session identifier, not a filesystem path.
          schema:
            type: string
            minLength: 1
        - name: replayOnly
          in: query
          required: false
          description: Drain the retained history through a captured Events head without registering a live follower.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/WorkerSessionAfterPosition'
        - $ref: '#/components/parameters/AfterSequence'
        - $ref: '#/components/parameters/WorkerSessionStreamGenerationID'
      responses:
        '200':
          description: Retained then live Worker Session event frames, or a finite retained replay ending in REPLAY_SUMMARY.
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events where each data frame is serialized JSON matching WorkerSessionEvent.
              x-event-schema: '#/components/schemas/WorkerSessionEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorkerSessionRecordingUnavailable'
  /factory-sessions/{session_id}/worker-sessions/{worker_session_id}/events:
    get:
      tags:
        - Worker Sessions
      operationId: streamWorkerSessionEventsByWorkerSessionId
      summary: Stream retained and live Worker Session events by Worker Session identity
      description: >-
        Streams the canonical Worker Session Events topic for the stable Worker
        Session identity returned by the Worker Sessions list operation. This
        provider-neutral path remains available when the provider did not emit
        a native Provider Session reference. Retained records are emitted first
        in aggregate order, followed by live records unless replayOnly is true.
        In replay-only mode the retained head is captured before delivery, no
        live follower is registered, and one REPLAY_SUMMARY frame closes the
        stream after the retained drain. Every event record carries its Worker
        Session cursor. after_position is exclusive and may be paired with
        stream_generation_id; a cursor from another Worker Session, a future
        position, stale retained history, or an unavailable generation is
        rejected with a typed error. In follow mode the durable-to-live
        handoff is atomic and duplicate overlap is suppressed.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/WorkerSessionID'
        - name: replayOnly
          in: query
          required: false
          description: Drain the retained history through a captured Events head without registering a live follower.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/WorkerSessionAfterPosition'
        - $ref: '#/components/parameters/AfterSequence'
        - $ref: '#/components/parameters/WorkerSessionStreamGenerationID'
      responses:
        '200':
          description: Retained then live Worker Session event frames, or a finite retained replay ending in REPLAY_SUMMARY.
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events where each data frame is serialized JSON matching WorkerSessionEvent.
              x-event-schema: '#/components/schemas/WorkerSessionEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorkerSessionRecordingUnavailable'
  /factory-sessions/{session_id}/worker-sessions/{worker_session_id}:
    get:
      tags:
        - Worker Sessions
      operationId: getWorkerSessionObservationByFactorySessionAndWorkerSessionId
      summary: Show one Worker Session observation by Worker Session ID
      description: >-
        Returns the authoritative observation for the exact Worker Session
        identity in the explicitly selected Factory Session. The Worker
        Session ID is the canonical lookup key for live and durable history;
        Provider Session identity is optional enrichment and is never required
        for a Worker to be observable.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/WorkerSessionID'
      responses:
        '200':
          description: One detached Worker Session observation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerSessionObservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
