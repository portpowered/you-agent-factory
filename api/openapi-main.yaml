openapi: 3.0.3
info:
  title: Agent Factory API
  version: 0.1.0
  license:
    name: MIT
  description: |
    Current Agent Factory runtime API contract. This file captures existing
    handler behavior for schema standardization and intentionally does not
    redesign route names, pagination, or response fields.
servers:
  - url: http://localhost:7437
    description: Local Agent Factory API server
security: []
tags:
  - name: Work
    description: Runtime work submission and inspection.
  - name: Factory
    description: Named factory activation and current-factory inspection.
  - name: Runtime
    description: Runtime state, event stream, and trace inspection.
  - name: Provider Sessions
    description: Provider-owned session diagnostics for dashboard inspection.
  - name: Models
    description: Model discovery and capability inspection for the current runtime.
  - name: Workflows
    description: Stored workflow inspection.
paths:
  /work:
    post:
      tags:
        - Work
      operationId: submitWork
      summary: Submit work
      description: Submits one work item to the running factory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitWorkRequest'
            examples:
              textOnlyContent:
                summary: Submit one work item with ordered text content parts.
                value:
                  name: summary-draft
                  workTypeName: task
                  content:
                    - type: text
                      text: Draft a short project summary.
                    - type: text
                      text: Keep it under 120 words.
              textPlusImageContent:
                summary: Submit one work item with ordered text and image content parts.
                value:
                  name: screenshot-review
                  workTypeName: task
                  content:
                    - type: text
                      text: Review this screenshot and list the highest-risk UI issues.
                    - type: image
                      file: fixtures/ui/dashboard-error-state.png
      responses:
        '201':
          description: Work was accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitWorkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Work
      operationId: listWork
      summary: List work
      description: Lists current work tokens from the engine state snapshot.
      parameters:
        - $ref: '#/components/parameters/MaxResults'
        - $ref: '#/components/parameters/NextToken'
        - $ref: '#/components/parameters/StateName'
        - $ref: '#/components/parameters/StateType'
        - $ref: '#/components/parameters/SortBy'
      responses:
        '200':
          description: Current work tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /factories/{factory_id}/work:
    post:
      tags:
        - Work
      operationId: submitWorkByFactoryId
      summary: Submit work for one session
      description: Submits one work item to the explicitly selected live factory session. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/FactoryID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitWorkRequest'
      responses:
        '201':
          description: Work was accepted for processing by the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitWorkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Work
      operationId: listWorkByFactoryId
      summary: List work for one session
      description: Lists current work tokens from the engine state snapshot owned by the explicitly selected live factory session.
      parameters:
        - $ref: '#/components/parameters/FactoryID'
        - $ref: '#/components/parameters/MaxResults'
        - $ref: '#/components/parameters/NextToken'
        - $ref: '#/components/parameters/StateName'
        - $ref: '#/components/parameters/StateType'
        - $ref: '#/components/parameters/SortBy'
      responses:
        '200':
          description: Current work tokens for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /work-requests/{request_id}:
    put:
      tags:
        - Work
      operationId: upsertWorkRequest
      summary: Upsert work request
      description: Submits or retries one canonical work request batch. The request identifier in the URL must match the request_id in the JSON body, and repeated request IDs are idempotent.
      parameters:
        - name: request_id
          in: path
          required: true
          description: Stable request identifier used for idempotent submission.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkRequest'
      responses:
        '201':
          description: Work request was accepted or had already been accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertWorkRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /factories/{factory_id}/work-requests/{request_id}:
    put:
      tags:
        - Work
      operationId: upsertWorkRequestByFactoryId
      summary: Upsert work request for one session
      description: Submits or retries one canonical work request batch against the explicitly selected live factory session. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/FactoryID'
        - name: request_id
          in: path
          required: true
          description: Stable request identifier used for idempotent submission.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkRequest'
      responses:
        '201':
          description: Work request was accepted or had already been accepted by the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertWorkRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /work/{id}:
    get:
      tags:
        - Work
      operationId: getWork
      summary: Get work token
      description: Returns one token by token ID from the current marking.
      parameters:
        - $ref: '#/components/parameters/WorkOrTokenID'
      responses:
        '200':
          description: Work token with history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factories/{factory_id}/work/{id}:
    get:
      tags:
        - Work
      operationId: getWorkByFactoryId
      summary: Get work token for one session
      description: Returns one token by token ID from the current marking owned by the explicitly selected live factory session.
      parameters:
        - $ref: '#/components/parameters/FactoryID'
        - $ref: '#/components/parameters/WorkOrTokenID'
      responses:
        '200':
          description: Work token with history for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /events:
    get:
      tags:
        - Runtime
      operationId: getEvents
      summary: Stream factory events
      description: Streams current-process canonical factory events as default Server-Sent Events. Historical events are sent first in ascending tick order, followed by live events on the same connection.
      responses:
        '200':
          description: Factory event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events where each data frame is serialized JSON matching FactoryEvent.
              x-event-schema: '#/components/schemas/FactoryEvent'
        '500':
          $ref: '#/components/responses/InternalError'
  /factories/{factory_id}/events:
    get:
      tags:
        - Runtime
      operationId: getEventsByFactoryId
      summary: Stream factory events for one session
      description: Streams canonical factory events for the explicitly selected live session. Historical events are sent first in ascending tick order, followed by live events on the same connection. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/FactoryID'
      responses:
        '200':
          description: Factory event stream for the targeted session.
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events where each data frame is serialized JSON matching FactoryEvent.
              x-event-schema: '#/components/schemas/FactoryEvent'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /status:
    get:
      tags:
        - Runtime
      operationId: getStatus
      summary: Get runtime status
      description: Returns the current factory lifecycle status, token category counts, and resource availability from the aggregate engine snapshot.
      responses:
        '200':
          description: Current runtime status summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /models:
    get:
      tags:
        - Models
      operationId: listModels
      summary: List discovered models
      description: Lists the concrete model identifiers exposed by the currently loaded runtime configuration together with capability, readiness, locality, load-state, and resource summary data.
      responses:
        '200':
          description: Discovered models for the current runtime.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelsResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /models/{model_name}:
    get:
      tags:
        - Models
      operationId: getModel
      summary: Get one discovered model
      description: Returns one discovered model's readiness, supported operations, resource metadata, worker capabilities, and diagnostics for the currently loaded runtime configuration.
      parameters:
        - name: model_name
          in: path
          required: true
          description: Concrete public model identifier such as `OMNIVOICE_Q4_K_M`.
          schema:
            type: string
      responses:
        '200':
          description: Discovered model detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /models/{model_name}/invocations:
    post:
      tags:
        - Models
      operationId: invokeModel
      summary: Invoke one discovered model directly
      description: Invokes one discovered model through its declared provider-agnostic operation contract using canonical `WorkContent` input and optional slot-binding overrides. Non-streaming clients receive JSON metadata, while audio-producing operations can return a streamed audio body when requested.
      parameters:
        - name: model_name
          in: path
          required: true
          description: Concrete public model identifier such as `OMNIVOICE_Q4_K_M`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelInvocationRequest'
      responses:
        '200':
          description: Successful model invocation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInvocationResponse'
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Streamed audio body for audio-producing invocations when `options.responseMode` requests `AUDIO_STREAM`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /models/{model_name}/pull:
    post:
      tags:
        - Models
      operationId: pullModel
      summary: Pull local model assets into the managed cache
      description: Pulls the required local assets for one discovered model into the managed cache directory. Cloud-backed models and unsupported local targets return actionable errors instead of silently succeeding.
      parameters:
        - name: model_name
          in: path
          required: true
          description: Concrete public model identifier such as `OMNIVOICE_Q4_K_M`.
          schema:
            type: string
      responses:
        '200':
          description: Successful local-model asset pull or confirmation that the managed cache already contained the required revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPullResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factories/{factory_id}/status:
    get:
      tags:
        - Runtime
      operationId: getStatusByFactoryId
      summary: Get runtime status for one session
      description: Returns the current factory lifecycle status, token category counts, and resource availability from the aggregate engine snapshot owned by the explicitly selected live factory session.
      parameters:
        - $ref: '#/components/parameters/FactoryID'
      responses:
        '200':
          description: Current runtime status summary for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /provider-sessions/detail:
    get:
      tags:
        - Provider Sessions
      operationId: getProviderSessionDetails
      summary: Get provider session details
      description: Loads a known Codex provider-session file by provider-session metadata. The browser supplies provider, kind, and identifier values; the server resolves the matching rollout file under the configured Codex sessions root and never accepts a raw filesystem path.
      parameters:
        - name: provider
          in: query
          required: true
          description: Provider that emitted the session identifier. Only codex sessions are currently loadable.
          schema:
            $ref: '#/components/schemas/LoadableProviderSessionProvider'
        - name: kind
          in: query
          required: true
          description: Provider-session identifier kind. Only session_id is currently loadable.
          schema:
            $ref: '#/components/schemas/LoadableProviderSessionKind'
        - name: id
          in: query
          required: true
          description: Provider-session identifier to resolve. This is an identifier, not a filesystem path.
          schema:
            type: string
      responses:
        '200':
          description: Parsed provider-session details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSessionDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory:
    post:
      tags:
        - Factory
      operationId: createFactory
      summary: Create factory
      description: Stores one factory definition and activates it as the current factory when the runtime is idle. The reserved `UNDEFINED` identifier is for `GET /factory/~current` readback only and cannot be activated as a customer-named factory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Factory'
      responses:
        '201':
          description: Factory was stored and activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factory'
        '400':
          $ref: '#/components/responses/CreateFactoryBadRequest'
        '409':
          $ref: '#/components/responses/CreateFactoryConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions:
    get:
      tags:
        - Factory
      operationId: listFactorySessions
      summary: List live factory sessions
      description: Lists every live factory session that the shared runtime host is currently keeping open, including the reserved default session.
      responses:
        '200':
          description: Live factory sessions that can be rendered as workspace tabs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFactorySessionsResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Factory
      operationId: openFactorySession
      summary: Open another live factory session
      description: Opens another live factory session from a folder path and optional target selection. When the folder exposes more than one runnable target and no explicit target was provided, the response returns typed target metadata instead of creating a session yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenFactorySessionRequest'
      responses:
        '200':
          description: Session was opened or the caller needs to choose one of the returned runnable targets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenFactorySessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}:
    delete:
      tags:
        - Factory
      operationId: closeFactorySession
      summary: Close one live factory session
      description: Stops the selected live factory session, removes it from the workspace session list, and leaves all remaining sessions running unchanged.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
          description: Stable live factory session identifier. Use `~default` to close the default compatibility session explicitly.
      responses:
        '204':
          description: Session was stopped and removed from the live workspace.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory/~current:
    get:
      tags:
        - Factory
      operationId: getCurrentFactory
      summary: Get current factory
      description: Returns the canonical current-factory payload from the durable current-factory pointer or, when no pointer exists yet, from the active default root runtime. Default-runtime responses use the reserved `UNDEFINED` identifier in `Factory.name`.
      responses:
        '200':
          description: Current active factory or the active default root runtime when no current-factory pointer exists yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factory'
              examples:
                defaultRootRuntime:
                  summary: Default root runtime is active.
                  value:
                    name: UNDEFINED
                    workTypes:
                      - name: task
                        states:
                          - name: init
                            type: INITIAL
                          - name: done
                            type: TERMINAL
                    workers:
                      - name: planner
                        type: MODEL_WORKER
                        modelProvider: CLAUDE
                        executorProvider: SCRIPT_WRAP
                        model: claude-sonnet-4-20250514
                    workstations:
                      - name: plan-task
                        behavior: STANDARD
                        type: MODEL_WORKSTATION
                        worker: planner
                        inputs:
                          - workType: task
                            state: init
                        outputs:
                          - workType: task
                            state: done
        '404':
          $ref: '#/components/responses/CurrentFactoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factories/{factory_id}/factory/~current:
    get:
      tags:
        - Factory
      operationId: getCurrentFactoryByFactoryId
      summary: Get current factory for one session
      description: Returns the current factory definition owned by the explicitly selected live session. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/FactoryID'
      responses:
        '200':
          description: Current active factory definition for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factory'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factories/{factory_id}/factory/~current/editable-definition:
    get:
      tags:
        - Factory
      operationId: getEditableCurrentFactoryDefinitionByFactoryId
      summary: Get editable current factory definition for one session
      description: Returns the complete current factory definition for graph editing together with version metadata for the explicitly selected live session. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/FactoryID'
      responses:
        '200':
          description: Editable current factory definition and version metadata for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditableFactoryDefinition'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Factory
      operationId: saveEditableCurrentFactoryDefinitionByFactoryId
      summary: Save editable current factory definition for one session
      description: Submits one complete replacement for the current factory definition owned by the explicitly selected live session. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/FactoryID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveEditableFactoryDefinitionRequest'
      responses:
        '200':
          description: Saved editable factory definition and new version metadata for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditableFactoryDefinition'
        '400':
          $ref: '#/components/responses/SaveEditableFactoryDefinitionBadRequest'
        '409':
          $ref: '#/components/responses/SaveEditableFactoryDefinitionConflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory/~current/workstations/{workstation_name}/prompt-template-contract:
    get:
      tags:
        - Factory
      operationId: getCurrentFactoryWorkstationPromptTemplateContract
      summary: Get workstation prompt-template contract
      description: Returns the authoritative prompt-variable reference and unavailable-access patterns for the selected current-factory workstation editing context.
      parameters:
        - name: workstation_name
          in: path
          required: true
          description: Customer-authored workstation name to inspect in the current factory.
          schema:
            type: string
      responses:
        '200':
          description: Prompt-template contract for the selected workstation editing context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplateContract'
        '404':
          $ref: '#/components/responses/CurrentFactoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory/~current/editable-definition:
    get:
      tags:
        - Factory
      operationId: getEditableCurrentFactoryDefinition
      summary: Get editable current factory definition
      description: Returns the complete current factory definition for graph editing together with hybrid logical timestamp metadata clients must carry into saves for stale-edit detection.
      responses:
        '200':
          description: Editable current factory definition and version metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditableFactoryDefinition'
        '404':
          $ref: '#/components/responses/CurrentFactoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Factory
      operationId: saveEditableCurrentFactoryDefinition
      summary: Save editable current factory definition
      description: Submits one complete replacement for the current factory definition. The payload preserves all untouched fields because the full Factory contract is saved through the same canonical factory persistence path used by named-factory activation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveEditableFactoryDefinitionRequest'
      responses:
        '200':
          description: Saved editable factory definition and new version metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditableFactoryDefinition'
        '400':
          $ref: '#/components/responses/SaveEditableFactoryDefinitionBadRequest'
        '409':
          $ref: '#/components/responses/SaveEditableFactoryDefinitionConflict'
        '404':
          $ref: '#/components/responses/CurrentFactoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory/~current/workstations/{workstation_name}/prompt-template-validation:
    post:
      tags:
        - Factory
      operationId: validateCurrentFactoryWorkstationPromptTemplate
      summary: Validate workstation prompt template
      description: Validates a prompt draft against the authoritative current-factory workstation prompt contract and returns typed syntax or variable diagnostics.
      parameters:
        - name: workstation_name
          in: path
          required: true
          description: Customer-authored workstation name to validate against in the current factory.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptTemplateValidationRequest'
      responses:
        '200':
          description: Prompt validation result for the selected workstation editing context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplateValidationResult'
        '404':
          $ref: '#/components/responses/CurrentFactoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    FactoryID:
      name: factory_id
      in: path
      required: true
      description: Stable live factory session identifier. Use `~default` to target the default compatibility session explicitly.
      schema:
        type: string
    MaxResults:
      name: maxResults
      in: query
      required: false
      description: Optional positive page size. Omit to use the default page size; non-positive values fall back to the default after successful integer binding.
      schema:
        type: integer
        minimum: 1
        default: 50
    NextToken:
      name: nextToken
      in: query
      required: false
      description: Optional base64-encoded token ID cursor.
      schema:
        type: string
    StateName:
      name: state.name
      in: query
      required: false
      description: Optional current work state name filter.
      schema:
        type: string
    StateType:
      name: state.type
      in: query
      required: false
      description: Optional current work state type filter.
      schema:
        $ref: '#/components/schemas/WorkStateType'
    SortBy:
      name: sortBy
      in: query
      required: false
      description: Optional list-work sort field. Use state.type to order by current work state type.
      schema:
        type: string
        enum:
          - state.type
    WorkOrTokenID:
      name: id
      in: path
      required: true
      description: Work or token identifier, depending on route.
      schema:
        type: string
  responses:
    BadRequest:
      description: Request payload or parameter was invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CreateFactoryBadRequest:
      description: Named factory name or payload was invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidFactoryName:
              summary: Factory name failed validation.
              value:
                message: Factory name must be a safe directory segment without path separators.
                family: BAD_REQUEST
                code: INVALID_FACTORY_NAME
            invalidFactory:
              summary: Factory payload failed validation.
              value:
                message: Factory payload is not a valid Agent Factory definition.
                family: BAD_REQUEST
                code: INVALID_FACTORY
    CreateFactoryConflict:
      description: Named factory could not be activated because the name already exists or the current runtime is not idle.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            factoryAlreadyExists:
              summary: Factory name already exists.
              value:
                message: Named factory already exists.
                family: CONFLICT
                code: FACTORY_ALREADY_EXISTS
            factoryNotIdle:
              summary: Runtime is not idle.
              value:
                message: Current factory runtime must be idle before activation.
                family: CONFLICT
                code: FACTORY_NOT_IDLE
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CurrentFactoryNotFound:
      description: Current named factory was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            currentFactoryMissing:
              summary: No current named factory is available.
              value:
                message: Current named factory not found.
                family: NOT_FOUND
                code: NOT_FOUND
    SaveEditableFactoryDefinitionBadRequest:
      description: Editable factory definition save request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidFactory:
              summary: Factory payload failed validation.
              value:
                message: Factory payload is not a valid Agent Factory definition.
                family: BAD_REQUEST
                code: INVALID_FACTORY
                targets:
                  - kind: form
                    field: factoryDefinition
    SaveEditableFactoryDefinitionConflict:
      description: Editable factory definition could not be saved because the runtime or submitted version is not safe to replace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            factoryNotIdle:
              summary: Runtime is not idle.
              value:
                message: Current factory runtime must be idle before activation.
                family: CONFLICT
                code: FACTORY_NOT_IDLE
                targets:
                  - kind: save
                    id: active-work
    InternalError:
      description: Server failed while reading or building runtime state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
