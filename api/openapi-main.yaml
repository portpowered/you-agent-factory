      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionRetryDispatchRequest'
      responses:
        '200':
          description: Retry dispatch applied immediately or produced a typed no-op outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Retry-dispatch control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/interrupt-dispatch:
    post:
      tags:
        - Factory
      operationId: interruptFactorySessionDispatch
      summary: Interrupt one active durable factory session dispatch
      description: >-
        Interrupts one active dispatch within the targeted durable factory
        session. The response links the interruption to the session and dispatch
        state and preserves inspectable partial results, dispatches, and
        artifacts after the control operation.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionInterruptDispatchRequest'
      responses:
        '200':
          description: Interrupt dispatch applied immediately or produced a typed no-op outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Interrupt-dispatch control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/partial-result:
    get:
      tags:
        - Factory
      operationId: getFactorySessionPartialResult
      summary: Get one factory session partial result
      description: Returns the current partial result for one live JavaScript workflow session. Checkpoint artifact refs and summaries are returned without raw checkpoint bodies or unrestricted host paths.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Partial session result projection for the targeted live session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionPartialResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}:
    get:
      tags:
        - Factory
      operationId: getFactorySession
      summary: Get one factory session
      description: >-
        Returns the canonical factory session inspection read model. Live
        workspace sessions return the existing FactorySession projection with
        orchestrator identity, lifecycle status, progress, budgets, usage, and
        kind-specific runtime projections. Durable execution sessions return a
        durable read model with status, resolved source ref/hash, phase
        summaries, progress counts, budgets, usage, policy hash, artifact refs,
        result summary, failure details, and lifecycle timestamps. Responses
        expose public source refs and hashes without raw workflow source or
        diagnostic artifacts.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Canonical factory session inspection read model for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionGetResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Factory
      operationId: closeFactorySession
      summary: Delete one stopped live factory session
      description: Deletes the selected non-default live factory session only after its runtime has already stopped. The request never implicitly stops an active runtime; default and active sessions return a typed conflict and remain registered.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
          description: Stable live factory session identifier. The reserved `~default` compatibility session cannot be deleted.
      responses:
        '204':
          description: A stopped non-default session was removed from the live workspace.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionDeletionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/factory:
    get:
      tags:
        - Factory
      operationId: getCurrentFactoryBySessionId
      summary: Get current factory for one session
      description: Returns the current factory definition owned by the explicitly selected live session together with server-managed version metadata for replacement saves. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Current active factory definition and version metadata for the targeted session, or the active default root runtime when the default session has no durable current-factory pointer yet. Default-runtime responses use the reserved `UNDEFINED` identifier in `Factory.name`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factory'
              examples:
                defaultRootRuntime:
                  summary: Default root runtime is active.
                  value:
                    name: UNDEFINED
                    workTypes:
                      - name: task
                        states:
                          - name: init
                            type: INITIAL
                          - name: done
                            type: TERMINAL
                    workers:
                      - name: planner
                        type: MODEL_WORKER
                        modelProvider: CLAUDE
                        executorProvider: SCRIPT_WRAP
                        model: claude-sonnet-4-20250514
                    workstations:
                      - name: plan-task
                        behavior: STANDARD
                        type: MODEL_WORKSTATION
                        worker: planner
                        inputs:
                          - workType: task
                            state: init
                        outputs:
                          - workType: task
                            state: done
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Factory
      operationId: saveCurrentFactoryBySessionId
      summary: Save factory for one session
      description: >-
        Submits one complete factory definition to the explicitly selected live
        session using an explicit save mode. Omitted `mode` defaults to
        `REPLACE_CURRENT`, which replaces the factory already current in the
        session. `UPSERT_NAMED_AND_ACTIVATE` persists under the session factory
        root using `factory.name`, updates the session current-factory pointer,
        and activates that runtime when idle. Clients should echo the
        server-managed `factory.version` field from the latest current-factory
        read for replacement saves. Unknown session identifiers return
        NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveFactoryForSessionRequest'
            examples:
              replaceCurrent:
                summary: Replace the factory already current in the session.
                value:
                  mode: REPLACE_CURRENT
                  factory:
                    name: alpha
                    version:
                      logical: '2'
                      physical: '2026-05-30T12:00:00.000000000Z'
                    workTypes:
                      - name: task
                        states:
                          - name: init
                            type: INITIAL
                          - name: done
                            type: TERMINAL
                    workers: []
                    workstations: []
              upsertNamedAndActivate:
                summary: Create or replace a named factory and activate it in the session.
                value:
                  mode: UPSERT_NAMED_AND_ACTIVATE
                  factory:
                    name: beta
                    workTypes:
                      - name: task
                        states:
                          - name: init
                            type: INITIAL
                          - name: done
                            type: TERMINAL
                    workers: []
                    workstations: []
      responses:
        '200':
          description: Saved current factory definition and new version metadata for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factory'
        '400':
          $ref: '#/components/responses/SaveCurrentFactoryBadRequest'
        '409':
          $ref: '#/components/responses/SaveCurrentFactoryConflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/factory/workstations/{workstation_name}/prompt-template-contract:
    get:
      tags:
        - Factory
      operationId: getCurrentFactoryWorkstationPromptTemplateContractBySessionId
      summary: Get workstation prompt-template contract
      description: Returns the authoritative prompt-variable reference and unavailable-access patterns for the selected current-factory workstation editing context.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - name: workstation_name
          in: path
          required: true
          description: Customer-authored workstation name to inspect in the current factory.
          schema:
            type: string
      responses:
        '200':
          description: Prompt-template contract for the selected workstation editing context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplateContract'
        '404':
          $ref: '#/components/responses/CurrentFactoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/factory/workstations/{workstation_name}/prompt-template-validation:
    post:
      tags:
        - Factory
      operationId: validateCurrentFactoryWorkstationPromptTemplateBySessionId
      summary: Validate workstation prompt template
      description: Validates a prompt draft against the authoritative current-factory workstation prompt contract and returns typed syntax or variable diagnostics.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - name: workstation_name
          in: path
          required: true
          description: Customer-authored workstation name to validate against in the current factory.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptTemplateValidationRequest'
      responses:
        '200':
          description: Prompt validation result for the selected workstation editing context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplateValidationResult'
        '404':
          $ref: '#/components/responses/CurrentFactoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /packaged-factories:
    get:
      tags:
        - Factory
      operationId: listPackagedFactories
      summary: List built-in packaged factories
      description: Returns the backend-owned built-in factory catalog, including the selected artifacts the dashboard displays. The dashboard must consume this API rather than importing the publication package.
      responses:
        '200':
          description: Published packaged factory catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackagedFactoryCatalogResponse'
        '500':
          $ref: '#/components/responses/InternalError'

