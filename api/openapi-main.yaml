openapi: 3.0.3
info:
  title: Agent Factory API
  version: 0.1.0
  license:
    name: MIT
  description: |
    Current Agent Factory runtime API contract. This file captures existing
    handler behavior for schema standardization and intentionally does not
    redesign route names, pagination, or response fields.
servers:
  - url: http://localhost:7437
    description: Local Agent Factory API server
security: []
tags:
  - name: Work
    description: Runtime work submission and inspection.
  - name: Factory
    description: Named factory activation and current-factory inspection.
  - name: Runtime
    description: Runtime state, event stream, and trace inspection.
  - name: Provider Sessions
    description: Provider-owned session diagnostics for dashboard inspection.
  - name: Models
    description: Model discovery and capability inspection for the current runtime.
  - name: Workflows
    description: Stored workflow inspection.
paths:
  /work:
    post:
      tags:
        - Work
      operationId: submitWork
      summary: Submit work
      description: Submits one work item to the running factory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitWorkRequest'
            examples:
              textOnlyContent:
                summary: Submit one work item with ordered text content parts.
                value:
                  name: summary-draft
                  workTypeName: task
                  content:
                    - type: text
                      text: Draft a short project summary.
                    - type: text
                      text: Keep it under 120 words.
              textPlusImageContent:
                summary: Submit one work item with ordered text and image content parts.
                value:
                  name: screenshot-review
                  workTypeName: task
                  content:
                    - type: text
                      text: Review this screenshot and list the highest-risk UI issues.
                    - type: image
                      file: fixtures/ui/dashboard-error-state.png
      responses:
        '201':
          description: Work was accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitWorkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Work
      operationId: listWork
      summary: List work
      description: Lists current work tokens from the engine state snapshot.
      parameters:
        - $ref: '#/components/parameters/MaxResults'
        - $ref: '#/components/parameters/NextToken'
        - $ref: '#/components/parameters/StateName'
        - $ref: '#/components/parameters/StateType'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/WorkListName'
        - $ref: '#/components/parameters/WorkListWorkTypeName'
        - $ref: '#/components/parameters/WorkListTraceId'
      responses:
        '200':
          description: Current work tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /work/staged-files:
    post:
      tags:
        - Work
      operationId: stageSubmitWorkFile
      summary: Stage one submit-work file
      description: Accepts one dashboard-authored file payload, stores it behind a backend-owned staged reference, and returns the staged reference plus identifying metadata for structured submit-work items.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageSubmitWorkFileRequest'
      responses:
        '201':
          description: File payload staged successfully for later submit-work use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageSubmitWorkFileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/work:
    post:
      tags:
        - Work
      operationId: submitWorkBySessionId
      summary: Submit work for one session
      description: Submits one work item to the explicitly selected live factory session. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitWorkRequest'
      responses:
        '201':
          description: Work was accepted for processing by the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitWorkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Work
      operationId: listWorkBySessionId
      summary: List work for one session
      description: Lists current work tokens from the engine state snapshot owned by the explicitly selected live factory session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/MaxResults'
        - $ref: '#/components/parameters/NextToken'
        - $ref: '#/components/parameters/StateName'
        - $ref: '#/components/parameters/StateType'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/WorkListName'
        - $ref: '#/components/parameters/WorkListWorkTypeName'
        - $ref: '#/components/parameters/WorkListTraceId'
      responses:
        '200':
          description: Current work tokens for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/work/staged-files:
    post:
      tags:
        - Work
      operationId: stageSubmitWorkFileBySessionId
      summary: Stage one submit-work file for one session
      description: Accepts one dashboard-authored file payload for the selected factory session, stores it behind a backend-owned staged reference, and returns the staged reference plus identifying metadata for structured submit-work items.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageSubmitWorkFileRequest'
      responses:
        '201':
          description: File payload staged successfully for later session-scoped submit-work use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageSubmitWorkFileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /work-requests/{request_id}:
    put:
      tags:
        - Work
      operationId: upsertWorkRequest
      summary: Upsert work request
      description: Submits or retries one canonical work request batch. The request identifier in the URL must match the request_id in the JSON body, and repeated request IDs are idempotent.
      parameters:
        - name: request_id
          in: path
          required: true
          description: Stable request identifier used for idempotent submission.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkRequest'
      responses:
        '201':
          description: Work request was accepted or had already been accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertWorkRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/work-requests/{request_id}:
    put:
      tags:
        - Work
      operationId: upsertWorkRequestBySessionId
      summary: Upsert work request for one session
      description: Submits or retries one canonical work request batch against the explicitly selected live factory session. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - name: request_id
          in: path
          required: true
          description: Stable request identifier used for idempotent submission.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkRequest'
      responses:
        '201':
          description: Work request was accepted or had already been accepted by the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertWorkRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /work/{id}:
    get:
      tags:
        - Work
      operationId: getWork
      summary: Get work
      description: Returns one work item by work or token identifier from the current marking.
      parameters:
        - $ref: '#/components/parameters/WorkOrTokenID'
      responses:
        '200':
          description: One work item from the current marking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/work/{id}:
    get:
      tags:
        - Work
      operationId: getWorkBySessionId
      summary: Get work for one session
      description: Returns one work item by work or token identifier from the current marking owned by the explicitly selected live factory session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/WorkOrTokenID'
      responses:
        '200':
          description: One work item for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /events:
    get:
      tags:
        - Runtime
      operationId: getEvents
      summary: Stream factory events
      description: Streams current-process canonical factory events as default Server-Sent Events. Historical events are sent first in ascending tick order, followed by live events on the same connection.
      responses:
        '200':
          description: Factory event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events where each data frame is serialized JSON matching FactoryEvent.
              x-event-schema: '#/components/schemas/FactoryEvent'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/events:
    get:
      tags:
        - Runtime
      operationId: getEventsBySessionId
      summary: Stream factory events for one session
      description: Streams canonical factory events for the explicitly selected live session. Historical events are sent first in ascending tick order, followed by live events on the same connection. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Factory event stream for the targeted session.
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events where each data frame is serialized JSON matching FactoryEvent.
              x-event-schema: '#/components/schemas/FactoryEvent'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /status:
    get:
      tags:
        - Runtime
      operationId: getStatus
      summary: Get runtime status
      description: Returns the current factory lifecycle status, token category counts, and resource availability from the aggregate engine snapshot.
      responses:
        '200':
          description: Current runtime status summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /models:
    get:
      tags:
        - Models
      operationId: listModels
      summary: List discovered models
      description: Lists the concrete model identifiers exposed by the currently loaded runtime configuration together with capability, readiness, locality, load-state, and resource summary data.
      responses:
        '200':
          description: Discovered models for the current runtime.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelsResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /models/{model_name}:
    get:
      tags:
        - Models
      operationId: getModel
      summary: Get one discovered model
      description: Returns one discovered model's readiness, supported operations, resource metadata, worker capabilities, and diagnostics for the currently loaded runtime configuration.
      parameters:
        - name: model_name
          in: path
          required: true
          description: Concrete public model identifier such as `OMNIVOICE_Q4_K_M`.
          schema:
            type: string
      responses:
        '200':
          description: Discovered model detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /models/{model_name}/invocations:
    post:
      tags:
        - Models
      operationId: invokeModel
      summary: Invoke one discovered model directly
      description: Invokes one discovered model through its declared provider-agnostic operation contract using canonical `WorkContent` input and optional slot-binding overrides. Non-streaming clients receive JSON metadata, while audio-producing operations can return a streamed audio body when requested.
      parameters:
        - name: model_name
          in: path
          required: true
          description: Concrete public model identifier such as `OMNIVOICE_Q4_K_M`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelInvocationRequest'
      responses:
        '200':
          description: Successful model invocation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInvocationResponse'
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Streamed audio body for audio-producing invocations when `options.responseMode` requests `AUDIO_STREAM`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /models/{model_name}/pull:
    post:
      tags:
        - Models
      operationId: pullModel
      summary: Pull local model assets into the managed cache
      description: Pulls the required local assets for one discovered model into the managed cache directory. Cloud-backed models and unsupported local targets return actionable errors instead of silently succeeding.
      parameters:
        - name: model_name
          in: path
          required: true
          description: Concrete public model identifier such as `OMNIVOICE_Q4_K_M`.
          schema:
            type: string
      responses:
        '200':
          description: Successful local-model asset pull or confirmation that the managed cache already contained the required revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPullResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/status:
    get:
      tags:
        - Runtime
      operationId: getStatusBySessionId
      summary: Get runtime status for one session
      description: Returns the current factory lifecycle status, token category counts, and resource availability from the aggregate engine snapshot owned by the explicitly selected live factory session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Current runtime status summary for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /provider-sessions/detail:
    get:
      tags:
        - Provider Sessions
      operationId: getProviderSessionDetails
      summary: Get provider session details
      description: Returns parsed provider-session details using a provider-neutral response schema. The browser supplies provider, kind, and identifier query parameters; the server resolves the matching session file under the configured provider sessions root and never accepts a raw filesystem path. Only Codex (`codex`) sessions are currently loadable for this endpoint.
      parameters:
        - name: provider
          in: query
          required: true
          description: Provider that emitted the session identifier. Only codex sessions are currently loadable.
          schema:
            $ref: '#/components/schemas/LoadableProviderSessionProvider'
        - name: kind
          in: query
          required: true
          description: Provider-session identifier kind. Only session_id is currently loadable.
          schema:
            $ref: '#/components/schemas/LoadableProviderSessionKind'
        - name: id
          in: query
          required: true
          description: Provider-session identifier to resolve. This is an identifier, not a filesystem path.
          schema:
            type: string
      responses:
        '200':
          description: Parsed provider-session details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSessionDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-validations:
    post:
      tags:
        - Factory
      operationId: validateFactory
      summary: Validate factory definition
      description: Validates a submitted complete factory definition and returns canonical validation targets without persisting or activating the factory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Factory'
      responses:
        '200':
          description: Validation result for the submitted factory definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactoryValidationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions:
    get:
      tags:
        - Factory
      operationId: listFactorySessions
      summary: List live factory sessions
      description: Lists every live factory session that the shared runtime host is currently keeping open, including the reserved default session.
      responses:
        '200':
          description: Live factory sessions that can be rendered as workspace tabs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFactorySessionsResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Factory
      operationId: openFactorySession
      summary: Open another live factory session
      description: Opens another live factory session from a folder path and optional target selection. When `validateOnly` is true, the request validates the folder and optional target selection without creating a session. When the folder exposes more than one runnable target and no explicit target was provided, the response returns typed target metadata instead of creating a session yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenFactorySessionRequest'
      responses:
        '200':
          description: Session was opened or the caller needs to choose one of the returned runnable targets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenFactorySessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}:
    delete:
      tags:
        - Factory
      operationId: closeFactorySession
      summary: Close one live factory session
      description: Stops the selected live factory session, removes it from the workspace session list, and leaves all remaining sessions running unchanged.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
          description: Stable live factory session identifier. Use `~default` to close the default compatibility session explicitly.
      responses:
        '204':
          description: Session was stopped and removed from the live workspace.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/factory:
    get:
      tags:
        - Factory
      operationId: getCurrentFactoryBySessionId
      summary: Get current factory for one session
      description: Returns the current factory definition owned by the explicitly selected live session together with server-managed version metadata for replacement saves. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Current active factory definition and version metadata for the targeted session, or the active default root runtime when the default session has no durable current-factory pointer yet. Default-runtime responses use the reserved `UNDEFINED` identifier in `Factory.name`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factory'
              examples:
                defaultRootRuntime:
                  summary: Default root runtime is active.
                  value:
                    name: UNDEFINED
                    workTypes:
                      - name: task
                        states:
                          - name: init
                            type: INITIAL
                          - name: done
                            type: TERMINAL
                    workers:
                      - name: planner
                        type: MODEL_WORKER
                        modelProvider: CLAUDE
                        executorProvider: SCRIPT_WRAP
                        model: claude-sonnet-4-20250514
                    workstations:
                      - name: plan-task
                        behavior: STANDARD
                        type: MODEL_WORKSTATION
                        worker: planner
                        inputs:
                          - workType: task
                            state: init
                        outputs:
                          - workType: task
                            state: done
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Factory
      operationId: saveCurrentFactoryBySessionId
      summary: Save factory for one session
      description: >-
        Submits one complete factory definition to the explicitly selected live
        session using an explicit save mode. Omitted `mode` defaults to
        `REPLACE_CURRENT`, which replaces the factory already current in the
        session. `UPSERT_NAMED_AND_ACTIVATE` persists under the session factory
        root using `factory.name`, updates the session current-factory pointer,
        and activates that runtime when idle. Clients should echo the
        server-managed `factory.version` field from the latest current-factory
        read for replacement saves. Unknown session identifiers return
        NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveFactoryForSessionRequest'
            examples:
              replaceCurrent:
                summary: Replace the factory already current in the session.
                value:
                  mode: REPLACE_CURRENT
                  factory:
                    name: alpha
                    version:
                      logical: '2'
                      physical: '2026-05-30T12:00:00.000000000Z'
                    workTypes:
                      - name: task
                        states:
                          - name: init
                            type: INITIAL
                          - name: done
                            type: TERMINAL
                    workers: []
                    workstations: []
              upsertNamedAndActivate:
                summary: Create or replace a named factory and activate it in the session.
                value:
                  mode: UPSERT_NAMED_AND_ACTIVATE
                  factory:
                    name: beta
                    workTypes:
                      - name: task
                        states:
                          - name: init
                            type: INITIAL
                          - name: done
                            type: TERMINAL
                    workers: []
                    workstations: []
      responses:
        '200':
          description: Saved current factory definition and new version metadata for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factory'
        '400':
          $ref: '#/components/responses/SaveCurrentFactoryBadRequest'
        '409':
          $ref: '#/components/responses/SaveCurrentFactoryConflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/factory/workstations/{workstation_name}/prompt-template-contract:
    get:
      tags:
        - Factory
      operationId: getCurrentFactoryWorkstationPromptTemplateContractBySessionId
      summary: Get workstation prompt-template contract
      description: Returns the authoritative prompt-variable reference and unavailable-access patterns for the selected current-factory workstation editing context.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - name: workstation_name
          in: path
          required: true
          description: Customer-authored workstation name to inspect in the current factory.
          schema:
            type: string
      responses:
        '200':
          description: Prompt-template contract for the selected workstation editing context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplateContract'
        '404':
          $ref: '#/components/responses/CurrentFactoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/factory/workstations/{workstation_name}/prompt-template-validation:
    post:
      tags:
        - Factory
      operationId: validateCurrentFactoryWorkstationPromptTemplateBySessionId
      summary: Validate workstation prompt template
      description: Validates a prompt draft against the authoritative current-factory workstation prompt contract and returns typed syntax or variable diagnostics.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - name: workstation_name
          in: path
          required: true
          description: Customer-authored workstation name to validate against in the current factory.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptTemplateValidationRequest'
      responses:
        '200':
          description: Prompt validation result for the selected workstation editing context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplateValidationResult'
        '404':
          $ref: '#/components/responses/CurrentFactoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    SessionID:
      $ref: './components/parameters/SessionID.yaml'
    MaxResults:
      $ref: './components/parameters/MaxResults.yaml'
    NextToken:
      $ref: './components/parameters/NextToken.yaml'
    StateName:
      $ref: './components/parameters/StateName.yaml'
    StateType:
      $ref: './components/parameters/StateType.yaml'
    SortBy:
      $ref: './components/parameters/SortBy.yaml'
    WorkListName:
      $ref: './components/parameters/WorkListName.yaml'
