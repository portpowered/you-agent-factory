version: "2"
run:
  timeout: 30m
  tests: true
linters:
  default: none
  enable:
    - repolint
    - govet
  exclusions:
    # Standalone go vet covered generated files too, without a path ratchet.
    generated: disable
    rules:
      # Match the former vet target's explicit roots; third_party was not
      # selected. Keep repolint's existing repository scope unchanged.
      - linters: [govet]
        path-except: ^(cmd|contracts|docs|internal|packages|pkg|scripts|tests|ui)/
  settings:
    custom:
      repolint:
        type: module
        description: Shared repository go/analysis rules
        settings:
          defer-stale: [layering, behavior, construction, petripublic, serviceshape, functionalshape, packageboundary]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
