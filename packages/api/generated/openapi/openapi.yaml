    FactoryEventType:
      type: string
      description: Canonical event vocabulary for customer-visible runtime changes. Work entering the factory is represented as WORK_REQUEST, including single-work submissions that are normalized into one-work requests.
      x-enum-varnames:
        - FactoryEventTypeRunRequest
        - FactoryEventTypeInitialStructureRequest
        - FactoryEventTypeFactoryChange
        - FactoryEventTypeWorkRequest
        - FactoryEventTypeRelationshipChangeRequest
        - FactoryEventTypeDispatchRequest
        - FactoryEventTypeModelRequest
        - FactoryEventTypeModelResponse
        - FactoryEventTypeInferenceRequest
        - FactoryEventTypeInferenceResponse
        - FactoryEventTypeScriptRequest
        - FactoryEventTypeScriptResponse
        - FactoryEventTypeAgentRunResponse
        - FactoryEventTypeDispatchResponse
        - FactoryEventTypeWorkStateChange
        - FactoryEventTypeFactoryStateResponse
        - FactoryEventTypeRunResponse
        - FactoryEventTypeSessionStarted
        - FactoryEventTypeSessionPaused
        - FactoryEventTypeSessionResumed
        - FactoryEventTypeSessionResultUpdated
        - FactoryEventTypeSessionCompleted
        - FactoryEventTypeSessionLifecycleControl
        - FactoryEventTypeOrchestratorPhaseChanged
        - FactoryEventTypeOrchestratorCheckpointWritten
        - FactoryEventTypeDispatchQueued
        - FactoryEventTypeDispatchInterrupted
        - FactoryEventTypeDispatchReconciled
        - FactoryEventTypeJavaScriptCheckpointRef
        - FactoryEventTypeJavaScriptPhaseChange
        - FactoryEventTypeArtifactCreated
      enum:
        - RUN_REQUEST
        - INITIAL_STRUCTURE_REQUEST
        - FACTORY_CHANGE
        - WORK_REQUEST
        - RELATIONSHIP_CHANGE_REQUEST
        - DISPATCH_REQUEST
        - MODEL_REQUEST
        - MODEL_RESPONSE
        - INFERENCE_REQUEST
        - INFERENCE_RESPONSE
        - SCRIPT_REQUEST
        - SCRIPT_RESPONSE
        - AGENT_RUN_RESPONSE
        - DISPATCH_RESPONSE
        - WORK_STATE_CHANGE
        - FACTORY_STATE_RESPONSE
        - RUN_RESPONSE
        - SESSION_STARTED
        - SESSION_PAUSED
        - SESSION_RESUMED
        - SESSION_RESULT_UPDATED
        - SESSION_COMPLETED
        - SESSION_LIFECYCLE_CONTROL
        - ORCHESTRATOR_PHASE_CHANGED
        - ORCHESTRATOR_CHECKPOINT_WRITTEN
        - DISPATCH_QUEUED
        - DISPATCH_INTERRUPTED
        - DISPATCH_RECONCILED
        - JAVASCRIPT_CHECKPOINT_REF
        - JAVASCRIPT_PHASE_CHANGE
        - ARTIFACT_CREATED
      x-enum-descriptions:
        - A factory run request was recorded and its effective runtime configuration is known.
        - The static factory topology and configured resources are available before work moves.
        - The running factory definition changed and a canonical replacement topology is now active.
        - Work entered the factory as a normalized request.
        - A relationship-change request between work items was recorded.
        - A workstation request began processing a set of input work.
        - A model-backed worker invocation request is about to enter resource, load, and execution boundaries.
        - A model-backed worker invocation returned with resource, load, output, and failure evidence.
        - A model-worker provider attempt is about to send a prompt to the provider.
        - A model-worker provider attempt returned from the provider boundary.
        - A script-backed worker is about to invoke one concrete command attempt.
        - A script-backed worker command attempt returned or failed before a normal exit.
        - An AGENT_RUN workstation agent loop completed and returned bounded inspection metadata.
        - A workstation response finished processing and produced an outcome.
        - A work item moved between authored marking states.
        - The factory lifecycle state response was recorded.
        - A factory run response ended and final metadata is available.
        - Durable factory session execution started and replay-safe session facts are available.
        - A Factory Session lifecycle pause control transitioned the session into PAUSED.
        - A Factory Session lifecycle resume control transitioned the session into RUNNING.
        - Partial or final customer-visible session result availability was recorded.
        - Durable factory session execution reached a terminal lifecycle state.
        - Durable factory session lifecycle control was applied or recorded for replay.
        - An orchestrator workflow phase transition was recorded.
        - An orchestrator checkpoint reference was recorded without exposing raw VM state.
        - A child dispatch was queued for execution.
        - A dispatch was interrupted before completion.
        - Durable dispatch state was reconciled after interruption or stream loss.
        - A JavaScript workflow checkpoint reference was recorded without exposing raw VM state.
        - A JavaScript workflow phase transition was recorded without using Petri marking terminology.
        - A customer-visible factory artifact was created without exposing raw artifact bodies.
    FactoryEventContext:
      type: object
      additionalProperties: false
      required:
        - sequence
        - tick
        - eventTime
      properties:
        sequence:
          type: integer
          minimum: 0
          description: Append-only event-log sequence number.
        tick:
          type: integer
          minimum: 0
          description: Logical engine tick observed by the runtime.
        eventTime:
          type: string
          format: date-time
          description: Wall-clock event timestamp for customer explanation and diagnostics. ISO8601 timestamp.
        sessionId:
          type: string
          description: Canonical factory session identity for session-scoped events; payloads must not restate it.
        sessionSequence:
          type: integer
          minimum: 0
          description: Monotonic per-session ordering used for replay deduplication within one session.
        orchestratorKind:
          $ref: '#/components/schemas/FactoryOrchestratorKind'
          description: Canonical orchestrator kind for session-scoped events; payloads must not restate it.
        orchestratorDialect:
          type: string
          description: Optional JavaScript workflow dialect when orchestrator.kind = JAVASCRIPT.
        phaseId:
          type: string
          description: Canonical workflow phase identifier; payloads must not restate it.
        phaseName:
          type: string
          description: Canonical workflow phase name for customer-visible diagnostics.
        checkpointId:
          type: string
          description: Canonical checkpoint identifier for checkpoint-scoped events; payloads must not restate it.
        requestId:
          type: string
          description: Canonical request identity for all request-scoped events; payload metadata must not restate it.
        traceIds:
          type: array
