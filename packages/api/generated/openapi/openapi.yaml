        progress:
          $ref: '#/components/schemas/FactorySessionProgress'
        budgets:
          $ref: '#/components/schemas/FactorySessionBudgets'
        usage:
          $ref: '#/components/schemas/FactorySessionUsage'
        lifecycle:
          $ref: '#/components/schemas/FactorySessionLifecycle'
        stopSummary:
