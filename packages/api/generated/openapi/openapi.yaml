        runtime:
          $ref: '#/components/schemas/FactorySessionRuntime'
    FactorySession:
      type: object
      additionalProperties: false
      required:
        - id
        - target
        - folderPath
        - factoryDir
        - project
        - isDefault
        - runtime
      properties:
