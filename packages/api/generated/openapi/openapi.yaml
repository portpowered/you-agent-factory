openapi: 3.0.3
info:
  title: Agent Factory API
  version: 0.1.0
  license:
    name: MIT
  description: |
    Current Agent Factory runtime API contract. This file captures existing
    handler behavior for schema standardization and intentionally does not
    redesign route names, pagination, or response fields.
servers:
  - url: http://localhost:7437
    description: Local Agent Factory API server
security: []
tags:
  - name: Work
    description: Runtime work submission and inspection.
  - name: Factory
    description: Named factory activation and current-factory inspection.
  - name: Runtime
    description: Runtime state, event stream, and trace inspection.
  - name: Provider Sessions
    description: Provider-owned session diagnostics for dashboard inspection.
  - name: Models
    description: Model discovery and capability inspection for the current runtime.
  - name: Workflows
    description: Stored workflow inspection.
paths:
  /factory-sessions/{session_id}/work:
    post:
      tags:
        - Work
      operationId: submitWorkBySessionId
      summary: Submit work for one session
      description: Submits one work item to the explicitly selected live factory session. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitWorkRequest'
      responses:
        '201':
          description: Work was accepted for processing by the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitWorkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Work
      operationId: listWorkBySessionId
      summary: List work for one session
      description: Lists current work tokens from the engine state snapshot owned by the explicitly selected live factory session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/MaxResults'
        - $ref: '#/components/parameters/NextToken'
        - $ref: '#/components/parameters/StateName'
        - $ref: '#/components/parameters/StateType'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/WorkListName'
        - $ref: '#/components/parameters/WorkListWorkTypeName'
        - $ref: '#/components/parameters/WorkListTraceId'
      responses:
        '200':
          description: Current work tokens for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/invocations:
    post:
      tags:
        - Work
      operationId: invokeFactorySessionBySessionId
      summary: Invoke one factory session and return its primary result
      description: Live-session compatibility API for invocations against an already-open factory session. This route is not the primary durable workflow execution entrypoint; use POST /factory-sessions/async or POST /factory-sessions/sync for dynamic workflow-backed durable execution. Requests may use legacy text-first compatibility content or structured invocationSignature args. Structured args normalize through the shared backend argument resolver, while content preserves the legacy compatibility carrier. When invocationReturn is omitted, runtimes use the documented SUBMITTED_WORK_TERMINAL fallback. Supplying ambiguous input sources is rejected with INVOCATION_INPUT_SOURCE_CONFLICT or INVOCATION_ARGUMENT_SOURCE_CONFLICT. Empty selected text input is rejected with INVOCATION_INPUT_EMPTY. If no primary output can be resolved, the response status is FAILED with INVOCATION_PRIMARY_RESULT_UNRESOLVED and no primaryResult.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvocationRequest'
      responses:
        '200':
          description: Invocation reached a terminal status for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvocationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/work/staged-files:
    post:
      tags:
        - Work
      operationId: stageSubmitWorkFileBySessionId
      summary: Stage one submit-work file for one session
      description: Accepts one dashboard-authored file payload for the selected factory session, stores it behind a backend-owned staged reference, and returns the staged reference plus identifying metadata for structured submit-work items.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageSubmitWorkFileRequest'
      responses:
        '201':
          description: File payload staged successfully for later session-scoped submit-work use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageSubmitWorkFileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/work-requests/{request_id}:
    put:
      tags:
        - Work
      operationId: upsertWorkRequestBySessionId
      summary: Upsert work request for one session
      description: Submits or retries one canonical work request batch against the explicitly selected live factory session. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - name: request_id
          in: path
          required: true
          description: Stable request identifier used for idempotent submission.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkRequest'
      responses:
        '201':
          description: Work request was accepted or had already been accepted by the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertWorkRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/work/{id}:
    get:
      tags:
        - Work
      operationId: getWorkBySessionId
      summary: Get work for one session
      description: Returns one work item by work or token identifier from the current marking owned by the explicitly selected live factory session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/WorkOrTokenID'
      responses:
        '200':
          description: One work item for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/work/{id}/move:
    post:
      tags:
        - Work
      operationId: moveWorkBySessionId
      summary: Move work to another state for one session
      description: Moves an existing work item to a named authored marking state in the selected live factory session. Rejects moves while the work item is consumed by an active dispatch.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/WorkOrTokenID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveWorkRequest'
      responses:
        '200':
          description: Work item at the new marking position for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MoveWorkConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /events:
    get:
      tags:
        - Runtime
      operationId: getEvents
      summary: Stream process-global factory events (compatibility-only)
      description: Compatibility-only process-global event stream retained for legacy tooling and operator diagnostics. Dashboard clients must open GET /factory-sessions/{session_id}/events with the resolved UUID factorySessionID instead; this route does not carry session identity handshakes and must not govern default-session dashboard recovery. New Factory Session and durable replay consumers should use the session-scoped route so reconnect cursors and stream recovery have explicit session context. Historical events are sent first in ascending tick order, followed by live events on the same connection. Reconnect clients may pass after_event_id or after_sequence to receive only events newer than the acknowledged point.
      parameters:
        - $ref: '#/components/parameters/AfterEventId'
        - $ref: '#/components/parameters/AfterSequence'
      responses:
        '200':
          description: Factory event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events where each data frame is serialized JSON matching FactoryEvent.
              x-event-schema: '#/components/schemas/FactoryEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/events:
    get:
      tags:
        - Runtime
      operationId: getEventsBySessionId
      summary: Stream factory events for one session
      x-doc-id: agent-factory/api/factory-session-events
      description: |-
        Canonical FactoryEvent Server-Sent Events stream for dashboard, Factory Session, and durable replay traffic scoped to one explicitly selected session_id. OpenAPI 3.0.3 cannot structurally declare SSE event ids, comment keepalives, or per-connection ordering guarantees, so the lifecycle rules below are documented in operation prose rather than as unsupported response fields.
        Event ordering: the server sends retained history first in ascending tick order, then continues on the same connection with live FactoryEvent records. Each text/event-stream data frame is serialized JSON matching the FactoryEvent union referenced by x-event-schema.
        Reconnect cursors: pass after_event_id or after_sequence to receive only events recorded after the acknowledged point. When both are present, after_event_id wins. For session-scoped streams, after_sequence prefers FactoryEvent.context.sessionSequence when that field is present; otherwise it falls back to FactoryEvent.context.sequence. Omitting both cursors starts replay from the beginning of the session's currently retained history.
        Replay bounds: live sessions replay only events retained for the current stream generation of the targeted Factory Session. Durable execution session identifiers replay persisted canonical records for that session without crossing into another session. Cursors that no longer match the retained history boundary return typed invalid-cursor handling (400 on SSE open, cursor_stale on JSON reconnect probe) rather than silently skipping events.
        Identity handshake before reconnect: compare the response headers X-Factory-Session-Backend-Scope-Id, X-Factory-Session-Logical-Session-Key-Id, X-Factory-Session-Factory-Session-Id, and X-Factory-Session-Stream-Generation-Id with the latest sync-preflight or session-read identity set before reusing a persisted reconnect cursor or stream-derived cache. A changed streamGenerationId means the current stream generation invalidates prior cursors even when factorySessionId is unchanged.
        Keepalives: successful SSE responses use Connection keep-alive. Idle periods may occur while the Factory Session is waiting for new canonical events; clients must treat these as normal waiting state rather than terminal stream completion unless the HTTP connection closes.
        Expired-cursor recovery: when Accept includes application/json, the same route acts as a reconnect probe and returns FactorySessionEventStreamRecovery instead of opening Server-Sent Events. cursor_stale outcomes tell clients to retry with omitAfterEventId and omitAfterSequence set so the next open omits stale cursors. UNKNOWN_SESSION means the selector does not resolve to a live or durable session and never falls back to the default session.
        Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/AfterEventId'
        - $ref: '#/components/parameters/AfterSequence'
      responses:
        '200':
          description: Retained catch-up in ascending tick order followed by live FactoryEvent records for the targeted session when Accept requests text/event-stream, or a JSON FactorySessionEventStreamRecovery reconnect probe result when Accept includes application/json. Successful SSE responses use Connection keep-alive and may remain idle until the next canonical FactoryEvent is recorded.
          headers:
            X-Factory-Session-Backend-Scope-Id:
              description: Stable backend scope identifier for the current live Factory Session event history. Compare this handshake header with session-sync or preflight `backendScopeId` values before reusing reconnect cursors or stream-derived projections.
              schema:
                type: string
            X-Factory-Session-Logical-Session-Key-Id:
              description: Stable logical session key for the resolved Factory Session target within the current backend scope. Compare this handshake header with session-sync or preflight `logicalSessionKeyId` values before reusing reconnect cursors or stream-derived projections.
              schema:
                type: string
            X-Factory-Session-Factory-Session-Id:
              description: Resolved UUID Factory Session identifier for the current live event history. Compare this handshake header with session-sync or preflight `factorySessionId` values before reusing reconnect cursors or stream-derived projections.
              schema:
                type: string
            X-Factory-Session-Stream-Generation-Id:
              description: Opaque invalidation token for the current live Factory Session event history. Compare this handshake header with session-sync or preflight `streamGenerationID` values before reusing reconnect cursors or stream-derived projections.
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events where each data frame is serialized JSON matching FactoryEvent.
              x-event-schema: '#/components/schemas/FactoryEvent'
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionEventStreamRecovery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/response-events:
    get:
      tags:
        - Runtime
      operationId: getFactoryResponseEventsBySessionId
      summary: Stream ephemeral response events for one Factory Session
      description: Streams ephemeral FactoryResponseEvent observation records for the explicitly selected Factory Session. These records are outside canonical FactoryEvent replay and never derive canonical Factory state. The connection first sends retained matching records in ascending response sequence and then continues with live matching records. Each SSE id is the decimal FactoryResponseEvent.sequence so reconnect clients can acknowledge it with after_sequence. Omitting after_sequence starts at the beginning of retained history. When a cursor predates retained history, the first emitted record is STREAM_GAP and describes the lost range rather than silently skipping it. An unknown session_id returns a typed 404 and never falls back to the current or default session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/ResponseEventAfterSequence'
        - $ref: '#/components/parameters/ResponseEventDispatchID'
        - $ref: '#/components/parameters/ResponseEventKind'
      responses:
        '200':
          description: Retained catch-up followed by live Factory Response Event records for the explicitly targeted session.
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events where each data record is serialized JSON matching FactoryResponseEvent and each id is its decimal response sequence.
              x-event-schema: '#/components/schemas/FactoryResponseEvent'
        '400':
          $ref: '#/components/responses/ResponseEventBadRequest'
        '404':
          $ref: '#/components/responses/ResponseEventSessionNotFound'
        '410':
          $ref: '#/components/responses/ResponseEventStreamExpired'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/sync-preflight:
    get:
      tags:
        - Runtime
      operationId: getFactorySessionSyncPreflightBySessionId
      summary: Validate cached session sync state for one session
      description: Returns the canonical backend-owned session sync identity set and validates an optional reconnect cursor before the dashboard restores cached checkpoint state or opens the event stream. This route accepts `~default` as a session selector, but clients must persist the returned `factorySessionId` field rather than treating `~default` as a durable live-session identifier.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/BackendScopeId'
        - $ref: '#/components/parameters/LogicalSessionKeyId'
        - $ref: '#/components/parameters/AfterEventId'
        - $ref: '#/components/parameters/AfterSequence'
      responses:
        '200':
          description: Typed session sync preflight outcome for the targeted session selector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionSyncPreflightResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /status:
    get:
      tags:
        - Runtime
      operationId: getStatus
      summary: Get runtime status
      description: Returns the current factory lifecycle status, token category counts, and resource availability from the aggregate engine snapshot.
      responses:
        '200':
          description: Current runtime status summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /models:
    get:
      tags:
        - Models
      operationId: listModels
      summary: List managed runtimes
      description: Lists named managed runtimes exposed by the currently loaded runtime configuration together with readiness, lifecycle state, locality, supported operations, and resource summary data using the managed-runtime contract.
      responses:
        '200':
          description: Managed runtimes for the current runtime.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelsResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /models/{model_name}:
    get:
      tags:
        - Models
      operationId: getModel
      summary: Inspect one managed runtime
      description: Returns one managed runtime's readiness, lifecycle state, supported operations, resource metadata, worker capabilities, and diagnostics for the currently loaded runtime configuration.
      parameters:
        - name: model_name
          in: path
          required: true
          description: Stable managed runtime identity such as `OMNIVOICE_Q4_K_M`.
          schema:
            type: string
      responses:
        '200':
          description: Managed runtime detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /models/{model_name}/invocations:
    post:
      tags:
        - Models
      operationId: invokeModel
      summary: Invoke one discovered model directly
      description: Invokes one discovered model through its declared provider-agnostic operation contract using canonical `WorkContent` input and optional slot-binding overrides. Non-streaming clients receive JSON metadata, while audio-producing operations can return a streamed audio body when requested.
      parameters:
        - name: model_name
          in: path
          required: true
          description: Concrete public model identifier such as `OMNIVOICE_Q4_K_M`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelInvocationRequest'
      responses:
        '200':
          description: Successful model invocation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInvocationResponse'
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Streamed audio body for audio-producing invocations when `options.responseMode` requests `AUDIO_STREAM`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /models/{model_name}/pull:
    post:
      tags:
        - Models
      operationId: pullModel
      summary: Pull or install one managed runtime
      description: Pulls or installs required managed runtime assets into the managed cache using one source-agnostic customer action. Cloud-backed runtimes and unsupported local targets return actionable errors instead of silently succeeding.
      parameters:
        - name: model_name
          in: path
          required: true
          description: Stable managed runtime identity such as `OMNIVOICE_Q4_K_M`.
          schema:
            type: string
      responses:
        '200':
          description: Successful managed runtime pull or install, or confirmation that the managed cache already contained the required revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPullResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/status:
    get:
      tags:
        - Runtime
      operationId: getStatusBySessionId
      summary: Get runtime status for one session
      description: Returns the current factory lifecycle status, token category counts, and resource availability from the aggregate engine snapshot owned by the explicitly selected live factory session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Current runtime status summary for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /provider-sessions/detail:
    get:
      tags:
        - Provider Sessions
      operationId: getProviderSessionDetails
      summary: Get provider session details
      description: Returns parsed provider-session details using a provider-neutral response schema. The browser supplies provider, kind, and identifier query parameters; the server resolves the matching session file under the configured provider sessions root and never accepts a raw filesystem path. Only Codex (`codex`) sessions are currently loadable for this endpoint.
      parameters:
        - name: provider
          in: query
          required: true
          description: Provider that emitted the session identifier. Only codex sessions are currently loadable.
          schema:
            $ref: '#/components/schemas/LoadableProviderSessionProvider'
        - name: kind
          in: query
          required: true
          description: Provider-session identifier kind. Only session_id is currently loadable.
          schema:
            $ref: '#/components/schemas/LoadableProviderSessionKind'
        - name: id
          in: query
          required: true
          description: Provider-session identifier to resolve. This is an identifier, not a filesystem path.
          schema:
            type: string
      responses:
        '200':
          description: Parsed provider-session details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSessionDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factories/preview:
    post:
      tags:
        - Factory
      operationId: previewFactory
      summary: Preview JavaScript orchestrator factory source
      description: Canonical Factory preview surface for JavaScript orchestrator factories. Resolves orchestrator source, validates JavaScript or TypeScript source without execution, and projects effective policy, artifact-root, and structured-result constraints before Factory Session start.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactoryPreviewRequest'
      responses:
        '200':
          description: Factory preview validation, source resolution, and policy projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactoryPreviewResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /workflow-previews:
    post:
      deprecated: true
      tags:
        - Workflows
      operationId: previewWorkflow
      summary: Preview workflow validation and policy (obsolete)
      description: Obsolete Batch 001 compatibility alias for POST /factories/preview. Returns the same Factory preview contract while callers migrate to canonical Factory preview semantics.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowPreviewRequest'
      responses:
        '200':
          description: Compatibility alias of Factory preview validation and policy projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPreviewResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-validations:
    post:
      tags:
        - Factory
      operationId: validateFactory
      summary: Validate factory definition
      description: Validates a submitted complete factory definition and returns canonical validation targets without persisting or activating the factory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Factory'
      responses:
        '200':
          description: Validation result for the submitted factory definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactoryValidationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/async:
    post:
      tags:
        - Factory
      operationId: startDurableFactorySessionAsync
      summary: Start durable factory session execution asynchronously
      description: 'Primary durable execution entrypoint for dynamic workflow-backed factory sessions. Accepts the normalized FactorySessionExecutionRequest, resolves the requested source, and returns session identity plus polling links without waiting for terminal completion. WORKFLOW_FILE and WORKFLOW_NAME sources resolve in order: project `.claude/workflows`, user `~/.you-agent-factory/workflows`, package-relative workflow directories, built-in/global JavaScript factories, then explicit factory lookup when requested or required. Replaying the same requestId with the same normalized source, args, orchestrator, and requested policy returns the existing session instead of starting duplicate work. Reusing requestId with materially different inputs returns 409 Conflict with EXECUTION_REQUEST_ID_CONFLICT.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionExecutionRequest'
      responses:
        '202':
          description: Durable session execution was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionExecutionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/ExecutionRequestIdConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/sync:
    post:
      tags:
        - Factory
      operationId: startDurableFactorySessionSync
      summary: Start durable factory session execution synchronously
      description: Durable execution entrypoint that waits for terminal completion or a sync timeout before returning. Accepts the same normalized FactorySessionExecutionRequest as POST /factory-sessions/async and uses the same workflow source resolution order and requestId idempotency semantics. When the session reaches a terminal result before timeout, the response includes FactorySessionResult. Timeout responses use syncOutcome = TIMED_OUT and must not imply the session was canceled unless wait.cancelOnTimeout was explicitly true in the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionExecutionRequest'
      responses:
        '200':
          description: Sync durable execution completed, timed out, or returned while still running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionSyncExecutionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/ExecutionRequestIdConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions:
    get:
      tags:
        - Factory
      operationId: listFactorySessions
      summary: List factory sessions
      description: Lists factory sessions for the requested scope. live returns workspace sessions kept open by the runtime host, including the reserved default session. persisted returns durable execution sessions stored outside the live workspace. all returns both live and persisted summaries. Persisted summaries cover active, terminal, interrupted, and stale-lease durable sessions without exposing raw workflow source or unrestricted host paths.
      parameters:
        - $ref: '#/components/parameters/FactorySessionListScope'
      responses:
        '200':
          description: Factory session summaries for the requested scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFactorySessionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Factory
      operationId: openFactorySession
      summary: Open another live factory session
      description: Live-session compatibility API for opening workspace tabs from a folder path and optional target selection. This route is not the primary durable workflow execution entrypoint; use POST /factory-sessions/async or POST /factory-sessions/sync for dynamic workflow-backed durable execution. When `validateOnly` is true, the request validates the folder and optional target selection without creating a session. When the folder exposes more than one runnable target and no explicit target was provided, the response returns typed target metadata instead of creating a session yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenFactorySessionRequest'
      responses:
        '200':
          description: Session was opened or the caller needs to choose one of the returned runnable targets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenFactorySessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/result:
    get:
      tags:
        - Factory
      operationId: getFactorySessionResult
      summary: Get one live factory session result
      description: Returns the terminal session result for one live factory session. JavaScript workflow sessions expose final result and checkpoint artifact refs without raw checkpoint bodies or unrestricted host paths. Durable workflow execution results use GET /factory-sessions/{session_id}/results instead.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Terminal session result projection for the targeted live session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLiveResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/results:
    get:
      tags:
        - Factory
      operationId: getFactorySessionResults
      summary: Get durable factory session results
      description: Returns final or partial durable workflow outputs for one factory session. Supports mode=final|partial and includeArtifacts=true|false without requiring clients to scrape event streams or logs. Non-ready, unavailable, and failed-with-partial states return typed FactorySessionResult bodies with session identity, current session status, and actionable failure or availability details when known.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/FactorySessionResultMode'
        - $ref: '#/components/parameters/FactorySessionResultIncludeArtifacts'
      responses:
        '200':
          description: Durable session result retrieval response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/dispatches:
    get:
      tags:
        - Factory
      operationId: listFactorySessionDispatches
      summary: List durable factory session dispatches
      description: Returns dispatch summaries for one factory session with dispatch id, status, dispatch kind, phase, label, attempt, runner/model metadata when available, provider-session correlation refs, usage, warnings, output artifact ids, and failure details. Petri and JavaScript dispatches share the neutral summary shape; orchestrator-specific detail is available on GET /factory-sessions/{session_id}/dispatches/{dispatch_id}.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/FactoryDispatchPhase'
        - $ref: '#/components/parameters/FactoryDispatchStatusFilter'
      responses:
        '200':
          description: Dispatch summaries for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFactorySessionDispatchesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/dispatches/{dispatch_id}:
    get:
      tags:
        - Factory
      operationId: getFactorySessionDispatch
      summary: Get one durable factory session dispatch
      description: Returns one dispatch detail for the targeted session. Petri transition dispatches expose optional petri projections and JavaScript workflow dispatches expose optional javascript projections without forcing orchestrator-specific fields on neutral clients.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/DispatchID'
      responses:
        '200':
          description: Dispatch detail for the targeted session and dispatch id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactoryDispatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/artifacts:
    get:
      tags:
        - Factory
      operationId: listFactorySessionArtifacts
      summary: List durable factory session artifacts
      description: Returns artifact metadata for one factory session with artifact id, kind, visibility, content hash, size, created time, dispatch relation, secret-redaction counts, audit mode, and safe retrieval refs without exposing unrestricted host filesystem paths by default.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Artifact metadata rows for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFactorySessionArtifactsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/artifacts/{artifact_id}:
    get:
      tags:
        - Factory
      operationId: getFactorySessionArtifact
      summary: Get one durable factory session artifact
      description: Returns artifact metadata plus inlined content or a safe content ref according to artifact visibility and payload size. Responses must not expose unrestricted host filesystem paths by default.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/ArtifactID'
      responses:
        '200':
          description: Artifact detail for the targeted session and artifact id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionArtifactDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/approve:
    post:
      tags:
        - Factory
      operationId: approveFactorySession
      summary: Approve one durable factory session
      description: Approves requested orchestrator policy for one durable factory session in AWAITING_APPROVAL state. Returns the updated session or a typed lifecycle-control outcome for no-op, invalid-state, terminal-session, or conflict cases. Approval responses include the effective policy hash and approval preview identity when available.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionApproveRequest'
      responses:
        '200':
          description: Approval applied immediately or the session already satisfied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Approval control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/pause:
    post:
      tags:
        - Factory
      operationId: pauseFactorySession
      summary: Pause one Factory Session
      description: Pauses one live or durable Factory Session while preserving inspectable partial results, dispatches, artifacts, and buffered inbound submissions or completed worker results. Live workspace sessions use the same route family as durable execution sessions. Automatic progression stops until resume. Returns the updated session or a typed lifecycle-control outcome for no-op, invalid-state, terminal-session, or conflict cases.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionLifecycleControlRequest'
      responses:
        '200':
          description: Pause applied immediately or the session was already paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Pause control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/resume:
    post:
      tags:
        - Factory
      operationId: resumeFactorySession
      summary: Resume one Factory Session
      description: Resumes one paused live or durable Factory Session while preserving inspectable partial results, dispatches, and artifacts. Live workspace sessions use the same route family as durable execution sessions. Wakes the runtime internally and drains ready buffered submissions and completed worker results without requiring a new external signal. Returns the updated session or a typed lifecycle-control outcome for no-op, invalid-state, terminal-session, or conflict cases.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionLifecycleControlRequest'
      responses:
        '200':
          description: Resume applied immediately or the session was already running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Resume control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/cancel:
    post:
      tags:
        - Factory
      operationId: cancelFactorySession
      summary: Cancel one durable factory session
      description: Requests graceful cancellation for one durable factory session while preserving inspectable partial results, dispatches, and artifacts. Returns the updated session or a typed lifecycle-control outcome for no-op, invalid-state, terminal-session, or conflict cases.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionLifecycleControlRequest'
      responses:
        '200':
          description: Cancel applied immediately or the session was already canceled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Cancel control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/terminate:
    post:
      tags:
        - Factory
      operationId: terminateFactorySession
      summary: Terminate one durable factory session
      description: Forcefully terminates one durable factory session while preserving inspectable partial results, dispatches, and artifacts. Returns the updated session or a typed lifecycle-control outcome for no-op, invalid-state, terminal-session, or conflict cases.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionLifecycleControlRequest'
      responses:
        '200':
          description: Termination applied immediately or the session was already terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Terminate control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/retry-dispatch:
    post:
      tags:
        - Factory
      operationId: retryFactorySessionDispatch
      summary: Retry one durable factory session dispatch
      description: Retries one failed or interrupted dispatch within the targeted durable factory session. The response links the retry to the session and dispatch state and preserves inspectable partial results, dispatches, and artifacts after the control operation.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionRetryDispatchRequest'
      responses:
        '200':
          description: Retry dispatch applied immediately or produced a typed no-op outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Retry-dispatch control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/interrupt-dispatch:
    post:
      tags:
        - Factory
      operationId: interruptFactorySessionDispatch
      summary: Interrupt one active durable factory session dispatch
      description: Interrupts one active dispatch within the targeted durable factory session. The response links the interruption to the session and dispatch state and preserves inspectable partial results, dispatches, and artifacts after the control operation.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorySessionInterruptDispatchRequest'
      responses:
        '200':
          description: Interrupt dispatch applied immediately or produced a typed no-op outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '202':
          description: Interrupt-dispatch control request accepted asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FactorySessionLifecycleControlConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/partial-result:
    get:
      tags:
        - Factory
      operationId: getFactorySessionPartialResult
      summary: Get one factory session partial result
      description: Returns the current partial result for one live JavaScript workflow session. Checkpoint artifact refs and summaries are returned without raw checkpoint bodies or unrestricted host paths.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Partial session result projection for the targeted live session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionPartialResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}:
    get:
      tags:
        - Factory
      operationId: getFactorySession
      summary: Get one factory session
      description: Returns the canonical factory session inspection read model. Live workspace sessions return the existing FactorySession projection with orchestrator identity, lifecycle status, progress, budgets, usage, and kind-specific runtime projections. Durable execution sessions return a durable read model with status, resolved source ref/hash, phase summaries, progress counts, budgets, usage, policy hash, artifact refs, result summary, failure details, and lifecycle timestamps. Responses expose public source refs and hashes without raw workflow source or diagnostic artifacts.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Canonical factory session inspection read model for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactorySessionGetResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Factory
      operationId: closeFactorySession
      summary: Close one live factory session
      description: Stops the selected live factory session, removes it from the workspace session list, and leaves all remaining sessions running unchanged.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
          description: Stable live factory session identifier. Use `~default` to close the default compatibility session explicitly.
      responses:
        '204':
          description: Session was stopped and removed from the live workspace.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/factory:
    get:
      tags:
        - Factory
      operationId: getCurrentFactoryBySessionId
      summary: Get current factory for one session
      description: Returns the current factory definition owned by the explicitly selected live session together with server-managed version metadata for replacement saves. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Current active factory definition and version metadata for the targeted session, or the active default root runtime when the default session has no durable current-factory pointer yet. Default-runtime responses use the reserved `UNDEFINED` identifier in `Factory.name`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factory'
              examples:
                defaultRootRuntime:
                  summary: Default root runtime is active.
                  value:
                    name: UNDEFINED
                    workTypes:
                      - name: task
                        states:
                          - name: init
                            type: INITIAL
                          - name: done
                            type: TERMINAL
                    workers:
                      - name: planner
                        type: MODEL_WORKER
                        modelProvider: CLAUDE
                        executorProvider: SCRIPT_WRAP
                        model: claude-sonnet-4-20250514
                    workstations:
                      - name: plan-task
                        behavior: STANDARD
                        type: MODEL_WORKSTATION
                        worker: planner
                        inputs:
                          - workType: task
                            state: init
                        outputs:
                          - workType: task
                            state: done
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Factory
      operationId: saveCurrentFactoryBySessionId
      summary: Save factory for one session
      description: Submits one complete factory definition to the explicitly selected live session using an explicit save mode. Omitted `mode` defaults to `REPLACE_CURRENT`, which replaces the factory already current in the session. `UPSERT_NAMED_AND_ACTIVATE` persists under the session factory root using `factory.name`, updates the session current-factory pointer, and activates that runtime when idle. Clients should echo the server-managed `factory.version` field from the latest current-factory read for replacement saves. Unknown session identifiers return NOT_FOUND instead of falling back to the default session.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveFactoryForSessionRequest'
            examples:
              replaceCurrent:
                summary: Replace the factory already current in the session.
                value:
                  mode: REPLACE_CURRENT
                  factory:
                    name: alpha
                    version:
                      logical: '2'
                      physical: '2026-05-30T12:00:00.000000000Z'
                    workTypes:
                      - name: task
                        states:
                          - name: init
                            type: INITIAL
                          - name: done
                            type: TERMINAL
                    workers: []
                    workstations: []
              upsertNamedAndActivate:
                summary: Create or replace a named factory and activate it in the session.
                value:
                  mode: UPSERT_NAMED_AND_ACTIVATE
                  factory:
                    name: beta
                    workTypes:
                      - name: task
                        states:
                          - name: init
                            type: INITIAL
                          - name: done
                            type: TERMINAL
                    workers: []
                    workstations: []
      responses:
        '200':
          description: Saved current factory definition and new version metadata for the targeted session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factory'
        '400':
          $ref: '#/components/responses/SaveCurrentFactoryBadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SaveCurrentFactoryConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/factory/workstations/{workstation_name}/prompt-template-contract:
    get:
      tags:
        - Factory
      operationId: getCurrentFactoryWorkstationPromptTemplateContractBySessionId
      summary: Get workstation prompt-template contract
      description: Returns the authoritative prompt-variable reference and unavailable-access patterns for the selected current-factory workstation editing context.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - name: workstation_name
          in: path
          required: true
          description: Customer-authored workstation name to inspect in the current factory.
          schema:
            type: string
      responses:
        '200':
          description: Prompt-template contract for the selected workstation editing context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplateContract'
        '404':
          $ref: '#/components/responses/CurrentFactoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /factory-sessions/{session_id}/factory/workstations/{workstation_name}/prompt-template-validation:
    post:
      tags:
        - Factory
      operationId: validateCurrentFactoryWorkstationPromptTemplateBySessionId
      summary: Validate workstation prompt template
      description: Validates a prompt draft against the authoritative current-factory workstation prompt contract and returns typed syntax or variable diagnostics.
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - name: workstation_name
          in: path
          required: true
          description: Customer-authored workstation name to validate against in the current factory.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptTemplateValidationRequest'
      responses:
        '200':
          description: Prompt validation result for the selected workstation editing context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplateValidationResult'
        '404':
          $ref: '#/components/responses/CurrentFactoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    SessionID:
      name: session_id
      in: path
      required: true
      description: Stable live factory session identifier. Use `~default` to target the default compatibility session explicitly.
      schema:
        type: string
    MaxResults:
      name: maxResults
      in: query
      required: false
      description: Optional positive page size. Omit to use the default page size; non-positive values fall back to the default after successful integer binding.
      schema:
        type: integer
        minimum: 1
        default: 50
    NextToken:
      name: nextToken
      in: query
      required: false
      description: Optional base64-encoded token ID cursor.
      schema:
        type: string
    StateName:
      name: state.name
      in: query
      required: false
      description: Optional current work state name filter.
      schema:
        type: string
    StateType:
      name: state.type
      in: query
      required: false
      description: Optional current work state type filter.
      schema:
        $ref: '#/components/schemas/WorkStateType'
    SortBy:
      name: sortBy
      in: query
      required: false
      description: Optional list-work sort field. Use state.type to order by current work state type.
      schema:
        type: string
        enum:
          - state.type
    WorkListName:
      name: name
      in: query
      required: false
      description: Optional work name filter. Matches when the work name contains this value, case-insensitively.
      schema:
        type: string
    WorkListWorkTypeName:
      name: workTypeName
      in: query
      required: false
      description: Optional work type name filter. Matches when workTypeName equals this value exactly.
      schema:
        type: string
    WorkListTraceId:
      name: traceId
      in: query
      required: false
      description: Optional trace filter. Matches when traceId or currentChainingTraceId equals this value exactly.
      schema:
        type: string
    WorkOrTokenID:
      name: id
      in: path
      required: true
      description: Work or token identifier, depending on route.
      schema:
        type: string
    FactorySessionListScope:
      name: scope
      in: query
      required: false
      description: Optional session list scope. Defaults to live for backward-compatible live workspace session listing.
      schema:
        $ref: '#/components/schemas/FactorySessionListScope'
    FactorySessionResultMode:
      name: mode
      in: query
      required: false
      description: Optional durable result retrieval mode. Defaults to final for terminal outputs. partial returns the latest partial workflow output when available.
      schema:
        $ref: '#/components/schemas/FactorySessionResultMode'
    FactorySessionResultIncludeArtifacts:
      name: includeArtifacts
      in: query
      required: false
      description: When true, include artifact metadata refs for materialized outputs. Defaults to false and may return artifact ids only.
      schema:
        type: boolean
        default: false
    DispatchID:
      name: dispatch_id
      in: path
      required: true
      description: Stable factory-session dispatch identifier.
      schema:
        type: string
    FactoryDispatchPhase:
      name: phase
      in: query
      required: false
      description: Exact canonical phase identifier. Unknown phases return an empty collection.
      schema:
        type: string
        minLength: 1
    FactoryDispatchStatusFilter:
      name: status
      in: query
      required: false
      description: Canonical Dispatch lifecycle status.
      schema:
        $ref: '#/components/schemas/FactoryDispatchStatus'
    ArtifactID:
      name: artifact_id
      in: path
      required: true
      description: Stable factory-session artifact identifier.
      schema:
        type: string
    AfterEventId:
      name: after_event_id
      in: query
      required: false
      description: Session-scoped reconnect cursor identifying the last acknowledged FactoryEvent.id. The stream replays only events recorded after this stable event identifier. When both after_event_id and after_sequence are present on GET /factory-sessions/{session_id}/events, after_event_id wins.
      schema:
        type: string
    AfterSequence:
      name: after_sequence
      in: query
      required: false
      description: Session-scoped reconnect cursor identifying the last acknowledged ordering point. Session-scoped FactoryEvent streams prefer FactoryEvent.context.sessionSequence when present and otherwise fall back to FactoryEvent.context.sequence. When both after_event_id and after_sequence are present on GET /factory-sessions/{session_id}/events, after_event_id wins. Cursors that no longer match the retained history boundary surface as cursor_stale on JSON reconnect probes or invalid-cursor 400 responses on SSE open.
      schema:
        type: integer
        minimum: 0
    ResponseEventAfterSequence:
      name: after_sequence
      in: query
      required: false
      description: Last acknowledged FactoryResponseEvent.sequence. The stream sends only retained response events with a greater sequence before continuing with live events. Omit this cursor to start at the beginning of retained response-event history. If the cursor predates retained history, the first emitted event is a STREAM_GAP record describing the loss instead of silently skipping it.
      schema:
        type: integer
        format: int64
        minimum: 0
    ResponseEventDispatchID:
      name: dispatch_id
      in: query
      required: false
      description: Return only FactoryResponseEvent records associated with this exact dispatch identifier. Invalid or empty identifiers return the typed bad-request response.
      schema:
        type: string
        minLength: 1
    ResponseEventKind:
      name: kind
      in: query
      required: false
      description: Return FactoryResponseEvent records matching any requested public kind. The parameter may be repeated, for example kind=MESSAGE&kind=TOOL. Invalid or empty kind values return the typed bad-request response.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        items:
          $ref: '#/components/schemas/FactoryResponseEventKind'
    BackendScopeId:
      name: backend_scope_id
      in: query
      required: false
      description: Optional backend scope identifier used with logicalSessionKeyId to resolve the current live Factory Session when the requested session selector is missing or stale. When provided, resolution succeeds only when it matches the active backend scope.
      schema:
        type: string
    LogicalSessionKeyId:
      name: logical_session_key_id
      in: query
      required: false
      description: Optional canonical logical-session key derived from the normalized factory session target. When the requested session selector is missing or stale, resolution uses backendScopeId plus this key to locate the replacement current live Factory Session.
      schema:
        type: string
  responses:
    BadRequest:
      description: Request payload or parameter was invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CreateFactoryBadRequest:
      description: Named factory name or payload was invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidFactoryName:
              summary: Factory name failed validation.
              value:
                message: Factory name must be a safe directory segment without path separators.
                family: BAD_REQUEST
                code: INVALID_FACTORY_NAME
            invalidFactory:
              summary: Factory payload failed validation because a workstation has outputs but no failure route.
              value:
                message: Factory payload is not a valid Agent Factory definition.
                family: BAD_REQUEST
                code: INVALID_FACTORY
                targets:
                  - code: factory.workstation.missingFailureRoute
                    severity: error
                    message: workstation "bob" must define a failure route.
                    subject:
                      type: WORKSTATION
                      id: bob
                      location: ON_FAILURE
            routelessWorkstation:
              summary: Factory payload failed validation because a workstation has no output routes.
              value:
                message: Factory payload is not a valid Agent Factory definition.
                family: BAD_REQUEST
                code: INVALID_FACTORY
                targets:
                  - code: factory.workstation.missingOutputRoutes
                    severity: error
                    message: workstation "bob" must define output routes.
                    subject:
                      type: WORKSTATION
                      id: bob
                      location: OUTPUTS
    CreateFactoryConflict:
      description: Named factory could not be activated because the name already exists or the current runtime is not idle.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            factoryAlreadyExists:
              summary: Factory name already exists.
              value:
                message: Named factory already exists.
                family: CONFLICT
                code: FACTORY_ALREADY_EXISTS
            factoryNotIdle:
              summary: Runtime is not idle.
              value:
                message: Current factory runtime must be idle before activation.
                family: CONFLICT
                code: FACTORY_NOT_IDLE
                targets:
                  - code: factory.runtime.notIdle
                    severity: error
                    message: Current factory runtime must be idle before activation.
                    subject:
                      type: FACTORY
                      id: ''
                      location: DEFINITION
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CurrentFactoryNotFound:
      description: Current named factory was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            currentFactoryMissing:
              summary: No current named factory is available.
              value:
                message: Current named factory not found.
                family: NOT_FOUND
                code: NOT_FOUND
    SaveCurrentFactoryBadRequest:
      description: Current factory save request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidFactory:
              summary: Factory payload failed validation because a workstation has outputs but no failure route.
              value:
                message: Factory payload is not a valid Agent Factory definition.
                family: BAD_REQUEST
                code: INVALID_FACTORY
                targets:
                  - code: factory.workstation.missingFailureRoute
                    severity: error
                    message: workstation "bob" must define a failure route.
                    subject:
                      type: WORKSTATION
                      id: bob
                      location: ON_FAILURE
            routelessWorkstation:
              summary: Factory payload failed validation because a workstation has no output routes.
              value:
                message: Factory payload is not a valid Agent Factory definition.
                family: BAD_REQUEST
                code: INVALID_FACTORY
                targets:
                  - code: factory.workstation.missingOutputRoutes
                    severity: error
                    message: workstation "bob" must define output routes.
                    subject:
                      type: WORKSTATION
                      id: bob
                      location: OUTPUTS
    SaveCurrentFactoryConflict:
      description: Current factory could not be saved because the runtime or submitted version is not safe to replace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            staleFactoryVersion:
              summary: Submitted version is stale.
              value:
                message: Current factory definition is stale. Refresh the graph before saving.
                family: CONFLICT
                code: STALE_FACTORY_VERSION
                targets:
                  - code: factory.version.stale
                    severity: error
                    message: Current factory definition is stale. Refresh the graph before saving.
                    subject:
                      type: FACTORY
                      id: ''
                      location: DEFINITION
            factoryNotIdle:
              summary: Runtime is not idle.
              value:
                message: Current factory runtime must be idle before activation.
                family: CONFLICT
                code: FACTORY_NOT_IDLE
                targets:
                  - code: factory.runtime.notIdle
                    severity: error
                    message: Current factory runtime must be idle before activation.
                    subject:
                      type: FACTORY
                      id: ''
                      location: DEFINITION
    MoveWorkConflict:
      description: Operator move request was already applied for the supplied requestId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            duplicateRequestId:
              summary: Duplicate operator move requestId.
              value:
                message: Operator move request was already applied.
                family: CONFLICT
                code: MOVE_WORK_REQUEST_ALREADY_APPLIED
    ExecutionRequestIdConflict:
      description: The supplied requestId was already used with materially different source, args, orchestrator, or requested policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            requestIdConflict:
              summary: Durable execution requestId conflict.
              value:
                message: requestId was already used with different execution inputs.
                family: CONFLICT
                code: EXECUTION_REQUEST_ID_CONFLICT
    FactorySessionLifecycleControlConflict:
      description: Lifecycle control request conflicts with current session state, another in-flight control, or a previously applied control requestId.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FactorySessionLifecycleControlResponse'
              - $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Server failed while reading or building runtime state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ResponseEventBadRequest:
      description: Response-event cursor or filter parameters were invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidCursor:
              summary: The response-event reconnect cursor is invalid.
              value:
                message: after_sequence must be a non-negative integer.
                family: BAD_REQUEST
                code: INVALID_RESPONSE_EVENT_CURSOR
            invalidFilter:
              summary: A response-event filter is invalid.
              value:
                message: kind must contain only public FactoryResponseEventKind values.
                family: BAD_REQUEST
                code: INVALID_RESPONSE_EVENT_FILTER
    ResponseEventSessionNotFound:
      description: The explicitly selected Factory Session does not exist. Response-event streaming never falls back to the current or default session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unknownSession:
              summary: The explicit Factory Session identifier was not found.
              value:
                message: Factory Session was not found.
                family: NOT_FOUND
                code: RESPONSE_EVENT_SESSION_NOT_FOUND
    ResponseEventStreamExpired:
      description: The retained response-event stream has expired and can no longer be opened. This is distinct from an invalid cursor or filter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            expiredStream:
              summary: Retained response-event history is no longer available.
              value:
                message: The retained Factory Response Event stream has expired.
                family: GONE
                code: RESPONSE_EVENT_STREAM_EXPIRED
  schemas:
    SubmitWorkRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - workTypeName
      properties:
        name:
          type: string
          description: Required authored name for this single-work submission.
        workTypeName:
          type: string
          description: Configured work type name from factory.json to submit to.
        currentChainingTraceId:
          type: string
          description: Explicit chaining-trace identifier for the submitted work.
        traceId:
          type: string
          description: Legacy trace identifier retained for compatibility; prefer currentChainingTraceId.
        items:
          $ref: '#/components/schemas/SubmitWorkItemList'
          description: Ordered submit-work items authored by the dashboard for structured multimodal submission.
        content:
          $ref: '#/components/schemas/WorkContent'
          description: Optional canonical ordered work content parts for this submission.
        payload:
          description: Opaque work payload forwarded as raw JSON.
        tags:
          $ref: '#/components/schemas/StringMap'
        relations:
          type: array
          description: Optional token-level runtime relations preserved on the submitted work item.
          items:
            $ref: '#/components/schemas/SubmitRelation'
    SubmitRelation:
      type: object
      additionalProperties: false
      required:
        - type
        - targetWorkId
      properties:
        type:
          $ref: '#/components/schemas/RelationType'
        targetWorkId:
          type: string
          description: Target runtime work identifier for the relation.
        requiredState:
          type: string
          description: Required target state before the dependency can proceed.
    SubmitWorkResponse:
      type: object
      additionalProperties: false
      required:
        - traceId
        - requestId
        - accepted
      properties:
        traceId:
          type: string
          description: Trace identifier for the submitted work request batch.
        requestId:
          type: string
          description: Stable request identifier assigned during normalization.
        accepted:
          type: boolean
          description: False when the same requestId was already accepted (idempotent replay).
        workId:
          type: string
          description: Primary work identifier for single-work submits (batch-<requestId>-<name> when omitted).
        name:
          type: string
          description: Submitted work display name.
        workTypeName:
          type: string
          description: Configured work type name for the submitted work.
        sessionId:
          type: string
          description: Factory session that accepted the submit (~default for POST /work).
    InvocationInputSourceKind:
      type: string
      description: Invocation input source category. `text` is the only implemented API source for the text-first invocation slice. `fileRef` and `audioStream` are reserved future source categories and are not accepted by current runtimes.
      enum:
        - text
        - fileRef
        - audioStream
      x-enum-varnames:
        - InvocationInputSourceKindText
        - InvocationInputSourceKindFileRef
        - InvocationInputSourceKindAudioStream
      x-enum-descriptions:
        - Text supplied in canonical WorkContent.
        - Reserved future file-reference input source.
        - Reserved future audio-stream input source.
    InvocationRequest:
      type: object
      additionalProperties: false
      properties:
        sourceKind:
          $ref: '#/components/schemas/InvocationInputSourceKind'
          description: Compatibility input source category selected by the API caller when `content` is supplied. Current runtimes accept `text` only; future multimodal categories are documented in the enum but not implemented by this contract slice.
        content:
          $ref: '#/components/schemas/WorkContent'
          description: 'Canonical text-first compatibility invocation content. Current runtimes resolve exactly one logical text input from this carrier; non-text source categories are reserved for future contract extensions. When `args` is omitted, `content` and `sourceKind: text` preserve the legacy invocation contract.'
        args:
          type: object
          additionalProperties: true
          description: Optional structured invocation arguments keyed by parameter name, externalName, or alias. Values must decode as a string or an array of strings. Signature-backed runtimes normalize these values through the shared backend argument resolver. Compatibility `content` requests should omit `args`.
        requestId:
          type: string
          description: Optional caller-supplied idempotency key for the invocation request.
        timeoutMillis:
          type: integer
          format: int64
          minimum: 1
          description: Optional caller timeout budget in milliseconds for waiting on the primary result.
    InvocationResponse:
      type: object
      additionalProperties: false
      required:
        - requestId
        - traceId
        - status
      properties:
        requestId:
          type: string
          description: Stable invocation request identifier assigned or accepted by the server.
        traceId:
          type: string
          description: Trace identifier for the work submitted by this invocation.
        status:
          $ref: '#/components/schemas/InvocationTerminalStatus'
          description: Terminal invocation status after resolving or failing primary-result selection.
        primaryResult:
          $ref: '#/components/schemas/WorkContent'
          description: Primary invocation result. Present only when the invocation resolves successfully with status `COMPLETED`.
        errorCode:
          type: string
          description: Stable machine-readable invocation failure code when status is not `COMPLETED`.
          enum:
            - INVOCATION_BLOCKED
            - INVOCATION_INTERRUPTED
            - INVOCATION_NEEDS_HUMAN
            - INVOCATION_PAUSED
            - INVOCATION_PRIMARY_RESULT_UNRESOLVED
            - INVOCATION_TIMED_OUT
            - INVOCATION_CANCELED
            - INVOCATION_RUNTIME_FAILURE
            - INVOCATION_TTS_MODEL_NOT_READY
            - INVOCATION_TTS_GENERATION_FAILED
        message:
          type: string
          description: Human-readable failure summary when status is not `COMPLETED`.
        sessionId:
          type: string
          description: Session identifier for the invocation outcome when non-success context needs to point operators at the relevant factory session.
        workId:
          type: string
          description: Relevant work identifier for a non-success invocation outcome when one scoped work item explains the stop condition.
        workName:
          type: string
          description: Relevant work name for a non-success invocation outcome when one scoped work item explains the stop condition.
        workState:
          type: string
          description: Current authored work state that best explains the non-success invocation outcome when one scoped work item is available.
    InvocationTerminalStatus:
      type: string
      description: Terminal status for a factory-session invocation.
      enum:
        - COMPLETED
        - FAILED
        - CANCELED
        - TIMED_OUT
      x-enum-varnames:
        - InvocationTerminalStatusCompleted
        - InvocationTerminalStatusFailed
        - InvocationTerminalStatusCanceled
        - InvocationTerminalStatusTimedOut
      x-enum-descriptions:
        - Invocation completed and any primaryResult is authoritative.
        - Invocation reached a runtime or primary-result resolution failure.
        - Invocation was canceled before successful completion.
        - Invocation exceeded its caller or server timeout budget.
    SubmitWorkItemList:
      type: array
      description: Ordered dashboard-authored submit-work items preserved for one submission.
      items:
        $ref: '#/components/schemas/SubmitWorkItem'
    SubmitWorkItem:
      description: One ordered dashboard-authored submit-work item.
      oneOf:
        - $ref: '#/components/schemas/SubmitWorkTextItem'
        - $ref: '#/components/schemas/SubmitWorkImageItem'
        - $ref: '#/components/schemas/SubmitWorkVideoItem'
        - $ref: '#/components/schemas/SubmitWorkAudioItem'
        - $ref: '#/components/schemas/SubmitWorkDocumentItem'
    SubmitWorkItemType:
      type: string
      description: Supported dashboard submit-work item types for multimodal submission.
      x-enum-varnames:
        - SubmitWorkItemTypeText
        - SubmitWorkItemTypeImage
        - SubmitWorkItemTypeVideo
        - SubmitWorkItemTypeAudio
        - SubmitWorkItemTypeDocument
      enum:
        - text
        - image
        - video
        - audio
        - document
    SubmitWorkFileItemCommonFields:
      type: object
      required:
        - url
      properties:
        url:
          $ref: '#/components/schemas/SubmitWorkContentURLProperty'
        stagedFileRef:
          type: string
          minLength: 1
          description: Backend-owned staged file reference preserved for later dispatch.
        fileName:
          type: string
          minLength: 1
          description: Browser-authored filename preserved for inline identification and validation.
        mediaType:
          type: string
          minLength: 1
          description: Browser-authored MIME type preserved for validation and dispatch decisions.
    SubmitWorkTextItem:
      description: Ordered inline text submission item.
      type: object
      additionalProperties: false
      required:
        - type
        - text
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/SubmitWorkItemType'
          enum:
            - text
        text:
          type: string
          description: Authored inline text preserved in item order.
    SubmitWorkImageItem:
      description: Ordered image submission item backed by one staged file reference.
      allOf:
        - $ref: '#/components/schemas/SubmitWorkFileItemCommonFields'
        - type: object
          additionalProperties: false
          required:
            - type
            - stagedFileRef
            - fileName
            - mediaType
          properties:
            type:
              allOf:
                - $ref: '#/components/schemas/SubmitWorkItemType'
              enum:
                - image
    SubmitWorkVideoItem:
      description: Ordered video submission item backed by one staged file reference.
      allOf:
        - $ref: '#/components/schemas/SubmitWorkFileItemCommonFields'
        - type: object
          additionalProperties: false
          required:
            - type
            - stagedFileRef
            - fileName
            - mediaType
          properties:
            type:
              allOf:
                - $ref: '#/components/schemas/SubmitWorkItemType'
              enum:
                - video
    SubmitWorkAudioItem:
      description: Ordered audio submission item backed by one staged file reference.
      allOf:
        - $ref: '#/components/schemas/SubmitWorkFileItemCommonFields'
        - type: object
          additionalProperties: false
          required:
            - type
            - stagedFileRef
            - fileName
            - mediaType
          properties:
            type:
              allOf:
                - $ref: '#/components/schemas/SubmitWorkItemType'
              enum:
                - audio
    SubmitWorkDocumentItem:
      description: Ordered document submission item backed by one staged file reference.
      allOf:
        - $ref: '#/components/schemas/SubmitWorkFileItemCommonFields'
        - type: object
          additionalProperties: false
          required:
            - type
            - stagedFileRef
            - fileName
            - mediaType
          properties:
            type:
              allOf:
                - $ref: '#/components/schemas/SubmitWorkItemType'
              enum:
                - document
    StageSubmitWorkFileRequest:
      type: object
      additionalProperties: false
      required:
        - contentBase64
        - fileName
        - itemType
        - mediaType
      properties:
        itemType:
          $ref: '#/components/schemas/SubmitWorkItemType'
          description: Structured submit-work item kind this file will back. Text is not allowed.
        fileName:
          type: string
          minLength: 1
          description: Browser-authored filename preserved for inline identification and staging.
        mediaType:
          type: string
          minLength: 1
          description: Browser-authored MIME type preserved for validation and dispatch decisions.
        contentBase64:
          type: string
          minLength: 1
          description: Base64-encoded file payload to stage behind a backend-owned reference.
    StageSubmitWorkFileResponse:
      type: object
      additionalProperties: false
      required:
        - fileName
        - mediaType
        - stagedFileRef
        - url
      properties:
        url:
          $ref: '#/components/schemas/SubmitWorkContentURLProperty'
          description: Canonical file:// URL for the staged bytes on the factory host.
        stagedFileRef:
          type: string
          minLength: 1
          description: Backend-owned staged file reference returned for later structured submit-work items.
        fileName:
          type: string
          minLength: 1
          description: Browser-authored filename preserved for inline identification after staging.
        mediaType:
          type: string
          minLength: 1
          description: Browser-authored MIME type preserved for inline identification after staging.
    UpsertWorkRequestSubmittedWork:
      type: object
      additionalProperties: false
      required:
        - name
        - workTypeName
        - workId
      properties:
        name:
          type: string
        workTypeName:
          type: string
        workId:
          type: string
    UpsertWorkRequestResponse:
      type: object
      additionalProperties: false
      required:
        - requestId
        - traceId
        - works
      properties:
        requestId:
          type: string
        traceId:
          type: string
        works:
          type: array
          items:
            $ref: '#/components/schemas/UpsertWorkRequestSubmittedWork'
    MoveWorkRequest:
      type: object
      additionalProperties: false
      description: Operator request to move one work item to another authored marking state.
      required:
        - stateName
      properties:
        stateName:
          type: string
          description: Authored marking state name to move the work item into.
        requestId:
          type: string
          description: Optional client idempotency key. Repeating the same requestId for an already-applied operator move returns 409 Conflict without a second mutation.
    ListWorkResponse:
      type: object
      additionalProperties: false
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Work'
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
    PaginationContext:
      type: object
      additionalProperties: false
      required:
        - maxResults
      properties:
        maxResults:
          type: integer
        nextToken:
          type: string
    TokenResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - placeId
        - workId
        - workType
        - traceId
        - createdAt
        - enteredAt
      properties:
        id:
          type: string
        placeId:
          type: string
        name:
          type: string
        workId:
          type: string
        workType:
          type: string
        chainingTraceDepth:
          type: integer
          minimum: 1
        currentChainingTraceId:
          type: string
        previousChainingTraceIds:
          type: array
          items:
            type: string
        traceId:
          type: string
        content:
          $ref: '#/components/schemas/WorkContent'
          description: Ordered canonical content parts preserved on this work token.
        tags:
          $ref: '#/components/schemas/StringMap'
        createdAt:
          type: string
          format: date-time
        enteredAt:
          type: string
          format: date-time
        history:
          $ref: '#/components/schemas/TokenHistory'
    TokenHistory:
      type: object
      additionalProperties: false
      properties:
        totalVisits:
          $ref: '#/components/schemas/IntegerMap'
        consecutiveFailures:
          $ref: '#/components/schemas/IntegerMap'
        placeVisits:
          $ref: '#/components/schemas/IntegerMap'
        lastError:
          type: string
    ResourceUsage:
      type: object
      additionalProperties: false
      required:
        - name
        - available
        - total
      properties:
        name:
          type: string
        available:
          type: integer
        total:
          type: integer
    ResourceRequirement:
      type: object
      additionalProperties: false
      required:
        - name
        - capacity
      properties:
        name:
          type: string
        capacity:
          type: integer
          minimum: 1
    StatusCategories:
      type: object
      additionalProperties: false
      required:
        - initial
        - processing
        - terminal
        - failed
      properties:
        initial:
          type: integer
        processing:
          type: integer
        terminal:
          type: integer
        failed:
          type: integer
    StatusResponse:
      type: object
      additionalProperties: false
      required:
        - categories
        - factoryState
        - runtimeStatus
        - totalTokens
      properties:
        categories:
          $ref: '#/components/schemas/StatusCategories'
        factoryState:
          type: string
        lifecycleControlStatus:
          $ref: '#/components/schemas/FactorySessionDurableLifecycleStatus'
          description: Canonical Factory Session lifecycle-control status reconstructed from SESSION_PAUSED and SESSION_RESUMED events when present. Live status reads report PAUSED after a successful pause and RUNNING after a successful resume.
        runtimeStatus:
          type: string
        totalTokens:
          type: integer
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceUsage'
    ListModelsResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          description: Managed runtimes exposed by the currently loaded runtime configuration.
          items:
            $ref: '#/components/schemas/ModelSummary'
    ManagedRuntime:
      type: object
      required:
        - identity
        - readinessState
        - lifecycleState
        - locality
        - supportedOperations
      properties:
        identity:
          type: string
          description: |
            Stable managed runtime identity shared by discovery, inspect, pull or install, and factory dependency surfaces.
        readinessState:
          $ref: '#/components/schemas/ManagedRuntimeReadinessState'
        lifecycleState:
          $ref: '#/components/schemas/ManagedRuntimeLifecycleState'
        locality:
          $ref: '#/components/schemas/WorkerModelLocality'
        supportedOperations:
          type: array
          description: Provider-agnostic operations supported by this managed runtime.
          items:
            $ref: '#/components/schemas/ModelOperation'
        diagnostics:
          $ref: '#/components/schemas/StringMap'
          description: Concise managed-runtime diagnostics in customer-relevant terms.
    ManagedRuntimeLifecycleState:
      type: string
      description: |
        Customer-facing lifecycle position for one managed runtime. Lifecycle state tracks install, cache, and load progression independently from short-lived readiness used by invocation surfaces.
      enum:
        - NOT_APPLICABLE
        - NOT_INSTALLED
        - INSTALLING
        - INSTALLED
        - LOADING
        - LOADED
      x-enum-descriptions:
        - Managed install and cache lifecycle does not apply, such as for cloud-backed runtimes.
        - Required managed runtime assets are not installed in the managed cache.
        - Managed runtime assets are being pulled or installed into the managed cache.
        - Required managed runtime assets are installed in the managed cache but not loaded for invocation.
        - Managed runtime assets are being loaded into an invocation-ready runtime handle.
        - Managed runtime assets are loaded and available for invocation subject to readiness checks.
    ManagedRuntimePullOutcome:
      type: string
      description: |
        Source-agnostic outcome for one managed runtime pull or install request. Outcomes classify whether the runtime is already ready, newly installed, still preparing, timed out, failed to fetch required assets, or unsupported.
      enum:
        - ALREADY_READY
        - INSTALLED_SUCCESSFULLY
        - ALREADY_PRESENT
        - STILL_LOADING
        - TIMED_OUT
        - SOURCE_FETCH_FAILED
        - UNSUPPORTED_RUNTIME
      x-enum-descriptions:
        - The managed runtime was already ready and no additional install work was required.
        - Required managed runtime assets were installed successfully into the managed cache.
        - Required managed runtime assets were already present in the managed cache at the requested revision.
        - Managed runtime install or preparation is still in progress.
        - Managed runtime install or preparation timed out before reaching a terminal readiness state.
        - Required managed runtime assets could not be fetched from the configured backend source.
        - The requested managed runtime does not support pull or install in the current configuration.
    ManagedRuntimePullResult:
      type: object
      required:
        - identity
        - pullOutcome
        - readinessState
      properties:
        identity:
          type: string
          description: Stable managed runtime identity targeted by the pull or install request.
        pullOutcome:
          $ref: '#/components/schemas/ManagedRuntimePullOutcome'
        readinessState:
          $ref: '#/components/schemas/ManagedRuntimeReadinessState'
        cachePath:
          type: string
          description: Managed cache directory that now contains the installed runtime assets.
        revision:
          type: string
          description: Managed revision identifier for the installed runtime assets.
        downloadedFiles:
          type: array
          description: Files downloaded or verified as already present for the managed cache entry.
          items:
            $ref: '#/components/schemas/ModelPullDownloadedFile'
        sourceDiagnostics:
          $ref: '#/components/schemas/ManagedRuntimeSourceDiagnostics'
    ManagedRuntimeReadinessState:
      type: string
      description: |
        Customer-facing readiness for one managed runtime. Readiness describes whether the runtime can be invoked now or what action is required next, without naming upstream repository or provider-specific cache semantics.
      enum:
        - READY
        - MISSING
        - LOADING
        - FAILED
        - UNSUPPORTED
      x-enum-descriptions:
        - Required managed runtime assets are present and the runtime is ready for invocation.
        - Required managed runtime assets are not present and pull or install is required.
        - Managed runtime assets are being prepared or loaded.
        - Managed runtime setup failed and requires operator attention.
        - The managed runtime is not supported by the current factory or platform configuration.
    ManagedRuntimeSourceDiagnostics:
      type: object
      description: |
        Optional advanced diagnostics for how one managed runtime resolved assets from a configured backend source. Source details are implementation diagnostics and are not required for the primary customer lifecycle contract.
      properties:
        sourceKind:
          type: string
          description: |
            Resolver-classified backend source kind, such as `UPSTREAM_REPOSITORY` or `MANAGED_MIRROR`, without exposing provider-native repository vocabulary in the primary customer contract.
        sourceId:
          type: string
          description: Opaque resolver identifier for the selected backend source instance.
        resolverNotes:
          type: string
          description: Concise resolver note suitable for operator diagnostics.
    ModelSummary:
      type: object
      required:
        - name
        - managedRuntime
        - providerLocality
        - status
        - loadState
        - operations
        - modalities
        - resources
      properties:
        name:
          type: string
          description: |
            Stable managed runtime identity such as `OMNIVOICE_Q4_K_M`. Mirrors `managedRuntime.identity` for compatibility with earlier discovery fields.
        managedRuntime:
          $ref: '#/components/schemas/ManagedRuntime'
        providerLocality:
          $ref: '#/components/schemas/WorkerModelLocality'
          description: |
            Managed runtime locality summary. Mirrors `managedRuntime.locality` for compatibility with earlier discovery fields.
        status:
          $ref: '#/components/schemas/ModelStatus'
        loadState:
          $ref: '#/components/schemas/ModelLoadState'
        operations:
          type: array
          description: |
            Provider-agnostic operations supported by the managed runtime. Mirrors `managedRuntime.supportedOperations` for compatibility with earlier discovery fields.
          items:
            $ref: '#/components/schemas/ModelOperation'
        modalities:
          type: array
          description: Uppercase content modalities observed across the model's declared operation inputs and outputs.
          items:
            $ref: '#/components/schemas/ModelOperationContentType'
        resources:
          type: array
          description: Factory resource summaries associated with this model's workers or explicit model metadata.
          items:
            $ref: '#/components/schemas/ModelResourceSummary'
    ModelDetail:
      type: object
      required:
        - name
        - managedRuntime
        - providerLocality
        - status
        - loadState
        - operations
        - modalities
        - resources
        - capabilities
        - diagnostics
      properties:
        name:
          type: string
          description: |
            Stable managed runtime identity such as `OMNIVOICE_Q4_K_M`. Mirrors `managedRuntime.identity` for compatibility with earlier inspect fields.
        managedRuntime:
          $ref: '#/components/schemas/ManagedRuntime'
        providerLocality:
          $ref: '#/components/schemas/WorkerModelLocality'
          description: |
            Managed runtime locality summary. Mirrors `managedRuntime.locality` for compatibility with earlier inspect fields.
        status:
          $ref: '#/components/schemas/ModelStatus'
        loadState:
          $ref: '#/components/schemas/ModelLoadState'
        operations:
          type: array
          description: |
            Union of provider-agnostic operations supported by workers for this managed runtime. Mirrors `managedRuntime.supportedOperations` for compatibility with earlier inspect fields.
          items:
            $ref: '#/components/schemas/ModelOperation'
        modalities:
          type: array
          description: Uppercase content modalities observed across all declared operation inputs and outputs.
          items:
            $ref: '#/components/schemas/ModelOperationContentType'
        resources:
          type: array
          description: Factory resource summaries associated with this model's workers or explicit model metadata.
          items:
            $ref: '#/components/schemas/ModelResourceSummary'
        capabilities:
          type: array
          description: Worker-scoped capability declarations that contribute to this discovered model.
          items:
            $ref: '#/components/schemas/ModelCapability'
        diagnostics:
          $ref: '#/components/schemas/StringMap'
    ModelInvocationRequest:
      type: object
      additionalProperties: false
      required:
        - operation
      properties:
        operation:
          type: string
          description: Uppercase provider-agnostic operation to invoke, such as `TTS`.
        content:
          $ref: '#/components/schemas/WorkContent'
          description: Ordered invocation input content resolved through optional slot bindings.
        bindings:
          type: array
          description: Optional per-request slot bindings that follow the same contract as `MODEL_INVOKE` workstation bindings.
          items:
            $ref: '#/components/schemas/WorkstationOperationBinding'
        options:
          $ref: '#/components/schemas/ModelInvocationOptions'
    ModelInvocationOptions:
      type: object
      additionalProperties: false
      description: Optional direct-invocation controls for response shaping and transport.
      properties:
        responseMode:
          $ref: '#/components/schemas/ModelInvocationResponseMode'
    ModelInvocationResponseMode:
      type: string
      description: Requested direct-invocation response mode.
      enum:
        - METADATA
        - AUDIO_STREAM
    ModelInvocationResponse:
      type: object
      additionalProperties: false
      required:
        - modelName
        - worker
        - operation
        - providerLocality
        - content
        - bindings
      properties:
        modelName:
          type: string
          description: Concrete public model identifier such as `OMNIVOICE_Q4_K_M`.
        worker:
          type: string
          description: Worker selected to satisfy this invocation.
        operation:
          type: string
          description: Uppercase provider-agnostic operation that was invoked.
        providerLocality:
          $ref: '#/components/schemas/WorkerModelLocality'
        content:
          $ref: '#/components/schemas/WorkContent'
          description: Returned model output as canonical `WorkContent`.
        bindings:
          type: array
          description: Deterministically resolved slot bindings used for the invocation.
          items:
            $ref: '#/components/schemas/ResolvedModelOperationBinding'
    ModelPullDownloadedFile:
      type: object
      required:
        - path
        - bytes
      properties:
        path:
          type: string
          description: Relative file path written under the managed model cache directory.
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: Downloaded file size in bytes.
        sha256:
          type: string
          description: Lowercase SHA-256 checksum for the cached file when known.
    ModelPullOutcome:
      type: string
      description: |
        Compatibility pull outcome projection for one managed runtime. Prefer `managedRuntimePull.pullOutcome` for the canonical managed-runtime vocabulary. `PULLED` maps to managed pull outcome `INSTALLED_SUCCESSFULLY`; `ALREADY_PRESENT` maps to managed pull outcome `ALREADY_PRESENT`.
      enum:
        - PULLED
        - ALREADY_PRESENT
    ModelPullResponse:
      type: object
      required:
        - modelName
        - managedRuntimePull
        - providerLocality
        - outcome
        - cachePath
        - revision
        - downloadedFiles
      properties:
        modelName:
          type: string
          description: |
            Stable managed runtime identity such as `OMNIVOICE_Q4_K_M`. Mirrors `managedRuntimePull.identity` for compatibility with earlier pull fields.
        managedRuntimePull:
          $ref: '#/components/schemas/ManagedRuntimePullResult'
        providerLocality:
          $ref: '#/components/schemas/WorkerModelLocality'
        outcome:
          $ref: '#/components/schemas/ModelPullOutcome'
        cachePath:
          type: string
          description: |
            Final managed cache directory that now contains the installed runtime assets. Mirrors `managedRuntimePull.cachePath`.
        revision:
          type: string
          description: |
            Managed revision identifier for the installed runtime assets. Mirrors `managedRuntimePull.revision`.
        downloadedFiles:
          type: array
          description: Files that were downloaded or verified as already present for the managed cache entry.
          items:
            $ref: '#/components/schemas/ModelPullDownloadedFile'
    ResolvedModelOperationBinding:
      type: object
      additionalProperties: false
      required:
        - slot
        - source
        - content
      properties:
        slot:
          type: string
          description: Stable input slot name declared by the worker capability.
        source:
          $ref: '#/components/schemas/ResolvedModelOperationBindingSource'
        content:
          $ref: '#/components/schemas/WorkContent'
          description: Resolved content bound to the slot.
    ResolvedModelOperationBindingSource:
      type: string
      description: Source used to resolve one invocation slot binding.
      enum:
        - INPUT
        - CONFIG
        - DEFAULT
        - OMITTED
    ModelCapability:
      type: object
      required:
        - worker
        - providerLocality
        - operations
        - resourceNames
      properties:
        worker:
          type: string
          description: Customer-authored worker name that exposes this capability declaration.
        modelProvider:
          $ref: '#/components/schemas/WorkerModelProvider'
        providerLocality:
          $ref: '#/components/schemas/WorkerModelLocality'
        operations:
          type: array
          description: Operations declared by this worker for the selected model.
          items:
            $ref: '#/components/schemas/ModelOperation'
        resourceNames:
          type: array
          description: Factory resource names referenced by the worker declaration.
          items:
            type: string
    ModelResourceSummary:
      type: object
      required:
        - name
        - type
        - capacity
      properties:
        name:
          type: string
          description: Factory-authored resource name.
        type:
          $ref: '#/components/schemas/ResourceType'
        capacity:
          type: integer
          minimum: 0
          description: Declared factory capacity for this resource.
        model:
          type: string
          description: Concrete model identifier when the resource is model-specific.
        backend:
          type: string
          description: Local runtime backend identifier for model resources.
        loadPolicy:
          type: string
          description: Local load-policy metadata for model resources.
        provider:
          type: string
          description: Cloud provider identity when the resource models quota or routing.
    ModelStatus:
      type: string
      description: |
        Compatibility readiness projection for one managed runtime. Prefer `managedRuntime.readinessState` for the canonical managed-runtime vocabulary. `READY` maps to managed readiness `READY`; `UNAVAILABLE` maps to managed readiness `MISSING` for local runtimes that still require install or setup.
      enum:
        - READY
        - UNAVAILABLE
    ModelLoadState:
      type: string
      description: |
        Compatibility lifecycle projection for one managed runtime. Prefer `managedRuntime.lifecycleState` for the canonical managed-runtime vocabulary. `UNLOADED` maps to managed lifecycle `NOT_INSTALLED` or `LOADED` depending on cache and load state; `NOT_APPLICABLE` maps to managed lifecycle `NOT_APPLICABLE` for cloud-backed runtimes.
      enum:
        - UNLOADED
        - NOT_APPLICABLE
    ErrorFamily:
      type: string
      description: Stable machine-readable error family for broader client grouping.
      enum:
        - BAD_REQUEST
        - CONFLICT
        - NOT_FOUND
        - GONE
        - INTERNAL_SERVER_ERROR
      x-enum-varnames:
        - ErrorFamilyBadRequest
        - ErrorFamilyConflict
        - ErrorFamilyNotFound
        - ErrorFamilyGone
        - ErrorFamilyInternalServerError
      x-enum-descriptions:
        - Request payload or parameter validation failed.
        - The request conflicts with current resource state.
        - The requested resource does not exist.
        - The requested resource previously existed but is no longer retained.
        - The server failed while handling an otherwise valid request.
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - message
        - family
        - code
      properties:
        message:
          type: string
        family:
          $ref: '#/components/schemas/ErrorFamily'
        code:
          type: string
          description: Stable machine-readable error code.
          enum:
            - BAD_REQUEST
            - FACTORY_SESSION_CONFIG_LOAD_FAILED
            - INVALID_FACTORY_NAME
            - FACTORY_ALREADY_EXISTS
            - INVALID_FACTORY
            - FACTORY_NOT_IDLE
            - STALE_FACTORY_VERSION
            - MOVE_WORK_REQUEST_ALREADY_APPLIED
            - EXECUTION_REQUEST_ID_CONFLICT
            - FACTORY_SESSION_CONTROL_REQUEST_ALREADY_APPLIED
            - INVALID_RESPONSE_EVENT_CURSOR
            - INVALID_RESPONSE_EVENT_FILTER
            - RESPONSE_EVENT_SESSION_NOT_FOUND
            - RESPONSE_EVENT_STREAM_EXPIRED
            - NOT_FOUND
            - INTERNAL_ERROR
          x-enum-descriptions:
            - Request payload or parameter validation failed.
            - Factory session discovery found a readable factory target whose config could not be loaded.
            - Named factory name validation failed.
            - Submitted named factory already exists.
            - Submitted named factory payload failed validation.
            - Current factory runtime is not idle and cannot activate a new named factory.
            - Submitted editable factory definition was based on an older version than the current definition.
            - Operator move requestId was already applied for this session.
            - Durable execution requestId was reused with materially different inputs.
            - Lifecycle control requestId was already applied with different control inputs.
            - The Factory Response Event reconnect cursor is invalid.
            - A Factory Response Event filter is invalid.
            - The explicitly selected Factory Session for response events does not exist.
            - The retained Factory Response Event stream is no longer available.
            - The requested resource does not exist.
            - The server failed while handling an otherwise valid request.
        targets:
          type: array
          description: Optional canonical validation targets that clients can map to factory graph nodes, handles, and form fields.
          items:
            $ref: '#/components/schemas/FactoryValidationTarget'
    ErrorTarget:
      type: object
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          type: string
          description: Client-visible target category such as form, node, edge, field, or save.
        id:
          type: string
          description: Optional graph entity, relationship, or save condition identifier.
        field:
          type: string
          description: Optional request or form field path associated with the error.
    HybridLogicalTimestamp:
      type: object
      additionalProperties: false
      required:
        - logical
        - physical
      properties:
        logical:
          type: string
          format: int64
          pattern: ^[0-9]+$
          description: Monotonic Lamport-style logical component derived from the persisted factory definition version. Serialized as a decimal string so JavaScript clients can round-trip the 64-bit value without precision loss.
        physical:
          type: string
          format: date-time
          description: UTC physical timestamp component for the persisted factory definition version.
    ProviderSessionDetailResponse:
      type: object
      additionalProperties: false
