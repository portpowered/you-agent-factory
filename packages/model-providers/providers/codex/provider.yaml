id: codex
aliases: []
displayName:
  type: LOCALIZABLE_ASSET
  value: Codex
description:
  type: LOCALIZABLE_ASSET
  value: OpenAI Codex CLI integration.
documentation:
  - kind: reference
    url: https://developers.openai.com/codex/cli/reference/
technicalSupportLevel: production
implementationAvailability: bundled
maximumExecutionCapabilities:
  promptSubmission: true
  imageInput: true
  sessionResume: true
  structuredOutput: true
  toolExecution: true
  workingDirectory: true
  worktree: true
maximumResponseFidelityCapabilities:
  nativeStreaming: true
  messageDeltas: false
  messageSnapshots: true
  reasoningSummaries: true
  toolLifecycle: true
  toolOutputDeltas: true
  fileChanges: true
  plans: true
  usage: true
  stableItemIds: true
  providerReconnect: false
discovery:
  executableNames:
    - codex
  endpointKinds:
    - stdio
  configurationKeys: []
  prerequisites:
    - kind: authentication
      name: account-authentication
      description: Sign in to the Codex account before execution.
    - kind: executable
      name: codex
      description: The bundled Codex adapter requires the codex executable.
    - kind: workspace
      name: writable-workspace
      description: Execution requires a writable workspace selected by the factory.
models:
  - id: gpt-5.6
    efforts:
      - minimal
      - low
      - medium
      - high
      - xhigh
      - max
    modalities:
      - direction: input
        modality: audio
        support: unsupported
        transport: none
      - direction: input
        modality: image
        support: supported
        transport: file_path
      - direction: input
        modality: text
        support: supported
        transport: inline
      - direction: input
        modality: video
        support: unsupported
        transport: none
      - direction: output
        modality: audio
        support: unsupported
        transport: none
      - direction: output
        modality: image
        support: supported
        transport: file_path
      - direction: output
        modality: text
        support: supported
        transport: inline
      - direction: output
        modality: video
        support: unsupported
        transport: none
tools:
  - name: filesystem
    support: supported
    description: Read and modify files in the selected workspace.
  - name: shell
    support: supported
    description: Run bounded shell commands through the Codex tool runner.
  - name: web_search
    support: supported
    description: Use the provider web-search tool when enabled by the invocation.
knownLimits:
  - name: referenced_image_paths
    kind: maximum
    unit: paths
    description: Image generation accepts at most five referenced image paths.
    maximum: 5
