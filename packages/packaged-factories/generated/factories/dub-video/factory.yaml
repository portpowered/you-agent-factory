                    def test_long_translation_keeps_every_segment_across_model_calls(self):
                        with tempfile.TemporaryDirectory() as directory:
                            root = Path(directory)
                            manifest = self.manifest(root, stage="transcribed")
                            value = dub_video.read_json(manifest)
