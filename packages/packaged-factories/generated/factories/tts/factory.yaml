description:
    type: LOCALIZABLE_ASSET
    value: Converts submitted text to audio with the packaged local text-to-speech model.
examples:
    - args:
        text: The release is ready.
      description:
        type: LOCALIZABLE_ASSET
        value: Convert a short release summary to audio.
      name: speak-release-summary
id: builtin-tts
invocationSignature:
    parameters:
        - bindings:
            - kind: POSITIONAL
              position: 1
            - kind: STDIN
            - kind: NAMED
          description: Text to convert to speech.
          externalName: to
          name: text
          required: true
name: tts
resources:
    - backend: LOCALAI-VIBEVOICE
      capacity: 1
      loadPolicy: ON_DEMAND
      model: tts
      name: tts-cache
      type: MODEL
workTypes:
    - handlingBehavior:
        - DEFAULT
      name: task
      states:
        - name: init
          type: INITIAL
        - name: complete
          type: TERMINAL
        - name: failed
          type: FAILED
workers:
    - body: You are the local text-to-speech worker for @you/tts. Treat the bound text slot as the complete input, preserve its wording and reading order, synthesize exactly one audio result with the configured local model, and surface a clear failure rather than returning partial or unrelated content.
      command: localai-vibevoice
      model: tts
      modelLocality: LOCAL
      modelProvider: CODEX
      name: tts-executor
      operations:
        - inputs:
            - contentTypes:
                - TEXT
              name: text
              required: true
          name: TTS
          outputs:
            - contentTypes:
                - AUDIO
              name: audio
      resources:
        - capacity: 1
          name: tts-cache
      type: INFERENCE_WORKER
workstations:
    - body: For Work {{ (index .Inputs 0).WorkID }}, read the complete bound text input, pass it unchanged to the configured TTS operation, and return the resulting audio content. Do not summarize, translate, add commentary, or claim success if synthesis produces no valid audio output.
      inputs:
        - state: init
          workType: task
      name: execute-tts
      onFailure:
        - state: failed
          workType: task
      operation: TTS
      operationBindings:
        - selector:
            type: TEXT
          slot: text
      outputs:
        - state: complete
          workType: task
      type: INFERENCE_RUN
      worker: tts-executor
