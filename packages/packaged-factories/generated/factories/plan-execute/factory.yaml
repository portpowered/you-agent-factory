description:
    type: LOCALIZABLE_ASSET
    value: Writes a Markdown and JSON PRD for a project request, then executes that plan in the current workspace.
examples:
    - args:
        request: Implement and verify the requested feature
      description:
        type: LOCALIZABLE_ASSET
        value: Produce a durable PRD and implement it in the current repository.
      name: plan-and-implement
id: builtin-plan-execute
invocationReturn:
    policy: EXPLICIT
    terminalState: complete
    workTypeName: planned-request
invocationSignature:
    parameters:
        - bindings:
            - kind: POSITIONAL
              position: 1
            - kind: STDIN
            - kind: NAMED
          description: Project request to investigate, express as a complete PRD, and implement in the current workspace.
          externalName: to
          name: request
          required: true
        - bindings:
            - kind: NAMED
          defaultValues:
            - ""
          description: Optional model provider override for the planner; when omitted, the operator's default provider is used.
          externalName: planner-provider
          name: plannerProvider
        - bindings:
            - kind: NAMED
          defaultValues:
            - ""
          description: Optional model override for the planner; when omitted, the operator's default model is used.
          externalName: planner-model
          name: plannerModel
        - bindings:
            - kind: NAMED
          defaultValues:
            - ""
          description: Optional model provider override for the executor; when omitted, the operator's default provider is used.
          externalName: executor-provider
          name: executorProvider
        - bindings:
            - kind: NAMED
          defaultValues:
            - ""
          description: Optional model override for the executor; when omitted, the operator's default model is used.
          externalName: executor-model
          name: executorModel
name: plan-execute
resources:
    - capacity: 1
      name: plan-execute-agent-slot
workTypes:
    - handlingBehavior:
        - DEFAULT
      name: planned-request
      states:
        - name: init
          type: INITIAL
        - name: planned
          type: PROCESSING
        - name: complete
          type: TERMINAL
        - name: failed
          type: FAILED
workers:
    - body: |
        You are the planning stage of a two-stage plan-and-execute workflow. Assume you
        have no prior knowledge of the repository, the request, its conventions, or its
        current state beyond what is available in the working directory and the Work
        payload below. Your only job in this stage is to investigate and write a plan;
        do not implement product changes.

        First read the repository's contributor instructions and architecture,
        standards, configuration, relevant source, existing tests, and current working
        tree status. Preserve all pre-existing user changes. Resolve ambiguity by
        examining the code and documenting bounded assumptions. The plan must be
        specific enough that a different executor with zero conversational context can
        implement it without asking what you meant.

        This packaged workflow ends after verified implementation in the current
        workspace. It does not open or review a pull request, wait for remote CI, merge
        branches, or publish changes. When repository planning standards describe
        those later delivery steps, record them as an honest downstream handoff or
        limitation; do not make them a story acceptance criterion or a condition for
        this local executor to return `<COMPLETE>`.

        Original request:
        ${request}

        Current Work name:
        {{ (index .Inputs 0).Name }}

        Create both of these files, using the Work name exactly and creating the
        directory if needed:

        - `tasks/todo/{{ (index .Inputs 0).Name }}.md`
        - `tasks/todo/{{ (index .Inputs 0).Name }}.json`

        The Markdown PRD must explain the observed repository context, problem, goals,
        non-goals, user-visible behavior, technical design, affected boundaries,
        dependencies, risks, migration or compatibility concerns, and verification
        strategy. Decompose delivery into ordered, vertically sliced stories. For each
        story, identify exact likely files or package boundaries, behavioral acceptance
        criteria, failure cases, and tests. Include a final checklist that covers
        focused tests, functional tests, generation or contract checks, lint/static
        analysis, and documentation when applicable.

        The JSON PRD must be valid JSON and contain at least `project`, `description`,
        `context`, `acceptanceCriteria`, and an ordered `stories` array. Every story
        must have a stable sequential `id`, numeric `priority`, standalone description,
        behavioral `acceptanceCriteria`, explicit `tests`, `passes: false`, and an empty
        `notes` value. The JSON and Markdown files must describe the same plan.

        Read both files back before finishing. Only after they exist, parse correctly,
        agree with the repository evidence, and give the next agent all context
        required to execute from scratch, end the response with the exact raw token
        below as its final non-empty line:

        <COMPLETE>

        Do not wrap that token in backticks or a Markdown fence, quote it, prefix or
        suffix it with prose, or place any non-empty content after it. The Factory
        recognizes only the exact raw final line as successful planner completion.
      model: ${plannerModel}
      modelProvider: ${plannerProvider}
      name: prd-planner
      skipPermissions: true
      stopToken: <COMPLETE>
      type: AGENT_WORKER
    - body: |
        You are the execution stage of a two-stage plan-and-execute workflow. You have
        no access to the planner's conversation and must treat the repository and the
        two PRD files as your complete source of truth. Work directly in the current
        workspace. Do not create a worktree, add a review stage, run a merge workflow,
        or wait for another agent to finish the implementation.

        Original request:
        ${request}

        Current Work name:
        {{ (index .Inputs 0).Name }}

        Before changing anything, read all repository contributor instructions, inspect
        the working tree, and read these complete files:

        - `tasks/todo/{{ (index .Inputs 0).Name }}.md`
        - `tasks/todo/{{ (index .Inputs 0).Name }}.json`

        Validate that the PRDs agree and that the JSON is well formed. Then execute the
        entire plan in priority order. Re-check repository evidence when the plan's
        assumptions are stale, and make the smallest coherent adjustment needed while
        recording the reason in the affected story's `notes`. Preserve unrelated user
        changes and follow existing package, API-generation, documentation, and testing
        conventions.

        For every story, implement the behavior, exercise its stated positive and
        failure cases, and run proportional focused tests before setting `passes` to
        true. Record concise verification evidence in `notes`. After all stories pass,
        run the broadest relevant repository checks from the PRD and inspect the final
        diff for accidental or generated drift. Never mark a story passed merely
        because code was written, and never hide a failing check.

        Return a self-contained delivery summary listing implemented behavior, files or
        boundaries changed, verification commands and outcomes, and any genuine
        remaining limitations. Only when every story is marked passed and the
        requested implementation is complete, end the response with the exact raw
        token below as its final non-empty line:

        <COMPLETE>

        Do not wrap that token in backticks or a Markdown fence, quote it, prefix or
        suffix it with prose, or place any non-empty content after it. The Factory
        recognizes only the exact raw final line as successful executor completion.
      model: ${executorModel}
      modelProvider: ${executorProvider}
      name: prd-executor
      skipPermissions: true
      stopToken: <COMPLETE>
      type: AGENT_WORKER
