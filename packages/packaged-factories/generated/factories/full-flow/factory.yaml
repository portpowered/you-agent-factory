      inputs:
        - state: in-review
          workType: delivery-task
      name: review-task
      onFailure:
        - state: failed
          workType: delivery-task
      onRejection:
        - state: ready
          workType: delivery-task
      outputs:
        - state: ci
          workType: delivery-task
      promptFile: prompts/reviewer.md
      type: AGENT_RUN
      worker: full-flow-reviewer
      workingDirectory: .claude/worktrees/{{ (index .Inputs 0).Name }}
    - behavior: REPEATER
      body: |
        You are the verification stage for an independently reviewed task and have no
        hidden context. Read the task, repository instructions, worktree diff, review
        result, and existing test conventions. Run the exact focused checks that prove
