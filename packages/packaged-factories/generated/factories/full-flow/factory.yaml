        only when every required task-owned check passes. Return `<CONTINUE>` with a
        specific repair plan while actionable verification work remains.
      inputs:
        - state: ci
          workType: delivery-task
      name: verify-task-ci
      onContinue:
        - state: ci
          workType: delivery-task
      onFailure:
        - state: failed
          workType: delivery-task
      onRejection:
        - state: ready
          workType: delivery-task
      outputs:
        - state: merge
          workType: delivery-task
      promptFile: prompts/ci.md
      type: AGENT_RUN
      worker: full-flow-ci
      workingDirectory: .claude/worktrees/{{ (index .Inputs 0).Name }}
    - behavior: REPEATER
      body: |
        You are the merge stage for one verified task. Assume zero shared context. Read
