      inputs:
        - state: init
          workType: project
      limits:
        maxGeneratedWorkItems: 9
      name: assess-project
      onFailure:
        - state: failed
          workType: project
      outputs:
        - state: waiting
          workType: project
      promptFile: prompts/planner.md
      resources:
        - capacity: 1
          name: full-flow-planner-slot
      type: AGENT_RUN
      workPropagation:
        mode: PRESERVE_INPUT
      worker: full-flow-planner
    - inputs:
        - state: init
          workType: delivery-task
      name: setup-task-worktree
      onFailure:
        - state: failed
          workType: delivery-task
      outputs:
        - state: ready
          workType: delivery-task
      resources:
        - capacity: 1
          name: full-flow-task-slots
      type: SCRIPT_RUN
      worker: task-worktree-setup
    - behavior: REPEATER
      body: |
        You are the implementation agent for one assigned delivery task in an isolated
        worktree. Assume zero conversational context and read the complete Work payload,
        dependency outputs, repository contributor instructions, architecture, relevant
        source and tests, and current worktree status before editing.

        Implement only the assigned task while preserving unrelated and already merged
