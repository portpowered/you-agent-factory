name: full-flow
resources:
    - capacity: 8
      name: full-flow-task-slots
    - capacity: 1
      name: full-flow-planner-slot
    - capacity: 1
      name: full-flow-merge-slot
supportingFiles:
    bundledFiles:
        - content:
            encoding: utf-8
            inline: |
                #!/usr/bin/env python3
                """Create or reuse one safe task worktree for @you/full-flow."""
                import json
                import re
                import subprocess
                import sys
                from pathlib import Path

                SAFE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._/-]{0,79}$")

                def run(root, *args):
                    result = subprocess.run(["git", *args], cwd=root, text=True, capture_output=True)
                    if result.returncode:
                        raise RuntimeError(result.stderr.strip() or result.stdout.strip())
                    return result.stdout.strip()

                def main():
                    if len(sys.argv) != 3 or not SAFE.fullmatch(sys.argv[1]) or not SAFE.fullmatch(sys.argv[2]) or ".." in sys.argv[1] or ".." in sys.argv[2]:
                        raise RuntimeError("safe task and base branch names are required")
                    task, base = sys.argv[1], sys.argv[2]
                    root = Path(run(None, "rev-parse", "--show-toplevel"))
                    run(root, "rev-parse", "--verify", base)
                    target = root / ".claude" / "worktrees" / task.replace("/", "-")
                    if not (target / ".git").exists():
                        target.parent.mkdir(parents=True, exist_ok=True)
                        exists = subprocess.run(["git", "show-ref", "--verify", "--quiet", f"refs/heads/{task}"], cwd=root).returncode == 0
                        args = ["worktree", "add", str(target), task] if exists else ["worktree", "add", "-b", task, str(target), base]
                        run(root, *args)
                    print(json.dumps({"status":"ready","task":task,"base":base,"worktree":str(target)}))

                if __name__ == "__main__":
                    try:
                        main()
                    except Exception as error:
                        print(f"task worktree setup failed: {error}", file=sys.stderr)
                        raise SystemExit(1)
          id: factory/scripts/setup-task-worktree.py
          targetPath: factory/scripts/setup-task-worktree.py
          type: SCRIPT
workTypes:
    - handlingBehavior:
        - DEFAULT
      name: project
      states:
        - name: init
          type: INITIAL
        - name: waiting
          type: PROCESSING
        - name: complete
          type: TERMINAL
        - name: failed
          type: FAILED
    - name: delivery-task
      states:
        - name: init
          type: INITIAL
        - name: ready
          type: PROCESSING
        - name: in-review
          type: PROCESSING
        - name: ci
          type: PROCESSING
        - name: merge
          type: PROCESSING
        - name: merged
          type: TERMINAL
        - name: failed
          type: FAILED
    - name: cycle-control
      states:
        - name: init
          type: INITIAL
        - name: continue
          type: PROCESSING
        - name: complete
          type: TERMINAL
        - name: failed
          type: FAILED
workers:
    - body: |
        You are the planning stage for one bounded delivery cycle. Assume zero prior
        conversation. Inspect the complete request, repository contributor instructions,
        architecture, relevant source and tests, current branch and working-tree state,
        and already merged results before deciding what remains. Preserve unrelated user
        changes and never infer completion from prior prose alone.

        Before planning, run `you docs agents` and read it. Also run
        `you docs batch-inputs` and `you docs relationships` when available. The runtime
        does not infer a batch from prose: your entire response must be one raw JSON
        object with an outer `request` wrapper, with no Markdown fence or surrounding
        explanation.

        Project request:
        ${request}

        Cycle limits are maxCycles=${maxCycles} and
        maxTasksPerCycle=${maxTasksPerCycle}. The project and cycle-control Work name is
        exactly `{{ (index .Inputs 0).Name }}`.

        If work remains, return raw JSON matching this exact shape:

        {"request":{"type":"FACTORY_REQUEST_BATCH","works":[{"name":"task-a","workTypeName":"delivery-task","state":"init","payload":"Standalone implementation task with observed repository context, objective, boundaries, relevant files, dependency assumptions, acceptance criteria, tests, and merge risks."},{"name":"{{ (index .Inputs 0).Name }}","workTypeName":"cycle-control","state":"init","payload":"continue"}],"relations":[{"type":"DEPENDS_ON","sourceWorkName":"{{ (index .Inputs 0).Name }}","targetWorkName":"task-a","requiredState":"merged"}]}}

        Generate between one and the configured maximum `delivery-task` items plus
        exactly one `cycle-control` item. Its name must exactly match
        `{{ (index .Inputs 0).Name }}` and its payload must be `continue`. Every
        delivery task must use state `init`, be a standalone specification for an agent
        with no shared context, and have a unique name safe for a Git branch. Add a
        DEPENDS_ON relation whose source is cycle-control and target is each delivery
        task, with requiredState `merged`. A DEPENDS_ON source is blocked by its target.
        Add delivery-task dependencies only when execution truly must be ordered, and
        use requiredState `merged` for them.

        When direct inspection proves the entire project request and its verification
        are complete, return exactly this shape instead:

        {"request":{"type":"FACTORY_REQUEST_BATCH","works":[{"name":"{{ (index .Inputs 0).Name }}","workTypeName":"cycle-control","state":"init","payload":"complete"}],"relations":[]}}

        Do not emit requestId, additional top-level fields, other work types or states,
        cycles, self-dependencies, unknown names, PARENT_CHILD, SPAWNED_BY, comments,
        Markdown, or prose outside the JSON object. Do not declare completion while
        required work or failing checks remain.
      model: ${plannerModel}
      modelProvider: ${plannerProvider}
      name: full-flow-planner
      skipPermissions: true
      type: AGENT_WORKER
    - args:
        - factory/scripts/setup-task-worktree.py
        - '{{ (index .Inputs 0).Name }}'
        - ${baseBranch}
      command: python
      name: task-worktree-setup
      type: SCRIPT_WORKER
    - body: |
        You are the implementation agent for one assigned delivery task in an isolated
        worktree. Assume zero conversational context and read the complete Work payload,
        dependency outputs, repository contributor instructions, architecture, relevant
        source and tests, and current worktree status before editing.

        Implement only the assigned task while preserving unrelated and already merged
        changes. Validate the planner's assumptions against current code. Exercise the
        task's behavioral acceptance criteria and important failure cases, run
        proportional tests, inspect the diff, and commit a coherent reviewable change.
        Return a self-contained summary with files changed, decisions, commands and
        outcomes, and any limitation needed by review or merge.

        End with `<COMPLETE>` only when the task is implemented, verified, and committed.
        Use `<CONTINUE>` only when another pass can make concrete progress; explain the
        remaining work before the marker.
      model: ${executorModel}
      modelProvider: ${executorProvider}
      name: full-flow-executor
      skipPermissions: true
      stopToken: <COMPLETE>
      type: AGENT_WORKER
    - body: |
        You are an independent reviewer with no shared conversation. Read the full task,
        repository instructions, actual worktree diff and commits, relevant source and
        tests, and the executor's verification evidence. Review correctness before
        style, including task scope, behavioral and failure cases, architecture fit,
        compatibility, security implications, and preservation of unrelated work.

        Accept only a task that is ready for CI and eventual merge. When rejecting,
        identify each concrete defect, the required correction, and why it matters so a
        fresh executor can repair it without guessing. Do not approve based only on the
        executor's claims or reject for subjective preferences.
      model: ${reviewerModel}
      modelProvider: ${reviewerProvider}
      name: full-flow-reviewer
      skipPermissions: true
      type: AGENT_WORKER
    - body: |
        You are the verification stage for an independently reviewed task and have no
        hidden context. Read the task, repository instructions, worktree diff, review
        result, and existing test conventions. Run the exact focused checks that prove
        the changed behavior, then the proportional repository, lint, generation,
        contract, or documentation checks required by the affected boundaries.

        Diagnose and repair task-owned failures without hiding output or changing
        unrelated behavior. If required remote CI exists, inspect it until terminal.
        Report commands, outcomes, and any known baseline failure. Return `<COMPLETE>`
        only when every required task-owned check passes. Return `<CONTINUE>` with a
        specific repair plan while actionable verification work remains.
      model: ${executorModel}
      modelProvider: ${executorProvider}
      name: full-flow-ci
      skipPermissions: true
      type: AGENT_WORKER
    - body: |
        You are the merge stage for one verified task. Assume zero shared context. Read
        the task specification, repository instructions, worktree commits and diff,
        review and CI evidence, current base branch, and changes merged by other tasks.

        Update against the evolving base, resolve conflicts semantically without
        discarding either valid task work or unrelated changes, and rerun every check
        affected by conflict resolution. Merge using the repository's established local
        workflow and verify that the task commit is observable on the base branch with a
        clean relevant status. Report the resulting commit and verification evidence.

        Return `<COMPLETE>` only after the merge is actually observable on the base.
        Use `<CONTINUE>` while a repair, conflict, check, or merge action remains.
      model: ${executorModel}
      modelProvider: ${executorProvider}
      name: full-flow-merger
      skipPermissions: true
      type: AGENT_WORKER
    - body: 'You are a cycle gate with zero prior context. Read the complete cycle-control payload and the observable results of every task it depends on. Return exactly `complete` only when the payload requests completion and the project evidence shows no required work remains; otherwise return exactly `continue`. Do not add prose or infer success from missing evidence. Payload: {{ (index .Inputs 0).Payload }}'
      model: ${plannerModel}
      modelProvider: ${plannerProvider}
      name: cycle-decider
      skipPermissions: true
      type: AGENT_WORKER
workstations:
    - body: |
        You are the planning stage for one bounded delivery cycle. Assume zero prior
