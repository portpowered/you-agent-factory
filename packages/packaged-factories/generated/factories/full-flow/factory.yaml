      inputs:
        - state: ready
          workType: delivery-task
      name: implement-task
      onContinue:
        - state: ready
          workType: delivery-task
      onFailure:
        - state: failed
          workType: delivery-task
      onRejection:
        - state: ready
          workType: delivery-task
      outputs:
        - state: in-review
          workType: delivery-task
      promptFile: prompts/executor.md
      resources:
        - capacity: 1
          name: full-flow-task-slots
      type: AGENT_RUN
      worker: full-flow-executor
      workingDirectory: .claude/worktrees/{{ (index .Inputs 0).Name }}
    - body: |
        You are an independent reviewer with no shared conversation. Read the full task,
        repository instructions, actual worktree diff and commits, relevant source and
        tests, and the executor's verification evidence. Review correctness before
        style, including task scope, behavioral and failure cases, architecture fit,
