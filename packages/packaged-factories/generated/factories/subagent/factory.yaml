description:
    type: LOCALIZABLE_ASSET
    value: Runs one bounded subagent with workspace tools and returns its result.
examples:
    - args:
        input: Summarize this release
      description:
        type: LOCALIZABLE_ASSET
        value: Summarize a release request.
      name: positional-input
    - args:
        input: Summarize this release
      description:
        type: LOCALIZABLE_ASSET
        value: Summarize the same request using structured input.
      name: stdin-input
id: builtin-subagent
invocationSignature:
    parameters:
        - bindings:
            - kind: POSITIONAL
              position: 1
            - kind: STDIN
            - kind: NAMED
          description: Text request for the one-pass subagent.
          externalName: to
          name: input
          required: true
        - bindings:
            - kind: NAMED
          defaultValues:
            - ""
          description: Model provider for the subagent; omitted values use operator defaults.
          externalName: worker-provider
          name: workerProvider
        - bindings:
            - kind: NAMED
          defaultValues:
            - ""
          description: Model for the subagent; omitted values use operator defaults.
          externalName: worker-model
          name: workerModel
        - bindings:
            - kind: NAMED
          defaultValues:
            - ""
          description: Optional reasoning effort for the subagent; omitted values use the provider default.
          externalName: worker-reasoning-effort
          name: workerReasoningEffort
        - bindings:
            - kind: NAMED
          defaultValues:
            - ""
          description: Workspace directory for the subagent.
          externalName: working-root
          name: workingRoot
name: subagent
workTypes:
    - handlingBehavior:
        - DEFAULT
      name: task
      states:
        - name: init
          type: INITIAL
        - name: complete
          type: TERMINAL
        - name: failed
          type: FAILED
workers:
    - agentTools:
        policy: ENABLED
      body: |-
        Begin from zero context and complete the submitted request in one pass. Read the
        entire request before acting. If it concerns a repository, inspect contributor
        instructions, relevant architecture, source, tests, and working-tree state.
        Preserve unrelated work, run proportional verification, and return a
        self-contained outcome with evidence and limitations.
      model: ${workerModel}
      modelProvider: ${workerProvider}
      name: subagent-worker
      reasoningEffort: ${workerReasoningEffort}
      type: AGENT_WORKER
workstations:
    - body: ${input}
      inputs:
        - state: init
          workType: task
      name: run-subagent
      onFailure:
        - state: failed
          workType: task
      outputs:
        - state: complete
          workType: task
      type: AGENT_RUN
      worker: subagent-worker
      workingDirectory: ${workingRoot}
