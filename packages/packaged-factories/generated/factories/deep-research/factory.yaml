examples:
    - args:
        topic: Compare event sourcing and state machines for workflow orchestration
      description:
        type: LOCALIZABLE_ASSET
        value: Compare two workflow architecture approaches.
      name: positional-topic
    - args:
        topic: What are the trade-offs of retrieval-augmented generation?
      description:
        type: LOCALIZABLE_ASSET
        value: Research retrieval-augmented generation trade-offs.
      name: stdin-topic
id: builtin-deep-research
invocationSignature:
    parameters:
        - bindings:
            - kind: POSITIONAL
              position: 1
            - kind: STDIN
          description: Research topic for the lead research workflow.
          name: topic
          required: true
        - bindings:
            - kind: NAMED
          defaultValue: "2"
          description: Investigation breadth from 1 (focused) through 3 (broad). Defaults to 2.
          externalName: researchDepth
          name: researchDepth
          typeHint: STRING
        - bindings:
            - kind: NAMED
          defaultValue: "2"
          description: Maximum specialist child agents for this invocation, from 0 through 2. Defaults to 2.
          externalName: maxSubagents
          name: maxSubagents
          typeHint: STRING
        - bindings:
            - kind: NAMED
          defaultValue: CODEX
          description: Approved provider for specialist research execution. Defaults to CODEX.
          externalName: model-provider
          name: modelProvider
          typeHint: STRING
        - bindings:
            - kind: NAMED
          defaultValue: gpt-5
          description: Approved model for specialist research execution. Defaults to gpt-5.
          externalName: model
          name: model
          typeHint: STRING
        - bindings:
            - kind: NAMED
          defaultValue: medium
          description: Approved reasoning effort for specialist research execution. Defaults to medium.
          externalName: reasoning-effort
          name: reasoningEffort
          typeHint: STRING
name: deep-research
orchestrator:
    javascript:
        argsSchema:
            additionalProperties: false
            properties:
                maxSubagents:
                    default: 2
                    description: Per-invocation specialist cap within the factory policy ceiling.
                    maximum: 2
                    minimum: 0
                    type: integer
                model:
                    default: gpt-5
                    description: The requested specialist execution model, subject to package policy.
                    enum:
                        - gpt-5
                    minLength: 1
                    type: string
                modelProvider:
                    default: CODEX
                    description: The package's approved specialist execution provider.
                    enum:
                        - CODEX
                    type: string
                reasoningEffort:
                    default: medium
                    description: The requested specialist reasoning effort, subject to package policy.
                    enum:
                        - medium
                    minLength: 1
                    type: string
                researchDepth:
                    default: 2
                    description: 'Investigation breadth: 1 focused, 2 balanced, or 3 broad.'
                    maximum: 3
                    minimum: 1
                    type: integer
                topic:
                    description: The subject to investigate.
                    minLength: 1
                    type: string
            required:
                - topic
            type: object
        defaultPolicy:
            allowConnectors: false
            allowDangerFullAccess: false
            allowNetwork: false
            allowedModels:
                - gpt-5
            allowedReasoningEfforts:
                - medium
            concurrency: 2
            maxAgents: 3
            maxDepth: 1
            maxRetries: 0
            mode: READ_ONLY
            writableRoots: []
        sourceRef: scripts/deep-research.workflow.js
    kind: JAVASCRIPT
supportingFiles:
    bundledFiles:
        - content:
            encoding: utf-8
            inline: |
                return (async function () {
                  phase("lead-research");

                  const topic = args.topic;
                  const researchDepth = args.researchDepth === undefined ? 2 : args.researchDepth;
                  const maxSubagents = args.maxSubagents === undefined ? 2 : args.maxSubagents;
                  const modelProvider = args.modelProvider === undefined ? "CODEX" : args.modelProvider;
                  const model = args.model === undefined ? "gpt-5" : args.model;
                  const reasoningEffort = args.reasoningEffort === undefined ? "medium" : args.reasoningEffort;
                  // Longer topics carry enough scope to benefit from the two complementary
                  // specialist roles while short questions remain a lead-only investigation.
                  const needsSpecialists = args.topic.length >= 40;

                  let specialistFindings = [];
                  if (needsSpecialists && maxSubagents > 0) {
                    phase("specialist-research");
                    specialistFindings = await parallel([
                      {
                        label: "research-specialist-technical",
                        prompt: "Investigate technical mechanisms and supporting evidence for the research topic at breadth level " + researchDepth + ".",
                        modelProvider: modelProvider,
                        model: model,
                        reasoningEffort: reasoningEffort,
                      },
                      {
                        label: "research-specialist-tradeoffs",
                        prompt: "Investigate practical trade-offs, risks, and counterarguments for the research topic at breadth level " + researchDepth + ".",
                        modelProvider: modelProvider,
                        model: model,
                        reasoningEffort: reasoningEffort,
                      },
                    ].slice(0, maxSubagents));
                  }

                  phase("lead-synthesis");
                  const specialistEvidence = specialistFindings.length === 0
                    ? "No specialist findings were requested."
                    : specialistFindings[0].output.text + (specialistFindings.length > 1 ? "\n" + specialistFindings[1].output.text : "");
                  const leadSynthesis = await agent.run({
                    label: "lead-research-synthesis",
                    prompt: "You are the lead researcher. Investigate and synthesize a coherent answer for the topic: " + topic + ". " +
                      "Use breadth level " + researchDepth + ". Incorporate these completed specialist findings when present: " +
                      specialistEvidence,
                    modelProvider: modelProvider,
                    model: model,
                    reasoningEffort: reasoningEffort,
                  });

                  return {
                    topic: topic,
                    role: "lead-researcher",
                    researchDepth: researchDepth,
                    maxSubagents: maxSubagents,
                    execution: {
                      modelProvider: modelProvider,
                      model: model,
                      reasoningEffort: reasoningEffort,
                    },
                    synthesis: {
                      leadResult: leadSynthesis.output,
                    },
                  };
                })();
          id: factory/scripts/deep-research.workflow.js
          targetPath: factory/scripts/deep-research.workflow.js
          type: SCRIPT
