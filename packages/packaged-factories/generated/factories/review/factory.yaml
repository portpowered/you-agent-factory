description:
    type: LOCALIZABLE_ASSET
    value: Produces candidate work and repeats independent review until approval or a bounded failure.
examples:
    - args:
        input: Draft the release notes
      description:
        type: LOCALIZABLE_ASSET
        value: Review draft release notes.
      name: positional-input
id: builtin-review
invocationReturn:
    policy: EXPLICIT
    terminalState: approved
    workTypeName: reviewable-work
invocationSignature:
    parameters:
        - bindings:
            - kind: POSITIONAL
              position: 1
            - kind: STDIN
            - kind: NAMED
          description: Work request that must be independently reviewed before it is returned.
          externalName: to
          name: input
          required: true
        - bindings:
            - kind: NAMED
          defaultValues:
            - ""
          description: Model provider for the writer; omitted values use operator defaults.
          externalName: writer-provider
          name: writerProvider
        - bindings:
            - kind: NAMED
          defaultValues:
            - ""
          description: Model for the writer; omitted values use operator defaults.
          externalName: writer-model
          name: writerModel
        - bindings:
            - kind: NAMED
          defaultValues:
            - ""
          description: Model provider for the reviewer; omitted values use operator defaults.
          externalName: reviewer-provider
          name: reviewerProvider
        - bindings:
            - kind: NAMED
          defaultValues:
            - ""
          description: Model for the reviewer; omitted values use operator defaults.
          externalName: reviewer-model
          name: reviewerModel
name: review
workTypes:
    - handlingBehavior:
        - DEFAULT
      name: reviewable-work
      states:
        - name: init
          type: INITIAL
        - name: in-review
          type: PROCESSING
        - name: approved
          type: TERMINAL
        - name: failed
          type: FAILED
workers:
    - body: |
        You are the producing stage of an independent produce-and-review workflow. You
        have no prior conversation or hidden project context. Read the complete request
        below and, when it concerns a workspace, first inspect contributor instructions,
        relevant architecture, source, tests, and current working-tree state. Preserve
        unrelated user changes and verify important assumptions before acting.

        Request:
        {{ (index .Inputs 0).Payload }}

        {{ if gt (index .Inputs 0).History.AttemptNumber 1 -}}
        Previous rejected work:
        {{ (index .Inputs 0).PreviousOutput }}

        Reviewer feedback:
        {{ (index .Inputs 0).RejectionFeedback }}

        {{ end -}}
        Deliver a self-contained candidate that directly answers the request. Include
        the reasoning, artifacts, or verification evidence the reviewer needs to judge
        correctness. If this is a revision, address every item of feedback and re-check
        affected behavior rather than merely editing the wording. Return the complete
        candidate as your final response, and do not claim it has already been reviewed.
      model: ${writerModel}
      modelProvider: ${writerProvider}
      name: review-work-executor
      type: AGENT_WORKER
    - body: |
        You are the independent review stage. Assume zero context beyond the original
        request, candidate, and any repository state available in the workspace. Read
        the complete inputs. When the candidate changes code or configuration, inspect
        the actual diff, contributor instructions, affected implementation, tests, and
        verification evidence instead of trusting the candidate's claims.

        Original request:
        {{ (index .Inputs 0).Payload }}

        Candidate work:
        {{ (index .Inputs 0).PreviousOutput }}

        Check correctness, completeness, edge and failure cases, compatibility,
        security implications, architecture fit, preservation of unrelated work, and
        test adequacy. Feedback must identify the concrete defect, the required change,
        and why it matters. Do not reject for personal style preferences.

        Return only a JSON object. If every material requirement is satisfied, return
        {"decision":"ACCEPTED","output":"the complete approved candidate work"}.
        If it needs revision, return {"decision":"REJECTED","feedback":"specific actionable feedback"}.
        Do not approve without including the complete approved candidate in `output`,
        and do not approve when verification evidence needed for the request is absent.
      model: ${reviewerModel}
      modelProvider: ${reviewerProvider}
      name: review-work-reviewer
      type: AGENT_WORKER
workstations:
    - body: |
        You are the producing stage of an independent produce-and-review workflow. You
        have no prior conversation or hidden project context. Read the complete request
        below and, when it concerns a workspace, first inspect contributor instructions,
        relevant architecture, source, tests, and current working-tree state. Preserve
        unrelated user changes and verify important assumptions before acting.

        Request:
        {{ (index .Inputs 0).Payload }}

        {{ if gt (index .Inputs 0).History.AttemptNumber 1 -}}
        Previous rejected work:
        {{ (index .Inputs 0).PreviousOutput }}

        Reviewer feedback:
        {{ (index .Inputs 0).RejectionFeedback }}

        {{ end -}}
        Deliver a self-contained candidate that directly answers the request. Include
        the reasoning, artifacts, or verification evidence the reviewer needs to judge
        correctness. If this is a revision, address every item of feedback and re-check
        affected behavior rather than merely editing the wording. Return the complete
        candidate as your final response, and do not claim it has already been reviewed.
      inputs:
        - state: init
          workType: reviewable-work
      name: execute-review-work
      onFailure:
        - state: failed
          workType: reviewable-work
      outputs:
        - state: in-review
          workType: reviewable-work
      promptFile: prompts/executor.md
      type: AGENT_RUN
      workPropagation:
        mode: PRESERVE_INPUT
      worker: review-work-executor
    - body: |
        You are the independent review stage. Assume zero context beyond the original
        request, candidate, and any repository state available in the workspace. Read
        the complete inputs. When the candidate changes code or configuration, inspect
        the actual diff, contributor instructions, affected implementation, tests, and
        verification evidence instead of trusting the candidate's claims.

        Original request:
        {{ (index .Inputs 0).Payload }}

        Candidate work:
        {{ (index .Inputs 0).PreviousOutput }}

        Check correctness, completeness, edge and failure cases, compatibility,
        security implications, architecture fit, preservation of unrelated work, and
        test adequacy. Feedback must identify the concrete defect, the required change,
        and why it matters. Do not reject for personal style preferences.

        Return only a JSON object. If every material requirement is satisfied, return
        {"decision":"ACCEPTED","output":"the complete approved candidate work"}.
        If it needs revision, return {"decision":"REJECTED","feedback":"specific actionable feedback"}.
        Do not approve without including the complete approved candidate in `output`,
        and do not approve when verification evidence needed for the request is absent.
      inputs:
        - state: in-review
          workType: reviewable-work
      name: review-review-work
      onFailure:
        - state: failed
          workType: reviewable-work
      onRejection:
        - state: init
          workType: reviewable-work
      outcomeFormat: decision-envelope
      outputs:
        - state: approved
          workType: reviewable-work
      promptFile: prompts/reviewer.md
      type: AGENT_RUN
      worker: review-work-reviewer
    - guards:
        - maxVisits: 8
          type: VISIT_COUNT
          workstation: review-review-work
      inputs:
        - state: init
          workType: reviewable-work
      name: review-loop-breaker
      outputs:
        - state: failed
          workType: reviewable-work
      type: LOGICAL_MOVE
      worker: ""
