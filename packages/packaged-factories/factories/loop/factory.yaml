name: "@you/loop"
id: builtin-loop
description:
  type: LOCALIZABLE_ASSET
  value: Runs the requested task at a duration interval such as 1h for the lifetime of the Factory Session.
invocationSignature:
  parameters:
    - name: request
      description: Request to execute at each interval.
      externalName: to
      required: true
      bindings:
        - kind: POSITIONAL
          position: 1
        - kind: STDIN
        - kind: NAMED
    - name: every
      description: Positive duration interval from 1s through 168h, such as 30s, 5m, 1h, or 1h30m.
      externalName: every
      required: true
      bindings:
        - kind: NAMED
    - name: triggerAtStart
      description: Run once immediately after the controller Work is admitted.
      externalName: trigger-at-start
      defaultValue: "false"
      bindings:
        - kind: NAMED
    - name: maxConsecutiveFailures
      description: Stop scheduling after this many consecutive failed executions; zero continues indefinitely.
      externalName: max-consecutive-failures
      typeHint: NUMBER_STRING
      defaultValue: "0"
      bindings:
        - kind: NAMED
    - name: executorProvider
      description: Model provider for each scheduled execution; omitted values use operator defaults.
      externalName: executor-provider
      defaultValues:
        - ""
      bindings:
        - kind: NAMED
    - name: executorModel
      description: Model for each scheduled execution; omitted values use operator defaults.
      externalName: executor-model
      defaultValues:
        - ""
      bindings:
        - kind: NAMED
examples:
  - name: hourly-dependency-check
    description:
      type: LOCALIZABLE_ASSET
      value: Check dependency updates once per hour.
    args:
      request: Check dependency updates
      every: 1h
resources:
  - name: loop-executor-slot
    capacity: 1
workTypes:
  - name: loop-controller
    handlingBehavior:
      - DEFAULT
    states:
      - name: active
        type: INITIAL
      - name: stopped
        type: TERMINAL
      - name: failed
        type: FAILED
  - name: scheduled-execution
    states:
      - name: init
        type: INITIAL
      - name: complete
        type: TERMINAL
      - name: skipped
        type: TERMINAL
      - name: failed
        type: FAILED
workers:
  - name: loop-trigger
    type: AGENT_WORKER
    skipPermissions: true
    body: "At each configured trigger, preserve the complete controller request and create exactly one traceable scheduled execution without rewriting, summarizing, or losing its context."
  - name: loop-executor
    type: AGENT_WORKER
    skipPermissions: true
    modelProvider: ${executorProvider}
    model: ${executorModel}
    body: "Assume zero prior context. Read the complete scheduled request, inspect any relevant workspace instructions and current state, execute it exactly once for this trigger, verify the outcome, and return a timestamp-independent self-contained result."
workstations:
  - name: schedule-loop-request
    behavior: CRON
    worker: loop-trigger
    cron:
      every: ${every}
      triggerAtStart: false
    workPropagation:
      mode: PRESERVE_INPUT
    inputs:
      - workType: loop-controller
        state: active
    outputs:
      - workType: loop-controller
        state: active
      - workType: scheduled-execution
        state: init
    onFailure:
      - workType: loop-controller
        state: failed
  - name: execute-loop-request
    type: AGENT_RUN
    worker: loop-executor
    resources:
      - name: loop-executor-slot
        capacity: 1
    inputs:
      - workType: scheduled-execution
        state: init
    outputs:
      - workType: scheduled-execution
        state: complete
    onFailure:
      - workType: scheduled-execution
        state: failed
    body: |-
      This is one isolated occurrence of a recurring request. You have no memory of prior triggers unless their results are explicitly present in the Work input. Read the complete request below, inspect current workspace instructions and state when applicable, and execute it exactly once. Do not create your own timer or loop. Preserve unrelated changes, verify the outcome for this occurrence, and return a self-contained result that states what was done, what evidence was observed, and what could not be completed.

      ${request}
