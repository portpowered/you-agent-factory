name: "@you/subagent"
id: builtin-subagent
description:
  type: LOCALIZABLE_ASSET
  value: Runs one bounded subagent with workspace tools and returns its result.
invocationSignature:
  parameters:
    - name: input
      description: Text request for the one-pass subagent.
      externalName: to
      required: true
      bindings:
        - kind: POSITIONAL
          position: 1
        - kind: STDIN
        - kind: NAMED
    - name: workerProvider
      description: Model provider for the subagent; omitted values use operator defaults.
      externalName: worker-provider
      defaultValues:
        - ""
      bindings:
        - kind: NAMED
    - name: workerModel
      description: Model for the subagent; omitted values use operator defaults.
      externalName: worker-model
      defaultValues:
        - ""
      bindings:
        - kind: NAMED
    - name: workerReasoningEffort
      description: Optional reasoning effort for the subagent; omitted values use the provider default.
      externalName: worker-reasoning-effort
      defaultValues:
        - ""
      bindings:
        - kind: NAMED
    - name: workingRoot
      description: Workspace directory for the subagent.
      externalName: working-root
      defaultValues:
        - ""
      bindings:
        - kind: NAMED
examples:
  - name: positional-input
    description:
      type: LOCALIZABLE_ASSET
      value: Summarize a release request.
    args:
      input: Summarize this release
  - name: stdin-input
    description:
      type: LOCALIZABLE_ASSET
      value: Summarize the same request using structured input.
    args:
      input: Summarize this release
workTypes:
  - name: task
    handlingBehavior:
      - DEFAULT
    states:
      - name: init
        type: INITIAL
      - name: complete
        type: TERMINAL
      - name: failed
        type: FAILED
resources: []
workers:
  - name: subagent-worker
    type: AGENT_WORKER
    skipPermissions: false
    modelProvider: ${workerProvider}
    model: ${workerModel}
    reasoningEffort: ${workerReasoningEffort}
    agentTools:
      policy: ENABLED
    body: |-
      You are the one-pass subagent worker for @you/subagent. You inherit no hidden
      conversation or project knowledge. Read applicable contributor instructions.
      For exact-file bounded requests, inspect the named files and their direct
      dependencies and tests first. Expand only when the request requires it.
      Reserve time to edit, verify, and respond.

      Respond directly to the submitted request in a single bounded pass. Preserve
      unrelated changes, validate important assumptions, perform proportional
      verification, and make the response self-contained for a caller that will not
      see your intermediate reasoning. Do not plan multi-stage work or defer
      follow-up actions. Return one concise final result without plan narration.
workstations:
  - name: run-subagent
    type: AGENT_RUN
    worker: subagent-worker
    workingDirectory: ${workingRoot}
    inputs:
      - workType: task
        state: init
    outputs:
      - workType: task
        state: complete
    onFailure:
      - workType: task
        state: failed
    body: ${input}
