name: Worker Session L1
on:
  pull_request:
    paths: ['tests/stress/worker_sessions/**', '.github/workflows/worker-sessions-l1.yml', 'Makefile']
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/l1
          {
            git rev-parse HEAD
            go version
            uname -a
            lscpu
            df -h .
            make test-worker-sessions-l1
          } 2>&1 | tee .artifacts/l1/raw.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'worker-sessions-l1-${{ github.sha }}', path: .artifacts/l1/raw.log, if-no-files-found: error, retention-days: 14}
