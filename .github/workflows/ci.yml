name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep this pinned version aligned with ui/package.json's packageManager value.
  BUN_VERSION: 1.3.12

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Bun for the dashboard workspace
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dashboard dependencies
        run: make ui-deps

      - name: Run dashboard typecheck
        run: make typecheck

  verify-build-contracts:
    name: Build, Lint, and API
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Bun for the dashboard workspace
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node for API contract commands
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dashboard dependencies
        run: make ui-deps

      - name: Build dashboard bundle
        run: make ui-build

      - name: Build backend binaries
        run: make build

      - name: Run lint verification
        run: make lint

      - name: Run API smoke verification
        run: make api-smoke

  verify-tests:
    name: Website and Backend Tests
    runs-on: ubuntu-latest
    needs: verify-build-contracts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Bun for the dashboard workspace
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node for dashboard runtime
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dashboard dependencies
        run: make ui-deps

      - name: Install Playwright browser for dashboard integration tests
        run: make ui-install-playwright

      - name: Run dashboard test suite
        run: make ui-test

      - name: Run dashboard coverage suite
        run: make ui-test-coverage

      - name: Run replay coverage verification
        run: make ui-replay-coverage-check

      - name: Run backend coverage suite
        run: make test-coverage-go

      - name: Run backend functional suite
        run: make test-functional
