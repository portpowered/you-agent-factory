name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.12
  NODE_VERSION: 22
  # Keep this aligned with go.mod's toolchain directive. Using only the lower
  # go directive can make setup-go download the newer toolchain into GOMODCACHE
  # before cache restore, which causes cache extraction collisions on CI.
  GO_VERSION: 1.25.0

jobs:
  classify:
    name: Classify Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      classification: ${{ steps.classify.outputs.classification || 'full' }}
      areas: ${{ steps.classify.outputs.areas || 'ci-tooling' }}
      reason: ${{ steps.classify.outputs.reason || 'Conservative full verification.' }}
      run_docs_reference: ${{ steps.classify.outputs.run_docs_reference != 'false' }}
      run_readme: ${{ steps.classify.outputs.run_readme != 'false' }}
      run_frontend: ${{ steps.classify.outputs.run_frontend != 'false' }}
      run_backend: ${{ steps.classify.outputs.run_backend != 'false' }}
      run_backend_conformance: ${{ steps.classify.outputs.run_backend_conformance != 'false' }}
      run_ui_backend_integration: ${{ steps.classify.outputs.run_ui_backend_integration != 'false' }}
      run_api_package: ${{ steps.classify.outputs.run_api_package != 'false' }}
      run_packaged_factories_package: ${{ steps.classify.outputs.run_packaged_factories_package != 'false' }}
      run_model_providers_package: ${{ steps.classify.outputs.run_model_providers_package != 'false' }}
      docs_reference_reason: ${{ steps.classify.outputs.docs_reference_reason || steps.classify.outputs.reason || 'Conservative full verification.' }}
      readme_reason: ${{ steps.classify.outputs.readme_reason || steps.classify.outputs.reason || 'Conservative full verification.' }}
      frontend_reason: ${{ steps.classify.outputs.frontend_reason || steps.classify.outputs.reason || 'Conservative full verification.' }}
      backend_reason: ${{ steps.classify.outputs.backend_reason || steps.classify.outputs.reason || 'Conservative full verification.' }}
      backend_conformance_reason: ${{ steps.classify.outputs.backend_conformance_reason || steps.classify.outputs.reason || 'Conservative full verification.' }}
      ui_backend_integration_reason: ${{ steps.classify.outputs.ui_backend_integration_reason || steps.classify.outputs.reason || 'Conservative full verification.' }}
      api_package_reason: ${{ steps.classify.outputs.api_package_reason || steps.classify.outputs.reason || 'Conservative full verification.' }}
      packaged_factories_package_reason: ${{ steps.classify.outputs.packaged_factories_package_reason || steps.classify.outputs.reason || 'Conservative full verification.' }}
      model_providers_package_reason: ${{ steps.classify.outputs.model_providers_package_reason || steps.classify.outputs.reason || 'Conservative full verification.' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - id: classify
        if: github.event_name == 'pull_request'
        run: go run ./cmd/ciclassify -base "${{ github.event.pull_request.base.sha }}" -head "${{ github.event.pull_request.head.sha }}"
      - if: github.event_name != 'pull_request'
        run: |
          for lane in docs_reference readme frontend backend backend_conformance ui_backend_integration api_package packaged_factories_package model_providers_package; do
            echo "run_${lane}=true" >> "$GITHUB_OUTPUT"
          done
          echo "classification=full" >> "$GITHUB_OUTPUT"
          echo "areas=ci-tooling" >> "$GITHUB_OUTPUT"

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Test workflow lint failure behavior
        run: node --test scripts/ci/workflow-lint.test.mjs
      - name: Run schema-aware lint across all workflows
        run: node scripts/ci/workflow-lint.mjs

  docs-reference:
    name: Docs Reference
    needs: classify
    if: always() && needs.classify.outputs.run_docs_reference != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make docs-reference-smoke

  readme:
    name: README
    needs: classify
    if: always() && needs.classify.outputs.run_readme != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make readme-check

  frontend:
    name: Frontend
    needs: classify
    if: always() && needs.classify.outputs.run_frontend != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: make ui-deps
      - run: make typecheck ui-lint

  frontend-component:
    name: Frontend Component
    needs: classify
    if: always() && needs.classify.outputs.run_frontend != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: make ui-deps
      - name: Run browserless component tests
        env:
          UI_COMPONENT_MAX_DURATION_MS: "300000"
          UI_COMPONENT_TEST_MAX_WORKERS: "4"
        run: make ui-component-test

  ui-coverage:
    name: Frontend Coverage
    needs: classify
    if: always() && needs.classify.outputs.run_frontend != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: make ui-deps
      - name: Run frontend unit coverage
        env:
          UI_COVERAGE_MAIN_MAX_WORKERS: "4"
        run: make test-ui-coverage

  frontend-browser:
    name: Frontend Browser
    needs: classify
    if: always() && needs.classify.outputs.run_frontend != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ui-browser
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: make ui-integration-test

  frontend-storybook:
    name: Frontend Storybook
    needs: classify
    if: always() && needs.classify.outputs.run_frontend != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ui-browser
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Run Storybook integration and browser checks
        run: make ui-storybook-integration-test
        env:
          AGENT_FACTORY_BROWSER_ARTIFACT_DIR: ${{ github.workspace }}/.artifacts/factory-graph-visual-group
      - name: Upload visual group browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-graph-visual-group-browser-evidence
          path: .artifacts/factory-graph-visual-group
          if-no-files-found: warn
          retention-days: 14

  backend-coverage:
    name: Backend ${{ matrix.label }} Coverage
    needs: classify
    if: always() && needs.classify.outputs.run_backend != 'false'
    runs-on: ubuntu-latest
    # The functional runner enforces the 75m merge-full budget for both pull
    # requests and pushes to main. Keep five minutes of job-level grace so
    # always-run summary and artifact-upload steps can preserve partial
    # diagnostics after a timeout.
    timeout-minutes: 80
    # Both lanes upsert their own reporting comment on the pull request,
    # mirroring Backend Lint. Each uses a distinct HTML-comment marker, so the
    # two reports never find, overwrite, or delete each other's comment. Every
    # other permission stays at the workflow-level read-only default.
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      # Package-floor enforcement is BLOCKING. Both coverage lanes inherit the
      # Makefile default (GO_COVERAGE_FLOOR_POLICY ?= blocking), so a package
      # that drops below its floor fails CI and the floor must be updated
      # deliberately in the manifest rather than drifting silently.
      #
      # A measured package with no manifest entry is NOT a failure: it is held
      # to its lane's default floor (cmd/gocoveragecheck/manifest_default_floor.go),
      # so adding a package does not require a manifest edit.
      #
      # Do not reintroduce an advisory override here.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            label: Unit
          - suite: functional
            label: Functional
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        if: matrix.suite == 'functional'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Select functional runner parallelism
        if: matrix.suite == 'functional'
        id: functional-parallelism
        shell: bash
        run: |
          runner_cpus="$(nproc 2>/dev/null || true)"
          case "$runner_cpus" in
            ''|*[!0-9]*) runner_cpus=0 ;;
          esac
          if [ "$runner_cpus" -lt 4 ]; then
            functional_jobs=2
          else
            functional_jobs="$((runner_cpus / 2))"
            if [ "$functional_jobs" -gt 4 ]; then
              functional_jobs=4
            fi
          fi
          echo "Functional CI runner: logical_cpus=$runner_cpus jobs=$functional_jobs"
          echo "jobs=$functional_jobs" >> "$GITHUB_OUTPUT"
      - name: Verify quarantined package inventory on Linux
        if: matrix.suite == 'functional'
        run: bash scripts/ci/verify-functional-quarantine-packages.sh
        env:
          FUNCTIONAL_QUARANTINE_EVIDENCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FUNCTIONAL_QUARANTINE_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FUNCTIONAL_QUARANTINE_EVIDENCE_OUTPUT: .artifacts/functional-test-viz/quarantine-package-evidence.txt
          FUNCTIONAL_QUARANTINE_EVIDENCE_TIMEOUT: 15m
      - name: Upload Linux quarantine package evidence
        if: always() && matrix.suite == 'functional'
        uses: actions/upload-artifact@v4
        with:
          name: functional-quarantine-package-evidence
          path: .artifacts/functional-test-viz/quarantine-package-evidence.txt
          if-no-files-found: error
          retention-days: 14
      - name: Run backend coverage
        if: matrix.suite == 'unit'
        run: make test-unit-coverage
        env:
          GO_UNIT_COVERAGE_PROFILE: .artifacts/unit-coverage/coverage.out
          GO_UNIT_COVERAGE_JSON_OUTPUT: .artifacts/unit-coverage/coverage-summary.json
          GO_UNIT_COVERAGE_TIMING_OUTPUT: .artifacts/unit-coverage/unit-timing-summary.json
      # This existing coverage tier intentionally selects backend packages
      # under pkg/... through make test-unit-coverage. It does not claim to
      # exercise ./internal/...; that tree has separate repository-maintenance
      # baselines and fixtures, so a known-red whole-tree command must not be
      # wired into this required coverage job until those prerequisites are
      # repaired by their owning work.
      # Reporting only. Every unit step below is additive and runs with
      # if: always() so a failing or timed-out lane still publishes the partial
      # diagnostics it did produce. Each is fail-open: a missing or malformed
      # artifact writes an explicit "unavailable" body and exits 0, so a
      # renderer or API failure can never turn a passing suite red. Node is set
      # up here rather than beside the Go toolchain so the measured lane runs in
      # exactly the environment it ran in before.
      - name: Set up Node for unit coverage reporting
        if: always() && matrix.suite == 'unit'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Publish unit coverage job summary
        if: always() && matrix.suite == 'unit'
        continue-on-error: true
        run: bash scripts/ci/publish-unit-coverage-summary.sh
        env:
          UNIT_COVERAGE_DIR: .artifacts/unit-coverage
          UNIT_COVERAGE_PROFILE: .artifacts/unit-coverage/coverage.out
          UNIT_COVERAGE_JSON: .artifacts/unit-coverage/coverage-summary.json
          UNIT_COVERAGE_TIMING: .artifacts/unit-coverage/unit-timing-summary.json
          UNIT_COVERAGE_SUMMARY_FILE: .artifacts/unit-coverage/unit-coverage-summary.md
      - name: Upload unit coverage diagnostics
        if: always() && matrix.suite == 'unit'
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-diagnostics
          path: |
            .artifacts/unit-coverage/coverage.out
            .artifacts/unit-coverage/coverage-summary.json
            .artifacts/unit-coverage/unit-timing-summary.json
            .artifacts/unit-coverage/unit-coverage-summary.md
            .artifacts/unit-coverage/command.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Render unit coverage pull request comment
        if: always() && matrix.suite == 'unit'
        continue-on-error: true
        run: bash scripts/ci/publish-unit-coverage-comment.sh
        env:
          UNIT_COVERAGE_DIR: .artifacts/unit-coverage
          UNIT_COVERAGE_JSON: .artifacts/unit-coverage/coverage-summary.json
          UNIT_COVERAGE_TIMING: .artifacts/unit-coverage/unit-timing-summary.json
          UNIT_COVERAGE_COMMENT_FILE: .artifacts/unit-coverage/unit-coverage-comment.md
          UNIT_COVERAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Publish unit coverage report to the pull request
        if: always() && matrix.suite == 'unit' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          UNIT_COVERAGE_COMMENT_FILE: .artifacts/unit-coverage/unit-coverage-comment.md
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const commentPath = `${process.env.GITHUB_WORKSPACE}/${process.env.UNIT_COVERAGE_COMMENT_FILE}`;
            let body = '';
            try {
              body = fs.readFileSync(commentPath, 'utf8');
            } catch (error) {
              core.info(`unit coverage comment body unavailable at ${commentPath}: ${error.message}`);
              return;
            }
            if (!body.trim()) {
              core.info('unit coverage comment body is empty; nothing to publish.');
              return;
            }
            const { upsertUnitCoverageComment } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/unit-coverage-report.mjs`);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const publication = upsertUnitCoverageComment(comments, body);
            if (publication.action === 'update') {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: publication.commentId,
                body: publication.body,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: publication.body,
            });
      # This is the authoritative Linux functional run. Pull requests and
      # pushes to main use the same complete non-short tier. The run expands
      # ./tests/functional/... once, subtracts only the versioned quarantine,
      # and writes package plus top-level test outcomes before the coverage
      # gate returns, including on failure.
      - name: Run complete Linux functional coverage and inventory
        if: matrix.suite == 'functional'
        timeout-minutes: 75
        run: make functional-test-viz
        env:
          FUNCTIONAL_TEST_VIZ_DIR: .artifacts/functional-test-viz
          FUNCTIONAL_TEST_TIER: "merge-full"
          FUNCTIONAL_TEST_TRIGGER: ${{ github.event_name == 'push' && 'push-main' || 'pull_request' }}
          FUNCTIONAL_TEST_BUDGET: "75m"
          FUNCTIONAL_SHORT: "false"
          FUNCTIONAL_DEFAULT_JOBS: ${{ steps.functional-parallelism.outputs.jobs }}
          FUNCTIONAL_GOCOVERAGE_EXIT_FILE: .artifacts/functional-test-viz/gocoveragecheck-exit-code.txt
          FUNCTIONAL_COVERAGE_VERDICT_FILE: .artifacts/functional-test-viz/functional-coverage-verdict.txt
          INFINITE_YOU_RUN_ACPX_REAL_CLIENT: "1"
          INFINITE_YOU_REQUIRE_ACPX_REAL_CLIENT: "1"
          INFINITE_YOU_ACPX_EVIDENCE_OUTPUT: ${{ github.workspace }}/.artifacts/functional-test-viz/real-acpx-evidence.json
      # Ordinary test and coverage-gate failures are deferred by the runner so
      # this step is the only failing log for those outcomes. Timeout and
      # infrastructure failures keep the full run step failed instead.
      - name: Report functional coverage verdict
        if: always() && matrix.suite == 'functional'
        run: bash scripts/ci/publish-functional-coverage-verdict.sh
        env:
          FUNCTIONAL_TEST_VIZ_DIR: .artifacts/functional-test-viz
          FUNCTIONAL_GOCOVERAGE_EXIT_FILE: .artifacts/functional-test-viz/gocoveragecheck-exit-code.txt
          FUNCTIONAL_COVERAGE_VERDICT_FILE: .artifacts/functional-test-viz/functional-coverage-verdict.txt
      - name: Upload functional test diagnostics
        if: always() && matrix.suite == 'functional'
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-diagnostics
          path: |
            .artifacts/functional-test-viz/functional-tests.md
            .artifacts/functional-test-viz/functional-timing-summary.json
            .artifacts/functional-test-viz/coverage-summary.json
            .artifacts/functional-test-viz/coverage.out
            .artifacts/functional-test-viz/command.log
            .artifacts/functional-test-viz/quarantine-package-evidence.txt
            .artifacts/functional-test-viz/diagnostic-status.txt
            .artifacts/functional-test-viz/gocoveragecheck-exit-code.txt
            .artifacts/functional-test-viz/functional-coverage-verdict.txt
            .artifacts/functional-test-viz/real-acpx-evidence.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Require pinned real ACP evidence artifact
        if: always() && matrix.suite == 'functional'
        uses: actions/upload-artifact@v4
        with:
          name: pinned-real-acp-evidence
          path: .artifacts/functional-test-viz/real-acpx-evidence.json
          if-no-files-found: error
          retention-days: 14
      # Reporting only. Both steps below are fail-open: a missing or malformed
      # artifact writes an explicit "unavailable" body and exits 0, so a
      # renderer or API failure can never turn a passing suite red.
      - name: Render functional coverage pull request comment
        if: always() && matrix.suite == 'functional'
        continue-on-error: true
        run: bash scripts/ci/publish-functional-coverage-comment.sh
        env:
          FUNCTIONAL_TEST_VIZ_DIR: .artifacts/functional-test-viz
          FUNCTIONAL_TEST_VIZ_TIMING: .artifacts/functional-test-viz/functional-timing-summary.json
          FUNCTIONAL_TEST_VIZ_JSON: .artifacts/functional-test-viz/coverage-summary.json
          FUNCTIONAL_COVERAGE_COMMENT_FILE: .artifacts/functional-test-viz/functional-coverage-comment.md
          FUNCTIONAL_COVERAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Publish functional coverage inventory to the pull request
        if: always() && matrix.suite == 'functional' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          FUNCTIONAL_COVERAGE_COMMENT_FILE: .artifacts/functional-test-viz/functional-coverage-comment.md
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const commentPath = `${process.env.GITHUB_WORKSPACE}/${process.env.FUNCTIONAL_COVERAGE_COMMENT_FILE}`;
            let body = '';
            try {
              body = fs.readFileSync(commentPath, 'utf8');
            } catch (error) {
              core.info(`functional coverage comment body unavailable at ${commentPath}: ${error.message}`);
              return;
            }
            if (!body.trim()) {
              core.info('functional coverage comment body is empty; nothing to publish.');
              return;
            }
            const { upsertFunctionalCoverageComment } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/functional-coverage-comment.mjs`);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const publication = upsertFunctionalCoverageComment(comments, body);
            if (publication.action === 'update') {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: publication.commentId,
                body: publication.body,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: publication.body,
            });

  backend-test-stability:
    name: Backend Test Stability
    needs: classify
    # This is a pull-request hard gate. Classification-driven skips remain
    # observable to Verification Policy, which rejects an unexpected skip.
    if: github.event_name == 'pull_request' && needs.classify.outputs.run_backend != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run changed-test stability hard gate
        env:
          CHANGED_TEST_STABILITY_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGED_TEST_STABILITY_HEAD: ${{ github.event.pull_request.head.sha }}
          CHANGED_TEST_STABILITY_ATTEMPTS: "3"
          CHANGED_TEST_STABILITY_BUDGET: 15m
        run: make test-changed-test-stability

  backend-unit-latency:
    name: Backend Unit Latency
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      YOU_LOGICAL_CPUS: "4"
      YOU_EXPECTED_CONCURRENT_LANES: "4"
      UNIT_DEFAULT_JOBS: "2"
      UNIT_REFERENCE_COMMIT: 9e19e26e0fb6df47cfdd4c4d4469ce712aae04ff
      UNIT_CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      UNIT_RUNNER_PROVIDER: github-actions
      UNIT_RUNNER_IMAGE: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Initialize unit-latency evidence directories
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/unit-latency/reference .artifacts/unit-latency/candidate .artifacts/unit-latency/setup
      - name: Capture exact hosted runner identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$GITHUB_WORKSPACE/.artifacts/unit-latency"
          image_version="${ImageVersion:-${RUNNER_IMAGE_VERSION:-}}"
          cpu_model="$(awk -F: '/^model name[[:space:]]*:/ {gsub(/^[[:space:]]+/, "", $2); print $2; exit}' /proc/cpuinfo)"
          if [[ -z "$image_version" || -z "$cpu_model" || "$cpu_model" == "unknown" ]]; then
            printf 'image_version=%s\ncpu_model=%s\nstatus=unavailable\n' "$image_version" "$cpu_model" > "$artifact_root/setup/runner-identity.status.txt"
            echo 'UNIT_TIMING_INVALIDATIONS=hosted runner identity unavailable' >> "$GITHUB_ENV"
            echo "hosted runner identity is incomplete: image_version=${image_version:-unknown}, cpu_model=${cpu_model:-unknown}" >&2
            exit 1
          fi
          {
            echo "UNIT_RUNNER_IMAGE_VERSION=$image_version"
            echo "UNIT_RUNNER_CPU_MODEL=$cpu_model"
          } >> "$GITHUB_ENV"
          {
            printf 'provider=%s\n' "$UNIT_RUNNER_PROVIDER"
            printf 'image=%s\n' "$UNIT_RUNNER_IMAGE"
            printf 'image_version=%s\n' "$image_version"
            printf 'os=%s\n' "$(go env GOOS)"
            printf 'architecture=%s\n' "$(go env GOARCH)"
            printf 'cpu_model=%s\n' "$cpu_model"
            printf 'status=available\n'
          } > "$artifact_root/setup/runner-identity.status.txt"
      - name: Create detached reference checkout and capture ordered cohorts
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          artifact_root="$GITHUB_WORKSPACE/.artifacts/unit-latency"
          setup_root="$artifact_root/setup"
          reference_root="$artifact_root/reference"
          candidate_root="$artifact_root/candidate"
          reference_checkout="$RUNNER_TEMP/unit-latency-reference"
          reference_runner="$RUNNER_TEMP/unit-latency-unitlane"
          sample_runner="$GITHUB_WORKSPACE/scripts/ci/run-unit-latency-sample.mjs"
          failure_log="$artifact_root/orchestration-failures.log"
          sample_failure=0
          : > "$failure_log"

          record_failure() {
            printf '%s\n' "$1" | tee -a "$failure_log" >&2
            export UNIT_TIMING_INVALIDATIONS="${UNIT_TIMING_INVALIDATIONS:+$UNIT_TIMING_INVALIDATIONS,}workflow orchestration failure"
            sample_failure=1
          }

          run_setup_command() {
            local label="$1"
            local checkout="$2"
            shift 2
            local stdout_path="$setup_root/${label}.stdout.log"
            local stderr_path="$setup_root/${label}.stderr.log"
            local status_path="$setup_root/${label}.status.txt"
            local status=0
            if (cd "$checkout" && "$@") > "$stdout_path" 2> "$stderr_path"; then
              :
            else
              status=$?
            fi
            printf 'exit_status=%s\n' "$status" > "$status_path"
            if [ "$status" -ne 0 ]; then
              record_failure "$label: exit_status=$status"
              return 1
            fi
          }

          prewarm_checkout() {
            local cohort="$1"
            local checkout="$2"
            shift 2
            local failed=0
            run_setup_command "${cohort}-go-mod-download" "$checkout" go mod download || failed=1
            run_setup_command "${cohort}-go-build" "$checkout" go build "$@" || failed=1
            run_setup_command "${cohort}-go-test-compile" "$checkout" go test -short -vet=off -run '^$' -p=2 ./pkg/... || failed=1
            return "$failed"
          }

          run_sample() {
            local cohort="$1"
            local checkout="$2"
            local commit="$3"
            local ordinal="$4"
            local output_directory="$5"
            local command="$6"
            shift 6
            local timing_output="$output_directory/run-${ordinal}.v2.json"
            if UNIT_TIMING_COMMIT="$commit" UNIT_LATENCY_SAMPLE_CWD="$checkout" \
              node "$sample_runner" "$ordinal" "$output_directory" \
                "$command" "$@"; then
              :
            else
              local status=$?
              record_failure "$cohort sample $ordinal: exit_status=$status"
            fi
          }

          reference_ready=0
          if git fetch --no-tags origin "$UNIT_REFERENCE_COMMIT" \
            > "$setup_root/reference-fetch.stdout.log" \
            2> "$setup_root/reference-fetch.stderr.log"; then
            if git cat-file -e "${UNIT_REFERENCE_COMMIT}^{commit}" \
              >> "$setup_root/reference-fetch.stdout.log" \
              2>> "$setup_root/reference-fetch.stderr.log"; then
              reference_ready=1
              printf 'exit_status=0\ncommit=%s\n' "$UNIT_REFERENCE_COMMIT" > "$setup_root/reference-fetch.status.txt"
            else
              status=$?
              printf 'exit_status=%s\ncommit=%s\n' "$status" "$UNIT_REFERENCE_COMMIT" > "$setup_root/reference-fetch.status.txt"
              record_failure "reference commit verification: exit_status=$status commit=$UNIT_REFERENCE_COMMIT"
            fi
          else
            status=$?
            printf 'exit_status=%s\ncommit=%s\n' "$status" "$UNIT_REFERENCE_COMMIT" > "$setup_root/reference-fetch.status.txt"
            record_failure "reference commit fetch/verification: exit_status=$status commit=$UNIT_REFERENCE_COMMIT"
          fi

          if [ "$reference_ready" -eq 1 ]; then
            if git worktree add --detach "$reference_checkout" "$UNIT_REFERENCE_COMMIT" \
              > "$setup_root/reference-worktree-add.stdout.log" \
              2> "$setup_root/reference-worktree-add.stderr.log"; then
              printf 'exit_status=0\n' > "$setup_root/reference-worktree-add.status.txt"
            else
              status=$?
              printf 'exit_status=%s\n' "$status" > "$setup_root/reference-worktree-add.status.txt"
              record_failure "reference checkout: exit_status=$status"
            fi
          else
            printf 'reference worktree creation skipped because the pinned commit was not verified\n' > "$setup_root/reference-worktree-add.stdout.log"
            printf 'pinned reference commit %s was unavailable after fetch/verification\n' "$UNIT_REFERENCE_COMMIT" > "$setup_root/reference-worktree-add.stderr.log"
            printf 'exit_status=128\n' > "$setup_root/reference-worktree-add.status.txt"
            record_failure "reference checkout: unavailable after pinned commit fetch/verification"
          fi

          prewarm_checkout reference "$reference_checkout" ./cmd/unitlane || :
          prewarm_checkout candidate "$GITHUB_WORKSPACE" ./cmd/unitlane ./cmd/unitlanebudget || :
          run_setup_command candidate-measurement-runner-build "$GITHUB_WORKSPACE" \
            go build -o "$reference_runner" ./cmd/unitlane || :

          run_reference_sample() {
            local ordinal="$1"
            local timing_output="$reference_root/run-${ordinal}.v2.json"
            run_sample reference "$reference_checkout" "$UNIT_REFERENCE_COMMIT" "$ordinal" "$reference_root" \
              "$reference_runner" \
              -jobs=2 -count=1 -timeout=300s \
              "-timing-output=$timing_output" \
              "-timing-command=make test-unit-fresh UNIT_DEFAULT_JOBS=2 UNIT_TIMING_OUTPUT=$timing_output" \
              -computed-lane-budget=2
          }

          run_candidate_sample() {
            local ordinal="$1"
            local timing_output="$candidate_root/run-${ordinal}.v2.json"
            run_sample candidate "$GITHUB_WORKSPACE" "$UNIT_CANDIDATE_COMMIT" "$ordinal" "$candidate_root" \
              make test-unit-fresh UNIT_DEFAULT_JOBS=2 UNIT_TIMING_OUTPUT="$timing_output"
          }

          run_reference_sample 1
          run_reference_sample 2
          run_reference_sample 3

          run_candidate_sample 1
          run_candidate_sample 2
          run_candidate_sample 3

          printf 'exit_status=%s\n' "$sample_failure" > "$artifact_root/orchestration.status.txt"
          exit "$sample_failure"
      - name: Enforce unit-lane latency budget
        if: always()
        run: make test-unit-latency-budget
      - name: Retain complete unit-latency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-latency-evidence
          path: .artifacts/unit-latency
          if-no-files-found: error
          retention-days: 14

  backend-conformance:
    name: Backend Conformance
    needs: classify
    if: always() && needs.classify.outputs.run_backend_conformance != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run offline backend conformance guard
        run: make test-backend-conformance

  backend-lint:
    name: Backend Lint
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    env:
      LINT_REPORT_FILE: .artifacts/backend-lint/report.json
      LINT_LOG_FILE: .artifacts/backend-lint/lint.log
      LINT_COMMENT_FILE: .artifacts/backend-lint/comment.md
      BACKEND_LINT_TESTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          # Give the complete lint inventory a lane-specific key so its module
          # and build data are saved and reused by later measurements.
          cache-dependency-path: |
            go.mod
            go.sum
            .github/workflows/ci.yml
      - name: Check Go formatting
        run: make fmt-check
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Verify Backend Lint event selection
        env:
          BACKEND_LINT_EVENT_NAME: ${{ github.event_name }}
          BACKEND_LINT_REF: ${{ github.ref }}
          BACKEND_LINT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { selectBackendLint } from './scripts/ci/backend-lint-workflow.mjs';
          const selection = selectBackendLint({
            eventName: process.env.BACKEND_LINT_EVENT_NAME,
            ref: process.env.BACKEND_LINT_REF,
            sha: process.env.BACKEND_LINT_SHA,
          });
          if (!selection.selected || selection.error) {
            throw new Error(`Backend Lint was not selected for its hosted event: ${JSON.stringify(selection)}`);
          }
          if (selection.checkoutRef !== process.env.BACKEND_LINT_SHA) {
            throw new Error(`Backend Lint checkout identity disagrees with its tested identity: ${JSON.stringify(selection)}`);
          }
          console.log(`Backend Lint selected tested SHA ${selection.testedSha}`);
          NODE
      - name: Compile functionallong test packages
        id: compile-functionallong
        continue-on-error: true
        run: make test-functional-long-compile
      - name: Select Backend Lint runner parallelism
        id: backend-lint-parallelism
        shell: bash
        run: |
          runner_cpus="$(nproc 2>/dev/null || true)"
          RUNNER_LOGICAL_CPUS="$runner_cpus" node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { resolveBackendLintParallelism } from './scripts/ci/backend-lint-workflow.mjs';

          const { logicalCPUs, jobs, warning } = await resolveBackendLintParallelism(process.env.RUNNER_LOGICAL_CPUS);
          if (warning) {
            console.warn(`::warning::${warning}`);
          }
          console.log(`Backend Lint CI runner: logical_cpus=${logicalCPUs} jobs=${jobs}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `jobs=${jobs}\n`);
          NODE
      - name: Install UI dependencies for canonical UI lint targets
        if: always()
        run: make ui-deps
      - name: Run complete canonical Backend Lint inventory
        id: run-backend-lint
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p .artifacts/backend-lint
          make LINT_REPORT_FILE="$LINT_REPORT_FILE" lint 2>&1 | tee "$LINT_LOG_FILE"
          status=${PIPESTATUS[0]}
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"
        env:
          LINT_JOBS: ${{ steps.backend-lint-parallelism.outputs.jobs }}
      - name: Render Backend Lint summary and gate
        if: always()
        run: >-
          node scripts/ci/backend-lint-report.mjs
          --report "$LINT_REPORT_FILE"
          --log "$LINT_LOG_FILE"
          --summary "$GITHUB_STEP_SUMMARY"
          --comment "$LINT_COMMENT_FILE"
      - name: Upload complete Backend Lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-lint-diagnostics
          path: |
            .artifacts/backend-lint/report.json
            .artifacts/backend-lint/lint.log
            .artifacts/backend-lint/comment.md
            bin/deadcode-current.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Publish Backend Lint inventory to the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          BACKEND_LINT_COMMENT_FILE: ${{ env.LINT_COMMENT_FILE }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const { upsertBackendLintComment } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/backend-lint-workflow.mjs`);
            const body = fs.readFileSync(process.env.BACKEND_LINT_COMMENT_FILE, 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const publication = upsertBackendLintComment(comments, body);
            if (publication.action === 'update') {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: publication.commentId,
                body: publication.body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: publication.body,
              });
            }
      - name: Enforce functionallong compile guard
        if: always()
        env:
          FUNCTIONALLONG_COMPILE_OUTCOME: ${{ steps.compile-functionallong.outcome }}
        run: |
          if [ "$FUNCTIONALLONG_COMPILE_OUTCOME" != "success" ]; then
            echo "functionallong compile guard failed with outcome: ${FUNCTIONALLONG_COMPILE_OUTCOME:-unknown}"
            exit 1
          fi

  ui-backend-integration:
    name: UI Backend Integration
    needs: classify
    if: always() && needs.classify.outputs.run_ui_backend_integration != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: ./.github/actions/setup-ui-browser
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: make ui-durable-session-real-backend-integration-test

  development-package:
    name: Development Package
    needs: classify
    if: >-
      ${{
        always() &&
        (github.event_name == 'pull_request' || github.event_name == 'push')
      }}
    uses: ./.github/workflows/development-package.yml
    permissions:
      # The called workflow contains explicitly gated publication jobs whose
      # permission ceiling must be allowed at the call boundary. Its package
      # verification jobs retain the called workflow's read-only default.
      contents: write
      id-token: write
    with:
      is_ci_call: true
      run_candidates: ${{ github.event_name == 'pull_request' }}
      run_api_package: ${{ needs.classify.outputs.run_api_package != 'false' }}
      run_packaged_factories_package: ${{ needs.classify.outputs.run_packaged_factories_package != 'false' }}
      run_model_providers_package: ${{ needs.classify.outputs.run_model_providers_package != 'false' }}
      source_commit: ${{ github.event.pull_request.head.sha || github.sha }}
      pull_request_head_sha: ${{ github.event.pull_request.head.sha || '' }}
      source_ref: ${{ github.ref }}
      repository: ${{ github.repository }}

  # Maintainers can add the ci-workflow-behavior label to request one
  # controlled hosted evaluation of the reusable workflow contract. The job is
  # skipped before any runner is allocated for ordinary pull requests.
  development-package-behavior:
    name: Development Package Workflow Behavior
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'ci-workflow-behavior')
      }}
    uses: ./.github/workflows/development-package-behavior.yml
    permissions:
      contents: write
      id-token: write
    with:
      # Keep the PR evidence check green. The expected-failure propagation
      # case remains available through the dispatch input and deterministic
      # gate; hosted run 31558145400 records its child failure and assertion.
      include_failure: false

  verification-policy:
    name: Verification Policy
    needs: [classify, workflow-lint, docs-reference, readme, frontend, frontend-component, ui-coverage, frontend-browser, frontend-storybook, backend-coverage, backend-unit-latency, backend-test-stability, backend-conformance, backend-lint, ui-backend-integration, development-package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run CI workflow policy tests
        if: always()
        run: make test-ci-workflows
      - name: Verify selected lanes
        if: always()
        env:
          CLASSIFICATION_RESULT: ${{ needs.classify.result }}
          CLASSIFICATION: ${{ needs.classify.outputs.classification }}
          AREAS: ${{ needs.classify.outputs.areas }}
          CLASSIFICATION_REASON: ${{ needs.classify.outputs.reason }}
          RUN_DOCS: ${{ needs.classify.outputs.run_docs_reference }}
          RUN_README: ${{ needs.classify.outputs.run_readme }}
          RUN_FRONTEND: ${{ needs.classify.outputs.run_frontend }}
          RUN_BACKEND: ${{ needs.classify.outputs.run_backend }}
          RUN_BACKEND_CONFORMANCE: ${{ needs.classify.outputs.run_backend_conformance }}
          RUN_UI_BACKEND: ${{ needs.classify.outputs.run_ui_backend_integration }}
          RUN_API: ${{ needs.classify.outputs.run_api_package }}
          RUN_PACKAGED: ${{ needs.classify.outputs.run_packaged_factories_package }}
          RUN_PROVIDERS: ${{ needs.classify.outputs.run_model_providers_package }}
          DOCS_REASON: ${{ needs.classify.outputs.docs_reference_reason }}
          README_REASON: ${{ needs.classify.outputs.readme_reason }}
          FRONTEND_REASON: ${{ needs.classify.outputs.frontend_reason }}
          BACKEND_REASON: ${{ needs.classify.outputs.backend_reason }}
          BACKEND_CONFORMANCE_REASON: ${{ needs.classify.outputs.backend_conformance_reason }}
          UI_BACKEND_REASON: ${{ needs.classify.outputs.ui_backend_integration_reason }}
          API_REASON: ${{ needs.classify.outputs.api_package_reason }}
          PACKAGED_REASON: ${{ needs.classify.outputs.packaged_factories_package_reason }}
          PROVIDERS_REASON: ${{ needs.classify.outputs.model_providers_package_reason }}
          RUN_CANDIDATES: ${{ github.event_name == 'pull_request' }}
          DOCS_RESULT: ${{ needs.docs-reference.result }}
          README_RESULT: ${{ needs.readme.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_COMPONENT_RESULT: ${{ needs.frontend-component.result }}
          FRONTEND_COVERAGE_RESULT: ${{ needs.ui-coverage.result }}
          FRONTEND_BROWSER_RESULT: ${{ needs.frontend-browser.result }}
          FRONTEND_STORYBOOK_RESULT: ${{ needs.frontend-storybook.result }}
          BACKEND_RESULT: ${{ needs.backend-coverage.result }}
          RUN_BACKEND_STABILITY: ${{ github.event_name == 'pull_request' && needs.classify.outputs.run_backend != 'false' }}
          BACKEND_STABILITY_REASON: ${{ needs.classify.outputs.backend_reason }}
          BACKEND_STABILITY_RESULT: ${{ needs.backend-test-stability.result }}
          RUN_BACKEND_UNIT_LATENCY: "true"
          BACKEND_UNIT_LATENCY_REASON: "The canonical three-reference/three-candidate uncached unit-lane latency budget is required on every pull request and push to main."
          BACKEND_UNIT_LATENCY_RESULT: ${{ needs.backend-unit-latency.result }}
          BACKEND_CONFORMANCE_RESULT: ${{ needs.backend-conformance.result }}
          RUN_BACKEND_LINT: "true"
          BACKEND_LINT_REASON: "The complete canonical LINT_TARGETS inventory is required on every pull request and push to main."
          BACKEND_LINT_RESULT: ${{ needs.backend-lint.result }}
          RUN_WORKFLOW_LINT: "true"
          WORKFLOW_LINT_REASON: "Every repository workflow must pass pinned schema-aware lint on every pull request and push to main."
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
          UI_BACKEND_RESULT: ${{ needs.ui-backend-integration.result }}
          PACKAGE_WORKFLOW_RESULT: ${{ needs.development-package.result }}
          API_RESULT: ${{ needs.development-package.outputs.api_package_result }}
          API_CANDIDATE_RESULT: ${{ needs.development-package.outputs.api_candidate_result }}
          PACKAGED_RESULT: ${{ needs.development-package.outputs.packaged_factories_package_result }}
          PACKAGED_CANDIDATE_RESULT: ${{ needs.development-package.outputs.packaged_factories_candidate_result }}
          PROVIDERS_RESULT: ${{ needs.development-package.outputs.model_providers_package_result }}
        shell: bash
        run: node scripts/verification-policy.mjs
