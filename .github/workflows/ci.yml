name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.12
  NODE_VERSION: 22
  # Keep this aligned with go.mod's toolchain directive. Using only the lower
  # go directive can make setup-go download the newer toolchain into GOMODCACHE
  # before cache restore, which causes cache extraction collisions on CI.
  GO_VERSION: 1.25.0

jobs:
  classify:
    name: Classify Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      classification: ${{ steps.classify.outputs.classification || 'full' }}
      areas: ${{ steps.classify.outputs.areas || 'ci-tooling' }}
      run_docs_reference: ${{ steps.classify.outputs.run_docs_reference || 'true' }}
      run_readme: ${{ steps.classify.outputs.run_readme || 'true' }}
      run_frontend: ${{ steps.classify.outputs.run_frontend || 'true' }}
      run_backend: ${{ steps.classify.outputs.run_backend || 'true' }}
      run_ui_backend_integration: ${{ steps.classify.outputs.run_ui_backend_integration || 'true' }}
      run_api_package: ${{ steps.classify.outputs.run_api_package || 'true' }}
      run_packaged_factories_package: ${{ steps.classify.outputs.run_packaged_factories_package || 'true' }}
      run_model_providers_package: ${{ steps.classify.outputs.run_model_providers_package || 'true' }}
      run_local_inference: ${{ steps.classify.outputs.run_local_inference || 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - id: classify
        if: github.event_name == 'pull_request'
        run: go run ./cmd/ciclassify -base "${{ github.event.pull_request.base.sha }}" -head "${{ github.event.pull_request.head.sha }}"
      - if: github.event_name != 'pull_request'
        run: |
          for lane in docs_reference readme frontend backend ui_backend_integration api_package packaged_factories_package model_providers_package local_inference; do
            echo "run_${lane}=true" >> "$GITHUB_OUTPUT"
          done
          echo "classification=full" >> "$GITHUB_OUTPUT"
          echo "areas=ci-tooling" >> "$GITHUB_OUTPUT"

  docs-reference:
    name: Docs Reference
    needs: classify
    if: always() && needs.classify.outputs.run_docs_reference == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make docs-reference-smoke

  readme:
    name: README
    needs: classify
    if: always() && needs.classify.outputs.run_readme == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make readme-check

  frontend:
    name: Frontend
    needs: classify
    if: always() && needs.classify.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: make ui-deps
      - run: make typecheck ui-lint test-ui-coverage

  frontend-browser:
    name: Frontend Browser
    needs: classify
    if: always() && needs.classify.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: make ui-deps ui-install-playwright test-ui-browser-integration

  backend:
    name: Backend
    needs: classify
    if: always() && needs.classify.outputs.run_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build ./cmd/factory
      - run: make test-unit-coverage functional-test-viz

  ui-backend-integration:
    name: UI Backend Integration
    needs: classify
    if: always() && needs.classify.outputs.run_ui_backend_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: make ui-deps ui-install-playwright ui-durable-session-real-backend-integration-test

  api-package:
    name: API Contract And Package
    needs: classify
    if: always() && needs.classify.outputs.run_api_package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: make ui-deps contracts-smoke api-smoke api-package-verify

  packaged-factories-package:
    name: Packaged Factories Package
    needs: classify
    if: always() && needs.classify.outputs.run_packaged_factories_package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: make packaged-factory-package-verify

  model-providers-package:
    name: Model Providers Package
    needs: classify
    if: always() && needs.classify.outputs.run_model_providers_package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: make model-provider-package-verify

  local-inference:
    name: Local Inference
    needs: classify
    if: always() && needs.classify.outputs.run_local_inference == 'true'
    uses: ./.github/workflows/long-local-inference.yml

  verification-policy:
    name: Verification Policy
    needs: [classify, docs-reference, readme, frontend, frontend-browser, backend, ui-backend-integration, api-package, packaged-factories-package, model-providers-package, local-inference]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected lanes
        env:
          CLASSIFICATION: ${{ needs.classify.outputs.classification }}
          AREAS: ${{ needs.classify.outputs.areas }}
          RESULTS: >-
            docs=${{ needs.docs-reference.result }} readme=${{ needs.readme.result }} frontend=${{ needs.frontend.result }} frontend_browser=${{ needs.frontend-browser.result }} backend=${{ needs.backend.result }} ui_backend=${{ needs.ui-backend-integration.result }} api=${{ needs.api-package.result }} packaged=${{ needs.packaged-factories-package.result }} providers=${{ needs.model-providers-package.result }} inference=${{ needs.local-inference.result }}
        shell: bash
        run: |
          set -euo pipefail
          echo "## Verification policy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Classification: \`$CLASSIFICATION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Areas: \`$AREAS\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Results: \`$RESULTS\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$RESULTS" == *"failure"* || "$RESULTS" == *"cancelled"* ]]; then
            exit 1
          fi
