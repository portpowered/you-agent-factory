name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep this pinned version aligned with ui/package.json's packageManager value.
  BUN_VERSION: 1.3.12
  # Keep CI on an explicit Node LTS major so setup-node does not need to resolve
  # the floating lts/* alias through the GitHub-hosted manifest API.
  NODE_VERSION: 22
  # Keep this aligned with go.mod's toolchain directive. Using only the lower
  # go directive can make setup-go download the newer toolchain into GOMODCACHE
  # before cache restore, which causes cache extraction collisions on CI.
  GO_VERSION: 1.24.2

jobs:
  classify-pr-impact:
    name: Classify PR Impact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      classification: ${{ steps.classify.outputs.classification || steps.classify_push.outputs.classification }}
      docs_only: ${{ steps.classify.outputs.docs_only || steps.classify_push.outputs.docs_only }}
      ui_only: ${{ steps.classify.outputs.ui_only || steps.classify_push.outputs.ui_only }}
      backend_only: ${{ steps.classify.outputs.backend_only || steps.classify_push.outputs.backend_only }}
      shared_risk: ${{ steps.classify.outputs.shared_risk || steps.classify_push.outputs.shared_risk }}
      full_run_required: ${{ steps.classify.outputs.full_run_required || steps.classify_push.outputs.full_run_required }}
      areas: ${{ steps.classify.outputs.areas || steps.classify_push.outputs.areas }}
      changed_files_count: ${{ steps.classify.outputs.changed_files_count || steps.classify_push.outputs.changed_files_count }}
      reason: ${{ steps.classify.outputs.reason || steps.classify_push.outputs.reason }}
      run_ui_coverage: ${{ steps.classify.outputs.run_ui_coverage || steps.classify_push.outputs.run_ui_coverage }}
      ui_coverage_reason: ${{ steps.classify.outputs.ui_coverage_reason || steps.classify_push.outputs.ui_coverage_reason }}
      ui_coverage_command: ${{ steps.classify.outputs.ui_coverage_command || steps.classify_push.outputs.ui_coverage_command }}
      run_ui_browser_integration: ${{ steps.classify.outputs.run_ui_browser_integration || steps.classify_push.outputs.run_ui_browser_integration }}
      ui_browser_integration_reason: ${{ steps.classify.outputs.ui_browser_integration_reason || steps.classify_push.outputs.ui_browser_integration_reason }}
      ui_browser_integration_command: ${{ steps.classify.outputs.ui_browser_integration_command || steps.classify_push.outputs.ui_browser_integration_command }}
      run_backend_verification: ${{ steps.classify.outputs.run_backend_verification || steps.classify_push.outputs.run_backend_verification }}
      backend_verification_reason: ${{ steps.classify.outputs.backend_verification_reason || steps.classify_push.outputs.backend_verification_reason }}
      backend_verification_command: ${{ steps.classify.outputs.backend_verification_command || steps.classify_push.outputs.backend_verification_command }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Classify change impact
        id: classify
        if: github.event_name == 'pull_request'
        run: go run ./cmd/ciclassify -base "${{ github.event.pull_request.base.sha }}" -head "${{ github.event.pull_request.head.sha }}"

      - name: Default push events to full verification
        id: classify_push
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "classification=shared-risk"
            echo "docs_only=false"
            echo "ui_only=false"
            echo "backend_only=false"
            echo "shared_risk=true"
            echo "full_run_required=true"
            echo "areas=shared-risk"
            echo "changed_files_count=0"
            echo "reason=Push events stay on the full shared-risk verification path."
            echo "run_ui_coverage=true"
            echo "ui_coverage_reason=Runs because shared-risk changes stay on the full verification safety path."
            echo "ui_coverage_command=make test-ui-coverage"
            echo "run_ui_browser_integration=true"
            echo "ui_browser_integration_reason=Runs because shared-risk changes stay on the full verification safety path."
            echo "ui_browser_integration_command=make ui-integration-test"
            echo "run_backend_verification=true"
            echo "backend_verification_reason=Runs because shared-risk changes stay on the full verification safety path."
            echo "backend_verification_command=make test-backend-verification"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Pull request impact classification"
            echo
            echo "- Classification: \`shared-risk\`"
            echo "- Areas touched: \`shared-risk\`"
            echo "- Changed files: \`0\`"
            echo "- Reason: Push events stay on the full shared-risk verification path."
          } >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: classify-pr-impact
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Bun for the dashboard workspace
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-

      - name: Install dashboard dependencies
        run: make ui-deps

      - name: Run dashboard typecheck
        run: make typecheck

  verify-build-contracts:
    name: Build, Lint, and API
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Bun for the dashboard workspace
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node for API contract commands
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-

      - name: Install dashboard dependencies
        run: make ui-deps

      - name: Build dashboard bundle
        run: make ui-build

      - name: Build backend binaries
        run: make build

      - name: Run dashboard lint verification
        timeout-minutes: 10
        run: make ui-lint

      - name: Run dashboard deadcode verification
        timeout-minutes: 10
        run: make ui-deadcode

      - name: Run Go vet verification
        timeout-minutes: 10
        run: make vet

      - name: Run backend size verification
        timeout-minutes: 10
        run: make backend-size

      - name: Run pkg maintainability verification
        timeout-minutes: 10
        run: make pkg-maint

      - name: Run backend deadcode verification
        timeout-minutes: 10
        run: make deadcode

      - name: Run API smoke verification
        timeout-minutes: 10
        run: make api-smoke

  ui-coverage:
    name: UI Coverage
    runs-on: ubuntu-latest
    needs:
      - classify-pr-impact
      - verify-build-contracts
    timeout-minutes: 40
    steps:
      - name: Report lane routing
        run: |
          {
            echo "## UI Coverage"
            echo
            echo "- Classification: \`${{ needs.classify-pr-impact.outputs.classification }}\`"
            echo "- Decision: \`${{ needs.classify-pr-impact.outputs.run_ui_coverage == 'true' && 'run' || 'skip' }}\`"
            echo "- Local command: \`${{ needs.classify-pr-impact.outputs.ui_coverage_command }}\`"
            echo "- Reason: ${{ needs.classify-pr-impact.outputs.ui_coverage_reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out repository
        if: needs.classify-pr-impact.outputs.run_ui_coverage == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go from go.mod
        if: needs.classify-pr-impact.outputs.run_ui_coverage == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Bun for the dashboard workspace
        if: needs.classify-pr-impact.outputs.run_ui_coverage == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node for dashboard runtime
        if: needs.classify-pr-impact.outputs.run_ui_coverage == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore Bun package cache
        if: needs.classify-pr-impact.outputs.run_ui_coverage == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-

      - name: Install dashboard dependencies
        if: needs.classify-pr-impact.outputs.run_ui_coverage == 'true'
        timeout-minutes: 10
        run: make ui-deps

      - name: Run dashboard coverage lane
        if: needs.classify-pr-impact.outputs.run_ui_coverage == 'true'
        timeout-minutes: 30
        run: make test-ui-coverage

  ui-browser-integration:
    name: UI Browser Integration
    runs-on: ubuntu-latest
    needs:
      - classify-pr-impact
      - verify-build-contracts
    timeout-minutes: 25
    steps:
      - name: Report lane routing
        run: |
          {
            echo "## UI Browser Integration"
            echo
            echo "- Classification: \`${{ needs.classify-pr-impact.outputs.classification }}\`"
            echo "- Decision: \`${{ needs.classify-pr-impact.outputs.run_ui_browser_integration == 'true' && 'run' || 'skip' }}\`"
            echo "- Local command: \`${{ needs.classify-pr-impact.outputs.ui_browser_integration_command }}\`"
            echo "- Reason: ${{ needs.classify-pr-impact.outputs.ui_browser_integration_reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out repository
        if: needs.classify-pr-impact.outputs.run_ui_browser_integration == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go from go.mod
        if: needs.classify-pr-impact.outputs.run_ui_browser_integration == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Bun for the dashboard workspace
        if: needs.classify-pr-impact.outputs.run_ui_browser_integration == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node for dashboard runtime
        if: needs.classify-pr-impact.outputs.run_ui_browser_integration == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore Bun package cache
        if: needs.classify-pr-impact.outputs.run_ui_browser_integration == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-

      - name: Install dashboard dependencies
        if: needs.classify-pr-impact.outputs.run_ui_browser_integration == 'true'
        timeout-minutes: 10
        run: make ui-deps

      # This lane intentionally does not download a prebuilt UI artifact.
      # The owned browser harness rebuilds with a lane-specific API origin and
      # starts its own vite preview process, so reusing verify-build-contracts
      # output would add upload/download coupling without removing the lane's
      # local build/preview responsibility or making retries clearer.
      # Playwright recommends against caching browser binaries in CI because restore
      # time is usually comparable to a fresh download on hosted runners.
      - name: Install Playwright browser for dashboard integration tests
        if: needs.classify-pr-impact.outputs.run_ui_browser_integration == 'true'
        timeout-minutes: 10
        run: make ui-install-playwright

      - name: Run dashboard browser integration suite
        if: needs.classify-pr-impact.outputs.run_ui_browser_integration == 'true'
        timeout-minutes: 15
        run: make ui-integration-test

  backend-verification:
    name: Backend Verification
    runs-on: ubuntu-latest
    needs:
      - classify-pr-impact
      - verify-build-contracts
    timeout-minutes: 35
    steps:
      - name: Report lane routing
        run: |
          {
            echo "## Backend Verification"
            echo
            echo "- Classification: \`${{ needs.classify-pr-impact.outputs.classification }}\`"
            echo "- Decision: \`${{ needs.classify-pr-impact.outputs.run_backend_verification == 'true' && 'run' || 'skip' }}\`"
            echo "- Local command: \`${{ needs.classify-pr-impact.outputs.backend_verification_command }}\`"
            echo "- Reason: ${{ needs.classify-pr-impact.outputs.backend_verification_reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out repository
        if: needs.classify-pr-impact.outputs.run_backend_verification == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go from go.mod
        if: needs.classify-pr-impact.outputs.run_backend_verification == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run merged backend coverage and functional verification
        if: needs.classify-pr-impact.outputs.run_backend_verification == 'true'
        timeout-minutes: 15
        run: make test-backend-verification
