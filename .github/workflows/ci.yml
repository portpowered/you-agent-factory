name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep this pinned version aligned with ui/package.json's packageManager value.
  BUN_VERSION: 1.3.12
  # Keep CI on an explicit Node LTS major so setup-node does not need to resolve
  # the floating lts/* alias through the GitHub-hosted manifest API.
  NODE_VERSION: 22

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Bun for the dashboard workspace
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dashboard dependencies
        run: make ui-deps

      - name: Run dashboard typecheck
        run: make typecheck

  verify-build-contracts:
    name: Build, Lint, and API
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Bun for the dashboard workspace
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node for API contract commands
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dashboard dependencies
        run: make ui-deps

      - name: Build dashboard bundle
        run: make ui-build

      - name: Build backend binaries
        run: make build

      - name: Run dashboard lint verification
        timeout-minutes: 10
        run: make ui-lint

      - name: Run dashboard deadcode verification
        timeout-minutes: 10
        run: make ui-deadcode

      - name: Run Go vet verification
        timeout-minutes: 10
        run: make vet

      - name: Run backend size verification
        timeout-minutes: 10
        run: make backend-size

      - name: Run pkg maintainability verification
        timeout-minutes: 10
        run: make pkg-maint

      - name: Run backend deadcode verification
        timeout-minutes: 10
        run: make deadcode

      - name: Run API smoke verification
        timeout-minutes: 10
        run: make api-smoke

  verify-tests:
    name: Website and Backend Tests
    runs-on: ubuntu-latest
    needs: verify-build-contracts
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Bun for the dashboard workspace
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node for dashboard runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dashboard dependencies
        timeout-minutes: 10
        run: make ui-deps

      - name: Install Playwright browser for dashboard integration tests
        timeout-minutes: 10
        run: make ui-install-playwright

      - name: Run dashboard test suite
        timeout-minutes: 15
        run: make ui-test

      - name: Run dashboard coverage suite
        timeout-minutes: 15
        run: make ui-test-coverage

      - name: Run replay coverage verification
        timeout-minutes: 10
        run: make ui-replay-coverage-check

      - name: Run backend coverage suite
        timeout-minutes: 15
        run: make test-coverage-go

      - name: Run backend functional suite
        timeout-minutes: 15
        run: make test-functional
