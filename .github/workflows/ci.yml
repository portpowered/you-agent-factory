name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # The main merge queue tests each queued PR against the latest main in a
  # temporary gh-readonly-queue branch. Required checks must report here.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

# Only superseded pull_request runs are cancelled. Main pushes and merge_group
# runs key on their own sha so each gets a unique group and always finishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.3.12
  NODE_VERSION: 22
  # Keep this aligned with go.mod's toolchain directive. Using only the lower
  # go directive can make setup-go download the newer toolchain into GOMODCACHE
  # before cache restore, which causes cache extraction collisions on CI.
  GO_VERSION: 1.25.0

jobs:
  classify:
    name: Verification Setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_result: ${{ steps.docs-reference.outcome }}
      classification: ${{ steps.classify.outputs.classification || 'full' }}
      areas: ${{ steps.classify.outputs.areas || 'ci-tooling' }}
      reason: ${{ steps.classify.outputs.reason || 'Conservative full verification.' }}
      run_docs_reference: ${{ steps.classify.outputs.run_docs_reference != 'false' }}
      run_readme: ${{ steps.classify.outputs.run_readme != 'false' }}
      run_frontend: ${{ steps.classify.outputs.run_frontend != 'false' }}
      run_backend: ${{ steps.classify.outputs.run_backend != 'false' }}
      run_backend_conformance: ${{ steps.classify.outputs.run_backend_conformance != 'false' }}
      run_ui_backend_integration: ${{ steps.classify.outputs.run_ui_backend_integration != 'false' }}
      run_api_package: ${{ steps.classify.outputs.run_api_package != 'false' }}
      run_packaged_factories_package: ${{ steps.classify.outputs.run_packaged_factories_package != 'false' }}
      run_model_providers_package: ${{ steps.classify.outputs.run_model_providers_package != 'false' }}
      docs_reference_reason: ${{ steps.classify.outputs.docs_reference_reason || steps.classify.outputs.reason || 'Conservative full verification.' }}
      readme_reason: ${{ steps.classify.outputs.readme_reason || steps.classify.outputs.reason || 'Conservative full verification.' }}
      frontend_reason: ${{ steps.classify.outputs.frontend_reason || steps.classify.outputs.reason || 'Conservative full verification.' }}
      backend_reason: ${{ steps.classify.outputs.backend_reason || steps.classify.outputs.reason || 'Conservative full verification.' }}
      backend_conformance_reason: ${{ steps.classify.outputs.backend_conformance_reason || steps.classify.outputs.reason || 'Conservative full verification.' }}
      ui_backend_integration_reason: ${{ steps.classify.outputs.ui_backend_integration_reason || steps.classify.outputs.reason || 'Conservative full verification.' }}
      api_package_reason: ${{ steps.classify.outputs.api_package_reason || steps.classify.outputs.reason || 'Conservative full verification.' }}
      packaged_factories_package_reason: ${{ steps.classify.outputs.packaged_factories_package_reason || steps.classify.outputs.reason || 'Conservative full verification.' }}
      model_providers_package_reason: ${{ steps.classify.outputs.model_providers_package_reason || steps.classify.outputs.reason || 'Conservative full verification.' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - id: classify
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: go run ./cmd/ciclassify -base "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}" -head "${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}"
      - if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: |
          for lane in docs_reference readme frontend backend backend_conformance ui_backend_integration api_package packaged_factories_package model_providers_package; do
            echo "run_${lane}=true" >> "$GITHUB_OUTPUT"
          done
          echo "classification=full" >> "$GITHUB_OUTPUT"
          echo "areas=ci-tooling" >> "$GITHUB_OUTPUT"

      - name: Install pinned actionlint
        if: success() || failure()
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Workflow proof
        if: success() || failure()
        run: bash scripts/ci/run-workflow-verification.sh
      - name: Docs proof
        id: docs-reference
        if: (success() || failure()) && steps.classify.outputs.run_docs_reference != 'false'
        run: make docs-reference-smoke

  readme:
    name: README
    needs: classify
    if: always() && needs.classify.outputs.run_readme != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make readme-check

  frontend:
    name: Frontend
    needs: classify
    if: always() && needs.classify.outputs.run_frontend != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Restore Bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: frontend-bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('ui/bun.lock') }}
      - name: Install locked frontend dependencies
        run: cd ui && bun install --frozen-lockfile
      - name: Typecheck frontend
        run: make typecheck
      - name: Lint frontend
        if: success() || failure()
        run: make ui-lint ui-deadcode
      - name: Run frontend unit and replay coverage
        if: success() || failure()
        env:
          UI_COVERAGE_MAIN_MAX_WORKERS: "4"
        run: make test-ui-coverage

      - name: Restore Playwright Chromium
        id: playwright-browser
        if: success() || failure()
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ui/bun.lock') }}
      - name: Install Playwright Chromium
        if: (success() || failure()) && steps.playwright-browser.outputs.cache-hit != 'true'
        run: make ui-install-playwright
      - name: Frontend proof
        if: success() || failure()
        run: bash scripts/ci/run-frontend-verification.sh
        env:
          AGENT_FACTORY_BROWSER_ARTIFACT_DIR: ${{ github.workspace }}/.artifacts/factory-graph-visual-group
      - name: Upload visual group browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-graph-visual-group-browser-evidence
          path: .artifacts/factory-graph-visual-group
          if-no-files-found: warn
          retention-days: 14

  backend-models-verification:
    name: Backend Models Wire and Race
    needs: classify
    if: always() && needs.classify.outputs.run_backend != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOMAXPROCS: "2"
      GOFLAGS: "-p=1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Keep generation and race compilation outside the five-minute unit
      # coverage budget. Compare both generations and the committed graph.
      - name: Verify Wire reproducibility and committed drift
        timeout-minutes: 5
        shell: bash
        run: |
          make generate-wire
          sha256sum pkg/wire/wire_gen.go > "$RUNNER_TEMP/models-wire-first.sha256"
          make generate-wire
          sha256sum pkg/wire/wire_gen.go > "$RUNNER_TEMP/models-wire-second.sha256"
          diff -u "$RUNNER_TEMP/models-wire-first.sha256" "$RUNNER_TEMP/models-wire-second.sha256"
          git diff --exit-code -- pkg/wire/wire_gen.go
          cat "$RUNNER_TEMP/models-wire-second.sha256"
      - name: Race-check scoped Models components
        timeout-minutes: 10
        run: |
          go test -race -v -p 1 -count=1 -timeout 3m \
            ./pkg/services/models/internal/service \
            ./pkg/services/models/internal/local \
            ./pkg/services/models/internal/services/inference/internal/service \
            ./pkg/services/models/internal/services/runtime_host/internal/service \
            ./pkg/services/models/internal/services/runtime_host/internal/services/leases/internal/service \
            -run 'Test.*(Root|Scoped|Scope|ResourceLimiter|Invoke|Invocation|Cancel|Release|Lease|Deadline|Idle|Timer|Capacity)'
      - name: Race-check composed scoped Models scenarios
        timeout-minutes: 8
        run: |
          go test -race -v -p 1 -count=1 -timeout 3m \
            ./tests/functional/models/inference \
            -run 'TestModelsFixedLeaves|TestModelsScopedPullInterleavesOperatorSourcesAndCachesOnOneProcess'

  backend-coverage:
    name: Backend ${{ matrix.label }} Coverage
    needs: classify
    if: always() && needs.classify.outputs.run_backend != 'false'
    runs-on: ubuntu-latest
    # The functional runner enforces the 75m merge-full budget. The unit lane
    # has a fifteen-minute ceiling so a cache regression cannot quietly turn the
    # required coverage check back into the longest pull-request job.
    timeout-minutes: ${{ matrix.suite == 'unit' && 15 || 80 }}
    # Both lanes upsert their own reporting comment on the pull request,
    # mirroring Backend Lint. Each uses a distinct HTML-comment marker, so the
    # two reports never find, overwrite, or delete each other's comment. Every
    # other permission stays at the workflow-level read-only default.
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      # Package-floor enforcement is BLOCKING. Both coverage lanes inherit the
      # Makefile default (GO_COVERAGE_FLOOR_POLICY ?= blocking), so a package
      # that drops below its floor fails CI and the floor must be updated
      # deliberately in the manifest rather than drifting silently.
      #
      # A measured package with no manifest entry is NOT a failure: it is held
      # to its lane's default floor (cmd/gocoveragecheck/manifest_default_floor.go),
      # so adding a package does not require a manifest edit.
      #
      # Do not reintroduce an advisory override here.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            label: Unit
          - suite: functional
            label: Functional
    steps:
      - name: Record job start time
        shell: bash
        run: echo "JOB_START=$(date -u '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: matrix.suite == 'unit'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/checkout@v4
        if: matrix.suite == 'functional'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Customer Git fixtures own their histories; diagnostics need HEAD.
          fetch-depth: 1
      - uses: actions/setup-go@v5
        if: matrix.suite == 'unit'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-go@v5
        if: matrix.suite == 'functional'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Select functional runner parallelism
        if: matrix.suite == 'functional'
        id: functional-parallelism
        shell: bash
        run: |
          runner_cpus="$(nproc 2>/dev/null || true)"
          functional_jobs=8
          echo "Functional CI runner: logical_cpus=${runner_cpus:-unknown} jobs=$functional_jobs"
          echo "jobs=$functional_jobs" >> "$GITHUB_OUTPUT"
      - name: Restore Go module cache
        id: go-module-cache
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-modules-v2-${{ runner.os }}-${{ runner.arch }}-go-${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-modules-v2-${{ runner.os }}-${{ runner.arch }}-go-${{ env.GO_VERSION }}-
            go-modules-${{ runner.os }}-${{ runner.arch }}-go-${{ env.GO_VERSION }}-
      - name: Prefetch complete Go dependency graph
        run: go list -deps -test -mod=readonly ./... > /dev/null
      - name: Restore unit coverage Go build and test cache
        if: matrix.suite == 'unit'
        id: unit-go-build-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: unit-coverage-build-${{ runner.os }}-${{ runner.arch }}-go-${{ env.GO_VERSION }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            unit-coverage-build-${{ runner.os }}-${{ runner.arch }}-go-${{ env.GO_VERSION }}-
      # Deps-only functional build cache: compiled std and third-party
      # packages only. Coverage instruments just pkg/..., so these objects are
      # reusable by every instrumented test binary. The separate bounded archive
      # tier below retains recently used compiler outputs, avoiding the former
      # ~4 min restore of a ~7 GB whole build cache. The deps key is exact, with no
      # restore-keys, so a go.mod/go.sum or Go version change refills it.
      # Only pushes to main save it; every other run restores read-only.
      - name: Restore bounded functional compiler archives
        if: matrix.suite == 'functional'
        id: functional-compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: .artifacts/functional-compiler-cache/cache
          key: functional-compiler-archives-v2-${{ runner.os }}-${{ runner.arch }}-go-${{ env.GO_VERSION }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            functional-compiler-archives-v2-${{ runner.os }}-${{ runner.arch }}-go-${{ env.GO_VERSION }}-${{ hashFiles('go.mod', 'go.sum') }}-
            functional-compiler-archives-v1-${{ runner.os }}-${{ runner.arch }}-go-${{ env.GO_VERSION }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - name: Restore functional dependency build cache
        if: matrix.suite == 'functional' && (steps.functional-compiler-cache.outputs.cache-matched-key == '' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        id: functional-deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: functional-deps-build-v1-${{ runner.os }}-${{ runner.arch }}-go-${{ env.GO_VERSION }}-${{ hashFiles('go.mod', 'go.sum') }}
      - name: Build functional dependency build cache
        if: matrix.suite == 'functional' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.functional-deps-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          module_path="$(go list -m)"
          mapfile -t dep_packages < <(go list -deps -test -f '{{if not .ForTest}}{{.ImportPath}}{{end}}' ./pkg/... ./tests/functional/... | grep -v "^${module_path}" | grep -v '\.test$' | grep -v '\[' | sort -u)
          go build -p=4 "${dep_packages[@]}" runtime/coverage
          du -sh ~/.cache/go-build
      - name: Save functional dependency build cache
        if: matrix.suite == 'functional' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.functional-deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/go-build
          key: ${{ steps.functional-deps-cache.outputs.cache-primary-key }}
      - name: Apply bounded functional compiler archives
        if: matrix.suite == 'functional'
        shell: bash
        env:
          COMPILER_CACHE_MATCHED_KEY: ${{ steps.functional-compiler-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          compiler_cache="$GITHUB_WORKSPACE/.artifacts/functional-compiler-cache/cache"
          if [[ -z "$COMPILER_CACHE_MATCHED_KEY" ]]; then
            # Seed a cold snapshot from the smaller dependency-only tier.
            python3 scripts/ci/functional-compile-cache.py restore "$compiler_cache" "$(go env GOCACHE)"
          fi
          # Use restored archives in place; capture later removes executables
          # and result payloads before saving the bounded snapshot.
          echo "GOCACHE=$compiler_cache" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        if: matrix.suite == 'functional'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run LocalAI Runner V2 controlled component matrix
        if: matrix.suite == 'unit'
        run: make test-localai-runner-v2-component
      - name: Run backend coverage
        if: matrix.suite == 'unit'
        run: make test-unit-coverage
        env:
          GO_UNIT_COVERAGE_JOBS: "4"
          GO_UNIT_COVERAGE_PROFILE: .artifacts/unit-coverage/coverage.out
          GO_UNIT_COVERAGE_JSON_OUTPUT: .artifacts/unit-coverage/coverage-summary.json
          GO_UNIT_COVERAGE_TIMING_OUTPUT: .artifacts/unit-coverage/unit-timing-summary.json
      - name: Run retained ACP SDK regression tests
        if: matrix.suite == 'unit'
        run: make test-acp-sdk
      - name: Run focused Worker recording race witnesses
        if: matrix.suite == 'unit'
        run: |
          go test -race ./pkg/services/recordings/internal/services/worker_capture/internal/service ./pkg/platform/replay -count=1 -timeout=5m
          go test -race ./tests/functional/workers/inference -run 'TestWSRFT004|TestWSRFT009|TestWorkerRecordingSurvivesTempCleanup|TestWorkerSessionSelectedSessionObservationConsistency' -count=1 -p=2 -timeout=5m
          go test -race ./pkg/services/factory_runtime/internal/services/orchestration/runtime -run 'TestRecordedWorkerSessionObservation|TestMergeRecordedObservations' -count=1 -timeout=5m
          go test -race ./pkg/services/worker_sessions/internal/service -count=1 -timeout=5m
      - name: Race-check invocation preflight and request replay
        if: matrix.suite == 'unit'
        run: go test -race -p=2 ./pkg/services/worker_sessions/internal/service ./tests/functional/workers/invoke_continue -run 'Test.*(Start|Replay)|TestT7' -count=2 -timeout 10m
      - name: Race-check bounded Codex detail and shared HTTP fixture
        if: matrix.suite == 'unit'
        run: |
          go test -race ./pkg/services/provider_sessions/internal/service ./pkg/services/provider_sessions/transports/http -count=1 -p=1 -timeout=5m
          go test -race ./tests/functional/providers/codex -run '^TestCodexSharedTrustedWorkAndHistory$' -count=1 -p=1 -timeout=5m
      - name: Race-check selected Automations time and joined shutdown
        if: matrix.suite == 'unit'
        timeout-minutes: 10
        run: |
          go test -race -v -p 1 -count=1 -timeout 3m \
            ./pkg/services/automations/internal/clockview \
            ./pkg/services/automations/internal/services/script_pollers/internal/service \
            ./pkg/services/automations/internal/services/sourcelifecycle/internal/service \
            ./pkg/services/automations/internal/services/filesystem_watchers/internal/service \
            -run 'ClockView|StopsDuringBackoff|Backoff_ProgressionBounds|ControlledBackoff|ReadFileWithRetry|Debounce|StoppingOneWatcher'
          go test -race -v -p 1 -count=1 -timeout 3m \
            ./tests/functional/automations/scheduling \
            -run '^TestAutomationsSelectedTimeControlsWorkAndJoinedShutdown$'
      - name: Prune unit Go build cache to entries touched by this job
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.suite == 'unit' && steps.unit-go-build-cache.outputs.cache-hit != 'true'
        shell: bash
        run: find ~/.cache/go-build -type f ! -newermt "$JOB_START" -delete
      - name: Save unit coverage Go build and test cache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.suite == 'unit' && steps.unit-go-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/go-build
          key: ${{ steps.unit-go-build-cache.outputs.cache-primary-key }}
      # This existing coverage tier intentionally selects backend packages
      # under pkg/... through make test-unit-coverage. It does not claim to
      # exercise ./internal/...; that tree has separate repository-maintenance
      # baselines and fixtures, so a known-red whole-tree command must not be
      # wired into this required coverage job until those prerequisites are
      # repaired by their owning work.
      # Reporting only. Every unit step below is additive and runs with
      # if: always() so a failing or timed-out lane still publishes the partial
      # diagnostics it did produce. Each is fail-open: a missing or malformed
      # artifact writes an explicit "unavailable" body and exits 0, so a
      # renderer or API failure can never turn a passing suite red. Node is set
      # up here rather than beside the Go toolchain so the measured lane runs in
      # exactly the environment it ran in before.
      - name: Set up Node for unit coverage reporting
        if: always() && matrix.suite == 'unit'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Publish unit coverage job summary
        if: always() && matrix.suite == 'unit'
        continue-on-error: true
        run: bash scripts/ci/publish-unit-coverage-summary.sh
        env:
          UNIT_COVERAGE_DIR: .artifacts/unit-coverage
          UNIT_COVERAGE_PROFILE: .artifacts/unit-coverage/coverage.out
          UNIT_COVERAGE_JSON: .artifacts/unit-coverage/coverage-summary.json
          UNIT_COVERAGE_TIMING: .artifacts/unit-coverage/unit-timing-summary.json
          UNIT_COVERAGE_SUMMARY_FILE: .artifacts/unit-coverage/unit-coverage-summary.md
      - name: Upload unit coverage diagnostics
        if: always() && matrix.suite == 'unit'
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-diagnostics
          path: |
            .artifacts/unit-coverage/coverage.out
            .artifacts/unit-coverage/coverage-summary.json
            .artifacts/unit-coverage/unit-timing-summary.json
            .artifacts/unit-coverage/unit-coverage-summary.md
            .artifacts/unit-coverage/command.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Render unit coverage pull request comment
        if: always() && matrix.suite == 'unit'
        continue-on-error: true
        run: bash scripts/ci/publish-unit-coverage-comment.sh
        env:
          UNIT_COVERAGE_DIR: .artifacts/unit-coverage
          UNIT_COVERAGE_JSON: .artifacts/unit-coverage/coverage-summary.json
          UNIT_COVERAGE_TIMING: .artifacts/unit-coverage/unit-timing-summary.json
          UNIT_COVERAGE_COMMENT_FILE: .artifacts/unit-coverage/unit-coverage-comment.md
          UNIT_COVERAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Publish unit coverage report to the pull request
        if: always() && matrix.suite == 'unit' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          UNIT_COVERAGE_COMMENT_FILE: .artifacts/unit-coverage/unit-coverage-comment.md
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const commentPath = `${process.env.GITHUB_WORKSPACE}/${process.env.UNIT_COVERAGE_COMMENT_FILE}`;
            let body = '';
            try {
              body = fs.readFileSync(commentPath, 'utf8');
            } catch (error) {
              core.info(`unit coverage comment body unavailable at ${commentPath}: ${error.message}`);
              return;
            }
            if (!body.trim()) {
              core.info('unit coverage comment body is empty; nothing to publish.');
              return;
            }
            const { upsertUnitCoverageComment } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/unit-coverage-report.mjs`);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const publication = upsertUnitCoverageComment(comments, body);
            if (publication.action === 'update') {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: publication.commentId,
                body: publication.body,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: publication.body,
            });
      # This is the authoritative Linux functional run. Pull requests and
      # pushes to main use the same complete non-short tier. The run expands
      # ./tests/functional/... once, subtracts only the versioned quarantine,
      # and writes package plus top-level test outcomes before the coverage
      # gate returns, including on failure. The supervisor starts the unchanged
      # quarantine validator in the same critical-path window and joins both
      # independent verdicts before returning.
      - name: Run Linux functional coverage with concurrent quarantine verification
        if: matrix.suite == 'functional'
        timeout-minutes: 75
        shell: bash
        run: bash scripts/ci/run-functional-coverage-with-quarantine.sh
        env:
          FUNCTIONAL_QUARANTINE_EVIDENCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FUNCTIONAL_QUARANTINE_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FUNCTIONAL_QUARANTINE_EVIDENCE_OUTPUT: .artifacts/functional-test-viz/quarantine-package-evidence.txt
          FUNCTIONAL_QUARANTINE_EVIDENCE_TIMEOUT: 15m
          # Retry at most five failing top-level tests once on this same
          # commit; a pass on retry is recorded as a flake in the ledger.
          FUNCTIONAL_FLAKE_RETRY_MAX: "5"
          FUNCTIONAL_FLAKE_LEDGER: .artifacts/functional-test-viz/flake-ledger.json
          FUNCTIONAL_FLAKE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FUNCTIONAL_TEST_VIZ_DIR: .artifacts/functional-test-viz
          FUNCTIONAL_TEST_TIER: "merge-full"
          FUNCTIONAL_TEST_TRIGGER: ${{ github.event_name == 'push' && 'push-main' || 'pull_request' }}
          FUNCTIONAL_TEST_BUDGET: "75m"
          FUNCTIONAL_SHORT: "false"
          FUNCTIONAL_DEFAULT_JOBS: ${{ steps.functional-parallelism.outputs.jobs }}
          FUNCTIONAL_GOCOVERAGE_EXIT_FILE: .artifacts/functional-test-viz/gocoveragecheck-exit-code.txt
          FUNCTIONAL_COVERAGE_VERDICT_FILE: .artifacts/functional-test-viz/functional-coverage-verdict.txt
          FUNCTIONAL_COVERAGE_BUILD_DIAGNOSTICS: .artifacts/functional-test-viz/coverage-build-diagnostics.json
          FUNCTIONAL_COVERAGE_ACTION_CACHE_PRIMARY_KEY: ${{ steps.functional-compiler-cache.outputs.cache-primary-key }}
          FUNCTIONAL_COVERAGE_ACTION_CACHE_MATCHED_KEY: ${{ steps.functional-compiler-cache.outputs.cache-matched-key }}
          FUNCTIONAL_COVERAGE_ACTION_CACHE_EXACT_HIT: ${{ steps.functional-compiler-cache.outputs.cache-hit || 'false' }}
      - name: Capture bounded functional compiler archives
        if: always() && !cancelled() && matrix.suite == 'functional' && steps.functional-compiler-cache.outputs.cache-hit != 'true'
        id: functional-compiler-capture
        run: |
          python3 scripts/ci/functional-compile-cache.py capture "$(go env GOCACHE)" .artifacts/functional-compiler-cache/next --job-start "$JOB_START" --max-bytes 2147483648
          rm -rf -- .artifacts/functional-compiler-cache/cache
          mv -- .artifacts/functional-compiler-cache/next .artifacts/functional-compiler-cache/cache
      - name: Save bounded functional compiler archives
        if: always() && !cancelled() && matrix.suite == 'functional' && steps.functional-compiler-capture.outcome == 'success' && steps.functional-compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .artifacts/functional-compiler-cache/cache
          key: ${{ steps.functional-compiler-cache.outputs.cache-primary-key }}
      - name: Upload Linux quarantine package evidence
        if: always() && matrix.suite == 'functional'
        uses: actions/upload-artifact@v4
        with:
          name: functional-quarantine-package-evidence
          path: .artifacts/functional-test-viz/quarantine-package-evidence.txt
          if-no-files-found: error
          retention-days: 14
      # Ordinary test and coverage-gate failures are deferred by the runner so
      # this step is the only failing log for those outcomes. Timeout and
      # infrastructure failures keep the full run step failed instead.
      - name: Report functional coverage verdict
        if: always() && matrix.suite == 'functional'
        run: bash scripts/ci/publish-functional-coverage-verdict.sh
        env:
          FUNCTIONAL_TEST_VIZ_DIR: .artifacts/functional-test-viz
          FUNCTIONAL_GOCOVERAGE_EXIT_FILE: .artifacts/functional-test-viz/gocoveragecheck-exit-code.txt
          FUNCTIONAL_COVERAGE_VERDICT_FILE: .artifacts/functional-test-viz/functional-coverage-verdict.txt
      - name: Record functional flake ledger
        if: always() && matrix.suite == 'functional' && hashFiles('scripts/ci/flake-ledger-summary.mjs') != ''
        run: node scripts/ci/flake-ledger-summary.mjs --ledger .artifacts/functional-test-viz/flake-ledger.json
      - name: Upload functional flake ledger
        if: always() && matrix.suite == 'functional'
        uses: actions/upload-artifact@v4
        with:
          name: functional-flake-ledger
          path: .artifacts/functional-test-viz/flake-ledger.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload functional test diagnostics
        if: always() && matrix.suite == 'functional'
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-diagnostics
          path: |
            .artifacts/functional-test-viz/functional-tests.md
            .artifacts/functional-test-viz/functional-timing-summary.json
            .artifacts/functional-test-viz/coverage-summary.json
            .artifacts/functional-test-viz/coverage.out
            .artifacts/functional-test-viz/command.log
            .artifacts/functional-test-viz/quarantine-package-evidence.txt
            .artifacts/functional-test-viz/diagnostic-status.txt
            .artifacts/functional-test-viz/gocoveragecheck-exit-code.txt
            .artifacts/functional-test-viz/functional-coverage-verdict.txt
            .artifacts/functional-test-viz/coverage-build-diagnostics.json
            .artifacts/functional-test-viz/raw-failures/index.json
            .artifacts/functional-test-viz/raw-failures/*.jsonl
            .artifacts/functional-test-viz/c09-critical-path/quarantine-status.txt
            .artifacts/functional-test-viz/c09-critical-path/coverage-status.txt
            .artifacts/functional-test-viz/c09-critical-path/critical-path-timing.txt
          if-no-files-found: ignore
          retention-days: 14
      # Reporting only. Both steps below are fail-open: a missing or malformed
      # artifact writes an explicit "unavailable" body and exits 0, so a
      # renderer or API failure can never turn a passing suite red.
      - name: Render functional coverage pull request comment
        if: always() && matrix.suite == 'functional'
        continue-on-error: true
        run: bash scripts/ci/publish-functional-coverage-comment.sh
        env:
          FUNCTIONAL_TEST_VIZ_DIR: .artifacts/functional-test-viz
          FUNCTIONAL_TEST_VIZ_TIMING: .artifacts/functional-test-viz/functional-timing-summary.json
          FUNCTIONAL_TEST_VIZ_JSON: .artifacts/functional-test-viz/coverage-summary.json
          FUNCTIONAL_COVERAGE_COMMENT_FILE: .artifacts/functional-test-viz/functional-coverage-comment.md
          FUNCTIONAL_COVERAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Publish functional coverage inventory to the pull request
        if: always() && matrix.suite == 'functional' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          FUNCTIONAL_COVERAGE_COMMENT_FILE: .artifacts/functional-test-viz/functional-coverage-comment.md
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const commentPath = `${process.env.GITHUB_WORKSPACE}/${process.env.FUNCTIONAL_COVERAGE_COMMENT_FILE}`;
            let body = '';
            try {
              body = fs.readFileSync(commentPath, 'utf8');
            } catch (error) {
              core.info(`functional coverage comment body unavailable at ${commentPath}: ${error.message}`);
              return;
            }
            if (!body.trim()) {
              core.info('functional coverage comment body is empty; nothing to publish.');
              return;
            }
            const { upsertFunctionalCoverageComment } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/functional-coverage-comment.mjs`);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const publication = upsertFunctionalCoverageComment(comments, body);
            if (publication.action === 'update') {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: publication.commentId,
                body: publication.body,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: publication.body,
            });

  backend-conformance:
    name: Backend Conformance
    needs: classify
    if: always() && needs.classify.outputs.run_backend_conformance != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run offline backend conformance guard
        run: make test-backend-conformance
      - name: Verify pinned backend release assets
        run: make test-backend-conformance-live

  backend-integration:
    name: Backend Integration
    needs: classify
    if: always() && needs.classify.outputs.run_backend != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build shared CLI artifact for compiled integration evidence
        run: |
          mkdir -p .artifacts/integration/bin
          go build -o .artifacts/integration/bin/you ./cmd/factory
          echo "INFINITE_YOU_SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build platform conformance helper artifact
        run: |
          go test -c -o .artifacts/integration/bin/platform-conformance-helper ./tests/integration/models/platform_conformance
          test -x .artifacts/integration/bin/platform-conformance-helper
      - name: Build TTS clean-install helper artifact
        run: |
          go test -c -o .artifacts/integration/bin/tts-clean-install-helper ./tests/integration/models/tts_clean_install
          test -x .artifacts/integration/bin/tts-clean-install-helper
          helper_sha256=$(sha256sum .artifacts/integration/bin/tts-clean-install-helper | awk '{print $1}')
          echo "INFINITE_YOU_TTS_PREBUILT_HELPER_PATH=${{ github.workspace }}/.artifacts/integration/bin/tts-clean-install-helper" >> "$GITHUB_ENV"
          echo "INFINITE_YOU_TTS_PREBUILT_HELPER_SHA256=$helper_sha256" >> "$GITHUB_ENV"
      - name: Run backend integration tests with shared CLI artifact
        run: make test-integration
        env:
          INFINITE_YOU_PREBUILT_ARTIFACT: ${{ github.workspace }}/.artifacts/integration/bin/you
          INFINITE_YOU_REQUIRE_PREBUILT_ARTIFACT: "1"
          INFINITE_YOU_RESTART_EVIDENCE_OUTPUT: ${{ github.workspace }}/.artifacts/integration/sessions/restart/restart-baseline.json
          LOCALAI_PLATFORM_CONFORMANCE_HELPER_PATH: ${{ github.workspace }}/.artifacts/integration/bin/platform-conformance-helper
      - name: Upload restart characterization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restart-characterization-evidence
          path: .artifacts/integration/sessions/restart/restart-baseline.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run required runtime metrics session probe
        if: always()
        shell: bash
        run: |
          set -o pipefail
          go test ./tests/integration/factory/visualization/runtime_metrics \
            -run '^TestProbeMetricsSessionUsesInstalledArtifact$' \
            -count=1 -v -timeout=5m 2>&1 | tee .artifacts/integration/runtime-metrics-session-probe.log
        env:
          INFINITE_YOU_PREBUILT_ARTIFACT: ${{ github.workspace }}/.artifacts/integration/bin/you
          INFINITE_YOU_REQUIRE_PREBUILT_ARTIFACT: "1"
      - name: Upload runtime metrics session probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-metrics-session-probe-evidence
          path: .artifacts/integration/runtime-metrics-session-probe.log
          if-no-files-found: error
          retention-days: 14
      - name: Run delivered ACP response integration
        run: make test-acp-provider-prebuilt
        env:
          INFINITE_YOU_INTEGRATION_BINARY: ${{ github.workspace }}/.artifacts/integration/bin/you
      - name: Run pinned real ACP integration
        run: go test ./tests/integration/transport/acp/realclient -run '^TestPinnedAcpxCompletesDefaultFactoryBuilderPrompt$' -count=1 -timeout=15m
        env:
          INFINITE_YOU_RUN_ACPX_REAL_CLIENT: "1"
          INFINITE_YOU_REQUIRE_ACPX_REAL_CLIENT: "1"
          INFINITE_YOU_INTEGRATION_BINARY: ${{ github.workspace }}/.artifacts/integration/bin/you
          INFINITE_YOU_ACPX_EVIDENCE_OUTPUT: ${{ github.workspace }}/.artifacts/integration/real-acpx-evidence.json
      - name: Require pinned real ACP integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-real-acp-evidence
          path: .artifacts/integration/real-acpx-evidence.json
          if-no-files-found: error
          retention-days: 14

  tts-clean-install-windows:
    name: TTS Clean-Install Windows
    needs: classify
    if: always() && needs.classify.outputs.run_backend != 'false'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build TTS clean-install helper artifact
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE '.artifacts\integration\bin'
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null
          $helperPath = Join-Path $artifactDirectory 'tts-clean-install-helper.exe'
          go test -c -o $helperPath ./tests/integration/models/tts_clean_install
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path -LiteralPath $helperPath -PathType Leaf)) {
            throw "compiled TTS helper is missing: $helperPath"
          }
          $helperSha256 = (Get-FileHash -LiteralPath $helperPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "INFINITE_YOU_TTS_PREBUILT_HELPER_PATH=$helperPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INFINITE_YOU_TTS_PREBUILT_HELPER_SHA256=$helperSha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType File -Force -Path (Join-Path $env:GITHUB_WORKSPACE '.artifacts\integration\tts-clean-install-windows.log') | Out-Null
      - name: Run TTS clean-install Windows integration
        shell: pwsh
        run: |
          $logPath = Join-Path $env:GITHUB_WORKSPACE '.artifacts\integration\tts-clean-install-windows.log'
          & go test ./tests/integration/models/tts_clean_install -count=1 -v -timeout=20m 2>&1 | Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            exit $exitCode
          }
      - name: Upload TTS clean-install Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-clean-install-windows-evidence
          path: .artifacts/integration/tts-clean-install-windows.log
          if-no-files-found: error
          retention-days: 14

  backend-lint:
    name: Backend Lint
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    env:
      LINT_REPORT_FILE: .artifacts/backend-lint/report.json
      LINT_LOG_FILE: .artifacts/backend-lint/lint.log
      LINT_COMMENT_FILE: .artifacts/backend-lint/comment.md
      BACKEND_LINT_TESTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        id: backend-lint-go
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # Analysis-cache hits still need compiler export data for every tag scope.
      # Keep lint's warmed non-race build outputs separate from coverage writers;
      # setup-go remains the bootstrap on the first run. Go validates each entry
      # against compiler inputs, so the prefix safely reuses unchanged packages.
      - name: Restore Backend Lint Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: backend-lint-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.backend-lint-go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ hashFiles('**/*.go', '**/go.mod', '**/go.sum', 'Makefile', '.golangci*.yml', '.custom-gcl.yml', 'docs/reference/**', 'packages/**', 'ui/fallback_dist/**') }}
          restore-keys: backend-lint-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.backend-lint-go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ hashFiles('go.mod', '**/*.go', '.golangci*.yml', '.custom-gcl.yml') }}
          restore-keys: lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - name: Select lint inputs
        id: lint-inputs
        env:
          LINT_EVENT: ${{ github.event_name }}
          LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          LINT_HEAD: ${{ github.sha }}
        run: node scripts/ci/backend-lint-workflow.mjs --select-inputs --event "$LINT_EVENT" --base "$LINT_BASE" --head "$LINT_HEAD" --output .artifacts/backend-lint/selection.json
      - name: Identify Markdown tool runtime
        id: markdown-runtime
        if: steps.lint-inputs.outputs.docs != '0'
        run: echo "python=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - name: Restore pinned Markdown tools
        id: markdown-tools
        if: steps.lint-inputs.outputs.docs != '0'
        uses: actions/cache@v4
        with:
          path: .cache/docs-markdown-lint
          key: backend-lint-markdown-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.backend-lint-go.outputs.go-version }}-${{ steps.markdown-runtime.outputs.python }}-${{ hashFiles('Makefile', 'scripts/docs-markdown-lint-requirements.txt') }}
      - name: Activate exact Markdown tool cache
        if: steps.markdown-tools.outputs.cache-hit == 'true'
        run: |
          # The exact key covers both prerequisite contents. Checkout mtimes
          # must not reinstall the same tools; actual checks still run below.
          test -x .cache/docs-markdown-lint/bin/gomarklint
          python -c 'import sys; sys.path.insert(0, ".cache/docs-markdown-lint/python"); import pymarkdown, check_jsonschema'
          touch .cache/docs-markdown-lint/ready
      - name: Identify plugin compiler inputs
        id: plugin-inputs
        run: echo "key=$(python3 scripts/build-golangci.py --cache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: lint-plugin-cache
        with:
          path: .artifacts/golangci
          key: lint-plugin-${{ runner.os }}-${{ runner.arch }}-${{ steps.plugin-inputs.outputs.key }}
      - name: Prepare shared lint plugin
        id: prepare-lint-plugin
        run: |
          if [ "${{ steps.lint-plugin-cache.outputs.cache-hit }}" = "true" ]; then
            python3 scripts/build-golangci.py --restore --destination .artifacts/golangci || make golangci-build
          else
            make golangci-build
          fi
      - name: Smoke-test shared lint plugin
        run: python3 scripts/lint-migration-smoke.py ci-smoke --golangci "$PWD/.artifacts/golangci/golangci-repository"
      - name: Verify direct upstream deadcode boundary
        if: steps.lint-inputs.outputs.direct_boundary != '0'
        run: |
          python3 -m unittest discover -s scripts -p "build_golangci_test.py"
          python3 -m unittest discover -s scripts -p "deadcode_report_test.py"
          python3 scripts/deadcode-host-smoke.py --reporter "$PWD/scripts/deadcode-report.py" -- go run golang.org/x/tools/cmd/deadcode@v0.25.1
      - name: Verify Backend Lint event selection
        env:
          BACKEND_LINT_EVENT_NAME: ${{ github.event_name }}
          BACKEND_LINT_REF: ${{ github.ref }}
          BACKEND_LINT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { selectBackendLint } from './scripts/ci/backend-lint-workflow.mjs';
          const selection = selectBackendLint({
            eventName: process.env.BACKEND_LINT_EVENT_NAME,
            ref: process.env.BACKEND_LINT_REF,
            sha: process.env.BACKEND_LINT_SHA,
          });
          if (!selection.selected || selection.error) {
            throw new Error(`Backend Lint was not selected for its hosted event: ${JSON.stringify(selection)}`);
          }
          if (selection.checkoutRef !== process.env.BACKEND_LINT_SHA) {
            throw new Error(`Backend Lint checkout identity disagrees with its tested identity: ${JSON.stringify(selection)}`);
          }
          console.log(`Backend Lint selected tested SHA ${selection.testedSha}`);
          NODE
      - name: Compile functionallong test packages
        id: compile-functionallong
        continue-on-error: true
        run: make test-functional-long-compile
      - name: Select Backend Lint runner parallelism
        id: backend-lint-parallelism
        if: always()
        shell: bash
        run: |
          runner_cpus="$(nproc 2>/dev/null || true)"
          RUNNER_LOGICAL_CPUS="$runner_cpus" node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { resolveBackendLintParallelism } from './scripts/ci/backend-lint-workflow.mjs';

          const { logicalCPUs, jobs, warning } = await resolveBackendLintParallelism(process.env.RUNNER_LOGICAL_CPUS);
          if (warning) {
            console.warn(`::warning::${warning}`);
          }
          console.log(`Backend Lint CI runner: logical_cpus=${logicalCPUs} jobs=${jobs}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `jobs=${jobs}\n`);
          NODE
      - name: Run complete canonical Backend Lint inventory
        id: run-backend-lint
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p .artifacts/backend-lint
          make LINT_REPORT_FILE="$LINT_REPORT_FILE" lint 2>&1 | tee "$LINT_LOG_FILE"
          status=${PIPESTATUS[0]}
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"
        env:
          LINT_JOBS: ${{ steps.backend-lint-parallelism.outputs.jobs || '2' }}
          LINT_FULL: "1"
          LINT_BACKEND_ONLY: "1"
          LINT_RUN_DOCS: ${{ steps.lint-inputs.outputs.docs || '1' }}
          LINT_RUN_DEADCODE: ${{ steps.lint-inputs.outputs.deadcode || '1' }}
          LINT_SELECTION_FILE: .artifacts/backend-lint/selection.json
          GOLANGCI_PREBUILT: "1"
          GOLANGCI_PROFILE_DIR: .artifacts/backend-lint/profiles
      - name: Render Backend Lint summary and gate
        if: always()
        run: >-
          node scripts/ci/backend-lint-report.mjs
          --report "$LINT_REPORT_FILE"
          --log "$LINT_LOG_FILE"
          --summary "$GITHUB_STEP_SUMMARY"
          --comment "$LINT_COMMENT_FILE"
          --selection .artifacts/backend-lint/selection.json
      - name: Upload complete Backend Lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-lint-diagnostics
          path: |
            .artifacts/backend-lint/selection.json
            .artifacts/backend-lint/report.json
            .artifacts/backend-lint/lint.log
            .artifacts/backend-lint/comment.md
            .artifacts/backend-lint/profiles/
            .artifacts/lint-migration-smoke/ci-smoke-*/
            bin/deadcode-current.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Upload normalized deadcode evidence
        if: always() && steps.lint-inputs.outputs.deadcode != '0'
        uses: actions/upload-artifact@v4
        with:
          name: backend-deadcode-evidence
          path: bin/deadcode-current.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish Backend Lint inventory to the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          BACKEND_LINT_COMMENT_FILE: ${{ env.LINT_COMMENT_FILE }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const { upsertBackendLintComment } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/backend-lint-workflow.mjs`);
            const body = fs.readFileSync(process.env.BACKEND_LINT_COMMENT_FILE, 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const publication = upsertBackendLintComment(comments, body);
            if (publication.action === 'update') {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: publication.commentId,
                body: publication.body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: publication.body,
              });
            }
      - name: Enforce functionallong compile guard
        if: always()
        env:
          FUNCTIONALLONG_COMPILE_OUTCOME: ${{ steps.compile-functionallong.outcome }}
        run: |
          if [ "$FUNCTIONALLONG_COMPILE_OUTCOME" != "success" ]; then
            echo "functionallong compile guard failed with outcome: ${FUNCTIONALLONG_COMPILE_OUTCOME:-unknown}"
            exit 1
          fi

  ui-backend-integration:
    name: UI Backend Integration
    needs: classify
    if: always() && needs.classify.outputs.run_ui_backend_integration != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: ./.github/actions/setup-ui-browser
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: make ui-durable-session-real-backend-integration-test

  development-package:
    name: Development Package
    needs: classify
    if: >-
      ${{
        always() &&
        (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push')
      }}
    uses: ./.github/workflows/development-package.yml
    permissions:
      # The called workflow contains explicitly gated publication jobs whose
      # permission ceiling must be allowed at the call boundary. Its package
      # verification jobs retain the called workflow's read-only default.
      contents: write
      id-token: write
    with:
      is_ci_call: true
      run_candidates: ${{ github.event_name == 'pull_request' }}
      run_api_package: ${{ github.event_name != 'pull_request' && needs.classify.outputs.run_api_package != 'false' }}
      run_packaged_factories_package: ${{ needs.classify.outputs.run_packaged_factories_package != 'false' }}
      run_model_providers_package: ${{ needs.classify.outputs.run_model_providers_package != 'false' }}
      source_commit: ${{ github.event.pull_request.head.sha || github.sha }}
      pull_request_head_sha: ${{ github.event.pull_request.head.sha || '' }}
      source_ref: ${{ github.ref }}
      repository: ${{ github.repository }}

  api-pr-verification:
    name: API Contract And Candidate
    needs: classify
    if: always() && github.event_name == 'pull_request' && needs.classify.outputs.run_api_package != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: API proof and candidate dry run
        run: bash scripts/ci/run-api-pr-verification.sh
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_SOURCE_REF: ${{ github.ref }}
          PR_REPOSITORY: ${{ github.repository }}

  # Maintainers can add the ci-workflow-behavior label to request one
  # controlled hosted evaluation of the reusable workflow contract. The job is
  # skipped before any runner is allocated for ordinary pull requests.
  development-package-behavior:
    name: Development Package Workflow Behavior
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'ci-workflow-behavior')
      }}
    uses: ./.github/workflows/development-package-behavior.yml
    permissions:
      contents: write
      id-token: write
    with:
      # Keep the PR evidence check green. The expected-failure propagation
      # case remains available through the dispatch input and deterministic
      # gate; hosted run 31558145400 records its child failure and assertion.
      include_failure: false

  verification-policy:
    name: Verification Policy
    needs: [classify, readme, frontend, backend-coverage, backend-models-verification, backend-conformance, backend-integration, tts-clean-install-windows, backend-lint, ui-backend-integration, development-package, api-pr-verification]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run CI workflow policy tests
        if: always()
        run: make test-ci-workflows
      - name: Verify selected lanes
        if: always()
        env:
          CLASSIFICATION_RESULT: ${{ needs.classify.result }}
          CLASSIFICATION: ${{ needs.classify.outputs.classification }}
          AREAS: ${{ needs.classify.outputs.areas }}
          CLASSIFICATION_REASON: ${{ needs.classify.outputs.reason }}
          RUN_DOCS: ${{ needs.classify.outputs.run_docs_reference }}
          RUN_README: ${{ needs.classify.outputs.run_readme }}
          RUN_FRONTEND: ${{ needs.classify.outputs.run_frontend }}
          RUN_BACKEND: ${{ needs.classify.outputs.run_backend }}
          RUN_BACKEND_CONFORMANCE: ${{ needs.classify.outputs.run_backend_conformance }}
          RUN_UI_BACKEND: ${{ needs.classify.outputs.run_ui_backend_integration }}
          RUN_API: ${{ needs.classify.outputs.run_api_package }}
          RUN_PACKAGED: ${{ needs.classify.outputs.run_packaged_factories_package }}
          RUN_PROVIDERS: ${{ needs.classify.outputs.run_model_providers_package }}
          DOCS_REASON: ${{ needs.classify.outputs.docs_reference_reason }}
          README_REASON: ${{ needs.classify.outputs.readme_reason }}
          FRONTEND_REASON: ${{ needs.classify.outputs.frontend_reason }}
          BACKEND_REASON: ${{ needs.classify.outputs.backend_reason }}
          BACKEND_CONFORMANCE_REASON: ${{ needs.classify.outputs.backend_conformance_reason }}
          UI_BACKEND_REASON: ${{ needs.classify.outputs.ui_backend_integration_reason }}
          API_REASON: ${{ needs.classify.outputs.api_package_reason }}
          PACKAGED_REASON: ${{ needs.classify.outputs.packaged_factories_package_reason }}
          PROVIDERS_REASON: ${{ needs.classify.outputs.model_providers_package_reason }}
          RUN_CANDIDATES: ${{ github.event_name == 'pull_request' }}
          DOCS_RESULT: ${{ needs.classify.outputs.docs_result }}
          README_RESULT: ${{ needs.readme.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_COMPONENT_RESULT: ${{ needs.frontend.result }}
          FRONTEND_COVERAGE_RESULT: ${{ needs.frontend.result }}
          FRONTEND_BROWSER_RESULT: ${{ needs.frontend.result }}
          FRONTEND_STORYBOOK_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend-coverage.result == 'success' && needs.backend-integration.result == 'success' && needs.tts-clean-install-windows.result || needs.backend-coverage.result == 'success' && needs.backend-integration.result || needs.backend-coverage.result }}
          BACKEND_CONFORMANCE_RESULT: ${{ needs.backend-conformance.result }}
          BACKEND_MODELS_RESULT: ${{ needs.backend-models-verification.result }}
          RUN_BACKEND_LINT: "true"
          BACKEND_LINT_REASON: "The complete canonical LINT_TARGETS inventory is required on every pull request and push to main."
          BACKEND_LINT_RESULT: ${{ needs.backend-lint.result }}
          RUN_WORKFLOW_LINT: "true"
          WORKFLOW_LINT_REASON: "Every repository workflow must pass pinned schema-aware lint on every pull request and push to main."
          WORKFLOW_LINT_RESULT: ${{ needs.classify.result }}
          UI_BACKEND_RESULT: ${{ needs.ui-backend-integration.result }}
          API_INDEPENDENT: ${{ github.event_name == 'pull_request' }}
          PACKAGE_WORKFLOW_RESULT: ${{ needs.development-package.result }}
          API_RESULT: ${{ github.event_name == 'pull_request' && needs.api-pr-verification.result || needs.development-package.outputs.api_package_result }}
          API_CANDIDATE_RESULT: ${{ github.event_name == 'pull_request' && needs.api-pr-verification.result || needs.development-package.outputs.api_candidate_result }}
          PACKAGED_RESULT: ${{ needs.development-package.outputs.packaged_factories_package_result }}
          PACKAGED_CANDIDATE_RESULT: ${{ needs.development-package.outputs.packaged_factories_candidate_result }}
          PROVIDERS_RESULT: ${{ needs.development-package.outputs.model_providers_package_result }}
        shell: bash
        run: node scripts/verification-policy.mjs

  backend-visualizations-preview:
    name: Backend Architecture Preview
    needs: [backend-coverage, verification-policy]
    if: github.event_name == 'pull_request' && needs.backend-coverage.result == 'success' && needs.verification-policy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: unit-coverage-diagnostics
          path: .artifacts/unit-coverage
      - uses: actions/download-artifact@v4
        with:
          name: functional-test-diagnostics
          path: .artifacts/functional-test-viz
      - name: Generate architecture pages from this CI run
        run: make architecture
        env:
          BACKEND_VIS_UNIT_SUMMARY: .artifacts/unit-coverage/coverage-summary.json
          BACKEND_VIS_FUNCTIONAL_SUMMARY: .artifacts/functional-test-viz/coverage-summary.json
          BACKEND_VIS_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BACKEND_VIS_REQUIRE_COVERAGE: "1"
      - name: Upload pull request preview
        uses: actions/upload-artifact@v4
        with:
          name: backend-architecture-preview
          path: docs/architecture/visualizations/
          if-no-files-found: error

  backend-visualizations-publish:
    name: Propose Backend Architecture Visualizations
    needs: [backend-coverage, verification-policy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.backend-coverage.result == 'success' && needs.verification-policy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Skip generated-page-only main changes
        id: source-change
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- . ':(exclude)docs/architecture/visualizations/**'; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        if: steps.source-change.outputs.generate == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@v4
        if: steps.source-change.outputs.generate == 'true'
        with:
          name: unit-coverage-diagnostics
          path: .artifacts/unit-coverage
      - uses: actions/download-artifact@v4
        if: steps.source-change.outputs.generate == 'true'
        with:
          name: functional-test-diagnostics
          path: .artifacts/functional-test-viz
      - name: Generate architecture pages from this CI run
        if: steps.source-change.outputs.generate == 'true'
        run: make architecture
        env:
          BACKEND_VIS_UNIT_SUMMARY: .artifacts/unit-coverage/coverage-summary.json
          BACKEND_VIS_FUNCTIONAL_SUMMARY: .artifacts/functional-test-viz/coverage-summary.json
          BACKEND_VIS_SOURCE_COMMIT: ${{ github.sha }}
          BACKEND_VIS_REQUIRE_COVERAGE: "1"
      - name: Check for changed architecture pages
        if: steps.source-change.outputs.generate == 'true'
        id: candidate
        shell: bash
        run: |
          git add -A docs/architecture/visualizations/
          if git diff --cached --quiet; then
            echo "Backend architecture pages are current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint the architecture bot installation token
        if: steps.candidate.outputs.changed == 'true'
        id: bot-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BASELINE_BOT_APP_ID }}
          private-key: ${{ secrets.BASELINE_BOT_APP_PRIVATE_KEY }}
      - name: Propose and auto-merge measured pages
        if: steps.candidate.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error title=Missing bot credential::Architecture publication requires the installed GitHub App token." >&2
            exit 1
          fi
          gh auth setup-git --hostname github.com
          bot_branch="automation/backend-architecture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$bot_branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh backend architecture visualizations"
          git push origin "HEAD:$bot_branch"
          body_file="$RUNNER_TEMP/backend-architecture-pr.md"
          printf 'Generated from measured coverage in [main CI run](%s/%s/actions/runs/%s) at source commit %s.\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$body_file"
          pr_url=$(gh pr create --base main --head "$bot_branch" --title "docs: refresh backend architecture visualizations" --body-file "$body_file")
          gh pr merge "$pr_url" --auto
