name: Pinned LocalAI Backend Artifacts

on:
  workflow_dispatch:

permissions:
  # Publishing creates an immutable tag and GitHub release. Keep that
  # capability available at the workflow ceiling, then narrow every
  # non-publishing job back to read-only below.
  contents: write

concurrency:
  group: localai-backend-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-inputs:
    name: Validate pinned backend inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.validate.outputs.matrix }}
      node_version: ${{ steps.validate.outputs.node_version }}
      localai_commit: ${{ steps.validate.outputs.localai_commit }}
      protocol_revision: ${{ steps.validate.outputs.protocol_revision }}
      grpc_commit: ${{ steps.validate.outputs.grpc_commit }}
      vcpkg_commit: ${{ steps.validate.outputs.vcpkg_commit }}
      go_version: ${{ steps.validate.outputs.go_version }}
      cmake_version: ${{ steps.validate.outputs.cmake_version }}
      protobuf_version: ${{ steps.validate.outputs.protobuf_version }}
      grpc_version: ${{ steps.validate.outputs.grpc_version }}
      macos_make_formula_commit: ${{ steps.validate.outputs.macos_make_formula_commit }}
      macos_make_version: ${{ steps.validate.outputs.macos_make_version }}
      windows_msys_packages: ${{ steps.validate.outputs.windows_msys_packages }}
      windows_vcpkg_triplet: ${{ steps.validate.outputs.windows_vcpkg_triplet }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up the pinned Node tool
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0

      - name: Validate the closed matrix and immutable pins
        id: validate
        shell: bash
        run: node scripts/localai-backend-artifact-workflow.mjs validate --github-output "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.backend }} (${{ matrix.target }})
    needs: validate-inputs
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    # A Windows leg spends more than two hours compiling the pinned static
    # gRPC dependency graph before the backend build starts. GitHub's maximum
    # job timeout leaves enough room for that first-run dependency build and
    # the backend/package verification that follows it.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate-inputs.outputs.matrix) }}
    env:
      LOCALAI_ROOT: ${{ github.workspace }}/localai
      BACKEND_ID: ${{ matrix.backend }}
      TARGET_ID: ${{ matrix.target }}
      BUILD_TYPE: ${{ matrix.build_type }}
      GRPC_COMMIT: ${{ needs.validate-inputs.outputs.grpc_commit }}
      PROTOBUF_VERSION: ${{ needs.validate-inputs.outputs.protobuf_version }}
      GRPC_VERSION: ${{ needs.validate-inputs.outputs.grpc_version }}
      BACKEND_SOURCE_COMMIT: ${{ matrix.source_commit }}
      LOCALAI_ARTIFACT_CONFIG: ${{ github.workspace }}/you-agent-factory/.github/localai-backend-artifacts.json
      SOURCE_PATH: ${{ matrix.source_path }}
    steps:
      - name: Check out repository sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: you-agent-factory

      - name: Check out pinned LocalAI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mudler/LocalAI
          ref: ${{ needs.validate-inputs.outputs.localai_commit }}
          path: localai
          fetch-depth: 1
          submodules: recursive

      - name: Check out pinned Windows dependency manager
        if: runner.os == 'Windows'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: microsoft/vcpkg
          ref: ${{ needs.validate-inputs.outputs.vcpkg_commit }}
          path: vcpkg
          fetch-depth: 1

      - name: Set up the pinned Node tool
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ needs.validate-inputs.outputs.node_version }}

      - name: Expose the Windows Git tool to MSYS2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitCommand = Get-Command git -CommandType Application -ErrorAction Stop | Select-Object -First 1
          "WINDOWS_GIT_DIR=$($gitCommand.Source | Split-Path -Parent)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Expose the pinned Node tool to MSYS2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nodeCommand = Get-Command node -CommandType Application -ErrorAction Stop | Select-Object -First 1
          "WINDOWS_NODE_DIR=$($nodeCommand.Source | Split-Path -Parent)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Go at the pinned tool version
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ needs.validate-inputs.outputs.go_version }}
          cache: false

      - name: Expose the pinned Go tool to MSYS2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $goCommand = Get-Command go -CommandType Application -ErrorAction Stop | Select-Object -First 1
          "WINDOWS_GO_DIR=$($goCommand.Source | Split-Path -Parent)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up CMake at the pinned tool version
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb
        with:
          cmakeVersion: ${{ needs.validate-inputs.outputs.cmake_version }}

      - name: Expose the pinned CMake tool to MSYS2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cmakeCommand = Get-Command cmake -CommandType Application -ErrorAction Stop | Select-Object -First 1
          "WINDOWS_CMAKE_DIR=$($cmakeCommand.Source | Split-Path -Parent)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install GNU Make on Apple Silicon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          formula="https://raw.githubusercontent.com/Homebrew/homebrew-core/${{ needs.validate-inputs.outputs.macos_make_formula_commit }}/Formula/m/make.rb"
          formula_path="$RUNNER_TEMP/pinned-make.rb"
          tap="localai/pinned-make"
          curl --fail --silent --show-error --location "$formula" --output "$formula_path"
          test -s "$formula_path"
          brew tap-new --no-git "$tap"
          tap_path="$(brew --repository "$tap")"
          cp "$formula_path" "$tap_path/Formula/make.rb"
          brew install --formula "$tap/make"
          observed="$(gmake --version | sed -n '1s/.* //p')"
          test "$observed" = "${{ needs.validate-inputs.outputs.macos_make_version }}"
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Set up the pinned Windows build environment
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@fb197b72ce45fb24f17bf3f807a388985654d1f2
        with:
          msystem: MINGW64
          update: false

      - name: Install the pinned Windows build packages
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          WINDOWS_MSYS_PACKAGES: ${{ needs.validate-inputs.outputs.windows_msys_packages }}
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm
          read -r -a packages <<< "$WINDOWS_MSYS_PACKAGES"
          pacman -S --needed --noconfirm --overwrite '*' "${packages[@]}"

      - name: Install pinned Windows C++ dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: vcpkg
        run: |
          .\bootstrap-vcpkg.bat -disableMetrics
          $overlayTriplets = Join-Path (Get-Location) 'triplets\community'
          .\vcpkg.exe install grpc:${{ needs.validate-inputs.outputs.windows_vcpkg_triplet }} protobuf:${{ needs.validate-inputs.outputs.windows_vcpkg_triplet }} abseil:${{ needs.validate-inputs.outputs.windows_vcpkg_triplet }} --overlay-triplets=$overlayTriplets
          "VCPKG_ROOT=$((Get-Location).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_TRIPLET=${{ needs.validate-inputs.outputs.windows_vcpkg_triplet }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify the pinned host and source provenance
        working-directory: you-agent-factory
        shell: bash
        run: |
          set -euo pipefail
          node scripts/localai-backend-artifact-workflow.mjs verify-source \
            --config "$LOCALAI_ARTIFACT_CONFIG" \
            --localai-root "$LOCALAI_ROOT" \
            --backend "$BACKEND_ID" \
            --target "$TARGET_ID"

      - name: Build the backend package on Windows
        if: runner.os == 'Windows'
        working-directory: you-agent-factory
        shell: msys2 {0}
        # The pinned static gRPC dependency graph can take more than an hour
        # on a hosted Windows runner. Keep the step below the job ceiling so
        # the backend build, package closure, and startup smoke can finish.
        timeout-minutes: 300
        run: |
          set -euo pipefail
          bash scripts/build-localai-backend-artifact.sh

      - name: Build the backend package on Unix
        if: runner.os != 'Windows'
        working-directory: you-agent-factory
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-localai-backend-artifact.sh

      - name: Archive the Unix backend package
        if: runner.os != 'Windows'
        working-directory: you-agent-factory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          package_root="$LOCALAI_ROOT/$SOURCE_PATH/package"
          archive_stem="localai-backend-${BACKEND_ID}-${TARGET_ID}-${BACKEND_SOURCE_COMMIT}"
          archive="artifacts/${archive_stem}.tar.gz"
          tar -czf "$archive" -C "$package_root" .
          test -s "$archive"
          cp "$package_root/build-metadata.json" "artifacts/${archive_stem}.tar.gz.metadata.json"
          test -s "artifacts/${archive_stem}.tar.gz.metadata.json"

      - name: Archive the Windows backend package
        if: runner.os == 'Windows'
        working-directory: you-agent-factory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $packageRoot = Join-Path $env:LOCALAI_ROOT ($env:SOURCE_PATH -replace '/', '\\')
          $packageRoot = Join-Path $packageRoot 'package'
          $archiveStem = "localai-backend-$env:BACKEND_ID-$env:TARGET_ID-$env:BACKEND_SOURCE_COMMIT"
          $archive = Join-Path (Get-Location) "artifacts/$archiveStem.zip"
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $archive -Force
          if ((Get-Item -LiteralPath $archive).Length -le 0) { throw 'Windows backend archive is empty' }
          $metadata = Join-Path (Get-Location) "artifacts/$archiveStem.zip.metadata.json"
          Copy-Item -LiteralPath (Join-Path $packageRoot 'build-metadata.json') -Destination $metadata
          if ((Get-Item -LiteralPath $metadata).Length -le 0) { throw 'Windows backend metadata is empty' }

      - name: Upload one verified matrix-leg artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: localai-backend-${{ matrix.backend }}-${{ matrix.target }}-${{ matrix.source_commit }}
          path: you-agent-factory/artifacts/*
          if-no-files-found: error
          retention-days: 14

  join:
    name: Join and verify complete backend publication
    needs:
      - validate-inputs
      - build
    if: ${{ always() && needs.validate-inputs.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.join.outputs.release_tag }}
      pin_fingerprint: ${{ steps.join.outputs.pin_fingerprint }}
    steps:
      - name: Check out repository sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Download every successful matrix-leg result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: localai-backend-*
          path: .artifacts/matrix
          merge-multiple: true

      - name: Validate the closed set and build the publication bundle
        id: join
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/release
          node scripts/localai-backend-artifact-workflow.mjs join \
            --config .github/localai-backend-artifacts.json \
            --artifact-directory .artifacts/matrix \
            --output-directory .artifacts/release \
            --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload the complete validated publication bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: localai-backend-release-${{ steps.join.outputs.release_tag }}
          path: .artifacts/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish immutable backend release
    needs: join
    if: ${{ needs.join.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: localai-backend-publishing
    permissions:
      contents: write
    steps:
      - name: Download the complete validated publication bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: localai-backend-release-${{ needs.join.outputs.release_tag }}
          path: .artifacts/release

      - name: Create a draft release without overwriting an immutable pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.join.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_tag_target() {
            local response object_type object_sha _depth
            response="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$1")"
            for _depth in 1 2 3 4; do
              object_type="$(jq -r '.object.type // empty' <<<"$response")"
              object_sha="$(jq -r '.object.sha // empty' <<<"$response")"
              case "$object_type" in
                commit)
                  printf '%s\n' "$object_sha"
                  return 0
                  ;;
                tag)
                  response="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
                  ;;
                *)
                  return 1
                  ;;
              esac
            done
            return 1
          }

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            if ! existing_tag_target="$(resolve_tag_target "$RELEASE_TAG")"; then
              echo "immutable backend tag $RELEASE_TAG exists but its target could not be resolved" >&2
              exit 1
            fi
            if [[ "$existing_tag_target" != "$GITHUB_SHA" ]]; then
              echo "immutable backend tag $RELEASE_TAG points to $existing_tag_target, expected $GITHUB_SHA" >&2
              exit 1
            fi
            echo "reusing existing immutable tag $RELEASE_TAG at $GITHUB_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" \
              -f "sha=$GITHUB_SHA" >/dev/null
            echo "created immutable tag $RELEASE_TAG at $GITHUB_SHA"
          fi

          created_tag_target="$(resolve_tag_target "$RELEASE_TAG")"
          if [[ "$created_tag_target" != "$GITHUB_SHA" ]]; then
            echo "immutable backend tag $RELEASE_TAG resolved to $created_tag_target after creation, expected $GITHUB_SHA" >&2
            exit 1
          fi

          release_rows="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | [.id, (.draft | tostring)] | @tsv")"
          if [[ -n "$release_rows" ]]; then
            release_row="${release_rows%%$'\n'*}"
            IFS=$'\t' read -r release_id release_is_draft <<< "$release_row"
            if [[ "$release_is_draft" != "true" ]]; then
              echo "immutable backend release already exists: $RELEASE_TAG" >&2
              exit 1
            fi
            echo "reusing existing draft backend release $RELEASE_TAG id=$release_id"
          else
            release_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f "tag_name=$RELEASE_TAG" \
              -f "target_commitish=$GITHUB_SHA" \
              -f "name=Pinned LocalAI backends $RELEASE_TAG" \
              -f "body=Complete nine-platform backend publication. The release remains draft until every archive and manifest asset is uploaded." \
              -F draft=true \
              --jq '.id')"
            echo "created draft backend release $RELEASE_TAG id=$release_id"
          fi

          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber .artifacts/release/*
          printf '{"draft":false}\n' | gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" --input - >/dev/null
          published_tag_target="$(resolve_tag_target "$RELEASE_TAG")"
          if [[ "$published_tag_target" != "$GITHUB_SHA" ]]; then
            echo "published backend tag $RELEASE_TAG resolved to $published_tag_target, expected $GITHUB_SHA" >&2
            exit 1
          fi
          echo "LOCALAI_BACKEND_RELEASE_PUBLISHED tag=$RELEASE_TAG assets=10"
