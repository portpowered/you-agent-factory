name: Pinned LocalAI Backend Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localai-backend-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-inputs:
    name: Validate pinned backend inputs
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.validate.outputs.matrix }}
      localai_commit: ${{ steps.validate.outputs.localai_commit }}
      protocol_revision: ${{ steps.validate.outputs.protocol_revision }}
      grpc_commit: ${{ steps.validate.outputs.grpc_commit }}
      vcpkg_commit: ${{ steps.validate.outputs.vcpkg_commit }}
      go_version: ${{ steps.validate.outputs.go_version }}
      cmake_version: ${{ steps.validate.outputs.cmake_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate the closed matrix and immutable pins
        id: validate
        shell: bash
        run: node scripts/localai-backend-artifact-workflow.mjs validate --github-output "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.backend }} (${{ matrix.target }})
    needs: validate-inputs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate-inputs.outputs.matrix) }}
    env:
      LOCALAI_ROOT: ${{ github.workspace }}/localai
      BACKEND_ID: ${{ matrix.backend }}
      TARGET_ID: ${{ matrix.target }}
      BUILD_TYPE: ${{ matrix.build_type }}
      GRPC_COMMIT: ${{ needs.validate-inputs.outputs.grpc_commit }}
      LOCALAI_ARTIFACT_CONFIG: ${{ github.workspace }}/you-agent-factory/.github/localai-backend-artifacts.json
      SOURCE_PATH: ${{ matrix.source_path }}
    steps:
      - name: Check out repository sources
        uses: actions/checkout@v4
        with:
          path: you-agent-factory

      - name: Check out pinned LocalAI
        uses: actions/checkout@v4
        with:
          repository: mudler/LocalAI
          ref: ${{ needs.validate-inputs.outputs.localai_commit }}
          path: localai
          fetch-depth: 1
          submodules: recursive

      - name: Check out pinned Windows dependency manager
        if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ needs.validate-inputs.outputs.vcpkg_commit }}
          path: vcpkg
          fetch-depth: 1

      - name: Set up Go at the pinned tool version
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.validate-inputs.outputs.go_version }}
          cache: false

      - name: Set up CMake at the pinned tool version
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb
        with:
          cmakeVersion: ${{ needs.validate-inputs.outputs.cmake_version }}

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential ninja-build pkg-config

      - name: Install GNU Make on Apple Silicon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install make
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Set up the pinned Windows build environment
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-ninja

      - name: Install pinned Windows C++ dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: vcpkg
        run: |
          .\bootstrap-vcpkg.bat -disableMetrics
          .\vcpkg.exe install grpc:x64-mingw-dynamic protobuf:x64-mingw-dynamic abseil:x64-mingw-dynamic
          "VCPKG_ROOT=$((Get-Location).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_TRIPLET=x64-mingw-dynamic" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify the pinned host and source provenance
        working-directory: you-agent-factory
        shell: bash
        run: |
          set -euo pipefail
          node scripts/localai-backend-artifact-workflow.mjs verify-source \
            --config "$LOCALAI_ARTIFACT_CONFIG" \
            --localai-root "$LOCALAI_ROOT" \
            --backend "$BACKEND_ID" \
            --target "$TARGET_ID"

      - name: Build the backend package
        working-directory: you-agent-factory
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}
        run: |
          set -euo pipefail
          bash scripts/build-localai-backend-artifact.sh

      - name: Archive the Unix backend package
        if: runner.os != 'Windows'
        working-directory: you-agent-factory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          package_root="$LOCALAI_ROOT/$SOURCE_PATH/package"
          archive="artifacts/localai-backend-${BACKEND_ID}-${TARGET_ID}.tar.gz"
          tar -czf "$archive" -C "$package_root" .
          test -s "$archive"

      - name: Archive the Windows backend package
        if: runner.os == 'Windows'
        working-directory: you-agent-factory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $packageRoot = Join-Path $env:LOCALAI_ROOT ($env:SOURCE_PATH -replace '/', '\\')
          $packageRoot = Join-Path $packageRoot 'package'
          $archive = Join-Path (Get-Location) "artifacts/localai-backend-$env:BACKEND_ID-$env:TARGET_ID.zip"
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $archive -Force
          if ((Get-Item -LiteralPath $archive).Length -le 0) { throw 'Windows backend archive is empty' }

      - name: Upload one verified matrix-leg artifact
        uses: actions/upload-artifact@v4
        with:
          name: localai-backend-${{ matrix.backend }}-${{ matrix.target }}
          path: you-agent-factory/artifacts/*
          if-no-files-found: error
          retention-days: 14
