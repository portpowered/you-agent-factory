name: Development Package

on:
  workflow_call:
    inputs:
      is_ci_call:
        description: Main CI is invoking the reusable package verification path.
        required: true
        type: boolean
      run_candidates:
        description: Build package candidates for the reviewed pull request.
        required: true
        type: boolean
      run_api_package:
        description: Run API package verification and its candidate when selected.
        required: true
        type: boolean
      run_packaged_factories_package:
        description: Run Packaged Factories verification and its candidate when selected.
        required: true
        type: boolean
      run_model_providers_package:
        description: Run Model Providers package verification when selected.
        required: true
        type: boolean
      source_commit:
        description: Exact commit that package verification must check out.
        required: true
        type: string
      pull_request_head_sha:
        description: Reviewed pull request head SHA used by candidate dry runs.
        required: true
        type: string
      source_ref:
        description: Source ref passed to candidate validation policy.
        required: true
        type: string
      repository:
        description: Repository passed to candidate validation policy.
        required: true
        type: string
      behavior_test:
        description: Run the lightweight hosted workflow behavior probe instead of package commands.
        required: false
        default: false
        type: boolean
      behavior_test_failure_lane:
        description: Deliberately fail the named package behavior probe for propagation coverage.
        required: false
        default: ''
        type: string
    outputs:
      api_package_result:
        description: Terminal result of API package verification.
        value: ${{ jobs.verify_api_package.outputs.result }}
      api_candidate_result:
        description: Terminal result of the API package candidate.
        value: ${{ jobs.build_api_candidate.outputs.result }}
      packaged_factories_package_result:
        description: Terminal result of Packaged Factories verification.
        value: ${{ jobs.verify_packaged_factories_package.outputs.result }}
      packaged_factories_candidate_result:
        description: Terminal result of the Packaged Factories candidate.
        value: ${{ jobs.build_packaged_factories_candidate.outputs.result }}
      model_providers_package_result:
        description: Terminal result of Model Providers verification.
        value: ${{ jobs.verify_model_providers_package.outputs.result }}
  push:
    branches: [main]
  workflow_run:
    workflows:
      - Release Candidate Verification
    types:
      - completed

permissions:
  # The CI caller intentionally grants only read access. Publication jobs
  # request their narrower write or OIDC permissions at job level.
  contents: read

# Dev-snapshot pushes to main supersede each other; a real release publish
# never should, so it gets its own group keyed by the triggering run id
# (matching how release.yml used to scope its own concurrency).
concurrency:
  group: >-
    development-package-${{
      inputs.is_ci_call == true && format('ci-{0}', github.run_id) ||
      github.event_name == 'workflow_run' && github.event.workflow_run.id ||
      github.ref
    }}
  cancel-in-progress: ${{ inputs.is_ci_call != true && github.event_name == 'push' }}

env:
  BUN_VERSION: 1.3.12
  GORELEASER_VERSION: v2.12.7
  GO_VERSION: 1.25.0
  NODE_VERSION: 24
  NPM_VERSION: 11.15.0

jobs:
  # --- Dev-snapshot publish: runs on every push to main. ---

  prepare-main-candidate:
    name: Prepare Protected Main Candidate
    if: >-
      ${{
        inputs.is_ci_call != true &&
        github.event_name == 'push' &&
        github.repository == 'portpowered/you-agent-factory'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: make ui-deps
      - run: >-
          make ui-public-package-publish-prepare
          PACKAGE_VERSION="0.0.0-dev.${{ github.run_id }}.${{ github.sha }}"
          PACKAGE_OUTPUT=".artifacts/public-development-candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: public-development-main-candidate-${{ github.run_id }}
          path: .artifacts/public-development-candidate/
          if-no-files-found: error
          retention-days: 7

  publish-main-candidate:
    name: Publish and Verify Protected Main Candidate
    if: >-
      ${{
        inputs.is_ci_call != true &&
        github.event_name == 'push' &&
        github.repository == 'portpowered/you-agent-factory'
      }}
    needs: prepare-main-candidate
    environment: development-publishing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global npm@${{ env.NPM_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: public-development-main-candidate-${{ github.run_id }}
          path: .artifacts/public-development-candidate
      - working-directory: ui
        run: >-
          npm run publish:public-packages --
          --candidate-directory ../.artifacts/public-development-candidate
          --tag dev --provenance

  # --- Tagged release publish: runs when Release Candidate Verification
  # completes successfully for a tag push. This used to live in a separate
  # release.yml, but npm's Trusted Publisher (OIDC) configuration for these
  # packages pins the trusted workflow to this file (no Environment
  # restriction is configured, so the workflow filename is the whole trust
  # boundary) -- and having release.yml call into this file as a reusable
  # workflow did not satisfy that check in practice, twice, despite the
  # called job genuinely executing. Running the whole release pipeline
  # directly as this workflow removes that ambiguity: there is no nesting,
  # so there's nothing else the OIDC identity could plausibly be checked
  # against.

  resolve-release-tag:
    name: Resolve Release Tag
    if: >-
      ${{
        inputs.is_ci_call != true &&
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      }}
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve semver tag for released commit
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          output="$(go run ./cmd/releasetagcheck -points-at HEAD)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" >> "$GITHUB_OUTPUT"

      - name: Derive GoReleaser asset version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ steps.tag.outputs.release_tag }}"
          release_version="${release_tag#v}"
          printf 'release_version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"

  prepare-public-package-candidate:
    name: Prepare Complete Public Package Candidate
    needs: resolve-release-tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun for the frontend package workspace
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frontend package dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Prepare the complete public package candidate from the release commit
        run: >-
          node scripts/public-release-package-candidate.mjs
          --output-directory .artifacts/public-release-candidate
          --run-id "${{ github.run_id }}"
          --source-commit "${{ github.event.workflow_run.head_sha }}"
          --version "${{ needs.resolve-release-tag.outputs.release_version }}"

      - name: Upload the complete public package candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-release-candidate-${{ github.run_id }}
          path: .artifacts/public-release-candidate/
          if-no-files-found: error

  publish-tagged-release:
    name: Publish Tagged Release Candidate
    needs:
      - resolve-release-tag
      - prepare-public-package-candidate
    environment: development-publishing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Install dashboard dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Download the preserved complete public package candidate
        uses: actions/download-artifact@v4
        with:
          name: public-release-candidate-${{ github.run_id }}
          path: .artifacts/public-release-candidate

      - name: Reconcile, publish, and verify the complete reviewed public package set
        run: >-
          node scripts/public-release-package-publish.mjs
          --candidate-directory .artifacts/public-release-candidate
          --expected-source-commit "${{ github.event.workflow_run.head_sha }}"
          --workspace-directory .

  verify_api_package:
    name: API Contract And Package
    if: ${{ inputs.is_ci_call && inputs.run_api_package }}
    outputs:
      result: ${{ steps.record_result.outputs.result }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        if: inputs.behavior_test != true
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        if: inputs.behavior_test != true
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: oven-sh/setup-bun@v2
        if: inputs.behavior_test != true
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        if: inputs.behavior_test != true
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify API package
        if: inputs.behavior_test != true
        run: make ui-deps contracts-smoke api-smoke api-package-verify
      - name: Exercise API package workflow behavior
        if: inputs.behavior_test == true
        env:
          TEST_FAILURE_LANE: ${{ inputs.behavior_test_failure_lane }}
        run: |
          if [[ "$TEST_FAILURE_LANE" == "api" ]]; then
            echo "intentional API package behavior failure"
            exit 1
          fi
          echo "API package workflow behavior selected"
      - name: Record package result
        if: always()
        id: record_result
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

  verify_packaged_factories_package:
    name: Packaged Factories Package
    if: ${{ inputs.is_ci_call && inputs.run_packaged_factories_package }}
    outputs:
      result: ${{ steps.record_result.outputs.result }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        if: inputs.behavior_test != true
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: inputs.behavior_test != true
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify Packaged Factories package
        if: inputs.behavior_test != true
        run: make packaged-factory-package-verify
      - name: Exercise Packaged Factories workflow behavior
        if: inputs.behavior_test == true
        env:
          TEST_FAILURE_LANE: ${{ inputs.behavior_test_failure_lane }}
        run: |
          if [[ "$TEST_FAILURE_LANE" == "packaged" ]]; then
            echo "intentional Packaged Factories package behavior failure"
            exit 1
          fi
          echo "Packaged Factories package workflow behavior selected"
      - name: Record package result
        if: always()
        id: record_result
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

  verify_model_providers_package:
    name: Model Providers Package
    if: ${{ inputs.is_ci_call && inputs.run_model_providers_package }}
    outputs:
      result: ${{ steps.record_result.outputs.result }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        if: inputs.behavior_test != true
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: inputs.behavior_test != true
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        if: inputs.behavior_test != true
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install model provider package dependencies
        if: inputs.behavior_test != true
        run: make ui-deps
      - name: Verify Model Providers package
        if: inputs.behavior_test != true
        run: make model-provider-package-verify
      - name: Exercise Model Providers workflow behavior
        if: inputs.behavior_test == true
        env:
          TEST_FAILURE_LANE: ${{ inputs.behavior_test_failure_lane }}
        run: |
          if [[ "$TEST_FAILURE_LANE" == "providers" ]]; then
            echo "intentional Model Providers package behavior failure"
            exit 1
          fi
          echo "Model Providers package workflow behavior selected"
      - name: Record package result
        if: always()
        id: record_result
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

  build_api_candidate:
    name: Build API Candidate (No Publish)
    if: ${{ inputs.is_ci_call && inputs.run_candidates && inputs.run_api_package }}
    outputs:
      result: ${{ steps.record_result.outputs.result }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        if: inputs.behavior_test != true
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: inputs.behavior_test != true
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build API candidate
        if: inputs.behavior_test != true
        run: >-
          node scripts/api-package-development-command.mjs --action dry-run
          --event-name pull_request
          --output-directory .artifacts/api-development-candidate/package
          --package-directory packages/api
          --pull-request-head-sha "${{ inputs.pull_request_head_sha }}"
          --ref "${{ inputs.source_ref }}" --repository "${{ inputs.repository }}"
          --run-id "${{ github.run_id }}"
          --source-commit "${{ inputs.source_commit }}"
          --workspace-directory "${{ github.workspace }}"
      - name: Exercise API candidate workflow behavior
        if: inputs.behavior_test == true
        env:
          TEST_FAILURE_LANE: ${{ inputs.behavior_test_failure_lane }}
        run: |
          if [[ "$TEST_FAILURE_LANE" == "api_candidate" ]]; then
            echo "intentional API candidate behavior failure"
            exit 1
          fi
          echo "API candidate workflow behavior selected"
      - name: Record candidate result
        if: always()
        id: record_result
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

  build_packaged_factories_candidate:
    name: Build Packaged Factories Candidate (No Publish)
    if: ${{ inputs.is_ci_call && inputs.run_candidates && inputs.run_packaged_factories_package }}
    outputs:
      result: ${{ steps.record_result.outputs.result }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        if: inputs.behavior_test != true
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: inputs.behavior_test != true
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build Packaged Factories candidate
        if: inputs.behavior_test != true
        run: >-
          node scripts/packaged-factories-package-pr-dry-run.mjs
          --event-name pull_request
          --output-directory .artifacts/packaged-factories-development-candidate/package
          --package-directory packages/packaged-factories
          --pull-request-head-sha "${{ inputs.pull_request_head_sha }}"
          --ref "${{ inputs.source_ref }}" --repository "${{ inputs.repository }}"
          --run-id "${{ github.run_id }}"
          --source-commit "${{ inputs.source_commit }}"
          --workspace-directory "${{ github.workspace }}"
      - name: Exercise Packaged Factories candidate workflow behavior
        if: inputs.behavior_test == true
        env:
          TEST_FAILURE_LANE: ${{ inputs.behavior_test_failure_lane }}
        run: |
          if [[ "$TEST_FAILURE_LANE" == "packaged_candidate" ]]; then
            echo "intentional Packaged Factories candidate behavior failure"
            exit 1
          fi
          echo "Packaged Factories candidate workflow behavior selected"
      - name: Record candidate result
        if: always()
        id: record_result
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

  publish-release:
    name: Publish GitHub Release
    needs:
      - resolve-release-tag
      - publish-tagged-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check out release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git checkout --detach "${{ needs.resolve-release-tag.outputs.release_tag }}"

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Bun for the dashboard workspace
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dashboard dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Publish GitHub release assets from the tagged commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run github.com/goreleaser/goreleaser/v2@${{ env.GORELEASER_VERSION }} release --clean -f .goreleaser.yml

      - name: Upload hosted installer release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ needs.resolve-release-tag.outputs.release_tag }}" \
            --repo "${{ github.event.workflow_run.repository.full_name }}" \
            --clobber \
            scripts/install.sh \
            scripts/install.ps1

  smoke-hosted-installer:
    name: Smoke Hosted Installer (${{ matrix.os_id }})
    needs:
      - resolve-release-tag
      - publish-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_id: linux
            runner: ubuntu-latest
          - os_id: macos
            runner: macos-latest
          - os_id: windows
            runner: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Smoke hosted install.sh against the published release
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          install_url="https://github.com/${{ github.event.workflow_run.repository.full_name }}/releases/download/${{ needs.resolve-release-tag.outputs.release_tag }}/install.sh"
          sh ./scripts/release/smoke-install.sh \
            "$install_url" \
            "${{ needs.resolve-release-tag.outputs.release_version }}" \
            "$(pwd)/installed-bin"

      - name: Smoke hosted install.ps1 against the published release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installUrl = "https://github.com/${{ github.event.workflow_run.repository.full_name }}/releases/download/${{ needs.resolve-release-tag.outputs.release_tag }}/install.ps1"
          ./scripts/release/smoke-install.ps1 `
            -InstallScriptUrl $installUrl `
            -InstallVersion "${{ needs.resolve-release-tag.outputs.release_version }}" `
            -InstallDir (Join-Path (Get-Location) "installed-bin")

  verify-go-install:
    name: Verify Go Install Surface
    needs:
      - resolve-release-tag
      - publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Smoke go install verification contract
        shell: bash
        run: |
          set -euo pipefail
          go test ./tests/release -run TestGoInstallSmoke_InstallsCmdFactoryBinaryIntoCleanGOBIN -count=1

      - name: Smoke published go install command
        shell: bash
        env:
          INFINITE_YOU_RELEASE_PUBLIC_GO_INSTALL_SMOKE: "1"
          GOPROXY: direct
        run: |
          set -euo pipefail
          go test ./tests/release -run TestGoInstallSmoke_InstallsPublishedModulePathIntoCleanGOBIN -count=1

  smoke-released-artifacts:
    name: Smoke Released Artifacts (${{ matrix.asset_id }})
    needs:
      - resolve-release-tag
      - publish-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_id: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            archive_extension: .tar.gz
            binary_name: you
          - asset_id: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            archive_extension: .tar.gz
            binary_name: you
          - asset_id: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            archive_extension: .tar.gz
            binary_name: you
          - asset_id: darwin-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
            archive_extension: .tar.gz
            binary_name: you
          - asset_id: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            archive_extension: .zip
            binary_name: you.exe
          - asset_id: windows-arm64
            runner: windows-11-arm
            goos: windows
            goarch: arm64
            archive_extension: .zip
            binary_name: you.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Bun for the dashboard workspace
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dashboard dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: ui
        run: bunx playwright install chromium

      - name: Download published release asset on Unix
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist smoke-output
          asset_name="you_${{ needs.resolve-release-tag.outputs.release_version }}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.archive_extension }}"
          printf '%s\n' "$asset_name" > "smoke-output/${{ matrix.asset_id }}-asset.txt"
          gh release download "${{ needs.resolve-release-tag.outputs.release_tag }}" \
            --repo "${{ github.event.workflow_run.repository.full_name }}" \
            --pattern "$asset_name" \
            --dir dist

      - name: Download published release asset on Windows
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          New-Item -ItemType Directory -Path smoke-output -Force | Out-Null
          $assetName = "you_${{ needs.resolve-release-tag.outputs.release_version }}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.archive_extension }}"
          $assetName | Out-File -FilePath "smoke-output/${{ matrix.asset_id }}-asset.txt" -Encoding utf8
          gh release download "${{ needs.resolve-release-tag.outputs.release_tag }}" `
            --repo "${{ github.event.workflow_run.repository.full_name }}" `
            --pattern $assetName `
            --dir dist

      - name: Extract released archive on Unix
        if: runner.os != 'Windows'
        id: extract-unix
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/you_${{ needs.resolve-release-tag.outputs.release_version }}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.archive_extension }}"
          if [ ! -f "$archive" ]; then
            echo "released archive not found: $archive" >&2
            exit 1
          fi
          mkdir -p extracted
          tar -xzf "$archive" -C extracted
          binary="$(pwd)/extracted/${{ matrix.binary_name }}"
          chmod +x "$binary"
          echo "binary_path=$binary" >> "$GITHUB_OUTPUT"

      - name: Extract released archive on Windows
        if: runner.os == 'Windows'
        id: extract-windows
        shell: pwsh
        run: |
          $archive = "dist/you_${{ needs.resolve-release-tag.outputs.release_version }}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.archive_extension }}"
          if (-not (Test-Path -LiteralPath $archive)) {
            Write-Error "released archive not found: $archive"
          }
          New-Item -ItemType Directory -Path extracted -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath extracted -Force
          $binary = (Resolve-Path "extracted/${{ matrix.binary_name }}").Path
          "binary_path=$binary" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Smoke released binary on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          sh ./scripts/release/smoke-artifact.sh \
            "${{ steps.extract-unix.outputs.binary_path }}" \
            "tests/release/testdata/cli_smoke_factory" \
            > "smoke-output/${{ matrix.asset_id }}-result.json" \
            2> "smoke-output/${{ matrix.asset_id }}-error.json"

      - name: Smoke released binary on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/release/smoke-artifact.ps1 `
            -BinaryPath "${{ steps.extract-windows.outputs.binary_path }}" `
            -FixturePath "tests/release/testdata/cli_smoke_factory" `
            1> "smoke-output/${{ matrix.asset_id }}-result.json" `
            2> "smoke-output/${{ matrix.asset_id }}-error.json"

      - name: Upload released-artifact smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-${{ matrix.asset_id }}
          path: smoke-output
          if-no-files-found: error
