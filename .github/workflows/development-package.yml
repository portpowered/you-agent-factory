name: Development Package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: development-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.12
  NODE_VERSION: 24
  NPM_VERSION: 11.15.0
  GO_VERSION: 1.24.2

jobs:
  validate:
    name: Validate Development Package Prerequisites (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Typecheck
            command: make typecheck
            needs_playwright: false
          - name: Lint and package boundaries
            command: make lint
            needs_playwright: false
          - name: Repository tests
            command: make test
            needs_playwright: false
          - name: Contract generation
            command: make contracts-smoke
            needs_playwright: false
          - name: API parity
            command: make api-smoke
            needs_playwright: false
          - name: API package consumption
            command: make api-package-pack-smoke
            needs_playwright: false
          - name: Packaged Factories consumption
            command: make packaged-factory-package-smoke
            needs_playwright: false
          - name: Public frontend package release
            command: make ui-public-package-release
            needs_playwright: true
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dashboard dependencies
        run: make ui-deps

      - name: Install Playwright browser for frontend package verification
        if: matrix.needs_playwright
        run: make ui-install-playwright

      - name: Run validation lane
        run: ${{ matrix.command }}

  dry-run-candidate:
    name: Build and Smoke Exact Candidate (No Publish)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the reviewed pull request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dashboard dependencies
        run: make ui-deps

      - name: Prepare the frontend-only development package candidates
        run: >-
          make ui-public-package-publish-prepare
          PACKAGE_VERSION="0.0.0-dev.${{ github.run_id }}.${{ github.event.pull_request.head.sha }}"
          PACKAGE_OUTPUT=".artifacts/public-development-candidate"

      - name: Upload the frontend package candidates and evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-development-candidate-${{ github.run_id }}
          path: .artifacts/public-development-candidate/
          if-no-files-found: error
          retention-days: 7

  prepare-main-candidate:
    name: Prepare Protected Main Candidate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'portpowered/you-agent-factory'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the protected main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dashboard dependencies
        run: make ui-deps

      - name: Prepare the frontend-only development package candidates
        run: >-
          make ui-public-package-publish-prepare
          PACKAGE_VERSION="0.0.0-dev.${{ github.run_id }}.${{ github.sha }}"
          PACKAGE_OUTPUT=".artifacts/public-development-candidate"

      - name: Upload the frontend package candidates and evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-development-main-candidate-${{ github.run_id }}
          path: .artifacts/public-development-candidate/
          if-no-files-found: error
          retention-days: 7

  publish-main-candidate:
    name: Publish and Verify Protected Main Candidate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'portpowered/you-agent-factory'
    needs:
      - validate
      - prepare-main-candidate
    environment: development-publishing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the verified protected main helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up trusted-publishing-compatible Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Pin trusted-publishing-compatible npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Download the frontend-only development package candidates
        uses: actions/download-artifact@v4
        with:
          name: public-development-main-candidate-${{ github.run_id }}
          path: .artifacts/public-development-candidate

      - name: Publish and verify the frontend-only development package family
        working-directory: ui
        run: >-
          npm run publish:public-packages --
          --candidate-directory ../.artifacts/public-development-candidate
          --tag dev --provenance
