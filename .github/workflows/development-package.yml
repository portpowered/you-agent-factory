name: Development Package

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: development-package-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.12
  NODE_VERSION: 24
  NPM_VERSION: 11.15.0

jobs:
  prepare-main-candidate:
    name: Prepare Protected Main Candidate
    if: github.repository == 'portpowered/you-agent-factory'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: make ui-deps
      - run: >-
          make ui-public-package-publish-prepare
          PACKAGE_VERSION="0.0.0-dev.${{ github.run_id }}.${{ github.sha }}"
          PACKAGE_OUTPUT=".artifacts/public-development-candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: public-development-main-candidate-${{ github.run_id }}
          path: .artifacts/public-development-candidate/
          if-no-files-found: error
          retention-days: 7

  publish-main-candidate:
    name: Publish and Verify Protected Main Candidate
    if: github.repository == 'portpowered/you-agent-factory'
    needs: prepare-main-candidate
    environment: development-publishing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global npm@${{ env.NPM_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: public-development-main-candidate-${{ github.run_id }}
          path: .artifacts/public-development-candidate
      - working-directory: ui
        run: >-
          npm run publish:public-packages --
          --candidate-directory ../.artifacts/public-development-candidate
          --tag dev --provenance
