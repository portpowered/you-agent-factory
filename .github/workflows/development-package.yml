name: Development Package

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      candidate-artifact-name:
        description: >-
          Name of the already-uploaded artifact holding the complete,
          reviewed public package candidate (api + packaged-factories +
          frontend) to reconcile and publish as a tagged release.
        required: true
        type: string
      expected-source-commit:
        description: Commit SHA the candidate must have been built from.
        required: true
        type: string

permissions:
  contents: read

# npm's Trusted Publisher (OIDC) configuration for these packages has no
# GitHub Environment restriction, but it does pin the trusted workflow
# filename to this one. release.yml therefore calls the
# publish-tagged-release job below as a reusable workflow instead of
# publishing npm packages itself, so the OIDC token's job_workflow_ref
# claim always says development-package.yml regardless of which workflow
# triggered the run.
#
# Jobs here cannot gate on github.event_name to tell a direct push apart
# from a workflow_call invocation: within a job defined by a called
# reusable workflow, github.event_name reflects the CALLING workflow's
# original trigger event (e.g. workflow_run for release.yml), not
# workflow_call. Gate on whether the workflow_call-only
# expected-source-commit input was actually provided instead.
concurrency:
  group: development-package-${{ inputs.expected-source-commit || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.12
  NODE_VERSION: 24
  NPM_VERSION: 11.15.0

jobs:
  prepare-main-candidate:
    name: Prepare Protected Main Candidate
    if: ${{ inputs.expected-source-commit == '' && github.repository == 'portpowered/you-agent-factory' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: make ui-deps
      - run: >-
          make ui-public-package-publish-prepare
          PACKAGE_VERSION="0.0.0-dev.${{ github.run_id }}.${{ github.sha }}"
          PACKAGE_OUTPUT=".artifacts/public-development-candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: public-development-main-candidate-${{ github.run_id }}
          path: .artifacts/public-development-candidate/
          if-no-files-found: error
          retention-days: 7

  publish-main-candidate:
    name: Publish and Verify Protected Main Candidate
    if: ${{ inputs.expected-source-commit == '' && github.repository == 'portpowered/you-agent-factory' }}
    needs: prepare-main-candidate
    environment: development-publishing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global npm@${{ env.NPM_VERSION }}
      - name: Debug npm trusted-publishing OIDC token claims (temporary)
        run: |
          set -euo pipefail
          token="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)"
          payload="$(echo "$token" | cut -d. -f2 | tr '_-' '/+')"
          case $((${#payload} % 4)) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac
          echo "$payload" | base64 -d | jq '{job_workflow_ref, workflow_ref, repository, repository_owner, repository_id, environment, ref, sha, event_name, runner_environment, aud, iss}'
      - uses: actions/download-artifact@v4
        with:
          name: public-development-main-candidate-${{ github.run_id }}
          path: .artifacts/public-development-candidate
      - working-directory: ui
        run: >-
          npm run publish:public-packages --
          --candidate-directory ../.artifacts/public-development-candidate
          --tag dev --provenance

  publish-tagged-release:
    name: Publish Tagged Release Candidate
    if: ${{ inputs.expected-source-commit != '' }}
    environment: development-publishing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected-source-commit }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Debug npm trusted-publishing OIDC token claims (temporary)
        run: |
          set -euo pipefail
          token="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)"
          payload="$(echo "$token" | cut -d. -f2 | tr '_-' '/+')"
          case $((${#payload} % 4)) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac
          echo "$payload" | base64 -d | jq '{job_workflow_ref, workflow_ref, repository, repository_owner, repository_id, environment, ref, sha, event_name, runner_environment, aud, iss}'

      - name: Install dashboard dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Download the preserved complete public package candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.candidate-artifact-name }}
          path: .artifacts/public-release-candidate

      - name: Reconcile, publish, and verify the complete reviewed public package set
        run: >-
          node scripts/public-release-package-publish.mjs
          --candidate-directory .artifacts/public-release-candidate
          --expected-source-commit "${{ inputs.expected-source-commit }}"
          --workspace-directory .
