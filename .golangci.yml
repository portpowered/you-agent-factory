# golangci-lint configuration. Built-in linters live here; rules with no
# off-the-shelf equivalent are go/analysis analyzers in internal/lint/analyzers,
# loaded by the custom golangci module plugin. Both halves are run by
# `make golangci`, which `make lint` includes.
version: "2"

run:
  timeout: 30m
  tests: true
  # Tag union so build-tagged Go files are analyzed too (see REPOSITORY_LINT_TAGS).
  build-tags:
    - functionallong
    - backendconformance
    - factoryartifact
    - managed_process_integration

linters:
  default: none
  enable:
    - forbidigo
    - depguard
    - revive
    - gocyclo
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - nilerr
    - staticcheck
  settings:
    forbidigo:
      # Examples remain functional source; they cannot escape the OS boundary.
      exclude-godoc-examples: false
      # Resolve identifiers through go/types so import aliases cannot hide a call.
      analyze-types: true
      forbid:
        - pattern: '^log\.(Default|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln|Print|Printf|Println)$'
          msg: accept or propagate an injected logger instead of using process-global logging
        - pattern: '^slog\.(Default|SetDefault)$'
          msg: accept or propagate an injected logger instead of using process-global logging
        - pattern: '^zap\.(L|S|NewDevelopment|NewDevelopmentConfig|NewProduction|NewProductionConfig|ReplaceGlobals)$'
          msg: construct the application logger only at the approved composition boundary and propagate it
        - pattern: '^logging\.BuildTerminalLogger$'
          msg: accept or propagate an injected logger
        - pattern: '^exec\.(Command|CommandContext)$'
          # Same-named functions in other packages are not process launchers.
          pkg: '^os/exec$'
          msg: functional tests must replace process effects or move real OS proof to integration
        - pattern: '(^|\.)(AssertReplaySucceeds|BuildRuntimeScope|GetEngineStateSnapshot|NewProviderErrorSmokeHarness|NewReplayHarness|NewRuntimeBuilder|NewRuntimeBuilderWithModelsFactory|NewRuntimeFactory|NewServiceTestHarness|SetCustomExecutor|StartFunctionalServerWithConfig|WithRuntimeScheduler|WithWorkerExecutor|startFunctionalServerWithConfig|startReplayFunctionalServerWithConfig)$'
          msg: functional scenarios must use the customer process boundary
    depguard:
      rules:
        functional-no-os-exec:
          list-mode: lax
          files: ["**/tests/functional/**/*.go", "!**/tests/functional/internal/support/**", "!**/testdata/**"]
          deny:
            - pkg: os/exec$
              desc: functional scenarios replace process effects; real OS proof belongs in integration
        functional-composition:
          list-mode: lax
          files: ["**/tests/functional/**/*.go", "!**/testdata/**"]
          deny:
            - pkg: github.com/portpowered/infinite-you/pkg/initializer$
              desc: use root-built process support and exact external-effect ports
            - pkg: github.com/portpowered/infinite-you/pkg/initializer/
              desc: use root-built process support and exact external-effect ports
            - pkg: github.com/portpowered/infinite-you/pkg/platform/runtimeinput$
              desc: use root-built process support and exact external-effect ports
            - pkg: github.com/portpowered/infinite-you/pkg/platform/runtimeinput/
              desc: use root-built process support and exact external-effect ports
            - pkg: github.com/portpowered/infinite-you/pkg/services/factory_runtime$
              desc: use root-built process support and exact external-effect ports
            - pkg: github.com/portpowered/infinite-you/pkg/services/factory_runtime/
              desc: use root-built process support and exact external-effect ports
            - pkg: github.com/portpowered/infinite-you/pkg/services/factory_definitions/scaffold$
              desc: use root-built process support and exact external-effect ports
            - pkg: github.com/portpowered/infinite-you/pkg/services/factory_definitions/scaffold/
              desc: use root-built process support and exact external-effect ports
            - pkg: github.com/portpowered/infinite-you/pkg/services/factory_definitions/internal/services/validation/impl$
              desc: use root-built process support and exact external-effect ports
            - pkg: github.com/portpowered/infinite-you/pkg/services/factory_definitions/internal/services/validation/impl/
              desc: use root-built process support and exact external-effect ports
            - pkg: github.com/portpowered/infinite-you/pkg/services/recordings/artifacts$
              desc: use root-built process support and exact external-effect ports
            - pkg: github.com/portpowered/infinite-you/pkg/services/recordings/artifacts/
              desc: use root-built process support and exact external-effect ports
            - pkg: github.com/portpowered/infinite-you/pkg/services/recordings/events$
              desc: use root-built process support and exact external-effect ports
            - pkg: github.com/portpowered/infinite-you/pkg/services/recordings/events/
              desc: use root-built process support and exact external-effect ports
            - pkg: github.com/portpowered/infinite-you/pkg/services/recordings/projections$
              desc: use root-built process support and exact external-effect ports
            - pkg: github.com/portpowered/infinite-you/pkg/services/recordings/projections/
              desc: use root-built process support and exact external-effect ports
            - pkg: github.com/portpowered/infinite-you/pkg/services/recordings/replay$
              desc: use root-built process support and exact external-effect ports
            - pkg: github.com/portpowered/infinite-you/pkg/services/recordings/replay/
              desc: use root-built process support and exact external-effect ports
            - pkg: github.com/portpowered/infinite-you/pkg/transports/mapping/factoryeventprojection$
              desc: use root-built process support and exact external-effect ports
            - pkg: github.com/portpowered/infinite-you/pkg/transports/mapping/factoryeventprojection/
              desc: use root-built process support and exact external-effect ports
            - pkg: github.com/portpowered/infinite-you/pkg/wire$
              desc: use root-built process support and exact external-effect ports
            - pkg: github.com/portpowered/infinite-you/pkg/wire/
              desc: use root-built process support and exact external-effect ports
    revive:
      enable-default-rules: false
      rules:
        - name: file-length-limit
          arguments:
            - max: 1000
              skip-comments: true
              skip-blank-lines: true
        - name: function-length
          arguments: [0, 100]
    gocyclo:
      min-complexity: 15
  exclusions:
    generated: lax
    rules:
      # Preserve the retired pkg-only rule scope and generated exclusions.
      - linters: [bodyclose, contextcheck, errcheck, errorlint, govet, ineffassign, nilerr, staticcheck]
        path-except: '^pkg/'
      - linters: [revive, gocyclo]
        path-except: '^(cmd|internal|pkg|tests)/'
      # The logging boundary applies to production code under cmd, internal and pkg.
      - linters: [forbidigo]
        path-except: '^(cmd|internal|pkg)/'
        text: 'injected logger|application logger'
      - linters: [forbidigo]
        path: '_test\.go$'
        text: 'injected logger|application logger'
      # The approved composition boundary that may acquire loggers.
      - linters: [forbidigo]
        path: '^(pkg/wire/profiles\.go|pkg/transports/cli/root\.go|pkg/transports/cli/terminalpolicy/policy\.go|pkg/platform/logging/logger\.go)$'
        text: 'injected logger|application logger'
      - linters: [forbidigo]
        path-except: '^tests/functional/'
        text: 'functional tests must replace process effects'
      - linters: [forbidigo]
        path: '^tests/functional/internal/support/|(^|/)testdata/'
        text: 'functional tests must replace process effects'
      - linters: [forbidigo]
        path-except: '^tests/functional/'
        text: 'functional scenarios must use the customer process boundary'
      - linters: [forbidigo]
        path: '(^|/)testdata/'
        text: 'functional scenarios must use the customer process boundary'

issues:
  # Ratchet: only violations introduced since the merge base fail. Requires
  # origin/main to be fetched; Backend Lint checks out with fetch-depth 0.
  new-from-merge-base: origin/main
  whole-files: false
  max-issues-per-linter: 0
  max-same-issues: 0
