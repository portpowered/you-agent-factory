    discouragedAlternatives:
      - text: job
        status: discouraged
        replacement: Work
      - text: task
        status: discouraged
        replacement: Work
    example: Submit `Work` to a running `Factory Session` and inspect its current state.
    surfaces:
      - Work submission, listing, and inspection
      - Work relationships and state transitions
      - CLI and customer documentation
    owner: api/components/schemas/data-models/Work.yaml

