version: 1
schema:
  description: >-
    Version 1 of the repository product-terminology register. Every item in
    terms uses the same record shape. Null approved forms mean that the form
    does not apply; they are explicit and must not be inferred from omission.
  termRecord:
    canonical: Non-empty customer-facing spelling or protected literal.
    definition: Non-empty public meaning, limited to the owning contract.
    category: One of product-term, technical-noun, technical-verb, acronym, command, or protected-literal.
    approvedForms:
      singular: String or null.
      plural: String or null.
      verb: String or null.
    discouragedAlternatives:
      text: Non-empty alternative spelling or phrase.
      status: Either discouraged or prohibited.
      replacement: Approved canonical term or exact protected literal.
    example: Non-empty customer-facing usage example.
    surfaces: Non-empty list of surfaces where the term is valid.
    owner: Repository path, contract, or architecture source that owns the meaning.
terms:
  - canonical: Factory
    definition: A persisted factory definition used to author, save, import, export, and activate factory configuration.
    category: product-term
    approvedForms:
      singular: Factory
      plural: Factories
      verb: null
    discouragedAlternatives:
      - text: factory definition
        status: discouraged
        replacement: Factory
      - text: CPN
        status: prohibited
        replacement: Factory
    example: Save the `Factory` before you activate it in a `Factory Session`.
    surfaces:
      - Factory authoring and validation
      - CLI help and customer documentation
      - Public factory definition API
    owner: docs/architecture/data-model.md#canonical-public-resource-vocabulary

  - canonical: Factory Session
    definition: One live running factory instance with its runtime state, event history, current work, and active factory.
    category: product-term
    approvedForms:
      singular: Factory Session
      plural: Factory Sessions
      verb: null
    discouragedAlternatives:
      - text: factory instance
        status: discouraged
        replacement: Factory Session
      - text: runtime session
        status: discouraged
        replacement: Factory Session
    example: Open a `Factory Session` before you submit `Work` to the running factory.
    surfaces:
      - Factory Session API and CLI commands
      - Session inspection and lifecycle controls
      - Customer documentation
    owner: docs/architecture/data-model.md#canonical-public-resource-vocabulary

  - canonical: Current Factory
    definition: The factory definition currently active inside one Factory Session.
    category: product-term
    approvedForms:
      singular: Current Factory
      plural: Current Factories
      verb: null
    discouragedAlternatives:
      - text: active factory
        status: discouraged
        replacement: Current Factory
      - text: session factory
        status: discouraged
        replacement: Current Factory
    example: Edit the `Current Factory` when you need to change the definition used by a session.
    surfaces:
      - Current Factory read and save routes
      - Factory editor and CLI invocation
      - Customer documentation
    owner: docs/architecture/data-model.md#canonical-public-resource-vocabulary

  - canonical: Work
    definition: One customer-visible unit of work moving through a factory according to configured work types, states, workstations, workers, and guards.
    category: product-term
    approvedForms:
      singular: Work
      plural: Work items
