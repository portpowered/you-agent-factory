syntax = "proto3";

// This functional fixture intentionally uses a distinct protobuf namespace
// from the production LocalAI subset. Both packages are linked into the same
// Go test binary, so sharing the upstream backend message names would make
// protobuf's global descriptor registry reject the fixture at init time.
option go_package = "github.com/portpowered/infinite-you/tests/functional/internal/support/localai/protocol;proto";

package functional_backend;

message HealthMessage {}

message PredictOptions {
  string prompt = 1;
  repeated string images = 42;
  repeated string videos = 45;
  repeated string audios = 46;
  map<string, string> metadata = 52;
}

message Reply {
  bytes message = 1;
  int32 tokens = 2;
  int32 prompt_tokens = 3;
  bytes audio = 6;
}

message ModelOptions {
  string model = 1;
}

message Result {
  string message = 1;
  bool success = 2;
}

message EmbeddingResult {
  repeated float embeddings = 1;
}

message TranscriptRequest {
  string dst = 2;
  string prompt = 7;
}

message TranscriptSegment {
  int32 id = 1;
  int64 start = 2;
  int64 end = 3;
  string text = 4;
}

message TranscriptResult {
  repeated TranscriptSegment segments = 1;
  string text = 2;
  string language = 3;
  float duration = 4;
}

message TranscriptStreamResponse {
  string delta = 1;
  TranscriptResult final_result = 2;
}

message TTSRequest {
  string text = 1;
  string model = 2;
  string dst = 3;
  string voice = 4;
}

message StatusResponse {
  enum State {
    UNINITIALIZED = 0;
    BUSY = 1;
    READY = 2;
    ERROR = -1;
  }
  State state = 1;
}

service Backend {
  rpc Health(HealthMessage) returns (Reply);
  rpc Free(HealthMessage) returns (Result);
  rpc LoadModel(ModelOptions) returns (Result);
  rpc Predict(PredictOptions) returns (Reply);
  rpc PredictStream(PredictOptions) returns (stream Reply);
  rpc Embedding(PredictOptions) returns (EmbeddingResult);
  rpc TTS(TTSRequest) returns (Result);
  rpc TTSStream(TTSRequest) returns (stream Reply);
  rpc AudioTranscription(TranscriptRequest) returns (TranscriptResult);
  rpc AudioTranscriptionStream(TranscriptRequest) returns (stream TranscriptStreamResponse);
  rpc Status(HealthMessage) returns (StatusResponse);
}
